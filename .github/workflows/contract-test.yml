# PR 검증 — Event Bundle 와이어 계약(JSON Schema) 양단 일치.
#
# producer(tenant-sync-api)와 온프렘 실소비자들이 같은 libs/schema/contracts/event-bundle.schema.json
# 을 로드해 번들 계약을 검증한다(ALPHA-497) — 전 구간을 못박는다:
#   · tenant-sync-api : 직렬화 출력이 계약을 만족하는가(producer)
#   · screening-worker: 실 wire 소비자 BundleScreener 가 번들 evidences 를 analysis_item 으로 옮길 때
#                       계약 형상을 유지하는가(rename/drop/transform 감지)
#   · publication-api : 실 파싱 ExplanationStore.parseEvidences 가 계약 형상을 읽는가(서빙)
# 어긋나면 fail-loud — 온프렘 화면이 조용히 비는 사고(ALPHA-395)를 PR 에서 막는다.
#
# --tests 필터로 계약 테스트 클래스만 돈다 — 각 모듈의 Testcontainers 통합 테스트(Docker 필요)는
# 제외되어 이 워크플로는 DB·secret 없이 순수 JVM 만으로 끝난다.
#
# 스키마·두 모듈·Gradle 이 바뀐 PR 에서만 실행하도록 paths 필터를 둔다. 이 레포(private, free 플랜)는
# branch protection 을 쓸 수 없어 이 체크가 required 가 아니므로 paths 필터가 안전하다.
# 주의: 훗날 required 로 지정하려면(플랜 업그레이드·public 전환 후) paths 필터를 걷어내야 한다 —
# path 로 걸러 스킵된 required check 는 Pending 으로 남아 PR 을 영구 차단한다(schema-validate.yml 과 동일).
name: contract-test

on:
  pull_request:
    branches: [dev, main]
    paths:
      - "src/libs/schema/contracts/**"
      - "src/apps/cloud/tenant-sync-api/**"
      - "src/apps/onprem/screening-worker/**"
      - "src/apps/onprem/publication-api/**"
      - "src/gradle/**"
      - "src/gradlew"
      - "src/settings.gradle"
      - "src/build.gradle"
      - ".github/workflows/contract-test.yml"

# 최소 권한 — 체크아웃(읽기)만 필요하다(어떤 secret 도 쓰지 않는 검증 전용 워크플로).
permissions:
  contents: read

concurrency:
  group: contract-test-${{ github.ref }}
  cancel-in-progress: true

jobs:
  event-bundle-contract:
    runs-on: [self-hosted, Linux, X64]
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      # producer·consumer 가 같은 스키마로 번들을 검증한다. --tests 로 계약 테스트 클래스만 —
      # 두 모듈 모두 EventBundleContractTest 를 가지므로 필터가 양쪽에 매치한다.
      - name: Event Bundle 양단 계약 테스트
        working-directory: src
        run: >
          ./gradlew
          :apps:cloud:tenant-sync-api:test
          :apps:onprem:screening-worker:test
          :apps:onprem:publication-api:test
          --tests '*EventBundleContractTest'
