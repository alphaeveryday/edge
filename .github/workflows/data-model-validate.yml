name: data-model-validate

on:
  pull_request:
    branches: [dev, main]
    paths:
      - "docs/data-model/**"
      - "src/libs/schema/generated/physical-erd.dbml"
      - "src/libs/schema/generated/physical-erd-onprem.dbml"
      - "src/libs/schema/scripts/validate-doc-erd.py"
      - ".github/workflows/data-model-validate.yml"

permissions:
  contents: read

concurrency:
  group: data-model-validate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - uses: actions/checkout@v4
      - name: Validate domain ERD coverage and FK edges
        run: python3 src/libs/schema/scripts/validate-doc-erd.py
