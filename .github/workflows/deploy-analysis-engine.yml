# analysis-engine dev 이미지 배포 — KODEX 일일 뉴스 정규화 + 설명 배치 이미지를 ECR 에 push 한다.
# SFN task definition 은 edge/pipeline:analysis-engine-latest 를 참조하므로, 다음 실행부터 새 이미지를 pull 한다.
name: deploy-analysis-engine

on:
  workflow_dispatch:
  push:
    branches: [dev]
    paths:
      - "src/apps/cloud/analysis-engine/**"
      - "src/pyproject.toml"
      - "src/.dockerignore"

permissions:
  id-token: write
  contents: read

concurrency:
  group: deploy-analysis-engine
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: [self-hosted, Linux, X64]
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Login to Amazon ECR
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build & push analysis-engine image
        env:
          AWS_REGION: ${{ vars.AWS_REGION }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          set -euo pipefail
          account_id="$(aws sts get-caller-identity --query Account --output text)"
          ecr_repo="${account_id}.dkr.ecr.${AWS_REGION}.amazonaws.com/edge/pipeline"
          image_sha="${ecr_repo}:analysis-engine-${IMAGE_TAG}"
          image_latest="${ecr_repo}:analysis-engine-latest"
          docker build --platform linux/amd64 \
            -f src/apps/cloud/analysis-engine/Dockerfile \
            -t "${image_sha}" \
            -t "${image_latest}" \
            src
          docker push "${image_sha}"
          docker push "${image_latest}"

      # 상주 설명 소비자(ALPHA-719) — SFN 단발 task 는 run 마다 mutable 태그를 새로
      # 당기지만 상주 서비스는 재배포 없이는 옛 이미지를 돈다. 게이트·스킵·유예 규칙은
      # deploy-data-pipeline.yml 의 상주 롤아웃 블록과 동일한 근거다.
      - name: Roll analysis consumer service
        if: vars.MINUTE_SERVICES_DEPLOYED == 'true'
        env:
          AWS_REGION: ${{ vars.AWS_REGION }}
        run: |
          set -euo pipefail
          cluster="edge-dev-worker"
          svc="edge-dev-data-pipeline-analysis-consumer"
          grace_until="2026-08-10" # ALPHA-719 apply 착지 유예 — 만료 후 이 분기 제거 대상
          can_skip=false
          if [[ "$(date -u +%F)" < "${grace_until}" ]]; then can_skip=true; fi
          describe_err="$(mktemp)"
          if ! described="$(aws ecs describe-services \
            --cluster "${cluster}" --services "${svc}" \
            --query 'services[0].[status,desiredCount]' --output text 2>"${describe_err}")"; then
            if grep -q "AccessDenied" "${describe_err}" && [ "${can_skip}" = "true" ]; then
              echo "::warning::${svc} 조회가 AccessDenied — terraform-apply 선착 전이면 정상(첫 스케일업이 최신 이미지를 당긴다)"
              exit 0
            fi
            cat "${describe_err}" >&2
            echo "::error::${svc} describe 실패 — 유예(${grace_until} 전)가 아니므로 배선·자격 결함이다"
            exit 1
          fi
          read -r status desired <<<"${described}"
          if { [ "${status}" = "None" ] || [ -z "${status}" ]; } && [ "${can_skip}" = "true" ]; then
            echo "::warning::${svc} 가 아직 없다 — apply 선착 전이면 정상"
            exit 0
          fi
          if [ "${status}" != "ACTIVE" ]; then
            echo "::error::${svc} 가 ACTIVE 가 아니다(status=${status})"
            exit 1
          fi
          if [ "${desired}" = "0" ]; then
            # 이 건너뛰기의 근거가 ALPHA-912 로 바뀌었다. 예전엔 **세션이 아침에
            # force-new-deployment 로 올려** 그때 최신 이미지가 고정됐는데, 이제 desired 를
            # 올리는 것은 오토스케일링이고 그건 재배포를 안 한다. 그래도 안전한 이유는
            # 다른 데 있다 — Fargate 는 이미지를 캐시하지 않아 **태스크마다 태그를 새로
            # 당긴다**("container images are not cached on the instance", ECS 문서
            # fargate-pull-behavior). 위에서 민 `analysis-engine-latest` 를 첫 스케일업이
            # 그대로 집는다. desired>0 인 동안은 아래 force-new-deployment 가 필요하다
            # (도는 태스크는 안 바뀐다).
            echo "::notice::${svc} 는 desired 0 — 첫 스케일업이 latest 태그를 새로 당긴다(Fargate 무캐시)"
            exit 0
          fi
          aws ecs update-service --cluster "${cluster}" --service "${svc}" \
            --force-new-deployment >/dev/null
          echo "${svc} 재배포 시작"
          deadline=$(( SECONDS + 600 ))
          while :; do
            state="$(aws ecs describe-services --cluster "${cluster}" --services "${svc}" \
              --query 'services[0].deployments[?status==`PRIMARY`] | [0].rolloutState' --output text)"
            echo "${svc} 롤아웃 상태: ${state}"
            if [ "${state}" = "COMPLETED" ]; then break; fi
            if [ "${state}" = "FAILED" ]; then echo "::error::${svc} 롤아웃 실패"; exit 1; fi
            if [ ${SECONDS} -ge ${deadline} ]; then echo "::error::${svc} 롤아웃 10분 초과"; exit 1; fi
            sleep 15
          done
