# analysis-engine dev 이미지 배포 — KODEX 일일 뉴스 정규화 + 설명 배치 이미지를 ECR 에 push 한다.
# SFN task definition 은 edge/pipeline:analysis-engine-latest 를 참조하므로, 다음 실행부터 새 이미지를 pull 한다.
name: deploy-analysis-engine

on:
  workflow_dispatch:
  push:
    branches: [dev]
    paths:
      - "src/apps/cloud/analysis-engine/**"
      - "src/pyproject.toml"
      - "src/.dockerignore"

permissions:
  id-token: write
  contents: read

concurrency:
  group: deploy-analysis-engine
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: [self-hosted, Linux, X64]
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Login to Amazon ECR
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build & push analysis-engine image
        env:
          AWS_REGION: ${{ vars.AWS_REGION }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          set -euo pipefail
          account_id="$(aws sts get-caller-identity --query Account --output text)"
          ecr_repo="${account_id}.dkr.ecr.${AWS_REGION}.amazonaws.com/edge/pipeline"
          image_sha="${ecr_repo}:analysis-engine-${IMAGE_TAG}"
          image_latest="${ecr_repo}:analysis-engine-latest"
          docker build --platform linux/amd64 \
            -f src/apps/cloud/analysis-engine/Dockerfile \
            -t "${image_sha}" \
            -t "${image_latest}" \
            src
          docker push "${image_sha}"
          docker push "${image_latest}"

      # 상주 설명 소비자(ALPHA-719) — SFN 단발 task 는 run 마다 mutable 태그를 새로
      # 당기지만 상주 서비스는 재배포 없이는 옛 이미지를 돈다. 게이트·스킵·유예 규칙은
      # deploy-data-pipeline.yml 의 상주 롤아웃 블록과 동일한 근거다.
      - name: Roll analysis consumer service
        if: vars.MINUTE_SERVICES_DEPLOYED == 'true'
        env:
          AWS_REGION: ${{ vars.AWS_REGION }}
        run: |
          set -euo pipefail
          cluster="edge-dev-worker"
          svc="edge-dev-data-pipeline-analysis-consumer"
          grace_until="2026-08-10" # ALPHA-719 apply 착지 유예 — 만료 후 이 분기 제거 대상
          can_skip=false
          if [[ "$(date -u +%F)" < "${grace_until}" ]]; then can_skip=true; fi
          describe_err="$(mktemp)"
          if ! described="$(aws ecs describe-services \
            --cluster "${cluster}" --services "${svc}" \
            --query 'services[0].[status,desiredCount]' --output text 2>"${describe_err}")"; then
            if grep -q "AccessDenied" "${describe_err}" && [ "${can_skip}" = "true" ]; then
              echo "::warning::${svc} 조회가 AccessDenied — terraform-apply 선착 전이면 정상(서비스 생성 후 첫 배포가 이미지를 확정한다)"
              exit 0
            fi
            cat "${describe_err}" >&2
            echo "::error::${svc} describe 실패 — 유예(${grace_until} 전)가 아니므로 배선·자격 결함이다"
            exit 1
          fi
          read -r status desired <<<"${described}"
          if { [ "${status}" = "None" ] || [ -z "${status}" ]; } && [ "${can_skip}" = "true" ]; then
            echo "::warning::${svc} 가 아직 없다 — apply 선착 전이면 정상"
            exit 0
          fi
          if [ "${status}" != "ACTIVE" ]; then
            echo "::error::${svc} 가 ACTIVE 가 아니다(status=${status})"
            exit 1
          fi
          # ⚠️ **desired 0 이어도 건너뛰지 않는다**(ALPHA-912). 예전엔 건너뛰고 세션의
          # 아침 force-new-deployment 에 이미지 갱신을 맡겼는데, 그 스케일업이 사라졌다 —
          # 이제 desired 를 올리는 것은 오토스케일링이고 그건 재배포를 안 한다.
          # 스케일아웃이 태그를 다시 해소하지 **않는다**는 것이 핵심이다: ECS 는 배포 단위로
          # 다이제스트를 고정하고("After the container image digests have been established,
          # Amazon ECS uses the digests to start any other desired tasks, and for any future
          # service updates" — ECS 문서 deployment-type-ecs), 갱신 수단은 새 배포뿐이다
          # ("To establish updated image digests, you can force a new deployment").
          # 여기서 안 걸면 mutable 태그(analysis-engine-latest)가 새로 밀려도 스케일업은
          # 옛 다이제스트로 떠서 **고친 버그가 그대로 돈다**(갱신 계기가 영영 없다).
          # desired 0 에서의 force 는 태스크가 없어 다이제스트를 안 잡고, 첫 스케일업이
          # 그때의 태그를 확정한다 — 그게 우리가 원하는 것이다.
          # 실측: desired 0 에서도 롤아웃이 COMPLETED 로 끝난다(약 1분 50초, 아래 상한 안).
          aws ecs update-service --cluster "${cluster}" --service "${svc}" \
            --force-new-deployment >/dev/null
          echo "${svc} 재배포 시작"
          deadline=$(( SECONDS + 600 ))
          while :; do
            state="$(aws ecs describe-services --cluster "${cluster}" --services "${svc}" \
              --query 'services[0].deployments[?status==`PRIMARY`] | [0].rolloutState' --output text)"
            echo "${svc} 롤아웃 상태: ${state}"
            if [ "${state}" = "COMPLETED" ]; then break; fi
            if [ "${state}" = "FAILED" ]; then echo "::error::${svc} 롤아웃 실패"; exit 1; fi
            if [ ${SECONDS} -ge ${deadline} ]; then echo "::error::${svc} 롤아웃 10분 초과"; exit 1; fi
            sleep 15
          done
