# ETF Orca 랜딩페이지(etforca.com) dev 배포 — 랜딩 파일이 바뀐 dev push 에서만 돈다.
# 빌드 도구가 없는 정적 파일이라 deploy-ui.yml(pnpm 빌드)을 재사용하지 않는다. build.sh 가 조각 문서에
# 문서 머리를 붙여 dist/ 를 만들고, 여기서 S3 에 올린 뒤 CloudFront 캐시를 비운다.
# 이 배포는 버킷의 index.html·robots.txt·sitemap.xml 과 assets/ 만 다룬다 — 다른 경로는 지우지 않는다.
# 버킷·배포 ID 는 repo vars 로 받는다(envs/dev 출력값 landing_bucket·landing_distribution_id).
name: deploy-app-landing

on:
  push:
    branches: [dev]
    paths:
      - "src/apps/cloud/app-landing/**"
      # 배포 절차 자체의 변경.
      - ".github/workflows/deploy-app-landing.yml"

permissions:
  id-token: write # OIDC
  contents: read # checkout

# 배포는 직렬화하고, 실행 중 배포는 취소하지 않는다.
concurrency:
  group: deploy-app-landing
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    # 무효화 대기(aws cloudfront wait)만 최대 10분(20초 × 30회)이다 — 그보다 길게 둔다(deploy-ui.yml 과 같은 값).
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Build
        run: src/apps/cloud/app-landing/build.sh

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Upload to S3 & invalidate CloudFront
        working-directory: src/apps/cloud/app-landing/dist
        env:
          BUCKET: ${{ vars.APP_LANDING_BUCKET }}
          DISTRIBUTION_ID: ${{ vars.APP_LANDING_DISTRIBUTION_ID }}
        run: |
          set -euo pipefail
          # repo vars 가 비면 "s3:///index.html" 같은 엉뚱한 실패가 난다. 먼저 확인한다.
          : "${BUCKET:?repo var APP_LANDING_BUCKET 이 비어 있다}"
          : "${DISTRIBUTION_ID:?repo var APP_LANDING_DISTRIBUTION_ID 가 비어 있다}"
          # 순서: 새 assets 추가 → index.html 교체 → 옛 assets 삭제.
          # 삭제를 먼저 하면 index.html 업로드가 실패했을 때 옛 페이지가 지워진 파일을 가리킨다.
          # 전부 no-cache 로 올린다 — 파일명에 해시가 없어 같은 이름으로 바꿔 올릴 수 있으므로,
          # CloudFront 와 브라우저가 매번 원본에 확인하게 한다(안 바뀌었으면 304).
          aws s3 sync assets "s3://${BUCKET}/assets" --cache-control "no-cache"
          aws s3 cp index.html "s3://${BUCKET}/index.html" \
            --content-type "text/html; charset=utf-8" --cache-control "no-cache"
          aws s3 cp robots.txt "s3://${BUCKET}/robots.txt" \
            --content-type "text/plain; charset=utf-8" --cache-control "no-cache"
          aws s3 cp sitemap.xml "s3://${BUCKET}/sitemap.xml" \
            --content-type "application/xml" --cache-control "no-cache"
          aws s3 sync assets "s3://${BUCKET}/assets" --cache-control "no-cache" --delete
          # 캐시 무효화 후 완료까지 대기 — 실패 시 워크플로가 빨간불이 되게.
          id="$(aws cloudfront create-invalidation --distribution-id "${DISTRIBUTION_ID}" \
            --paths '/*' --query 'Invalidation.Id' --output text)"
          echo "무효화 생성: ${id} → 완료 대기"
          aws cloudfront wait invalidation-completed --distribution-id "${DISTRIBUTION_ID}" --id "${id}"
          echo "app-landing 배포 완료: s3://${BUCKET} (CloudFront ${DISTRIBUTION_ID} 무효화 완료)"
