# 앱 배포 재사용 워크플로 — JVM 앱 하나를 빌드해 ECS 서비스로 롤링 배포한다.
#
# 호출자(deploy-<app>.yml)가 app 이름만 넘기면 나머지 식별자는 규약으로 파생된다:
#   ECR 저장소 = edge/<app> · task 정의 family = <app> · ECS 서비스 = <app>
#   (infra/terraform/modules/ecs-service 가 var.name 하나로 세 이름을 모두 만드는 규약과 동일.)
#
# 마이그레이션과의 관계: 앱 배포는 스키마 마이그레이션(schema-migrate.yml)과 완전히 분리돼 있다.
# CI 에서 migrate 완료를 기다리지 않는다 — "스키마가 코드보다 먼저"는 확장-수축(expand-contract)과
# PR 순서 규율로 지킨다: 확장 마이그레이션 PR 을 먼저 머지·적용한 뒤 의존 코드 PR 을 머지한다.
# (근거: docs/implementation.md §4 확장-수축·§5 현행 CD · src/libs/schema/README.md)
#
# 배포 방식: 이미지 태그 = semver. ECR 의 최신 semver 태그를 기준으로 squash 커밋 타입에 따라
# 버전을 올린다(Conventional Commits 파싱 — feat→minor, BREAKING CHANGE/`!`→major, 그 외→patch).
# ECR 태그가 배포 버전의 SSOT 다: build.gradle version·tfvars 핀과 독립이며, tfvars 의 semver 핀은
# TF 소유 baseline 으로 남는다(terraform apply 시 baseline 으로 되돌 수 있음 — infra README 참고).
# 새 태그로 task 정의 리비전을 등록하고 서비스를 업데이트한 뒤 안정화를 폴링한다.
# 주의: run 재실행도 새 버전을 만든다(멱등 아님) — 같은 커밋을 재배포하면 버전이 한 번 더 오른다.
#
# 배포 역할 권한(ALPHA-303 완료): github-oidc-deploy 역할(schema-migrate 와 공유)에 앱 배포
# 권한이 부여돼 있다 — edge/<app> ECR push·DescribeImages(버전 조회),
# ecs:UpdateService/DescribeServices(서비스 ARN 스코프), 앱 task·execution 역할 PassRole.
# (infra/terraform/modules/github-oidc-deploy 의 app_* 변수 · envs/dev 에서 백엔드 앱
#  tenant-console-api·super-admin-api·gateway 배선. widget-api 는 피벗으로 제거 — ADR-0010.)
name: deploy-app

on:
  workflow_call:
    inputs:
      app:
        description: "배포할 앱 이름 (src/apps/<app> · ECR edge/<app> · ECS 서비스 <app>)"
        required: true
        type: string

# 호출자에게서 상속되는 상한 안에서만 유효.
# id-token: OIDC / contents: 체크아웃.
permissions:
  id-token: write
  contents: read

jobs:
  deploy:
    name: deploy ${{ inputs.app }}
    runs-on: ubuntu-latest
    # gradle 콜드 빌드(~10분) + 이미지 push + 롤아웃 대기까지 포함한 상한.
    timeout-minutes: 30
    # OIDC 신뢰 경계 = dev 브랜치(push:dev 트리거이므로 sub=ref:refs/heads/dev). `environment:` 를 쓰지
    # 않는다 — Free+private 플랜은 environment 배포 브랜치 정책을 강제할 수 없어 브랜치 핀이 안 되기 때문
    # (ALPHA-313). 배포 역할·리전 등은 repo-level vars 로 주입한다.
    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Login to Amazon ECR
        id: ecr
        uses: aws-actions/amazon-ecr-login@v2

      # squash 커밋 타입으로 bump 수준을 정하고, ECR 의 최신 semver 태그에서 다음 버전을 계산한다.
      # dev 는 Squash 머지만 받으므로 head_commit 제목 = PR 제목(Conventional Commits)이 보장된다.
      - name: Determine next version
        id: version
        env:
          APP: ${{ inputs.app }}
          HEAD_COMMIT_MSG: ${{ github.event.head_commit.message }}
        run: |
          set -euo pipefail
          title="$(printf '%s\n' "${HEAD_COMMIT_MSG}" | head -n 1)"
          if printf '%s\n' "${HEAD_COMMIT_MSG}" | grep -q 'BREAKING CHANGE' \
             || printf '%s' "${title}" | grep -qE '^[a-z]+(\([^)]*\))?!:'; then
            bump=major
          elif printf '%s' "${title}" | grep -qE '^feat(\([^)]*\))?:'; then
            bump=minor
          else
            bump=patch
          fi

          # ECR 전체 태그에서 semver 형식만 골라 최댓값을 현재 버전으로 삼는다(태그 없으면 0.0.0).
          current="$(aws ecr describe-images --repository-name "edge/${APP}" \
            --query 'imageDetails[].imageTags[]' --output text 2>/dev/null \
            | tr '[:space:]' '\n' | grep -E '^[0-9]+\.[0-9]+\.[0-9]+$' | sort -V | tail -n 1 || true)"
          current="${current:-0.0.0}"
          IFS=. read -r maj min pat <<< "${current}"
          case "${bump}" in
            major) maj=$(( maj + 1 )); min=0; pat=0 ;;
            minor) min=$(( min + 1 )); pat=0 ;;
            patch) pat=$(( pat + 1 )) ;;
          esac
          next="${maj}.${min}.${pat}"
          echo "커밋 제목: ${title}"
          echo "bump=${bump} / ECR 현재 ${current} → 다음 ${next}"
          echo "version=${next}" >> "${GITHUB_OUTPUT}"

      - name: Build & push image
        env:
          REGISTRY: ${{ steps.ecr.outputs.registry }}
          APP: ${{ inputs.app }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          image="${REGISTRY}/edge/${APP}:${VERSION}"
          # 빌드 컨텍스트 = src/ 루트(멀티프로젝트 — 각 앱 Dockerfile 헤더 참고). Fargate 는 amd64.
          docker build --platform linux/amd64 -f "src/apps/${APP}/Dockerfile" -t "${image}" src
          docker push "${image}"

      # TF 소유 base task 정의에서 이미지만 교체해 새 리비전 등록 → 서비스 롤링 업데이트 → 안정화 대기.
      - name: Deploy to ECS service
        env:
          CLUSTER: ${{ vars.ECS_CLUSTER_ARN }}
          REGISTRY: ${{ steps.ecr.outputs.registry }}
          APP: ${{ inputs.app }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          image="${REGISTRY}/edge/${APP}:${VERSION}"

          # base task 정의를 받아 이미지만 교체해 새 리비전 등록(register가 허용하는 필드만 추림).
          base="$(aws ecs describe-task-definition --task-definition "${APP}" --query 'taskDefinition' --output json)"
          new_def="$(printf '%s' "${base}" | jq --arg IMG "${image}" '
            .containerDefinitions[0].image = $IMG
            | {family, taskRoleArn, executionRoleArn, networkMode, containerDefinitions,
               requiresCompatibilities, cpu, memory, runtimePlatform}')"
          new_arn="$(aws ecs register-task-definition --cli-input-json "${new_def}" \
            --query 'taskDefinition.taskDefinitionArn' --output text)"
          echo "등록된 task 정의: ${new_arn}"

          aws ecs update-service --cluster "${CLUSTER}" --service "${APP}" \
            --task-definition "${new_arn}" >/dev/null
          echo "서비스 ${APP} 업데이트 시작 → 롤아웃 대기"

          # 롤아웃 폴링. rolloutState=FAILED 는 circuit breaker 가 켜진 서비스에서만 나오므로,
          # 안 켜진 서비스의 실패(크래시 루프 등)는 deadline 초과로 잡는다.
          deadline=$(( SECONDS + 900 )) # ~15분 (job timeout 30분 안, 빌드 시간 제외 여유)
          while :; do
            state="$(aws ecs describe-services --cluster "${CLUSTER}" --services "${APP}" \
              --query 'services[0].deployments[?status==`PRIMARY`] | [0].rolloutState' --output text 2>/dev/null || true)"
            echo "롤아웃 상태: ${state:-unknown}"
            if [ "${state}" = "COMPLETED" ]; then
              break
            fi
            if [ "${state}" = "FAILED" ]; then
              echo "::error::${APP} 롤아웃 실패 (circuit breaker). 서비스 이벤트를 확인하세요."
              exit 1
            fi
            if [ "${SECONDS}" -ge "${deadline}" ]; then
              echo "::error::${APP} 롤아웃이 제한 시간 내 안정화되지 않았습니다 (마지막 상태: ${state:-unknown})."
              exit 1
            fi
            sleep 15
          done
          echo "${APP} 배포 완료: ${image}"
