# b2b-console-ui dev 배포 — B2B 제안용 콘솔 데모(b2b.etforca.com, ALPHA-1486). 자기 코드(또는
# 워크스페이스 공유 파일)가 바뀐 dev push 에서만 트리거되는 독립 배포. 절차는 deploy-ui.yml 한 벌을 재사용한다.
#
# workflow_dispatch: 버킷·배포는 terraform-apply 가 같은 dev push 에서 만든다. 처음 머지 때는 이 배포가
# apply 보다 먼저 끝나 실패할 수 있어, apply 뒤 repo vars 를 채우고 손으로 다시 돌린다.
name: deploy-b2b-console-ui

on:
  push:
    branches: [dev]
    paths:
      - "apps/edgesignal/b2b-console-ui/**"
      # 소스 워크스페이스 의존성 — ui-kit 변경도 이 앱의 빌드 산출물을 바꾼다.
      - "libs/ui-kit/**"
      # 워크스페이스 공유 — 의존성 그래프에 영향.
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      # 배포 절차 자체의 변경.
      - ".github/workflows/deploy-ui.yml"
      - ".github/workflows/deploy-b2b-console-ui.yml"
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

# 같은 앱의 배포는 직렬화, 실행 중 배포는 취소하지 않는다.
concurrency:
  group: deploy-b2b-console-ui
  cancel-in-progress: false

jobs:
  deploy:
    # OIDC 배포 역할은 dev 브랜치만 신뢰한다 — 다른 ref 에서 손으로 돌리면 역할 획득에서 실패하므로 미리 막는다.
    if: github.ref == 'refs/heads/dev'
    uses: ./.github/workflows/deploy-ui.yml
    with:
      app: b2b-console-ui
      product: edgesignal
      bucket: ${{ vars.B2B_CONSOLE_UI_BUCKET }}
      distribution_id: ${{ vars.B2B_CONSOLE_UI_DISTRIBUTION_ID }}
