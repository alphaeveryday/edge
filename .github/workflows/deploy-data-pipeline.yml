# data-pipeline dev 이미지 배포 — raw 수집 배치 이미지를 ECR 에 push 한다.
# SFN task definition 은 edge/pipeline:data-pipeline-latest 를 참조하므로, 다음 실행부터 새 이미지를 pull 한다.
name: deploy-data-pipeline

on:
  workflow_dispatch:
  push:
    branches: [dev]
    paths:
      - "src/apps/cloud/data-pipeline/**"
      - "src/libs/ontology/**" # 이미지가 edge_ontology lib 를 동봉(ALPHA-539) — 어휘 교체도 재배포 대상
      - "src/pyproject.toml"
      - "src/.dockerignore"

permissions:
  id-token: write
  contents: read

concurrency:
  group: deploy-data-pipeline
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    # 빌드(~5분) + 상주 서비스 6종 롤아웃 대기(각 10분 상한, 순차 최악 60분) 수용
    timeout-minutes: 80
    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Login to Amazon ECR
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build & push data-pipeline image
        env:
          AWS_REGION: ${{ vars.AWS_REGION }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          set -euo pipefail
          account_id="$(aws sts get-caller-identity --query Account --output text)"
          ecr_repo="${account_id}.dkr.ecr.${AWS_REGION}.amazonaws.com/edge/pipeline"
          image_sha="${ecr_repo}:${IMAGE_TAG}"
          image_latest="${ecr_repo}:data-pipeline-latest"
          docker build --platform linux/amd64 \
            -f src/apps/cloud/data-pipeline/Dockerfile \
            -t "${image_sha}" \
            -t "${image_latest}" \
            src
          docker push "${image_sha}"
          docker push "${image_latest}"

      # 1분 상주 서비스(ALPHA-711) — SFN 단발 task 는 run-task 마다 mutable 태그를 새로
      # 당기지만, 상주 서비스는 재배포 없이는 옛 이미지를 계속 돈다. 이미지 push 뒤
      # force-new-deployment 로 같은 task definition 에서 최신 태그를 다시 pull 하게 한다.
      #
      # ⚠️ **명시적 opt-in 게이트**(vars.MINUTE_SERVICES_DEPLOYED): 이미지 CD 와
      # terraform apply 는 서로 독립이라 순서 보장이 없다. 이 워크플로가 dev 에 먼저
      # 착지하면 배포 역할에 새 서비스 ARN 권한이 아직 없어 describe 가 AccessDenied
      # 로 떨어지고 — 그건 "서비스 미생성"과 응답이 다르므로 skip 으로 접을 수도 없다 —
      # **멀쩡한 이미지 배포가 통째로 막힌다**. 그래서 존재 추론 대신 운영자가 선언한
      # 상태를 본다: apply 로 서비스·권한이 선 뒤 그 변수를 켜면 이 블록이 활성화된다.
      # 변수가 꺼져 있는 동안은 상주 서비스가 desired 0 이라(ALPHA-711) 옛 이미지를
      # 도는 문제 자체가 없다.
      - name: Roll minute resident services
        if: vars.MINUTE_SERVICES_DEPLOYED == 'true'
        env:
          AWS_REGION: ${{ vars.AWS_REGION }}
        run: |
          set -euo pipefail
          cluster="edge-dev-worker"
          for svc in edge-dev-data-pipeline-price-worker \
                     edge-dev-data-pipeline-relay \
                     edge-dev-data-pipeline-price-consumer \
                     edge-dev-data-pipeline-news-consumer-realtime \
                     edge-dev-data-pipeline-news-consumer-backfill \
                     edge-dev-data-pipeline-news-worker; do
            # 이 블록은 opt-in 게이트 뒤라 서비스·권한이 이미 서 있다는 선언 위에서
            # 돈다 — 명령 실패(AccessDenied·만료·스로틀)도, ACTIVE 가 아닌 상태도
            # 배선 결함이므로 삼키지 않는다(그 둘을 skip 으로 접으면 옛 이미지를
            # 도는 서비스가 초록으로 지나간다).
            # 예외 하나: **아직 안 만들어진 서비스**(describe 결과 없음)는 경고-스킵한다.
            # 게이트는 불리언 하나라 "기존 서비스 배포됨"과 "새로 추가된 서비스까지 apply
            # 됨"을 구분하지 못하는데, 이미지 CD 와 terraform-apply 는 순서 보장이 없어
            # 서비스 목록이 늘어나는 PR 마다 CD 가 apply 를 앞지르는 창이 생긴다
            # (deploy-order-splits-the-pr). 생성 전 스킵은 무해하다 — desired 0 스킵과
            # 같은 이유로, 첫 스케일업(force-new-deployment)이 최신 이미지를 당긴다.
            # ⚠️ describe 자체의 실패 중 **AccessDenied 만** 같은 창이다 — 배포 역할의
            # DescribeServices 는 terraform output(state 의 서비스 ARN)으로 스코프돼,
            # apply 선착 전의 새 서비스는 MISSING 이 아니라 AccessDenied 로 온다.
            # set -e 아래서 그대로 죽이면 MISSING 분기가 영영 안 밟히고 배포 전체가
            # 실패한다. 그 외 실패(스로틀·자격 만료·서버 오류)는 스킵하면 안 된다 —
            # 기존 서비스가 옛 이미지를 도는 채 워크플로가 초록으로 끝난다(봇 P2).
            # 스킵 자격은 **이번에 새로 정의된 서비스 × 유예 기한 내**로만 한정한다(봇 P2
            # 2건). 기존 3종의 MISSING·AccessDenied 는 apply 경합이 아니라 삭제·오명명·
            # IAM 회귀라 스킵하면 옛 이미지를 도는 채 초록으로 끝난다. 유예는 만료 단언으로
            # 회수한다(deploy-order-splits-the-pr 관례) — 기한 뒤에는 신규 서비스도 apply
            # 가 이미 착지했어야 하므로 전 서비스 동일하게 에러다.
            grace_new_svcs=" edge-dev-data-pipeline-news-consumer-realtime edge-dev-data-pipeline-news-consumer-backfill edge-dev-data-pipeline-news-worker "
            grace_until="2026-08-10" # ALPHA-713 apply 착지 유예 — 만료 후 이 분기 제거 대상
            can_skip=false
            if [[ "${grace_new_svcs}" == *" ${svc} "* ]] && [[ "$(date -u +%F)" < "${grace_until}" ]]; then
              can_skip=true
            fi
            describe_err="$(mktemp)"
            if ! described="$(aws ecs describe-services \
              --cluster "${cluster}" --services "${svc}" \
              --query 'services[0].[status,desiredCount]' --output text 2>"${describe_err}")"; then
              if grep -q "AccessDenied" "${describe_err}" && [ "${can_skip}" = "true" ]; then
                echo "::warning::${svc} 조회가 AccessDenied — terraform-apply 선착 전(새 서비스가 배포 역할 정책에 아직 없음)이라 유예 스킵한다. 생성 후 첫 스케일업이 최신 이미지를 당긴다"
                continue
              fi
              cat "${describe_err}" >&2
              echo "::error::${svc} describe 실패 — 유예 대상(신규 서비스 × ${grace_until} 전)이 아니므로 배선·자격 결함이다"
              exit 1
            fi
            read -r status desired <<<"${described}"
            if [ "${status}" = "None" ] || [ -z "${status}" ]; then
              if [ "${can_skip}" = "true" ]; then
                echo "::warning::${svc} 가 아직 없다 — terraform-apply 선착 전이라 유예 스킵한다(생성 후 첫 스케일업이 최신 이미지를 당긴다)"
                continue
              fi
              echo "::error::${svc} 가 없다 — 기존 서비스의 MISSING 은 삭제·오명명이다(유예 만료 후의 신규 서비스면 apply 가 착지하지 않은 것)"
              exit 1
            fi
            if [ "${status}" != "ACTIVE" ]; then
              echo "::error::${svc} 가 ACTIVE 가 아니다(status=${status}) — MINUTE_SERVICES_DEPLOYED 가 켜져 있는데 서비스가 없다면 배선이 어긋난 것이다"
              exit 1
            fi
            # desired 0 이면 **재배포해도 이미지가 고정되지 않는다** — ECS 는 태스크를
            # 띄울 때 mutable 태그를 다이제스트로 확정하므로, 0 인 채 돌린
            # force-new-deployment 는 즉시 COMPLETED 가 되면서 아무것도 당기지 않는다.
            # 여기서 성공으로 넘기면 "배포됐다"는 인상만 남고 다음 스케일업이 이전
            # 세션의 낡은 다이제스트를 쓸 수 있다. 이미지 고정은 **스케일업 주체**가
            # desired>0 전환과 함께 force-new-deployment 를 걸어 해결한다(ALPHA-712).
            if [ "${desired}" = "0" ]; then
              echo "::notice::${svc} 는 desired 0 이라 재배포를 건너뛴다 — 이미지는 스케일업(desired>0) 시점에 고정된다(ALPHA-712 가 그 전환과 함께 force-new-deployment 를 건다)"
              continue
            fi
            aws ecs update-service --cluster "${cluster}" --service "${svc}" \
              --force-new-deployment >/dev/null
            echo "${svc} 재배포 시작"

            # 롤아웃 확인(deploy-app.yml 선례) — update-service 는 접수만으로 성공이라,
            # 새 태스크가 시크릿·기동 오류로 반복 죽어도 여기서 안 기다리면 CD 가
            # 성공으로 위장된다. desired 0 이면 즉시 COMPLETED 라 무해하다.
            deadline=$(( SECONDS + 600 ))
            while :; do
              state="$(aws ecs describe-services --cluster "${cluster}" --services "${svc}" \
                --query 'services[0].deployments[?status==`PRIMARY`] | [0].rolloutState' --output text)"
              echo "${svc} 롤아웃 상태: ${state}"
              if [ "${state}" = "COMPLETED" ]; then break; fi
              if [ "${state}" = "FAILED" ]; then
                echo "::error::${svc} 롤아웃 실패"; exit 1
              fi
              if [ ${SECONDS} -ge ${deadline} ]; then
                echo "::error::${svc} 롤아웃이 10분 안에 안정화되지 않았다"; exit 1
              fi
              sleep 15
            done
          done
