# data-pipeline dev 이미지 배포 — raw 수집 배치 이미지를 ECR 에 push 한다.
# SFN task definition 은 edge/pipeline:data-pipeline-latest 를 참조하므로, 다음 실행부터 새 이미지를 pull 한다.
name: deploy-data-pipeline

on:
  workflow_dispatch:
  push:
    branches: [dev]
    paths:
      - "src/apps/cloud/data-pipeline/**"
      - "src/libs/ontology/**" # 이미지가 edge_ontology lib 를 동봉(ALPHA-539) — 어휘 교체도 재배포 대상
      - "src/pyproject.toml"
      - "src/.dockerignore"

permissions:
  id-token: write
  contents: read

concurrency:
  group: deploy-data-pipeline
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: [self-hosted, Linux, X64]
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Login to Amazon ECR
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build & push data-pipeline image
        env:
          AWS_REGION: ${{ vars.AWS_REGION }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          set -euo pipefail
          account_id="$(aws sts get-caller-identity --query Account --output text)"
          ecr_repo="${account_id}.dkr.ecr.${AWS_REGION}.amazonaws.com/edge/pipeline"
          image_sha="${ecr_repo}:${IMAGE_TAG}"
          image_latest="${ecr_repo}:data-pipeline-latest"
          docker build --platform linux/amd64 \
            -f src/apps/cloud/data-pipeline/Dockerfile \
            -t "${image_sha}" \
            -t "${image_latest}" \
            src
          docker push "${image_sha}"
          docker push "${image_latest}"

      # 1분 상주 서비스(ALPHA-711) — SFN 단발 task 는 run-task 마다 mutable 태그를 새로
      # 당기지만, 상주 서비스는 재배포 없이는 옛 이미지를 계속 돈다. 이미지 push 뒤
      # force-new-deployment 로 같은 task definition 에서 최신 태그를 다시 pull 하게 한다.
      # 서비스가 아직 없으면(terraform apply 선행 전) **크게 알리고 건너뛴다** — 배선
      # 순서상 정상이고, 조용히 실패로 접으면 배포 자체가 막힌다.
      - name: Roll minute resident services
        env:
          AWS_REGION: ${{ vars.AWS_REGION }}
        run: |
          set -euo pipefail
          cluster="edge-dev-worker"
          for svc in edge-dev-data-pipeline-price-worker \
                     edge-dev-data-pipeline-relay \
                     edge-dev-data-pipeline-price-consumer; do
            # 미존재 서비스는 **성공 응답**의 services=[] 로 온다(query 결과 "None") —
            # 명령 자체의 실패(AccessDenied·만료·스로틀)는 삼키지 않고 전파한다.
            # 오류를 미생성으로 접으면 ACTIVE 서비스가 옛 이미지로 계속 돌면서
            # 배포가 성공으로 위장된다.
            status="$(aws ecs describe-services --cluster "${cluster}" --services "${svc}" \
              --query 'services[0].status' --output text)"
            if [ "${status}" != "ACTIVE" ]; then
              echo "::warning::${svc} 가 아직 없다(status=${status}) — terraform apply 선행 전이면 정상, 이후에도 계속되면 배선 확인"
              continue
            fi
            aws ecs update-service --cluster "${cluster}" --service "${svc}" \
              --force-new-deployment >/dev/null
            echo "${svc} 재배포 시작"

            # 롤아웃 확인(deploy-app.yml 선례) — update-service 는 접수만으로 성공이라,
            # 새 태스크가 시크릿·기동 오류로 반복 죽어도 여기서 안 기다리면 CD 가
            # 성공으로 위장된다. desired 0 이면 즉시 COMPLETED 라 무해하다.
            deadline=$(( SECONDS + 600 ))
            while :; do
              state="$(aws ecs describe-services --cluster "${cluster}" --services "${svc}" \
                --query 'services[0].deployments[?status==`PRIMARY`] | [0].rolloutState' --output text)"
              echo "${svc} 롤아웃 상태: ${state}"
              if [ "${state}" = "COMPLETED" ]; then break; fi
              if [ "${state}" = "FAILED" ]; then
                echo "::error::${svc} 롤아웃 실패"; exit 1
              fi
              if [ ${SECONDS} -ge ${deadline} ]; then
                echo "::error::${svc} 롤아웃이 10분 안에 안정화되지 않았다"; exit 1
              fi
              sleep 15
            done
          done
