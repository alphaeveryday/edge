# 데모 온프렘 박스 배포 CD — 이미지·compose 를 한 번에(ALPHA-542).
#
# 두 갈래(ADR-0033 의 인프라/런타임 분리 원칙):
#   images  — 온프렘 4종 + mock-broker 를 amd64 로 빌드해 ECR push(GitHub 러너=amd64 네이티브).
#             MTS 정적(demo/mts-ai-tab)은 mock-broker 이미지에 내장돼 함께 배포된다(ALPHA-632 —
#             구 S3 sync 갈래 제거, 서빙 원칙: 모든 데모 표면은 박스가 서빙).
#   compose — 번들(compose+migrations)을 base64 인라인으로 SSM Run Command 에 실어 박스에서
#             docker compose up(재배포 시 flyway force-recreate 로 스키마 재적용). 박스는 태그로 타깃.
#
# OIDC 신뢰 = dev 브랜치. 역할·리소스는 데모 전용(envs/demo-onprem/deploy-role.tf), repo vars 로 주입.
# 트리거는 수동(dispatch) — 데모 기동은 의도적. (push:dev 자동은 온프렘 앱 변경마다 재빌드라 보류.)
# 선행: terraform apply(envs/demo-onprem) 로 역할·박스 존재 + repo vars 설정
#   AWS_DEMO_DEPLOY_ROLE_ARN (= terraform output).
name: deploy-demo-onprem

on:
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

# 데모 박스는 하나뿐 — 수동 재실행이 겹치면 두 런이 같은 박스에 SSM 을 뒤섞어
# 마지막 완료분이 이긴다. 큐잉으로 직렬화(다른 deploy-*.yml 과 동일 규약).
concurrency:
  group: deploy-demo-onprem
  cancel-in-progress: false

jobs:
  images:
    name: build ${{ matrix.svc }}
    runs-on: [self-hosted, Linux, X64]
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - { svc: publication-api, dockerfile: src/apps/onprem/publication-api/Dockerfile, context: src }
          - { svc: screening-worker, dockerfile: src/apps/onprem/screening-worker/Dockerfile, context: src }
          - { svc: intake, dockerfile: src/apps/onprem/intake/Dockerfile, context: src }
          - { svc: sync-agent, dockerfile: src/apps/onprem/sync-agent/Dockerfile, context: src }
          - { svc: mock-broker, dockerfile: demo/mock-broker/Dockerfile, context: demo }
          - { svc: tenant-console-api, dockerfile: src/apps/onprem/tenant-console-api/Dockerfile, context: src }
          - { svc: tenant-console-ui, dockerfile: src/apps/onprem/tenant-console-ui/Dockerfile, context: src }
    steps:
      - uses: actions/checkout@v4
      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_DEMO_DEPLOY_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
      - name: Login to Amazon ECR
        id: ecr
        uses: aws-actions/amazon-ecr-login@v2
      - name: Build & push image
        env:
          REGISTRY: ${{ steps.ecr.outputs.registry }}
          SVC: ${{ matrix.svc }}
          DOCKERFILE: ${{ matrix.dockerfile }}
          CONTEXT: ${{ matrix.context }}
          TAG: ${{ github.sha }}
        run: |
          set -euo pipefail
          image="${REGISTRY}/edge/${SVC}:${TAG}"
          # 러너가 amd64 라 정본 멀티스테이지 Dockerfile 을 네이티브로 빌드(로컬 에뮬레이션과 달리 빠름).
          docker build --platform linux/amd64 -f "${DOCKERFILE}" -t "${image}" "${CONTEXT}"
          docker push "${image}"
          echo "pushed ${image}"

  compose:
    name: deploy compose (SSM)
    needs: images
    runs-on: [self-hosted, Linux, X64]
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_DEMO_DEPLOY_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
      - name: Login to Amazon ECR
        id: ecr
        uses: aws-actions/amazon-ecr-login@v2
      - name: Deploy onprem stack to box via SSM
        env:
          REGION: ${{ vars.AWS_REGION }}
          REGISTRY: ${{ steps.ecr.outputs.registry }}
          TAG: ${{ github.sha }}
        run: |
          set -euo pipefail
          # 번들 = compose + migrations-onprem(옆에 놓여 flyway 가 마운트). base64 인라인 → 박스 S3 권한 불필요.
          stage="$(mktemp -d)"
          cp demo/onprem/docker-compose.yml "${stage}/"
          cp -r src/libs/schema/migrations-onprem "${stage}/migrations-onprem"
          bundle="$(tar czf - -C "${stage}" . | base64 -w0)"

          # 박스에서 실행할 스크립트. workflow 변수(${...})는 여기서 확장, \$(...) 는 박스에서 실행.
          box_script="$(cat <<BOX
          set -e
          mkdir -p /opt/edge-onprem && cd /opt/edge-onprem
          echo '${bundle}' | base64 -d | tar xz
          [ "\$(ls migrations-onprem/*.sql 2>/dev/null | wc -l)" -gt 0 ] || { echo 'ERROR: migrations 번들 없음'; exit 1; }
          aws ecr get-login-password --region ${REGION} | docker login --username AWS --password-stdin ${REGISTRY}
          # 재배포 스키마 재적용: flyway 를 강제 재생성(one-shot·불변 이미지라 안 하면 기존 컨테이너 재사용).
          # IMAGE_REGISTRY 도 넘긴다 — 방금 push 한 ${REGISTRY} 와 compose 기본 레지스트리가
          # 갈리면(다른 계정) 엉뚱한 곳에서 pull·auth 실패. push 대상과 일치시킨다.
          IMAGE_REGISTRY=${REGISTRY} IMAGE_TAG=${TAG} docker compose up -d --force-recreate flyway-onprem
          IMAGE_REGISTRY=${REGISTRY} IMAGE_TAG=${TAG} docker compose up -d
          sleep 30
          docker compose ps
          # up -d 는 앱이 startup 후 crash-loop 해도 exit 0 이라 실패를 못 드러낸다(예: validate 실패).
          # 필수 서비스가 running 인지 단언해 fail-loud 한다(flyway 는 exited(0) 정상이라 제외).
          fail=0
          for svc in postgres-onprem sync-agent intake screening-worker publication-api mock-broker tenant-console-api tenant-console-ui; do
            state="\$(docker compose ps --format '{{.State}}' "\$svc" 2>/dev/null || echo missing)"
            echo "\$svc: \$state"
            [ "\$state" = running ] || fail=1
          done
          [ "\$fail" -eq 0 ] || { echo 'ERROR: 일부 온프렘 서비스가 running 이 아님(crash-loop 의심)'; exit 1; }
          # 설명 조회 직행 오리진 스모크(ADR-0053, ALPHA-992) — compose 가 실제로 공개한
          # publication-api 호스트 포트가 응답하는지 박스 안에서 단언한다(running 검사는
          # 포트 미공개·기동 직후 미응답을 못 잡는다). 포트는 compose 와 같은 원천(.env,
          # 없으면 기본 8084)에서 읽는다 — 비기본 포트 정상 구성도 지원한다. 한계: terraform
          # publication_api_port(CloudFront behavior 목적지)와 .env 가 서로 어긋난 구성은 박스
          # 안에서 판별 불가 — 두 값의 일치 요구는 demo/onprem/README 가 명시한다. 200(게시분
          # 있음)·204(없음) 둘 다 정상, 그 외·연결 실패는 배포 실패다.
          smoke_port="\$(grep -s '^PUBLICATION_API_PORT=' .env | cut -d= -f2)"
          code="\$(curl -s -o /dev/null -w '%{http_code}' --max-time 10 "localhost:\${smoke_port:-8084}/api/v1/explanations/069500" || echo 000)"
          echo "publication-api direct origin smoke: \$code"
          # case 문을 안 쓰는 이유: heredoc 이 \$( ) 안에 있어 짝 안 맞는 괄호가 조립을 깨뜨린다(bash 함정).
          if [ "\$code" != 200 ] && [ "\$code" != 204 ]; then echo 'ERROR: publication-api 직행 오리진 스모크 실패(포트 불일치·기동 실패 의심)'; exit 1; fi
          BOX
          )"

          python3 -c 'import json,sys; print(json.dumps({"commands":[sys.stdin.read()]}))' <<<"${box_script}" > params.json
          cid="$(aws ssm send-command --region "${REGION}" \
            --document-name AWS-RunShellScript \
            --targets Key=tag:edge:role,Values=demo-onprem \
            --comment "deploy-demo-onprem ${TAG}" \
            --parameters file://params.json \
            --query 'Command.CommandId' --output text)"
          echo "command id: ${cid}"

          # 타깃 인스턴스 id 확보(태그 타깃이라 미리 모름) — 등록될 때까지 잠깐 대기.
          iid=""
          for i in $(seq 1 10); do
            iid="$(aws ssm list-command-invocations --command-id "${cid}" --region "${REGION}" \
              --query 'CommandInvocations[0].InstanceId' --output text 2>/dev/null || true)"
            [ -n "${iid}" ] && [ "${iid}" != "None" ] && break
            sleep 3
          done
          [ -n "${iid}" ] && [ "${iid}" != "None" ] || { echo "::error::타깃 인스턴스 없음(박스 태그 edge:role=demo-onprem 확인)"; exit 1; }
          echo "instance: ${iid}"

          for i in $(seq 1 40); do
            st="$(aws ssm get-command-invocation --command-id "${cid}" --instance-id "${iid}" --region "${REGION}" --query 'Status' --output text 2>/dev/null || echo Pending)"
            echo "poll ${i}: ${st}"
            case "${st}" in
              Success) break ;;
              Failed|Cancelled|TimedOut)
                echo "::error::SSM 배포 ${st}"
                aws ssm get-command-invocation --command-id "${cid}" --instance-id "${iid}" --region "${REGION}" --query 'StandardErrorContent' --output text
                exit 1 ;;
            esac
            sleep 10
          done
          echo "=== 박스 stdout ==="
          aws ssm get-command-invocation --command-id "${cid}" --instance-id "${iid}" --region "${REGION}" --query 'StandardOutputContent' --output text
          # 폴링이 Success 없이 소진되면(계속 InProgress/Delayed) 실패로 끝낸다 — 미완 배포를 성공으로 보고 금지.
          [ "${st}" = "Success" ] || { echo "::error::SSM 배포가 제한 시간(≈400s) 내 완료되지 않음 (마지막 상태: ${st})"; exit 1; }
