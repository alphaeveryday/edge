# dev 배포 — dev/staging DB에 스키마 마이그레이션을 적용한다.
#
# 원칙: merge 자체는 DB를 바꾸지 않는다. dev 브랜치에 머지가 들어와 이 파이프라인이
# 마이그레이션 task를 실행할 때만 dev/staging DB가 변경된다.
#
# 왜 ECS one-off task인가: dev RDS는 private 서브넷 + SG 제한이라 GitHub-hosted 러너(VPC 밖)에서
# 직접 접속할 수 없다. 그래서 러너에서 flyway를 돌리지 않는다. 대신 러너는 OIDC로 AWS 인증 후
# 마이그레이션 이미지를 ECR에 push하고, VPC 내부에서 도는 ECS Fargate task를 트리거만 한다.
# Flyway는 그 task 안에서 RDS에 적용된다(infra/terraform/modules/schema-migrate).
#
# 앱 배포: changes job 이 push 범위를 diff 해 앱별로 바뀐 것만 골라내고(path 필터),
# 바뀐 앱만 deploy-app.yml(재사용 워크플로)로 독립 배포한다. 모든 앱 배포 job 은
# `needs: migrate` — migrate 성공 후에만 앱이 롤아웃된다(스키마가 코드보다 먼저).
#
# 선행 조건(별도 티켓, ALPHA-303 참고): github-oidc-deploy 역할이 schema-migrate 전용 스코프라
# 앱 ECR push·ecs:UpdateService·PassRole 권한 확장 전까지 앱 배포 job 은 AccessDenied 로 실패한다.
name: deploy-dev

on:
  push:
    branches: [dev]

# OIDC 토큰 발급(id-token) + 체크아웃(contents). 그 외 권한 없음.
permissions:
  id-token: write
  contents: read

# dev 배포는 같은 그룹에서 직렬화한다(동시 마이그레이션 방지).
# cancel-in-progress: false — 실행 중 마이그레이션은 취소하지 않는다(부분 적용 방지).
# 대기 중 새 push가 오면 이전 pending은 취소되고 최신만 실행된다(latest-pending-wins).
# Flyway는 누적이라 최신 run이 dev HEAD의 모든 미적용 마이그레이션을 적용하므로 유실이 없다.
concurrency:
  group: deploy-dev
  cancel-in-progress: false

jobs:
  # 이 push 로 어떤 앱이 바뀌었는지 판별한다. 서드파티 액션 대신 git diff 로 직접 계산
  # (이 repo 는 폴링도 자체 구현하는 최소 의존 방침). 공유 경로(jvm-common·gradle 루트·
  # 이 워크플로들)가 바뀌면 모든 앱을 다시 배포한다 — 과잉 배포가 누락보다 안전하다.
  changes:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      widget_api: ${{ steps.filter.outputs.widget_api }}
      tenant_console_api: ${{ steps.filter.outputs.tenant_console_api }}
      super_admin_api: ${{ steps.filter.outputs.super_admin_api }}
      gateway: ${{ steps.filter.outputs.gateway }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # push 이전 커밋(event.before)과 diff 하려면 전체 히스토리 필요

      - id: filter
        env:
          BEFORE: ${{ github.event.before }}
          AFTER: ${{ github.sha }}
        run: |
          set -euo pipefail
          # force-push·최초 push 는 before 를 신뢰할 수 없다 → 전체 배포로 폴백(누락보다 과잉이 안전).
          if [ "${BEFORE}" = "0000000000000000000000000000000000000000" ] || ! git cat-file -e "${BEFORE}" 2>/dev/null; then
            echo "before(${BEFORE}) 조회 불가 — 전체 배포로 폴백."
            changed="__ALL__"
          else
            changed="$(git diff --name-only "${BEFORE}" "${AFTER}")"
            printf '변경 파일:\n%s\n' "${changed}"
          fi

          # 모든 JVM 앱 이미지에 영향을 주는 공유 경로. schema(SQL)는 migrate 소관이라 제외.
          shared='^src/libs/jvm-common/|^src/settings\.gradle$|^src/gradle/|^src/gradlew|^src/\.dockerignore$|^\.github/workflows/deploy-app\.yml$|^\.github/workflows/deploy-dev\.yml$'

          for app in widget-api tenant-console-api super-admin-api gateway; do
            key="${app//-/_}"
            if [ "${changed}" = "__ALL__" ] || printf '%s\n' "${changed}" | grep -qE "^src/apps/${app}/|${shared}"; then
              echo "${key}=true" >> "${GITHUB_OUTPUT}"
              echo "→ ${app}: 배포 대상"
            else
              echo "${key}=false" >> "${GITHUB_OUTPUT}"
              echo "→ ${app}: 변경 없음"
            fi
          done

  migrate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # 접속값/식별자는 development environment의 vars에서 주입한다(terraform output → GitHub vars).
    environment: development
    steps:
      - uses: actions/checkout@v4

      # OIDC로 배포 역할 assume. 장기 액세스 키 없음.
      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Login to Amazon ECR
        uses: aws-actions/amazon-ecr-login@v2

      # 이 커밋의 SQL을 담은 마이그레이션 이미지를 빌드·push. 태그는 git sha(불변).
      # 재실행 등으로 이미 있으면(불변 저장소) 빌드/푸시를 건너뛴다.
      - name: Build & push migration image
        env:
          ECR_REPO: ${{ vars.MIGRATE_ECR_REPOSITORY }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          set -euo pipefail
          image="${ECR_REPO}:${IMAGE_TAG}"
          repo_name="${ECR_REPO#*/}" # 레지스트리 호스트만 제거(네임스페이스 slash 보존)
          if aws ecr describe-images --repository-name "${repo_name}" --image-ids "imageTag=${IMAGE_TAG}" >/dev/null 2>&1; then
            echo "이미지 ${image} 이미 존재 — 빌드/푸시 생략."
          else
            docker build -t "${image}" -f src/libs/schema/Dockerfile src/libs/schema
            docker push "${image}"
          fi

      # 마이그레이션 이미지를 새 task 정의 리비전으로 등록하고 VPC 내부 one-off task로 실행,
      # 완료(STOPPED)까지 대기 후 컨테이너 exit code로 성공/실패를 판정한다.
      - name: Run schema migration (ECS one-off task)
        env:
          CLUSTER: ${{ vars.ECS_CLUSTER_ARN }}
          FAMILY: ${{ vars.MIGRATE_TASK_FAMILY }}
          ECR_REPO: ${{ vars.MIGRATE_ECR_REPOSITORY }}
          IMAGE_TAG: ${{ github.sha }}
          SUBNETS: ${{ vars.MIGRATE_SUBNET_IDS }}
          SECURITY_GROUP: ${{ vars.MIGRATE_SECURITY_GROUP_ID }}
          LOG_GROUP: ${{ vars.MIGRATE_LOG_GROUP }}
          RUN_ID: ${{ github.run_id }}
        run: |
          set -euo pipefail
          image="${ECR_REPO}:${IMAGE_TAG}"

          # TF가 소유한 base task 정의를 받아 이미지만 교체해 새 리비전 등록(register가 허용하는 필드만 추림).
          base="$(aws ecs describe-task-definition --task-definition "${FAMILY}" --query 'taskDefinition' --output json)"
          new_def="$(printf '%s' "${base}" | jq --arg IMG "${image}" '
            .containerDefinitions[0].image = $IMG
            | {family, taskRoleArn, executionRoleArn, networkMode, containerDefinitions,
               requiresCompatibilities, cpu, memory, runtimePlatform}')"
          new_arn="$(aws ecs register-task-definition --cli-input-json "${new_def}" \
            --query 'taskDefinition.taskDefinitionArn' --output text)"
          echo "등록된 task 정의: ${new_arn}"

          # private 서브넷 + 마이그레이션 SG, 퍼블릭 IP 없음(NAT로 egress, RDS SG 인바운드 허용됨).
          net="awsvpcConfiguration={subnets=[${SUBNETS}],securityGroups=[${SECURITY_GROUP}],assignPublicIp=DISABLED}"
          task_arn="$(aws ecs run-task \
            --cluster "${CLUSTER}" \
            --task-definition "${new_arn}" \
            --launch-type FARGATE \
            --network-configuration "${net}" \
            --started-by "gha-${RUN_ID}" \
            --query 'tasks[0].taskArn' --output text)"
          if [ -z "${task_arn}" ] || [ "${task_arn}" = "None" ]; then
            echo "::error::RunTask가 task를 시작하지 못했습니다."
            exit 1
          fi
          echo "실행된 task: ${task_arn}"

          # 완료 대기. (aws ecs wait tasks-stopped 는 ~10분 고정이라 job timeout 을 못 살린다 → 자체 폴링.)
          deadline=$(( SECONDS + 1080 )) # ~18분 (job timeout 20분 안)
          while :; do
            # 일시적 API 오류는 재시도(deadline 으로만 실패). 정상 상태일 때만 STOPPED 판정.
            status="$(aws ecs describe-tasks --cluster "${CLUSTER}" --tasks "${task_arn}" \
              --query 'tasks[0].lastStatus' --output text 2>/dev/null || true)"
            if [ -n "${status}" ] && [ "${status}" != "None" ]; then
              echo "task 상태: ${status}"
              [ "${status}" = "STOPPED" ] && break
            else
              echo "task 상태 조회 일시 실패 — 재시도"
            fi
            if [ "${SECONDS}" -ge "${deadline}" ]; then
              echo "::error::마이그레이션 task 가 제한 시간 내 완료되지 않았습니다 (마지막 상태: ${status:-unknown})."
              exit 1
            fi
            sleep 15
          done

          # 컨테이너 exit code 판정.
          exit_code="$(aws ecs describe-tasks --cluster "${CLUSTER}" --tasks "${task_arn}" \
            --query 'tasks[0].containers[0].exitCode' --output text)"
          reason="$(aws ecs describe-tasks --cluster "${CLUSTER}" --tasks "${task_arn}" \
            --query 'tasks[0].stoppedReason' --output text)"
          echo "exit code: ${exit_code} / stoppedReason: ${reason}"
          if [ "${exit_code}" != "0" ]; then
            echo "::error::마이그레이션 task 실패 (exit=${exit_code}, reason=${reason}). 로그: CloudWatch ${LOG_GROUP}"
            exit 1
          fi
          echo "dev/staging 스키마 마이그레이션 성공."

  # ─── 앱 배포 (path 필터 기반 독립 배포) ─────────────────────────────
  # 각 job 은 자기 앱 경로가 바뀐 push 에서만 실행되고, migrate 성공을 전제한다.
  # 배포 절차 자체는 deploy-app.yml(재사용 워크플로)에 한 벌만 둔다.

  deploy-widget-api:
    needs: [migrate, changes]
    if: needs.changes.outputs.widget_api == 'true'
    uses: ./.github/workflows/deploy-app.yml
    with:
      app: widget-api
      environment: development

  deploy-tenant-console-api:
    needs: [migrate, changes]
    if: needs.changes.outputs.tenant_console_api == 'true'
    uses: ./.github/workflows/deploy-app.yml
    with:
      app: tenant-console-api
      environment: development

  deploy-super-admin-api:
    needs: [migrate, changes]
    if: needs.changes.outputs.super_admin_api == 'true'
    uses: ./.github/workflows/deploy-app.yml
    with:
      app: super-admin-api
      environment: development

  # gateway 는 아직 dev 환경에 ECS 서비스가 없다(infra/terraform/envs/dev 에 모듈 미존재).
  # 서비스 인프라가 생기면(별도 티켓) 아래 주석을 해제한다 — changes 필터는 이미 gateway 를 추적한다.
  # 실패할 것이 확실한 job 을 켜두지 않는다(가짜 신호 방지, 헤더의 placeholder 원칙과 동일).
  # deploy-gateway:
  #   needs: [migrate, changes]
  #   if: needs.changes.outputs.gateway == 'true'
  #   uses: ./.github/workflows/deploy-app.yml
  #   with:
  #     app: gateway
  #     environment: development
