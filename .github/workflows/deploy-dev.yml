# dev 배포 — dev/staging DB에 스키마 마이그레이션을 적용한다.
#
# 원칙: merge 자체는 DB를 바꾸지 않는다. dev 브랜치에 머지가 들어와 이 파이프라인이
# :libs:schema:flywayMigrate를 실행할 때만 dev/staging DB가 변경된다.
#
# 앱 배포는 아직 워크플로가 없다. 이 워크플로는 스키마 migrate만 책임진다.
# 앱 배포 job/워크플로가 생기면 반드시 `needs: migrate`(또는 이 워크플로 완료)를 걸어
# "migrate 성공 후에만 앱 배포"가 성립하도록 연결한다. 지금은 가짜 성공 신호를 만들지
# 않기 위해 placeholder 배포 job을 두지 않는다.
name: deploy-dev

on:
  push:
    branches: [dev]

# dev 배포는 같은 그룹에서 직렬화한다(동시 마이그레이션 방지).
# cancel-in-progress: false — "실행 중"인 마이그레이션은 취소하지 않는다(부분 적용 방지).
# 단 GitHub은 pending run을 하나만 유지하므로, 대기 중 새 push가 오면 이전 pending은 취소되고
# 최신만 실행된다(latest-pending-wins). Flyway는 누적이라 최신 run이 dev HEAD의 모든 미적용
# 마이그레이션을 순서대로 적용하므로 중간 리비전 마이그레이션이 유실되지 않는다.
# (표준 GitHub Actions concurrency에는 FIFO 큐 옵션이 없다 — actionlint는 queue 키를 거부한다.)
concurrency:
  group: deploy-dev
  cancel-in-progress: false

jobs:
  migrate:
    runs-on: ubuntu-latest
    # 접속값 노출을 막고(승인 게이트를 붙일 수 있게) environment로 묶는다.
    environment: development
    # 접속값은 코드가 아니라 secrets로만 주입한다.
    env:
      FLYWAY_URL: ${{ secrets.DEV_FLYWAY_URL }}
      FLYWAY_USER: ${{ secrets.DEV_FLYWAY_USER }}
      FLYWAY_PASSWORD: ${{ secrets.DEV_FLYWAY_PASSWORD }}
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Flyway migrate (dev/staging DB)
        working-directory: src
        run: ./gradlew :libs:schema:flywayMigrate --info
