name: Deploy Pages

# private 레포라 자체 GitHub Pages 게시가 불가하므로(Free 플랜), 여기서 사이트를
# 빌드해 public 레포(alphaeveryday/edge-pages)로 퍼블리시하고 그쪽 Pages 가 서빙한다.
on:
  push:
    branches: [main, dev]
    paths:
      - "docs/**"
      - "pages/**"
      # 브랜드 로고 캐노니컬 — sync 가 포털로 복사하므로 변경 시 재빌드.
      - "src/libs/ui-kit/src/assets/**"
      - ".github/workflows/deploy-pages.yml"
  workflow_dispatch:

# 이 레포에서는 소스 읽기만 필요하다. 외부 레포 푸시는 PAGES_PUBLISH_TOKEN(PAT)으로 한다.
permissions:
  contents: read

# 동시 퍼블리시 충돌 방지(진행 중 작업은 취소하지 않는다).
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # 발전 기록 생성에 전체 커밋 이력 필요

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # 버전 고정 — 미래 릴리스가 --strict 빌드를 깨뜨리지 않도록 재현성 확보.
      - name: Install MkDocs Material
        run: pip install "mkdocs-material==9.7.6"

      - name: Sync reference docs
        run: python pages/scripts/sync_reference_docs.py

      - name: Generate evolution page
        run: python pages/scripts/generate_evolution.py

      - name: Build site
        run: mkdocs build -f pages/mkdocs.yml --strict

      # 빌드 산출물(pages/site)을 public 레포의 gh-pages 브랜치로 퍼블리시.
      - name: Publish to edge-pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          personal_token: ${{ secrets.PAGES_PUBLISH_TOKEN }}
          external_repository: alphaeveryday/edge-pages
          publish_branch: gh-pages
          publish_dir: ./pages/site
          user_name: github-actions[bot]
          user_email: github-actions[bot]@users.noreply.github.com
          commit_message: "deploy: ${{ github.sha }}"
