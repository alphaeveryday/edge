# prod 배포 — 운영 DB에 스키마 마이그레이션을 적용한 뒤 앱을 배포한다.
#
# 원칙: dev -> main 머지가 릴리스 경계다. main에 머지가 들어와 이 파이프라인이
# :libs:schema:flywayMigrate를 실행할 때만 운영 DB가 변경된다.
# 운영 마이그레이션은 environment protection(수동 승인 게이트)을 거친 뒤에만 실행된다.
# migrate가 성공해야만 prod 앱 배포(deploy-apps)가 진행된다.
name: deploy-prod

on:
  push:
    branches: [main]

# 운영 배포는 절대 병렬 실행하지 않는다.
concurrency:
  group: deploy-prod
  cancel-in-progress: false

jobs:
  migrate:
    runs-on: ubuntu-latest
    # 'production' environment에 required reviewers/보호 규칙을 걸어 수동 승인 게이트로 쓴다.
    # (게이트 활성화는 repo Settings > Environments에서 설정한다 — README 참고.)
    environment: production
    # 접속값은 코드가 아니라 secrets로만 주입한다.
    env:
      FLYWAY_URL: ${{ secrets.PROD_FLYWAY_URL }}
      FLYWAY_USER: ${{ secrets.PROD_FLYWAY_USER }}
      FLYWAY_PASSWORD: ${{ secrets.PROD_FLYWAY_PASSWORD }}
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          build-root-directory: src

      - name: Flyway migrate (prod DB)
        working-directory: src
        run: ./gradlew :libs:schema:flywayMigrate --info

  # 운영 스키마 마이그레이션 성공 후에만 앱을 배포한다.
  # 앱 배포 워크플로는 아직 없다. migrate 성공에 의존(needs)하는 훅만 둔다.
  deploy-apps:
    needs: migrate
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: App deploy placeholder
        run: |
          echo "운영 스키마 마이그레이션 성공. prod 앱 배포 단계 진입."
          echo "앱 배포 워크플로 구현 시 이 스텝을 실제 배포로 교체한다(needs: migrate 유지)."
