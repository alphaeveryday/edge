# prod 배포 — 운영 DB에 스키마 마이그레이션을 적용한다.
#
# 원칙: dev -> main 머지가 릴리스 경계다. main에 머지가 들어와 이 파이프라인이
# :libs:schema:flywayMigrate를 실행할 때만 운영 DB가 변경된다.
# 운영 마이그레이션은 environment protection(수동 승인 게이트)을 거친 뒤에만 실행된다.
#
# 앱 배포는 아직 워크플로가 없다. 이 워크플로는 스키마 migrate만 책임진다.
# 앱 배포 job/워크플로가 생기면 반드시 `needs: migrate`(또는 이 워크플로 완료)를 걸어
# "migrate 성공 후에만 앱 배포"가 성립하도록 연결한다. 지금은 가짜 성공 신호를 만들지
# 않기 위해 placeholder 배포 job을 두지 않는다.
name: deploy-prod

on:
  push:
    branches: [main]

# 운영 배포는 절대 병렬 실행하지 않는다.
concurrency:
  group: deploy-prod
  cancel-in-progress: false

jobs:
  migrate:
    runs-on: ubuntu-latest
    # 'production' environment에 required reviewers/보호 규칙을 걸어 수동 승인 게이트로 쓴다.
    # (게이트 활성화는 repo Settings > Environments에서 설정한다 — README 참고.)
    environment: production
    # 접속값은 코드가 아니라 secrets로만 주입한다.
    env:
      FLYWAY_URL: ${{ secrets.PROD_FLYWAY_URL }}
      FLYWAY_USER: ${{ secrets.PROD_FLYWAY_USER }}
      FLYWAY_PASSWORD: ${{ secrets.PROD_FLYWAY_PASSWORD }}
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Flyway migrate (prod DB)
        working-directory: src
        run: ./gradlew :libs:schema:flywayMigrate --info
