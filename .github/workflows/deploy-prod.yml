# prod 배포 — 운영 DB에 스키마 마이그레이션을 적용한다.
#
# 원칙: dev -> main 머지가 릴리스 경계다. main에 머지가 들어와 이 파이프라인이 마이그레이션 task를
# 실행할 때만 운영 DB가 변경된다. 운영 마이그레이션은 environment protection(수동 승인 게이트)을
# 거친 뒤에만 실행된다.
#
# 왜 ECS one-off task인가: prod RDS는 private 서브넷 + SG 제한이라 GitHub-hosted 러너(VPC 밖)에서
# 직접 접속할 수 없다. 러너는 OIDC로 AWS 인증 후 마이그레이션 이미지를 ECR에 push하고, VPC 내부
# ECS Fargate task를 트리거만 한다. Flyway는 그 task 안에서 RDS에 적용된다.
#
# 선행 조건(prod 인프라): 이 워크플로가 동작하려면 prod 환경에 다음이 있어야 한다 — schema-migrate
# 모듈(ECR·task 정의·SG), production environment 를 신뢰하는 github-oidc-deploy 역할
# (github_environments=["production"] — job 이 environment: production 을 쓰므로 OIDC sub 가 environment 형태),
# prod RDS/클러스터. 그리고 production environment의 vars.* 를 terraform output으로 채운다.
# (현재 repo에는 dev env terraform만 있으므로 prod env는 별도 티켓으로 추가한다.)
#
# 앱 배포는 아직 워크플로가 없다. 이 워크플로는 스키마 migrate만 책임진다(placeholder 배포 job 없음).
name: deploy-prod

on:
  push:
    branches: [main]

permissions:
  id-token: write
  contents: read

# 운영 배포는 같은 그룹에서 절대 병렬 실행하지 않고, 실행 중 마이그레이션은 취소하지 않는다.
concurrency:
  group: deploy-prod
  cancel-in-progress: false

jobs:
  migrate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # 'production' environment에 required reviewers를 걸어 수동 승인 게이트로 쓴다(README 참고).
    # vars.* 도 이 environment 스코프에서 주입된다.
    environment: production
    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Login to Amazon ECR
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build & push migration image
        env:
          ECR_REPO: ${{ vars.MIGRATE_ECR_REPOSITORY }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          set -euo pipefail
          image="${ECR_REPO}:${IMAGE_TAG}"
          repo_name="${ECR_REPO#*/}" # 레지스트리 호스트만 제거(네임스페이스 slash 보존)
          if aws ecr describe-images --repository-name "${repo_name}" --image-ids "imageTag=${IMAGE_TAG}" >/dev/null 2>&1; then
            echo "이미지 ${image} 이미 존재 — 빌드/푸시 생략."
          else
            docker build -t "${image}" -f src/libs/schema/Dockerfile src/libs/schema
            docker push "${image}"
          fi

      - name: Run schema migration (ECS one-off task)
        env:
          CLUSTER: ${{ vars.ECS_CLUSTER_ARN }}
          FAMILY: ${{ vars.MIGRATE_TASK_FAMILY }}
          ECR_REPO: ${{ vars.MIGRATE_ECR_REPOSITORY }}
          IMAGE_TAG: ${{ github.sha }}
          SUBNETS: ${{ vars.MIGRATE_SUBNET_IDS }}
          SECURITY_GROUP: ${{ vars.MIGRATE_SECURITY_GROUP_ID }}
          LOG_GROUP: ${{ vars.MIGRATE_LOG_GROUP }}
          RUN_ID: ${{ github.run_id }}
        run: |
          set -euo pipefail
          image="${ECR_REPO}:${IMAGE_TAG}"

          base="$(aws ecs describe-task-definition --task-definition "${FAMILY}" --query 'taskDefinition' --output json)"
          new_def="$(printf '%s' "${base}" | jq --arg IMG "${image}" '
            .containerDefinitions[0].image = $IMG
            | {family, taskRoleArn, executionRoleArn, networkMode, containerDefinitions,
               requiresCompatibilities, cpu, memory, runtimePlatform}')"
          new_arn="$(aws ecs register-task-definition --cli-input-json "${new_def}" \
            --query 'taskDefinition.taskDefinitionArn' --output text)"
          echo "등록된 task 정의: ${new_arn}"

          net="awsvpcConfiguration={subnets=[${SUBNETS}],securityGroups=[${SECURITY_GROUP}],assignPublicIp=DISABLED}"
          task_arn="$(aws ecs run-task \
            --cluster "${CLUSTER}" \
            --task-definition "${new_arn}" \
            --launch-type FARGATE \
            --network-configuration "${net}" \
            --started-by "gha-${RUN_ID}" \
            --query 'tasks[0].taskArn' --output text)"
          if [ -z "${task_arn}" ] || [ "${task_arn}" = "None" ]; then
            echo "::error::RunTask가 task를 시작하지 못했습니다."
            exit 1
          fi
          echo "실행된 task: ${task_arn}"

          # 완료 대기. (aws ecs wait tasks-stopped 는 ~10분 고정이라 job timeout 을 못 살린다 → 자체 폴링.)
          deadline=$(( SECONDS + 1080 )) # ~18분 (job timeout 20분 안)
          while :; do
            # 일시적 API 오류는 재시도(deadline 으로만 실패). 정상 상태일 때만 STOPPED 판정.
            status="$(aws ecs describe-tasks --cluster "${CLUSTER}" --tasks "${task_arn}" \
              --query 'tasks[0].lastStatus' --output text 2>/dev/null || true)"
            if [ -n "${status}" ] && [ "${status}" != "None" ]; then
              echo "task 상태: ${status}"
              [ "${status}" = "STOPPED" ] && break
            else
              echo "task 상태 조회 일시 실패 — 재시도"
            fi
            if [ "${SECONDS}" -ge "${deadline}" ]; then
              echo "::error::마이그레이션 task 가 제한 시간 내 완료되지 않았습니다 (마지막 상태: ${status:-unknown})."
              exit 1
            fi
            sleep 15
          done

          exit_code="$(aws ecs describe-tasks --cluster "${CLUSTER}" --tasks "${task_arn}" \
            --query 'tasks[0].containers[0].exitCode' --output text)"
          reason="$(aws ecs describe-tasks --cluster "${CLUSTER}" --tasks "${task_arn}" \
            --query 'tasks[0].stoppedReason' --output text)"
          echo "exit code: ${exit_code} / stoppedReason: ${reason}"
          if [ "${exit_code}" != "0" ]; then
            echo "::error::마이그레이션 task 실패 (exit=${exit_code}, reason=${reason}). 로그: CloudWatch ${LOG_GROUP}"
            exit 1
          fi
          echo "운영 스키마 마이그레이션 성공."
