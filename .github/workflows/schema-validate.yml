# PR 검증 — 스키마 마이그레이션을 실제 Postgres에 적용·검증한다.
#
# 원칙: DB 스키마 SSOT는 libs/schema이고, 서비스 앱이 아니라 파이프라인이 Flyway를 실행한다.
# 이 워크플로는 배포가 아니라 "이 PR의 마이그레이션이 안전하게 적용되는가"만 검증한다.
# 단순 build가 아니라 flywayMigrate로 SQL을 실제 실행한 뒤 flywayValidate로 정합성을 확인한다.
# 어떤 secret도 쓰지 않으며 dev/prod DB를 건드리지 않는다(ephemeral 컨테이너만 사용).
#
# 스키마와 무관한 PR에서는 실행하지 않도록 `on:`에 paths 필터를 둔다. 이 레포(private, free 플랜)는
# branch protection을 쓸 수 없어 이 체크가 required가 아니므로 paths 필터가 안전하다.
# 주의: 훗날 이 체크를 required로 지정하려면(플랜 업그레이드 또는 public 전환 후) paths 필터를
# 걷어내고 감지 step으로 되돌려야 한다 — path로 걸러 스킵된 required check는 GitHub에서
# Pending으로 남아 PR을 영구 차단한다.
#
# 한계(감수): paths 필터는 diff의 앞 300개 파일까지만 평가한다(GitHub 제약). 300개 초과 대형 PR에서
# 스키마 변경이 그 밖에 있으면 이 워크플로가 실행되지 않고 guard·검증이 건너뛰어질 수 있다.
# 이 창은 배포 파이프라인의 flywayValidate/Migrate가 fail-loud 백스톱으로 닫는다(발견이 배포 시점으로
# 늦어질 뿐 조용히 통과하지 않는다). required check가 아니어서 이 체크에 머지 차단력이 없는 현 상태에서는
# 감수 가능한 트레이드오프다 — required 도입 시 어차피 위 주의에 따라 무조건 실행으로 되돌린다.
#
# guard는 별도 job이 아니라 이 job의 step으로 둔다. 별도 job + needs로 걸면 guard 실패 시 이 job이
# skip되어 (required check 도입 시) skipped를 "통과"로 오인할 수 있다. step으로 두면 guard 실패 = job red.
name: schema-validate

on:
  pull_request:
    # feature/fix -> dev PR과 릴리스 PR(dev -> main) 모두에서 검증한다.
    branches: [dev, main]
    # 스키마/Gradle/파이프라인 워크플로가 바뀐 PR에서만 실행한다. (required check 도입 시 걷어낼 것 — 위 설명 참고)
    paths:
      - "src/libs/schema/**"
      - "src/gradle/**"
      - "src/gradlew"
      - "src/gradlew.bat"
      - "src/settings.gradle"
      - "src/build.gradle"
      - "src/gradle.properties"
      - ".github/workflows/schema-validate.yml"
      - ".github/workflows/schema-migrate.yml"

# 최소 권한 — 체크아웃(읽기)만 필요하다(어떤 secret도 쓰지 않는 검증 전용 워크플로).
permissions:
  contents: read

# 같은 PR의 이전 실행은 취소한다.
concurrency:
  group: schema-validate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  migrate-and-validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    # build.gradle의 Flyway 블록이 읽는 접속값. 아래에서 띄우는 ephemeral 컨테이너를 가리킨다.
    env:
      FLYWAY_URL: jdbc:postgresql://localhost:5432/edge
      FLYWAY_USER: edge
      FLYWAY_PASSWORD: edge

    steps:
      - uses: actions/checkout@v4
        with:
          # base와의 merge-base diff를 위해 전체 히스토리를 받는다.
          fetch-depth: 0

      # fresh ephemeral DB는 (a) 이미 적용된 파일 수정, (b) 이미 적용된 버전보다 낮은 신규 파일을
      # 모두 통과시킨다(전체를 순서대로 새로 적용하므로). 하지만 dev/prod DB에는 기존 이력이 남아 있어
      # 실제 배포의 flywayValidate/Migrate가 실패한다. 그 드리프트를 PR에서 선제 차단한다.
      # (repo 정책: libs/schema/README.md — 적용된 파일 수정 금지 + timestamp 버전 단조 증가)
      #
      # 한계: base_max는 "체크 실행 시점의 base tip" 기준이다. 같은 base에서 갈라진 두 PR이 각각
      # 더 큰 버전을 추가해 독립 통과한 뒤 순서대로 머지되면, 나중 PR이 이미 적용된 버전보다 낮게
      # 착지할 수 있다(그때는 배포 flywayMigrate가 out-of-order로 fail-loud). 이 창은 branch protection의
      # "Require branches to be up to date before merging"로 닫는다(머지 전 rebase → 최신 base로 재검증).
      # README의 CI 운영 설정 참고.
      - name: 마이그레이션 불변성·버전 단조성 guard
        env:
          BASE_REF: ${{ github.base_ref }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          base="origin/${BASE_REF}"
          head="${HEAD_SHA}"

          # 세트 2개(cloud·onprem — ADR-0016)를 각각 검사한다. 버전 단조성은 세트별 독립.
          for migdir in "src/libs/schema/migrations-cloud" "src/libs/schema/migrations-onprem"; do
            echo "── 세트 검사: ${migdir}"

            # (a) 기존 마이그레이션 파일의 수정(M)/삭제(D)/이름변경(R) 금지 — 추가(A)만 허용.
            changed="$(git diff --name-status --diff-filter=MDR "${base}...${head}" -- "${migdir}/")"
            if [ -n "${changed}" ]; then
              echo "::error::이미 존재하는 마이그레이션 파일을 수정/삭제/이름변경했습니다. 변경은 항상 새 V*.sql 추가로만 하세요(확장-수축)."
              echo "${changed}"
              exit 1
            fi

            # (b) 새로 추가되는 마이그레이션 버전은 base 브랜치 해당 세트의 최신 버전보다 커야 한다(out-of-order 방지).
            added="$(git diff --name-only --diff-filter=A "${base}...${head}" -- "${migdir}/" | grep -E '/V[0-9]+__' || true)"
            if [ -n "${added}" ]; then
              base_max="$(git ls-tree -r --name-only "${base}" -- "${migdir}/" \
                | sed -nE 's#.*/V([0-9]+)__.*#\1#p' | sort -n | tail -1)"
              base_max="${base_max:-0}"
              echo "base('${BASE_REF}') ${migdir} 최신 마이그레이션 버전: ${base_max}"
              # 주의: set -e 하에서 while 본문이 실패하는 test로 끝나면 서브셸이 exit 1이 되어
              # 명령치환 할당이 죽는다. 조건 출력은 반드시 if/fi로 감싸 본문을 exit 0으로 끝낸다.
              bad="$(echo "${added}" | while IFS= read -r f; do
                v="$(echo "${f}" | sed -nE 's#.*/V([0-9]+)__.*#\1#p')"
                [ -n "${v}" ] || continue
                if [ "${v}" -le "${base_max}" ]; then
                  echo "  - ${f} (버전 ${v} <= ${base_max})"
                fi
              done)"
              if [ -n "${bad}" ]; then
                echo "::error::신규 마이그레이션 버전이 base 최신 버전 이하입니다(out-of-order). 항상 더 큰 timestamp 버전으로 추가하세요."
                echo "${bad}"
                exit 1
              fi
            fi
          done

          # (c) 체크인된 gradle.properties의 Flyway override 전면 금지.
          # Flyway 설정은 gradle property/시스템 프로퍼티가 build.gradle의 flyway{} 블록보다
          # 우선한다. gradle.properties로 넣을 수 있는 우회 벡터는 여러 형태다:
          #   flyway.locations=... / systemProp.flyway.outOfOrder=true / org.gradle.jvmargs=-Dflyway.locations=...
          # 이들이 검증·배포 설정을 통째로 우회할 수 있다(빈 locations no-op 배포, out-of-order 허용 등).
          # 합법 gradle.properties 키에는 'flyway'가 없으므로, 체크인된 gradle.properties에서
          # 'flyway'가 언급되면(대소문자 무관) 형태 불문 거부한다. Flyway 설정은 build.gradle/CI env로만.
          propfiles="$(git ls-files | grep -E '(^|/)gradle\.properties$' || true)"
          if [ -n "${propfiles}" ]; then
            offenders="$(echo "${propfiles}" | xargs grep -liE 'flyway' 2>/dev/null || true)"
            if [ -n "${offenders}" ]; then
              echo "::error::체크인된 gradle.properties가 Flyway 설정을 참조합니다(flyway.* / systemProp.flyway.* / -Dflyway...). Flyway 설정은 build.gradle와 CI env로만 주입하세요."
              echo "${offenders}"
              exit 1
            fi
          fi
          echo "OK — 기존 파일 불변 + 신규 버전 단조 증가 + 체크인 gradle.properties의 Flyway override 없음."

      - name: Start ephemeral Postgres
        run: |
          set -euo pipefail
          docker run -d --name edge-ci-pg \
            -e POSTGRES_DB=edge -e POSTGRES_USER=edge -e POSTGRES_PASSWORD=edge \
            -p 5432:5432 postgres:16
          for _ in $(seq 1 30); do
            if docker exec edge-ci-pg pg_isready -U edge -d edge >/dev/null 2>&1; then
              echo "postgres ready"; exit 0
            fi
            sleep 2
          done
          echo "::error::ephemeral Postgres가 준비되지 않았습니다."
          docker logs edge-ci-pg || true
          exit 1

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      # SQL을 실제 Postgres에 적용한다. 마이그레이션이 깨졌으면 여기서 실패한다.
      - name: Flyway migrate (ephemeral Postgres)
        working-directory: src
        run: ./gradlew :libs:schema:flywayMigrate --info

      # 적용본과 마이그레이션 파일의 정합성(체크섬·순서·네이밍)을 검증한다.
      - name: Flyway validate
        working-directory: src
        run: ./gradlew :libs:schema:flywayValidate --info

      # ── 온프렘 세트(migrations-onprem/) — 별도 ephemeral DB에 독립 적용·검증 ──
      - name: Create onprem database
        run: docker exec edge-ci-pg createdb -U edge edge_onprem

      # 주의: Flyway Gradle 플러그인은 환경변수(FLYWAY_*)가 Gradle property 보다 우선한다.
      # job 레벨 FLYWAY_URL(=edge)이 -Pflyway.url 을 덮으므로 step 레벨 env 로 재정의한다.
      - name: Flyway migrate (onprem set)
        working-directory: src
        env:
          FLYWAY_URL: jdbc:postgresql://localhost:5432/edge_onprem
        run: >
          ./gradlew :libs:schema:flywayMigrate --info
          -Pflyway.locations=filesystem:$(pwd)/libs/schema/migrations-onprem

      - name: Flyway validate (onprem set)
        working-directory: src
        env:
          FLYWAY_URL: jdbc:postgresql://localhost:5432/edge_onprem
        run: >
          ./gradlew :libs:schema:flywayValidate --info
          -Pflyway.locations=filesystem:$(pwd)/libs/schema/migrations-onprem
