# PR 검증 — 스키마 마이그레이션을 실제 Postgres에 적용·검증한다.
#
# 원칙: DB 스키마 SSOT는 libs/schema이고, 서비스 앱이 아니라 파이프라인이 Flyway를 실행한다.
# 이 워크플로는 배포가 아니라 "이 PR의 마이그레이션이 안전하게 적용되는가"만 검증한다.
# 단순 build가 아니라 flywayMigrate로 SQL을 실제 실행한 뒤 flywayValidate로 정합성을 확인한다.
# 어떤 secret도 쓰지 않으며 dev/prod DB를 건드리지 않는다(ephemeral 컨테이너만 사용).
#
# 이 job(migrate-and-validate)은 dev·main의 required check로 쓰인다. 그래서 `on:`에 paths 필터를
# 두지 않는다 — path로 걸러 스킵된 required check는 GitHub에서 Pending으로 남아 PR을 영구 차단한다.
# 대신 모든 PR에서 job은 항상 실행되어 결론(성공/실패)을 보고하고, 무거운 검증은 detect step으로
# "스키마 관련 변경이 있을 때만" 수행한다(관련 없으면 빠르게 성공 처리).
#
# Postgres도 job-level `services`로 두지 않는다 — services는 step-level `if`보다 먼저 시작되어,
# 스키마와 무관한 PR도 매번 이미지 pull·health-check를 강제당하고 Docker/DB 기동 실패에 물릴 수 있다.
# 대신 relevant일 때만 조건부 step에서 컨테이너를 띄운다(무관한 PR은 Docker를 아예 건드리지 않음).
#
# guard도 별도 job이 아니라 이 job의 step으로 둔다. 별도 job + needs로 걸면 guard 실패 시 이 job이
# skip되어 branch protection이 skipped를 "통과"로 오인할 수 있다. step으로 두면 guard 실패 = job red.
name: schema-validate

on:
  pull_request:
    # feature/fix -> dev PR과 릴리스 PR(dev -> main) 모두에서 검증한다. (paths 필터는 두지 않는다 — 위 설명 참고)
    branches: [dev, main]

# 최소 권한 — 체크아웃(읽기)만 필요하다(어떤 secret도 쓰지 않는 검증 전용 워크플로).
permissions:
  contents: read

# 같은 PR의 이전 실행은 취소한다.
concurrency:
  group: schema-validate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  migrate-and-validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    # build.gradle.kts의 Flyway 블록이 읽는 접속값. 아래 조건부로 띄우는 ephemeral 컨테이너를 가리킨다.
    # (migrate/validate step에서만 쓰이며, 스킵되는 PR에서는 무시된다.)
    env:
      FLYWAY_URL: jdbc:postgresql://localhost:5432/edge
      FLYWAY_USER: edge
      FLYWAY_PASSWORD: edge

    steps:
      - uses: actions/checkout@v4
        with:
          # base와의 merge-base diff를 위해 전체 히스토리를 받는다.
          fetch-depth: 0

      # 스키마/Gradle/이 파이프라인 워크플로가 바뀐 PR에서만 무거운 검증을 돌린다.
      # (required check라 job 자체는 항상 실행되지만, 관련 없는 PR은 여기서 relevant=false로 빠르게 통과)
      - name: 스키마 관련 변경 감지
        id: changes
        env:
          BASE_REF: ${{ github.base_ref }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          if git diff --quiet "origin/${BASE_REF}...${HEAD_SHA}" -- \
              src/libs/schema/ src/gradle/ src/gradlew src/gradlew.bat \
              src/settings.gradle.kts src/build.gradle.kts src/gradle.properties \
              .github/workflows/schema-validate.yml \
              .github/workflows/deploy-dev.yml \
              .github/workflows/deploy-prod.yml; then
            echo "relevant=false" >> "${GITHUB_OUTPUT}"
            echo "스키마 관련 변경 없음 — 마이그레이션 검증 스킵(체크는 성공 처리)."
          else
            echo "relevant=true" >> "${GITHUB_OUTPUT}"
            echo "스키마 관련 변경 감지 — 마이그레이션 검증 수행."
          fi

      # fresh ephemeral DB는 (a) 이미 적용된 파일 수정, (b) 이미 적용된 버전보다 낮은 신규 파일을
      # 모두 통과시킨다(전체를 순서대로 새로 적용하므로). 하지만 dev/prod DB에는 기존 이력이 남아 있어
      # 실제 배포의 flywayValidate/Migrate가 실패한다. 그 드리프트를 PR에서 선제 차단한다.
      # (repo 정책: libs/schema/README.md — 적용된 파일 수정 금지 + timestamp 버전 단조 증가)
      #
      # 한계: base_max는 "체크 실행 시점의 base tip" 기준이다. 같은 base에서 갈라진 두 PR이 각각
      # 더 큰 버전을 추가해 독립 통과한 뒤 순서대로 머지되면, 나중 PR이 이미 적용된 버전보다 낮게
      # 착지할 수 있다(그때는 배포 flywayMigrate가 out-of-order로 fail-loud). 이 창은 branch protection의
      # "Require branches to be up to date before merging"로 닫는다(머지 전 rebase → 최신 base로 재검증).
      # README의 CI 운영 설정 참고.
      - name: 마이그레이션 불변성·버전 단조성 guard
        if: steps.changes.outputs.relevant == 'true'
        env:
          BASE_REF: ${{ github.base_ref }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          base="origin/${BASE_REF}"
          head="${HEAD_SHA}"
          migdir="src/libs/schema/migrations"

          # (a) 기존 마이그레이션 파일의 수정(M)/삭제(D)/이름변경(R) 금지 — 추가(A)만 허용.
          changed="$(git diff --name-status --diff-filter=MDR "${base}...${head}" -- "${migdir}/")"
          if [ -n "${changed}" ]; then
            echo "::error::이미 존재하는 마이그레이션 파일을 수정/삭제/이름변경했습니다. 변경은 항상 새 V*.sql 추가로만 하세요(확장-수축)."
            echo "${changed}"
            exit 1
          fi

          # (b) 새로 추가되는 마이그레이션 버전은 base 브랜치 최신 버전보다 커야 한다(out-of-order 방지).
          added="$(git diff --name-only --diff-filter=A "${base}...${head}" -- "${migdir}/" | grep -E '/V[0-9]+__' || true)"
          if [ -n "${added}" ]; then
            base_max="$(git ls-tree -r --name-only "${base}" -- "${migdir}/" \
              | sed -nE 's#.*/V([0-9]+)__.*#\1#p' | sort -n | tail -1)"
            base_max="${base_max:-0}"
            echo "base('${BASE_REF}') 최신 마이그레이션 버전: ${base_max}"
            # 주의: set -e 하에서 while 본문이 실패하는 test로 끝나면 서브셸이 exit 1이 되어
            # 명령치환 할당이 죽는다. 조건 출력은 반드시 if/fi로 감싸 본문을 exit 0으로 끝낸다.
            bad="$(echo "${added}" | while IFS= read -r f; do
              v="$(echo "${f}" | sed -nE 's#.*/V([0-9]+)__.*#\1#p')"
              [ -n "${v}" ] || continue
              if [ "${v}" -le "${base_max}" ]; then
                echo "  - ${f} (버전 ${v} <= ${base_max})"
              fi
            done)"
            if [ -n "${bad}" ]; then
              echo "::error::신규 마이그레이션 버전이 base 최신 버전 이하입니다(out-of-order). 항상 더 큰 timestamp 버전으로 추가하세요."
              echo "${bad}"
              exit 1
            fi
          fi
          echo "OK — 기존 파일 불변 + 신규 버전 단조 증가."

      # relevant일 때만 Postgres를 띄운다(무관한 PR은 Docker를 건드리지 않는다).
      - name: Start ephemeral Postgres
        if: steps.changes.outputs.relevant == 'true'
        run: |
          set -euo pipefail
          docker run -d --name edge-ci-pg \
            -e POSTGRES_DB=edge -e POSTGRES_USER=edge -e POSTGRES_PASSWORD=edge \
            -p 5432:5432 postgres:16
          for _ in $(seq 1 30); do
            if docker exec edge-ci-pg pg_isready -U edge -d edge >/dev/null 2>&1; then
              echo "postgres ready"; exit 0
            fi
            sleep 2
          done
          echo "::error::ephemeral Postgres가 준비되지 않았습니다."
          docker logs edge-ci-pg || true
          exit 1

      - name: Set up JDK 21
        if: steps.changes.outputs.relevant == 'true'
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Gradle
        if: steps.changes.outputs.relevant == 'true'
        uses: gradle/actions/setup-gradle@v4

      # SQL을 실제 Postgres에 적용한다. 마이그레이션이 깨졌으면 여기서 실패한다.
      - name: Flyway migrate (ephemeral Postgres)
        if: steps.changes.outputs.relevant == 'true'
        working-directory: src
        run: ./gradlew :libs:schema:flywayMigrate --info

      # 적용본과 마이그레이션 파일의 정합성(체크섬·순서·네이밍)을 검증한다.
      - name: Flyway validate
        if: steps.changes.outputs.relevant == 'true'
        working-directory: src
        run: ./gradlew :libs:schema:flywayValidate --info
