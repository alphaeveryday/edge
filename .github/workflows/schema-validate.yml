# PR 검증 — 스키마 마이그레이션을 실제 Postgres에 적용·검증한다.
#
# 원칙: DB 스키마 SSOT는 libs/schema이고, 서비스 앱이 아니라 파이프라인이 Flyway를 실행한다.
# 이 워크플로는 배포가 아니라 "이 PR의 마이그레이션이 빈 DB에 깨끗하게 적용되는가"만 검증한다.
# 단순 build가 아니라 flywayMigrate로 SQL을 실제 실행한 뒤 flywayValidate로 정합성을 확인한다.
# 어떤 secret도 쓰지 않으며 dev/prod DB를 건드리지 않는다(ephemeral 컨테이너만 사용).
name: schema-validate

on:
  pull_request:
    # feature/fix -> dev PR과 릴리스 PR(dev -> main) 모두에서 검증한다.
    branches: [dev, main]
    paths:
      - "src/libs/schema/**"
      - "src/gradle/**"
      - "src/gradlew"
      - "src/gradlew.bat"
      - "src/settings.gradle.kts"
      - ".github/workflows/schema-validate.yml"
      - ".github/workflows/deploy-dev.yml"
      - ".github/workflows/deploy-prod.yml"

# 같은 PR의 이전 실행은 취소한다.
concurrency:
  group: schema-validate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # fresh ephemeral DB는 "이미 적용된 마이그레이션 파일을 수정"해도 통과한다(체크섬이 새로 계산됨).
  # 하지만 dev/prod DB에는 기존 체크섬이 flyway_schema_history에 남아 있어 실제 배포 때 validate가 실패한다.
  # 그래서 base 브랜치 대비 기존 V*.sql의 수정/삭제/이름변경을 CI에서 차단한다(추가만 허용).
  # (repo 정책: "이미 적용된 마이그레이션 파일은 수정하지 않는다" — libs/schema/README.md)
  guard-immutable-migrations:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 기존 마이그레이션 파일 수정/삭제 차단
        env:
          BASE_REF: ${{ github.base_ref }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          # base(merge-base)부터 PR head까지, migrations 아래에서 수정(M)/삭제(D)/이름변경(R)된 파일.
          changed="$(git diff --name-status --diff-filter=MDR \
            "origin/${BASE_REF}...${HEAD_SHA}" -- src/libs/schema/migrations/)"
          if [ -n "${changed}" ]; then
            echo "::error::이미 존재하는 마이그레이션 파일을 수정/삭제/이름변경했습니다. 변경은 항상 새 V*.sql 추가로만 하세요(확장-수축)."
            echo "${changed}"
            exit 1
          fi
          echo "OK — 기존 마이그레이션 파일 변경 없음(추가만 있음)."

  migrate-and-validate:
    runs-on: ubuntu-latest
    # guard가 실패하면 이 job은 아예 실행되지 않는다(green이 되지 않는다).
    # branch protection이 이 job만 required check로 잡아도 guard 우회를 막는다.
    needs: guard-immutable-migrations

    # 검증 전용 ephemeral Postgres. 러너 종료와 함께 사라진다(운영 DB 아님).
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: edge
          POSTGRES_USER: edge
          POSTGRES_PASSWORD: edge
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U edge -d edge"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    # build.gradle.kts의 Flyway 블록이 읽는 접속값. ephemeral 컨테이너를 가리킨다.
    env:
      FLYWAY_URL: jdbc:postgresql://localhost:5432/edge
      FLYWAY_USER: edge
      FLYWAY_PASSWORD: edge

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          build-root-directory: src

      # SQL을 실제 Postgres에 적용한다. 마이그레이션이 깨졌으면 여기서 실패한다.
      - name: Flyway migrate (ephemeral Postgres)
        working-directory: src
        run: ./gradlew :libs:schema:flywayMigrate --info

      # 적용본과 마이그레이션 파일의 정합성(체크섬·순서·네이밍)을 검증한다.
      - name: Flyway validate
        working-directory: src
        run: ./gradlew :libs:schema:flywayValidate --info
