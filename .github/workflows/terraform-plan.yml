# envs/dev(및 modules) 를 바꾼 PR 에서 terraform plan 을 돌려 결과를 PR 코멘트로 게시한다.
# read-only 역할(edge-tf-plan, trust=pull_request)로만 assume — 이 워크플로는 인프라를 바꾸지 못한다.
# bootstrap·foundation 스택은 CD 대상이 아니다(수동 apply).
name: terraform-plan

on:
  pull_request:
    branches: [dev]
    paths:
      - "infra/terraform/envs/dev/**"
      - "infra/terraform/modules/**"
      - ".github/workflows/terraform-plan.yml"
      - ".github/workflows/terraform-apply.yml"

permissions:
  id-token: write # OIDC
  contents: read # checkout
  pull-requests: write # plan 결과 코멘트

# 같은 PR 의 이전 plan 은 취소(최신 diff 만 의미 있음).
concurrency:
  group: terraform-dev-plan-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  plan:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: infra/terraform/envs/dev
    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.15.7"
          terraform_wrapper: false

      - name: Configure AWS credentials (OIDC · read-only plan role)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.TF_PLAN_ROLE_ARN }}
          aws-region: ap-northeast-2

      - name: terraform init
        run: terraform init -input=false -lock-timeout=5m

      - name: terraform validate
        run: terraform validate

      - name: terraform plan
        id: plan
        # read-only 역할이라 state 락을 쓰지 않는다(-lock=false, 락파일 쓰기 권한 없음). 출력은 파일로.
        run: |
          set -o pipefail
          terraform plan -input=false -lock=false -no-color 2>&1 | tee plan_output.txt
        continue-on-error: true

      - name: Comment plan on PR
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            let plan = fs.readFileSync('infra/terraform/envs/dev/plan_output.txt', 'utf8');
            const max = 60000;
            if (plan.length > max) plan = plan.slice(0, max) + '\n... (출력이 잘렸습니다 — 전체는 워크플로 로그 참고)';
            const ok = '${{ steps.plan.outcome }}' === 'success';
            const marker = '<!-- terraform-plan-envs-dev -->';
            const body = [
              marker,
              '## Terraform Plan (`envs/dev`)',
              `결과: **${ok ? '✅ 성공' : '❌ 실패'}** · commit \`${context.sha.slice(0, 7)}\``,
              '',
              '<details><summary>plan 출력 펼치기</summary>',
              '',
              '```terraform',
              plan,
              '```',
              '</details>',
            ].join('\n');
            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner, repo: context.repo.repo, issue_number: context.issue.number,
            });
            const existing = comments.find((c) => c.body.includes(marker));
            if (existing) {
              await github.rest.issues.updateComment({ owner: context.repo.owner, repo: context.repo.repo, comment_id: existing.id, body });
            } else {
              await github.rest.issues.createComment({ owner: context.repo.owner, repo: context.repo.repo, issue_number: context.issue.number, body });
            }

      - name: Fail if plan errored
        if: steps.plan.outcome != 'success'
        run: |
          echo "::error::terraform plan 실패 — PR 코멘트/로그 확인"
          exit 1
