# PR 검증 — app-api 빌드/테스트 게이트.
#
# app-api 는 레포 루트 Gradle 빌드와 분리된 자체 Gradle 루트라 jvm-test.yml 대상이 아니다.
# 배포 Dockerfile 은 bootJar 만 실행하므로 테스트는 이 워크플로에서만 돈다.
# Testcontainers IT(PostgreSQL·Redis)는 러너 Docker 로 실행된다.
name: test-app-api

on:
  pull_request:
    branches: [dev, main]
    paths:
      - "apps/etforca/app-api/**"
      - ".github/workflows/test-app-api.yml"

permissions:
  contents: read

concurrency:
  group: test-app-api-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: apps/etforca/app-api
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      # build = compile + test + bootJar
      - name: 빌드/테스트
        run: ./gradlew build
