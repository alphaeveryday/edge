# PR 검증 — Python 워크스페이스(analysis-engine·data-pipeline) 테스트 + 이미지 빌드 스모크.
#
# deploy-* 워크플로는 dev 머지 후 CD 전용(빌드→ECR push)이라 테스트가 없다 — 머지 전
# 기계 게이트는 이 워크플로가 유일하다(ALPHA-534). 어떤 secret 도 쓰지 않고 실제
# dev/prod 자원(AWS·RDS)에 접속하지 않는다 — DB 는 ephemeral 컨테이너, S3·LLM 은 fake.
#
# 이 레포(private, free 플랜)는 branch protection 을 쓸 수 없어 이 체크가 required 가
# 아니므로 paths 필터가 안전하다. required 도입 시 필터를 걷어낼 것 — path 로 스킵된
# required check 는 Pending 으로 남아 PR 을 영구 차단한다(schema-validate.yml 헤더 참고).
#
# 주의: 두 앱 테스트를 한 pytest 호출로 합치면 같은 basename(test_config.py)이 충돌한다
# (tests/ 에 __init__.py 없음) — 반드시 앱별로 실행한다.
name: test-python

on:
  pull_request:
    branches: [dev, main]
    paths:
      - "src/apps/cloud/analysis-engine/**"
      - "src/apps/cloud/data-pipeline/**"
      - "src/pyproject.toml"
      - "src/uv.lock"
      - "src/.dockerignore"   # 이미지 컨텍스트 규칙 변경도 스모크 대상(deploy-* paths 와 일치)
      - "src/libs/schema/migrations-cloud/**"   # e2e 가 실 스키마를 적용한다 — 스키마 변경도 게이트 대상
      - ".github/workflows/test-python.yml"

# 최소 권한 — 체크아웃(읽기)만 필요하다.
permissions:
  contents: read

# 같은 PR 의 이전 실행은 취소한다.
concurrency:
  group: test-python-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ── 단위 테스트 (앱별 분리 실행) ─────────────────────────────
  pytest:
    runs-on: [self-hosted, Linux, X64]
    timeout-minutes: 15
    # Self-hosted runner jobs share ~/.cache/uv. Give each matrix job a private
    # cache directory so setup-uv's post-job prune cannot wait on another job.
    env:
      UV_CACHE_DIR: ${{ github.workspace }}/.uv-cache-${{ github.run_id }}-${{ github.run_attempt }}-${{ github.job }}-${{ matrix.app }}
    strategy:
      fail-fast: false
      matrix:
        app: [analysis-engine, data-pipeline]
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          cache-dependency-glob: "src/uv.lock"

      - name: uv sync (locked, 앱 스코프)
        working-directory: src
        # --locked: 락-pyproject 정합 fail-loud (--frozen 은 낡은 락을 통과시킨다).
        # --python 3.12: 프로덕션 이미지(python:3.12-slim)와 러너 인터프리터를 고정 일치.
        # --package: 워크스페이스 합집합이 아니라 그 앱 의존만 설치 — 교차 의존 누수가
        # CI 에선 green, 프로드 이미지에선 ImportError 로 갈리는 것을 차단한다.
        run: uv sync --locked --python 3.12 --package ${{ matrix.app }}

      - name: pytest ${{ matrix.app }}
        working-directory: src
        run: uv run --package ${{ matrix.app }} pytest apps/cloud/${{ matrix.app }}/tests -q

  # ── 이미지 빌드 스모크 (push 없음) ───────────────────────────
  # 머지 후 deploy-* 에서야 첫 docker build 가 도는 구멍을 막는다 — 패키징·Dockerfile
  # 파손(예: 모듈 트리 개편)이 PR 단계에서 잡힌다.
  image-smoke:
    runs-on: [self-hosted, Linux, X64]
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        app: [analysis-engine, data-pipeline]
    steps:
      - uses: actions/checkout@v4

      - name: docker build ${{ matrix.app }}
        run: docker build -f src/apps/cloud/${{ matrix.app }}/Dockerfile src


  # ── 골든패스 E2E 1개 (뉴스 조립 → 분석 → 영속) ───────────────
  # ephemeral Postgres 에 Flyway cloud 세트를 실제 적용한 뒤, assemble_events(분류 LLM
  # fake) → analysis-engine(DeepSeek fake·S3 fake) 를 같은 DB 위에서 이어 돌린다.
  # 두 코드베이스의 결정적 ID 수렴과 실 스키마 SQL 정합이 검증 대상이다(ALPHA-534).
  # sync 는 무스코프다 — 이 테스트만 의도적으로 두 워크스페이스 멤버를 함께 쓴다.
  e2e:
    runs-on: [self-hosted, Linux, X64]
    timeout-minutes: 15
    # This job runs alongside the pytest matrix on the same self-hosted runner.
    env:
      UV_CACHE_DIR: ${{ github.workspace }}/.uv-cache-${{ github.run_id }}-${{ github.run_attempt }}-${{ github.job }}
    steps:
      - uses: actions/checkout@v4

      # self-hosted 러너가 컨테이너 안에서 돌아 GitHub Actions 서비스 컨테이너(services:)를
      # 쓸 수 없다("Container feature is not supported when runner is already running inside
      # container" — DinD 로도 재활성화되지 않는다). DinD 로 직접 Postgres 를 띄운다(schema-validate 와 동일 패턴).
      - name: Start ephemeral Postgres
        run: |
          set -euo pipefail
          docker rm -f edge-e2e-pg >/dev/null 2>&1 || true
          # 호스트 5432 고정 점유는 박스의 다른 Postgres·CI 컨테이너와 충돌한다 — 동적 할당 후 매핑 포트를 읽는다.
          docker run -d --name edge-e2e-pg \
            -e POSTGRES_DB=edge -e POSTGRES_USER=edge -e POSTGRES_PASSWORD=edge \
            -p 5432 postgres:16
          pgport="$(docker port edge-e2e-pg 5432/tcp | head -1 | sed 's/.*://')"
          echo "E2E_PGPORT=${pgport}" >> "$GITHUB_ENV"
          for _ in $(seq 1 30); do
            if docker exec edge-e2e-pg pg_isready -U edge -d edge >/dev/null 2>&1; then
              echo "postgres ready on host port ${pgport}"; exit 0
            fi
            sleep 2
          done
          echo "::error::ephemeral Postgres가 준비되지 않았습니다."
          docker logs edge-e2e-pg || true
          exit 1

      # 버전은 libs/schema/build.gradle 의 Flyway 플러그인(10.21.0)과 맞춘다.
      # DinD 에선 워크스페이스 서브경로 bind mount 가 빈 디렉터리로 잡히는 함정이 있다
      # (루트 $PWD 마운트만 실제 내용이 실린다 — gitleaks 와 동일). 루트를 마운트하고
      # -locations 로 컨테이너 안 경로를 지정한다.
      - name: Flyway migrate (cloud set)
        run: >
          docker run --rm --network host
          -v "$PWD:/workspace:ro"
          flyway/flyway:10.21.0
          -locations=filesystem:/workspace/src/libs/schema/migrations-cloud
          -url=jdbc:postgresql://localhost:${{ env.E2E_PGPORT }}/edge -user=edge -password=edge migrate

      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          cache-dependency-glob: "src/uv.lock"

      - name: uv sync (locked)
        working-directory: src
        run: uv sync --locked --python 3.12

      - name: golden-path e2e
        working-directory: src
        env:
          E2E_PGHOST: 127.0.0.1
          # E2E_PGPORT 는 "Start ephemeral Postgres" 스텝이 $GITHUB_ENV 로 넘긴다.
        run: uv run pytest apps/cloud/analysis-engine/tests/e2e -q

      # 영속 러너에 컨테이너·포트를 남기지 않는다.
      - name: Tear down ephemeral Postgres
        if: always()
        run: docker rm -f edge-e2e-pg >/dev/null 2>&1 || true
