# PR 검증 — Python 워크스페이스(analysis-engine·data-pipeline) 테스트 + 이미지 빌드 스모크.
#
# deploy-* 워크플로는 dev 머지 후 CD 전용(빌드→ECR push)이라 테스트가 없다 — 머지 전
# 기계 게이트는 이 워크플로가 유일하다(ALPHA-534). 어떤 secret 도 쓰지 않고 실제
# dev/prod 자원(AWS·RDS)에 접속하지 않는다 — 단위 테스트는 fake I/O 로만 돈다.
# 골든패스 E2E job(ephemeral Postgres + Flyway)은 후속 PR 에서 추가된다.
#
# 이 레포(private, free 플랜)는 branch protection 을 쓸 수 없어 이 체크가 required 가
# 아니므로 paths 필터가 안전하다. required 도입 시 필터를 걷어낼 것 — path 로 스킵된
# required check 는 Pending 으로 남아 PR 을 영구 차단한다(schema-validate.yml 헤더 참고).
#
# 주의: 두 앱 테스트를 한 pytest 호출로 합치면 같은 basename(test_config.py)이 충돌한다
# (tests/ 에 __init__.py 없음) — 반드시 앱별로 실행한다.
name: test-python

on:
  pull_request:
    branches: [dev, main]
    paths:
      - "src/apps/cloud/analysis-engine/**"
      - "src/apps/cloud/data-pipeline/**"
      - "src/pyproject.toml"
      - "src/uv.lock"
      - ".github/workflows/test-python.yml"

# 최소 권한 — 체크아웃(읽기)만 필요하다.
permissions:
  contents: read

# 같은 PR 의 이전 실행은 취소한다.
concurrency:
  group: test-python-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ── 단위 테스트 (앱별 분리 실행) ─────────────────────────────
  pytest:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        app: [analysis-engine, data-pipeline]
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          cache-dependency-glob: "src/uv.lock"

      - name: uv sync (frozen)
        working-directory: src
        run: uv sync --frozen

      - name: pytest ${{ matrix.app }}
        working-directory: src
        run: uv run pytest apps/cloud/${{ matrix.app }}/tests -q

  # ── 이미지 빌드 스모크 (push 없음) ───────────────────────────
  # 머지 후 deploy-* 에서야 첫 docker build 가 도는 구멍을 막는다 — 패키징·Dockerfile
  # 파손(예: 모듈 트리 개편)이 PR 단계에서 잡힌다.
  image-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        app: [analysis-engine, data-pipeline]
    steps:
      - uses: actions/checkout@v4

      - name: docker build ${{ matrix.app }}
        run: docker build -f src/apps/cloud/${{ matrix.app }}/Dockerfile src

