# gitleaks 설정 (ALPHA-402) — 기본 규칙 세트를 그대로 확장한다.
#
# 오탐 예외 정책:
# - 일회성(특정 커밋·파일·라인)은 이 파일이 아니라 .gitleaksignore 에
#   fingerprint 로 등록한다 — 사유를 주석으로 남긴다.
# - 패턴 단위 allowlist(아래 [allowlist])는 "의도된 데모 기본값" 계열처럼
#   반복되는 오탐에만 쓴다 — 넓은 정규식은 실제 유출을 가리므로 최소로.
# - 로컬·데모 전용 기본 비밀번호(demo-admin-1 등)·compose 의 edge/edge 는
#   gitleaks 기본 규칙이 애초에 잡지 않는 저엔트로피 값이라 예외가 필요 없다 —
#   잡히기 시작하면 그 값이 실제 비밀값처럼 생겼다는 신호이므로 예외 대신 검토.

[extend]
useDefault = true

# Public JSON metric identifiers, not credentials. Exact secret text only;
# keep inspecting every file and every other value, including fields named key.
# PostHog 프로젝트 키(phc_) — 브라우저·앱 번들에 실리도록 만든 공개 수집용 키라 비밀이 아니다.
# 랜딩·truth-web·포트폴리오·앱이 같은 계열을 쓰고 변수 이름에 따라 반복해서 걸려 패턴으로 둔다.
# 서버용 개인 API 키(phx_)는 비밀이라 접두어와 길이를 고정해 그 계열을 가리지 않는다.
[allowlist]
description = "Public factor metric identifiers and PostHog public project keys"
regexTarget = "secret"
regexes = [
  '''^(ma20_distance_pct|ma60_direction|commodity_return_20d_pct|distribution_yield_12m_pct)$''',
  '''^phc_[A-Za-z0-9]{44}$''',
]
