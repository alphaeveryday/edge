plugins {
	id 'java'
	id 'org.springframework.boot' version '4.1.0'
	id 'io.spring.dependency-management' version '1.1.7'
}

group = 'com.edge'
version = '0.0.1-SNAPSHOT'

java {
	toolchain {
		languageVersion = JavaLanguageVersion.of(21)
	}
}

repositories {
	mavenCentral()
}

dependencies {
	implementation project(':libs:jvm-common') // 에러 응답 공통 포맷(ApiResponse)·에러 코드 규약
	implementation 'org.springframework.boot:spring-boot-starter-actuator'
	implementation 'org.springframework.boot:spring-boot-starter-webmvc'
	// 온프렘 Published Store 조회·요청 메트릭 기록 (migrations-onprem 스키마). JPA 로 매핑하되
	// 스키마는 Flyway(libs/schema) SSOT — ddl-auto=validate 로 검증만 한다(ADR-0038).
	implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
	// 조회 캐시(ALPHA-433) — 단일 인스턴스 인프로세스 캐시. 별도 캐시 서버(Redis)는 온프렘
	// 반입 컴포넌트를 늘려 보류했다(버전은 Boot dependency management 관리).
	implementation 'com.github.ben-manes.caffeine:caffeine'
	// 다중 인스턴스 캐시 로컬 실험(LOCAL-4/5) — Redis L2 후보 실측용. 도입 확정이 아니다:
	// ADR-0051 결정 6(온프렘 외부 의존 = Postgres 하나, Redis 반입 보류)은 유지되며,
	// 기본 프로필(publication.cache.mode=caffeine)에서는 Redis 에 연결하지 않는다.
	implementation 'org.springframework.boot:spring-boot-starter-data-redis'
	// 실험 관측(LOCAL-2) — /actuator/prometheus 노출. metrics 코어는 actuator starter 에 포함,
	// registry 만 얹으면 export 자동설정이 활성화된다.
	runtimeOnly 'io.micrometer:micrometer-registry-prometheus'
	runtimeOnly 'org.postgresql:postgresql'
	testImplementation 'org.springframework.boot:spring-boot-starter-webmvc-test'
	// 엔티티↔스키마 정합 검증: 실 Postgres 컨테이너에 onprem 마이그레이션을 적용하고
	// Hibernate validate 를 실통과시킨다(H2 는 JSONB·IDENTITY 등 Postgres 문법 미지원).
	testImplementation 'org.springframework.boot:spring-boot-testcontainers'
	testImplementation 'org.testcontainers:testcontainers-postgresql'
	// Redis L2 통합 테스트(실 직렬화·TTL·장애 fallback) — 버전은 Boot BOM 관리.
	testImplementation 'com.redis:testcontainers-redis'
	// Boot 4 는 자동설정을 기술별 모듈로 분리했다 — Flyway 자동설정(마이그레이션을 JPA 검증 전에
	// 실행)은 spring-boot-flyway 에 있고 flyway-core 만으론 트리거되지 않는다.
	testImplementation 'org.springframework.boot:spring-boot-flyway'
	testImplementation 'org.flywaydb:flyway-database-postgresql'
	// 번들 evidences 소비자 계약 테스트(JSON Schema 2020-12) — producer(tenant-sync-api)와 같은
	// libs/schema 공유 스키마를 로드하고, 실제 파싱(ExplanationStore.parseEvidences)이 그 형상을
	// 읽는지 검증한다(ALPHA-497 양단 일치). 문자열 입력으로 검증기 Jackson 을 앱과 분리한다.
	testImplementation 'com.networknt:json-schema-validator:1.5.6'
	testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

// 번들 계약 SSOT(event-bundle.schema.json)를 테스트 classpath 에 올린다(producer 와 동일 파일).
sourceSets {
	test {
		resources {
			srcDir "$rootDir/libs/schema/contracts"
		}
	}
}

tasks.named('test') {
	useJUnitPlatform()
}
