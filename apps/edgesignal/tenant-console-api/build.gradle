plugins {
	id 'java'
	id 'org.springframework.boot' version '4.1.0'
	id 'io.spring.dependency-management' version '1.1.7'
}

group = 'com.edge'
version = '0.0.1-SNAPSHOT'

java {
	toolchain {
		languageVersion = JavaLanguageVersion.of(21)
	}
}

repositories {
	mavenCentral()
}

dependencies {
	implementation project(':libs:jvm-common') // 에러 응답 공통 포맷(ApiResponse)·에러 코드 규약
	implementation 'org.springframework.boot:spring-boot-starter-actuator'
	implementation 'org.springframework.boot:spring-boot-starter-webmvc'
	// 검수·인증 도메인 — 온프렘 member·analysis_item·publication 읽기/소유 전이 쓰기.
	// DDL 은 Flyway(libs/schema/migrations-onprem)가 SSOT — Hibernate 는 검증만
	// 한다(ddl-auto=validate). ALPHA-525·526 과 함께 진행한 JdbcTemplate→JPA 전환(ADR-0038).
	implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
	// 데모 자체 계정 비밀번호 해시(BCrypt)만 사용 — Spring Security 프레임워크 전체가
	// 아니라 crypto 모듈 단독(ADR-0025 데모 최소 구현, 인가는 ConsoleAuthFilter 직접).
	implementation 'org.springframework.security:spring-security-crypto'
	runtimeOnly 'org.postgresql:postgresql'
	testImplementation 'org.springframework.boot:spring-boot-starter-webmvc-test'
	// 엔티티↔스키마 정합(validate) 통합 검증 — Testcontainers Postgres 에 실
	// migrations-onprem 을 Flyway 로 적용한 뒤 앱을 기동한다(Docker 필요, 없으면 skip).
	// Boot BOM 은 testcontainers 코어만 관리하므로 하위 모듈 버전은 testcontainers-bom 으로 맞춘다.
	testImplementation platform('org.testcontainers:testcontainers-bom:2.0.5')
	testImplementation 'org.springframework.boot:spring-boot-testcontainers'
	testImplementation 'org.testcontainers:testcontainers-junit-jupiter'
	testImplementation 'org.testcontainers:testcontainers-postgresql'
	// Boot 4.x 는 autoconfig 가 기술별 모듈로 분리 — Flyway 자동설정(마이그레이션 실행·
	// JPA 전 순서 보장)은 spring-boot-flyway 가 제공한다(flyway-core 만으론 부족).
	testImplementation 'org.springframework.boot:spring-boot-flyway'
	testImplementation 'org.flywaydb:flyway-core'
	testRuntimeOnly 'org.flywaydb:flyway-database-postgresql'
	testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

// 통합 테스트 Flyway 가 스키마 SSOT(libs/schema/migrations-onprem)를 그대로 적용하도록
// 테스트 클래스패스 db/migration 에 복사한다 — 테스트-로컬 DDL 드리프트를 피한다.
tasks.named('processTestResources') {
	from("${rootDir}/libs/schema/migrations-onprem") {
		into 'db/migration'
	}
}

tasks.named('test') {
	useJUnitPlatform()
}
