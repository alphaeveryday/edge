# 온프렘 콘솔 co-host — SPA 정적 서빙 + /api 를 tenant-console-api 로 리버스 프록시.
# UI 는 백엔드를 상대경로 /api/v1 로 호출(same-origin 전제, 세션 쿠키 same-site:strict).
server {
    listen 80;

    # /api 를 먼저 매칭 — API 응답이 SPA fallback(index.html)에 가려지지 않게 한다.
    # proxy_pass 에 URI(트레일링 슬래시)를 두지 않는다 — 원본 /api/v1/... 경로를 그대로 전달해야
    # tenant-console-api 의 /api/v1/* 컨트롤러에 닿는다(슬래시를 붙이면 /api/ 접두어가 잘려 404).
    location /api/ {
        proxy_pass http://tenant-console-api:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Cookie 요청헤더·Set-Cookie 응답헤더는 nginx 가 기본 보존한다(세션 인증 유지).
    }

    # SPA — 정적 자산 우선, 없으면 index.html 로 폴백(클라이언트 라우팅).
    location / {
        root /usr/share/nginx/html;
        try_files $uri /index.html;
    }
}
