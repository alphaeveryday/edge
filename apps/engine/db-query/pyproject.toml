[project]
name = "db-query"
version = "0.1.0"
description = "Read-only operational PostgreSQL query task"
requires-python = ">=3.12"
dependencies = ["psycopg2-binary>=2.9", "boto3>=1.34"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/edge_db_query"]

[dependency-groups]
dev = ["pytest>=8"]

[tool.pytest.ini_options]
pythonpath = ["src"]
