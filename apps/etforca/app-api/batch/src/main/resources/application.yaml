spring:
  application:
    name: batch
  main:
    web-application-type: none
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:55440/app}
    username: ${SPRING_DATASOURCE_USERNAME:app}
    password: ${SPRING_DATASOURCE_PASSWORD:app}
  batch:
    jdbc:
      initialize-schema: never   # 메타 테이블은 app-api Flyway 소관
app:
  pipeline:
    url: ${APP_PIPELINE_URL}
    username: ${APP_PIPELINE_USERNAME}
    password: ${APP_PIPELINE_PASSWORD}
