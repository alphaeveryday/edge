<!doctype html>

<head>
<meta charset="utf-8">
<style>
  html, body { margin: 0; }
  body { background: var(--bg); color: var(--text); font-family: var(--font-sans); padding: var(--space-xl) var(--page-x); -webkit-font-smoothing: antialiased; }
  .note { margin: var(--space-md) 0 0; font-size: 12.5px; color: var(--textMuted); }
  .stack { display: flex; flex-direction: column; gap: var(--space-md); max-width: 390px; }
  .rowx { display: flex; flex-wrap: wrap; align-items: center; gap: var(--space-sm); }
  svg.ic { fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; flex: none; }

  .lr { display: flex; align-items: center; gap: 14px; padding: 14px 8px; }
  .lr.div { border-bottom: 1px solid var(--surface); }
  .lr .ico { width: 22px; height: 22px; display: flex; align-items: center; justify-content: center; color: var(--textSub); }
  .lr .tx { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 3px; }
  .lr .lbl { font-size: 15.5px; font-weight: 600; letter-spacing: -0.3px; color: var(--text); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .lr .sub { font-size: 12.5px; color: var(--textMuted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .lr .val { font-size: 14px; color: var(--textMuted); }
  .lr .chv { color: var(--textDisabled); display: flex; }
</style>
</head>
