<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<style>
  html, body { margin: 0; }
  body { background: var(--bg); color: var(--text); font-family: var(--font-sans); padding: var(--space-xl) var(--page-x); -webkit-font-smoothing: antialiased; }
  .note { margin: var(--space-md) 0 0; font-size: 12.5px; color: var(--textMuted); }
  .stack { display: flex; flex-direction: column; gap: var(--space-md); max-width: 390px; }
  .rowx { display: flex; flex-wrap: wrap; align-items: center; gap: var(--space-sm); }
  svg.ic { fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; flex: none; }

  .sh { display: flex; align-items: baseline; gap: 8px; max-width: 390px; }
  .sh h3 { flex: 1; margin: 0; font-size: 20px; font-weight: 800; letter-spacing: -0.6px; color: var(--text); }
  .sh .act { display: inline-flex; align-items: center; gap: 2px; font-size: 12.5px; font-weight: 700; color: var(--primary); }
  .sh .meta { font-size: 12.5px; color: var(--textMuted); }
  .sh .badge { align-self: center; font-size: 11.5px; font-weight: 700; color: var(--textMuted); background: var(--surface); border-radius: var(--radius-tag); padding: 5px 9px; }
</style>
</head>
<body>
<div class="stack" style="gap: var(--space-xl)">
  <div class="sh"><h3>많이 본 ETF</h3><span class="act">더 보기<svg class="ic" width="14" height="14" viewBox="0 0 24 24"><path d="m9 18 6-6-6-6"/></svg></span></div>
  <div class="sh"><h3>오늘의 전망</h3><span class="badge">08:30 기준</span></div>
  <div class="sh"><h3>관심 ETF</h3><span class="meta">12개</span></div>
</div>
<p class="note">정적 재현 · src/components/ui/SectionHead.tsx 의 수치를 옮김</p>
</body>
</html>
