<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<style>
  html, body { margin: 0; }
  body { background: var(--bg); color: var(--text); font-family: var(--font-sans); padding: var(--space-xl) var(--page-x); -webkit-font-smoothing: antialiased; }
  .note { margin: var(--space-md) 0 0; font-size: 12.5px; color: var(--textMuted); }
  .stack { display: flex; flex-direction: column; gap: var(--space-md); max-width: 390px; }
  .rowx { display: flex; flex-wrap: wrap; align-items: center; gap: var(--space-sm); }
  svg.ic { fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; flex: none; }

  .tabs { display: flex; max-width: 390px; border-bottom: 1px solid var(--line); }
  .tab { position: relative; flex: 1; text-align: center; padding: 10px 0 11px; border-bottom: 2px solid transparent; margin-bottom: -1px; font-size: 14px; font-weight: 600; color: var(--textMuted); }
  .tab.on { border-bottom-color: var(--text); color: var(--text); font-weight: 800; }
  .tab .dot { position: absolute; top: 8px; right: 4px; width: 5px; height: 5px; border-radius: var(--radius-pill); background: var(--up); }
</style>
</head>
<body>
<div class="tabs">
  <div class="tab on">AI 분석</div><div class="tab">오늘 움직임</div><div class="tab">커뮤니티<span class="dot"></span></div><div class="tab">종목정보</div>
</div>
<p class="note">정적 재현 · src/components/ui/TabItem.tsx 의 수치를 옮김</p>
</body>
</html>
