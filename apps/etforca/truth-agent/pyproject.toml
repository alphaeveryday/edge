[project]
name = "edge-truth-agent"
version = "0.1.0"
description = "투자정보 기만 검증 사건을 검사·갱신하고 공개 데이터를 게시하는 배치"
requires-python = ">=3.12"
dependencies = [
    "jsonschema>=4.23,<5",
    "boto3>=1.36,<2", # S3 조건부 쓰기(If-Match·If-None-Match)
    "playwright>=1.49,<2", # 게시 전 실제 화면 렌더 검사
    "data-pipeline", # 레이크 키 규약·뉴스 정체성(news_article_id) 재사용 — 워크스페이스 멤버
]

[tool.uv.sources]
data-pipeline = { workspace = true }

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/edge_truth_agent"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
