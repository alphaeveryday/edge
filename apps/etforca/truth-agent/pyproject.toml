[project]
name = "edge-truth-agent"
version = "0.1.0"
description = "투자정보 기만 검증 사건을 검사하고 공개 데이터를 만드는 배치"
requires-python = ">=3.12"
dependencies = ["jsonschema>=4.23,<5"]

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/edge_truth_agent"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
