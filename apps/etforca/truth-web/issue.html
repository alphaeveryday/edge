<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>사건 · 투자정보 기만 검증</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
<link rel="stylesheet" href="style.css">
<script src="intro.js"></script>
<style>
.back:hover{background:rgba(255,255,255,.1)}
.window{height:calc(100vh - 100px)}
.page{flex:1;min-height:0;overflow-y:auto;border-radius:var(--r-lg);scrollbar-width:thin;scrollbar-color:rgba(255,255,255,.15) transparent}
.article{max-width:820px;margin:0 auto;padding:8px 8px 60px}

/* 영상 · 대표 사진 */
.video{position:relative;aspect-ratio:16/9;border-radius:var(--r-lg);overflow:hidden;border:1px solid var(--line);box-shadow:0 30px 80px rgba(0,0,0,.5)}
.video iframe{position:absolute;inset:0;width:100%;height:100%;border:0}
.vcap{font-size:12px;color:var(--faint);margin-top:10px}

/* 기사 머리 */
.head{margin:36px 0 28px}
.tags{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:16px}
.subject{font-size:15px;font-weight:700;color:var(--red-text);margin-bottom:8px}
.subject small{font-weight:500;color:var(--faint);margin-left:6px}
h1{font-size:clamp(24px,3vw,34px);line-height:1.35;letter-spacing:-.02em}
.lead{font-size:18px;line-height:1.7;color:rgba(255,255,255,.82);margin-top:14px}
.byline{font-size:13px;color:var(--faint);margin-top:16px}
.track{margin-top:24px;max-width:520px}
.track-label{display:flex;justify-content:space-between;align-items:baseline;font-size:13px;color:var(--muted);margin-bottom:10px}
.track-label b{font-size:24px;font-weight:800;color:var(--text);font-variant-numeric:tabular-nums}
.track .vbar{height:8px}
.track-scale{display:flex;justify-content:space-between;font-size:11px;color:var(--faint);margin-top:6px}
.track-note{font-size:12px;color:var(--faint);margin-top:8px}

/* 섹션: 01 핵심 거짓 · 02 본문 · 03 반론 */
.sec{padding-top:28px;margin-top:40px;border-top:1px solid var(--line)}
.sec-h{display:flex;align-items:center;gap:10px;font-size:20px;font-weight:700;letter-spacing:-.01em;margin-bottom:18px}
.sec-h span{font-size:13px;font-weight:700;color:var(--red-text);font-variant-numeric:tabular-nums}

/* 01: 처음 한 말 ↔ 충돌하는 기록 */
.qa{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.qbox{border-radius:var(--r-md);padding:18px}
.qbox small{font-size:12px;font-weight:600;color:var(--faint)}
.qbox p{font-size:15px;line-height:1.6;margin-top:8px}
.qbox.after{border-color:rgba(255,69,58,.35);background:rgba(255,69,58,.08)}
.qbox.after small{color:var(--red-text)}
.levels{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:14px}
.lv{border-radius:12px;padding:12px 14px;background:rgba(255,255,255,.04);border:1px solid rgba(255,255,255,.08)}
.lv small{display:block;font-size:11px;color:var(--faint)}
.lv b{display:block;font-size:14px;margin-top:4px}
.lv.confirmed b{color:var(--red-text)}
.legal{font-size:13px;color:var(--muted);margin-top:10px}

/* 02: 본문과 판정 근거 */
.body h2{font-size:17px;letter-spacing:-.01em;margin:30px 0 10px}
.body h2:first-child{margin-top:0}
.body p,.body li{font-size:16px;line-height:1.85;color:rgba(255,255,255,.82)}
.body p+p{margin-top:14px}
.body ul{padding-left:20px;margin:10px 0}
.body li+li{margin-top:4px}
.body figure{margin:28px 0}
.body figure .ph-img{border-radius:var(--r-lg);aspect-ratio:16/10;border:1px solid var(--line)}
.body figcaption{font-size:12px;color:var(--faint);margin-top:10px}
.ref{font-size:11px;vertical-align:super;color:var(--red-text);margin-left:2px}
.basis{margin-top:30px}
.basis h3{font-size:15px;margin-bottom:10px}
.bh{padding:14px 16px;border-radius:12px;background:rgba(255,255,255,.035);border:1px solid rgba(255,255,255,.07);margin-bottom:8px}
.bh div{display:flex;gap:8px;align-items:center;margin-bottom:6px;font-size:14px;font-weight:600}
.bh p{font-size:14px;line-height:1.7;color:var(--muted)}
.ach{display:grid;gap:8px;margin-top:8px}
.ach p{font-size:14px;line-height:1.7;color:var(--muted)}
.ach b{color:var(--text);font-weight:600;margin-right:6px}

/* 03: 반론 · 출처 */
.rebut{border-radius:var(--r-md);padding:18px 20px;font-size:16px;line-height:1.75;margin-bottom:8px}
.rebut small{display:block;font-size:12px;color:var(--faint);margin-bottom:4px}
.rebut.none{color:var(--faint)}
.sources{margin-top:36px;padding-top:20px;border-top:1px solid var(--line)}
.sources h3{font-size:13px;color:var(--faint);font-weight:600;margin-bottom:10px}
.sources ol{padding-left:22px}
.sources li{font-size:13.5px;color:var(--muted);padding:5px 0;line-height:1.5}
.sources li:target{color:var(--text)}
.sources a:hover{color:var(--text);text-decoration:underline}
.sources em{font-style:normal;color:var(--faint);margin-left:6px}

@media (max-width:900px){
  .window{height:auto}
  .page{overflow:visible}
  .qa{grid-template-columns:1fr}
  .levels{grid-template-columns:repeat(2,1fr)}
}
</style>
</head>
<body>
<div class="bg ph-img" id="bg"></div>

<main class="window">
  <header class="top">
    <a class="back pill glass" href="index.html">← 홈</a>
    <div class="score pill glass" id="score"></div>
  </header>
  <div class="page"><article class="article" id="article"></article></div>
</main>

<script src="common.js"></script>
<script>
const KINDS = {official: '공식 판단', disclosure: '공시', news: '보도', web: '웹 문서', video: '영상'};
const LEVELS = [['behavior', '행동'], ['intent', '고의'], ['harm', '피해'], ['legal', '법적 책임']];
const HYPOTHESES = {H0: '정당한 설명·수정', H1: '오류·부실 대응', H2: '의도적 기만·회피', H3: '조직적 공모', undecided: '판별 보류'};

function render(c, cases){
  if (cases) renderScore(cases);
  else $('score').textContent = '집계를 불러오지 못했습니다';
  document.title = `${c.subject} · 투자정보 기만 검증`;
  $('bg').innerHTML = img(c.cover);

  // 출처 번호: sources 배열 순서. 본문·대조·반론은 sourceId 로 이 번호를 가리킨다.
  const order = new Map(c.sources.map((s, i) => [s.id, i + 1]));
  const ref = id => order.has(id) ? `<a class="ref" href="#src-${order.get(id)}">[${order.get(id)}]</a>` : '';
  const refs = ids => (ids || []).map(ref).join('');

  const block = b => b.h ? `<h2>${esc(b.h)}</h2>`
    : b.p ? `<p>${esc(b.p)}${refs(b.sourceIds)}</p>`
    : b.list ? `<ul>${b.list.map(x => `<li>${esc(x)}</li>`).join('')}</ul>`
    : b.img ? `<figure><div class="ph-img">${img(b.img)}</div><figcaption>${esc(b.caption)}</figcaption></figure>`
    : '';

  const yt = (c.video?.youtube || '').replace(/[^\w-]/g, '');
  const media = yt
    ? `<div class="video ph-img"><iframe src="https://www.youtube-nocookie.com/embed/${yt}" title="${esc(c.video.title)}" allow="encrypted-media; picture-in-picture" allowfullscreen referrerpolicy="strict-origin-when-cross-origin"></iframe></div><div class="vcap">${esc(c.video.title)}</div>`
    : c.cover ? `<div class="video ph-img">${img(c.cover)}</div>` : '';

  const related = (c.related || []).slice(-10).reverse()
    .map(r => c.sources.find(s => s.id === r.sourceId)).filter(Boolean);

  $('article').innerHTML = `
    ${media}
    <header class="head">
      <div class="tags">
        ${c.behaviors.map(b => `<span class="tag pill glass red">${esc(TYPES[b.type])}</span>`).join('')}
        ${sticker(c)}
        ${c.origin === 'agent' ? '<span class="tag pill glass">AI 감시 중</span>' : ''}
      </div>
      <div class="subject">${esc(c.subject)}<small>${c.instruments.map(i => `${i.name === c.subject ? '' : esc(i.name) + ' '}${esc(i.code)}`).join(' · ')}</small></div>
      <h1>${esc(c.headline[0])}</h1>
      <p class="lead">${esc(c.headline[1])}</p>
      <div class="byline">기록 ${esc(c.flaggedAt)}${c.resolvedAt ? ` · 확인 ${esc(c.resolvedAt)}` : ''} · 갱신 ${esc(c.updatedAt.slice(0, 10))}</div>
      <div class="track">
        <div class="track-label"><span>파급력 가치</span><b>${won(c.impact)}</b></div>
        ${vbar(c.impact)}
        <div class="track-scale"><span>0원</span><span>100억원</span></div>
        <p class="track-note">${esc(c.impactReason)} 파급력은 조사 순서를 정하는 값이며 증거가 아닙니다.</p>
      </div>
    </header>

    <section class="sec">
      <div class="sec-h"><span>01</span>핵심 거짓</div>
      <div class="qa">
        <div class="qbox glass"><small>${esc(c.contrast.before.label)}</small><p>${esc(c.contrast.before.text)}${ref(c.contrast.before.sourceId)}</p></div>
        <div class="qbox glass after"><small>${esc(c.contrast.after.label)}</small><p>${esc(c.contrast.after.text)}${ref(c.contrast.after.sourceId)}</p></div>
      </div>
      <div class="levels">${LEVELS.map(([k, label]) =>
        `<div class="lv ${esc(c.levels[k])}"><small>${label}</small><b>${VERDICTS[c.levels[k]]}</b></div>`).join('')}</div>
      ${c.legalStatus ? `<p class="legal">법적 절차 · ${esc(c.legalStatus)}</p>` : ''}
    </section>

    <section class="sec">
      <div class="sec-h"><span>02</span>본문</div>
      <div class="body">${c.body.map(block).join('')}</div>
      <div class="basis">
        <h3>유형별 판정</h3>
        ${c.behaviors.map(b => `<div class="bh"><div>${esc(TYPES[b.type])}<i class="sticker s-${b.verdict === 'confirmed' ? 'confirmed' : 'pending'}">${VERDICTS[b.verdict]}</i></div><p>${esc(b.basis)}${refs(b.sourceIds)}</p></div>`).join('')}
        <h3 style="margin-top:22px">경쟁 가설</h3>
        <div class="ach">
          <p><b>가장 설명력 높은 가설</b>${esc(HYPOTHESES[c.ach.best])}</p>
          <p><b>가장 강한 반증</b>${esc(c.ach.strongestCounter)}</p>
          <p><b>결론을 바꿀 증거</b>${esc(c.ach.decisiveEvidence)}</p>
          ${c.beneficiary ? `<p><b>경제적 수혜·위험 부담</b>${esc(c.beneficiary)}</p>` : ''}
        </div>
      </div>
    </section>

    <section class="sec">
      <div class="sec-h"><span>03</span>반론</div>
      ${c.rebuttal.length
        ? c.rebuttal.map(r => `<div class="rebut glass"><small>${esc(r.label)}</small>${esc(r.text)}${ref(r.sourceId)}</div>`).join('')
        : '<div class="rebut glass none">당사자 반론을 확인하고 있습니다.</div>'}
    </section>

    ${related.length ? `<div class="sources"><h3>관련 보도</h3><ol>${related.map(s =>
      `<li><a ${ext(s.url)}>${esc(s.title)}</a><em>${esc(s.publisher)} · ${esc(s.publishedAt)}</em></li>`).join('')}</ol></div>` : ''}
    <div class="sources"><h3>출처</h3><ol>${c.sources.map((s, i) =>
      `<li id="src-${i + 1}"><a ${ext(s.url)}>${esc(s.title)}</a><em>${esc(s.publisher)} · ${KINDS[s.kind]} · ${esc(s.publishedAt)}</em></li>`).join('')}</ol></div>`;
}

const id = new URLSearchParams(location.search).get('id') || '';
const fail = msg => { $('article').innerHTML = `<p class="vcap">${msg} <a href="index.html">홈으로</a></p>`; };
// 사건 파일과 요약(성적용)을 따로 다룬다 — 요약을 못 읽어도 사건은 보여준다.
Promise.allSettled([loadCase(id), loadIndex()]).then(([one, all]) => {
  if (one.status === 'rejected') {
    console.error(one.reason);
    return fail(String(one.reason).includes(': 404') || String(one.reason).includes(': 403') ? '사건을 찾을 수 없습니다.' : '사건을 불러오지 못했습니다. 잠시 뒤 다시 열어 주세요.');
  }
  try {
    render(one.value, all.status === 'fulfilled' ? all.value.cases : null);  // 사건 하나로 성적을 계산해 공개하지 않는다
  } catch (error) {
    console.error(error);
    fail('사건 화면을 그리지 못했습니다.');
  }
});
</script>
</body>
</html>
