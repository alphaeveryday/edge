<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>오늘의 급등주 해석 · 투자정보 기만 검증</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
<link rel="stylesheet" href="style.css">
<script src="intro.js"></script>
<script src="analytics.js"></script>
<style>
/* list.html 처럼 창 높이를 풀고 페이지가 스크롤한다 */
body{overflow-y:auto}
.window{height:auto;min-height:calc(100vh - 100px)}
.back:hover{background:rgba(255,255,255,.1)}
:root{--up:#ff453a;--down:#4c8dff;--warn:#ff6a2b;--warn-text:#ffa77f;--ok-text:#6fe08f}
::selection{background:rgba(255,255,255,.22)}
:focus-visible{outline:2px solid #fff;outline-offset:2px}

.lhead{padding:22px 8px 20px}
.lhead h1{font-size:clamp(30px,4.5vw,52px);line-height:1.1;letter-spacing:-.03em;text-wrap:balance}
.lhead p{margin-top:12px;font-size:14px;line-height:1.6;color:var(--muted);max-width:62ch}

/* 날짜 · 판정 고르기 — list.html .filters 와 같은 모양 */
.bar{display:flex;flex-direction:column;gap:10px;padding:0 6px 8px}
.row{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;padding:2px}
.row::-webkit-scrollbar{display:none}
#tags{flex-wrap:wrap;overflow:visible}  /* 판정은 넷뿐이라 줄을 바꾼다. 날짜만 옆으로 넘긴다 */
.row button{flex:none;font:inherit;font-size:13px;font-weight:500;color:var(--text);padding:7px 14px;border-radius:999px;border:0;
  background:rgba(255,255,255,.08);cursor:pointer;font-variant-numeric:tabular-nums}
.row button:hover{background:rgba(255,255,255,.14)}
.row button[aria-pressed=true]{background:#fff;color:#000;font-weight:600}
.row button b{font-weight:inherit;opacity:.6;margin-left:4px}
.row button:disabled{opacity:.4;cursor:default}
.hint{min-height:20px;padding:4px 8px 14px;font-size:13px;color:var(--faint)}

.movers{display:flex;flex-direction:column;gap:12px;padding:0 6px}
.mv{display:grid;grid-template-columns:minmax(0,340px) minmax(0,1fr);gap:32px;padding:24px;border-radius:var(--r-lg)}

/* 왼쪽: 종목 · 장중 그래프 */
.who{display:flex;align-items:center;gap:12px}
.logo-c{position:relative;flex:none;width:40px;height:40px;border-radius:50%;overflow:hidden;display:grid;place-items:center;
  font-size:16px;font-weight:700;color:#fff}
.logo-c img{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;padding:5px;background:#fff}
.who>div{min-width:0;flex:1}
.who b{display:block;font-size:17px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.who small{font-size:12.5px;color:var(--faint);font-variant-numeric:tabular-nums}
.pct{flex:none;font-size:22px;font-weight:800;letter-spacing:-.02em;font-variant-numeric:tabular-nums}
.up{color:var(--up)}.down{color:var(--down)}
.spark{margin-top:18px}
.spark svg{display:block;width:100%;height:96px;overflow:visible}
.ax{display:flex;justify-content:space-between;gap:8px;font-size:11px;color:var(--faint);margin-top:6px;font-variant-numeric:tabular-nums}
.nochart{height:96px;display:grid;place-items:center;font-size:12.5px;color:var(--faint);border:1px dashed var(--line);border-radius:12px}
.px{margin-top:12px;font-size:12.5px;color:var(--muted);font-variant-numeric:tabular-nums}
.px b{color:var(--text);font-weight:600}

/* 오른쪽: 판정 · 사건 */
.verdict{display:inline-flex;align-items:center;gap:6px;font-size:12.5px;font-weight:700;padding:4px 10px;border-radius:999px;white-space:nowrap}
.v-false{background:var(--warn);color:#1a0800}
.v-promising{background:rgba(52,199,89,.16);color:var(--ok-text)}
.v-pending{background:rgba(255,255,255,.1);color:var(--muted)}
.verdict small{font-size:12px;font-weight:600;opacity:.8}
.meta{display:flex;flex-wrap:wrap;align-items:center;gap:6px 10px;font-size:12.5px;color:var(--faint);font-variant-numeric:tabular-nums}
.mv h2{font-size:20px;line-height:1.4;letter-spacing:-.02em;margin-top:14px;text-wrap:balance}
.finding{margin-top:8px;font-size:14.5px;line-height:1.65;color:rgba(245,245,247,.86);max-width:68ch}

details{margin-top:16px;border-top:1px solid var(--line)}
summary{list-style:none;display:inline-flex;align-items:center;gap:6px;margin-top:12px;font-size:13px;font-weight:600;color:var(--muted);cursor:pointer;border-radius:6px}
summary::-webkit-details-marker{display:none}
summary:hover{color:var(--text)}
summary svg{width:12px;height:12px;transition:transform .2s cubic-bezier(.2,.8,.2,1)}
details[open] summary svg{transform:rotate(90deg)}
.more{display:grid;gap:14px;padding-top:12px;max-width:68ch}
.more h3{font-size:12px;font-weight:600;color:var(--faint)}
.more p,.more li{font-size:14px;line-height:1.65;color:rgba(245,245,247,.82)}
.more p{margin-top:4px}
.more ul{margin-top:4px;padding-left:18px}
.srcs{display:flex;flex-direction:column;gap:2px;margin-top:4px}
.srcs a{display:flex;align-items:baseline;gap:8px;padding:5px 0;font-size:13.5px;color:var(--muted);min-width:0}
.srcs a:hover{color:var(--text)}
.srcs a em{flex:none;font-style:normal;font-size:12px;color:var(--faint);width:28px}
.srcs a span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.srcs svg{flex:none;width:11px;height:11px;align-self:center}
.impact b{color:var(--warn-text);font-variant-numeric:tabular-nums}

@media (max-width:900px){
  .mv{grid-template-columns:minmax(0,1fr);gap:20px;padding:18px 16px}
  .movers,.bar{padding-left:0;padding-right:0}
  .mv h2{font-size:18px}
  .lhead{padding-left:4px;padding-right:4px}
}
@media (prefers-reduced-motion:reduce){summary svg{transition:none}}
</style>
</head>
<body>
<main class="window">
  <header class="top">
    <a class="back pill glass" href="./">← 홈</a>
    <div class="score pill glass" id="status" aria-live="polite">불러오는 중</div>
  </header>
  <div class="lhead">
    <h1>오늘의 급등주 해석</h1>
    <p>크게 오른 종목마다 오른 이유로 꼽힌 사건이 사실인지 공시·보도와 대조합니다. AI 판단이며 투자 권유가 아닙니다.</p>
  </div>
  <nav class="bar" aria-label="보기 고르기">
    <div class="row" id="dates" role="group" aria-label="날짜"></div>
    <div class="row" id="tags" role="group" aria-label="판정"></div>
  </nav>
  <p class="hint" id="hint"></p>
  <section class="movers" id="movers" aria-live="polite"><div class="empty">급등주 해석을 불러오는 중입니다.</div></section>
  <p class="cookie-note">방문 통계를 위해 본 페이지·클릭, 기기·브라우저 정보, 접속 IP를 PostHog(미국)로 보냅니다. 쿠키는 허용한 경우에만 쓰고 1년간 유지합니다. 허용하지 않으면 쿠키 없이 그날의 방문 수만 셉니다. <button type="button" data-consent hidden>쿠키 사용 다시 고르기</button> · <a href="privacy">개인정보 처리방침</a></p>
</main>

<script src="common.js"></script>
<script>
// 데이터: truth-agent 가 장중 매시 게시한다 — data/movers/<날짜>.json, 날짜 목록 data/movers/dates.json (docs/design/truth-movers.md §4)
const TAGS = {false: '허위매물', promising: '유망주', pending: '판단 보류'};
const TAG_HINT = {
  all: '되돌림 예상 폭이 큰 순서입니다. 허위매물이 위로 옵니다.',
  false: '오른 이유로 꼽힌 주장이 원문과 어긋나거나, 회사 근거 없이 테마·풍문으로 올랐습니다.',
  promising: '오른 이유가 된 사건이 공시나 여러 보도로 확인됩니다.',
  pending: '자료로는 어느 쪽인지 가리지 못했습니다.',
};
const EVENT_KINDS = {disclosure: '공시', earnings: '실적', contract: '계약', policy: '정책', news: '보도', rumor: '풍문'};
const SOURCE_KINDS = {official: '공식', disclosure: '공시', news: '보도', web: '웹', video: '영상'};
const LOGO_RE = /^data\/logos\/[0-9A-Z]{6}\.(png|jpg|ico|webp)$/;  // 스키마와 같은 규칙만 src 로 쓴다
const DATE_RE = /^\d{4}-\d{2}-\d{2}$/;
const CHEVRON = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m9 6 6 6-6 6"/></svg>';
const todayKst = () => new Intl.DateTimeFormat('en-CA', {timeZone: 'Asia/Seoul'}).format(new Date());
const hhmm = s => (/T(\d{2}:\d{2})/.exec(s || '') || [])[1] || '';
const md = d => `${+d.slice(5, 7)}월 ${+d.slice(8, 10)}일`;
const dayLabel = d => `${+d.slice(5, 7)}.${+d.slice(8, 10)} ${'일월화수목금토'[new Date(d + 'T00:00:00+09:00').getUTCDay()]}`;
const signed = (v, n = 2) => `${v > 0 ? '+' : ''}${v.toFixed(n)}%`;
const krw = v => `${Math.round(v).toLocaleString("ko-KR")}원`;  // common.js 의 won 은 억 단위라 따로 둔다
const hue = code => (Math.imul([...code].reduce((h, c) => (h * 31 + c.charCodeAt(0)) >>> 0, 7), 0x9E3779B1) >>> 0) % 360;  // 끝자리만 달라도 색이 갈린다

// 로고가 없거나 못 불러오면 이름 첫 글자 배지가 드러난다(종목코드로 색을 고정)
const logo = it => `<span class="logo-c" style="background:hsl(${hue(it.code)} 42% 36%)" aria-hidden="true">${esc([...it.name][0])}${
  LOGO_RE.test(it.logo || '') ? `<img src="${esc(it.logo)}" alt="" loading="lazy" onerror="this.remove()">` : ''}</span>`;

// 장중 5분 시세 + 전일 종가 점선. 가로는 시각(분), 세로는 가격. 상승 빨강 · 하락 파랑
function chart(it){
  const s = (it.series || []).filter(p => Array.isArray(p) && /^\d{2}:\d{2}$/.test(p[0]) && Number.isFinite(p[1]));
  if (s.length < 2) return '<div class="nochart">장중 시세가 아직 없습니다</div>';
  const W = 300, H = 96, min = t => +t.slice(0, 2) * 60 + +t.slice(3);
  const t0 = min(s[0][0]), t1 = Math.max(t0 + 1, min(s.at(-1)[0]));
  const ps = s.map(p => p[1]), lo = Math.min(it.prevClose, ...ps), hi = Math.max(it.prevClose, ...ps), pad = (hi - lo) * .08 || 1;
  const x = t => ((min(t) - t0) / (t1 - t0) * W).toFixed(1), y = v => ((hi + pad - v) / (hi - lo + 2 * pad) * H).toFixed(1);
  const line = s.map((p, i) => `${i ? 'L' : 'M'}${x(p[0])},${y(p[1])}`).join('');
  const col = it.changePct >= 0 ? 'var(--up)' : 'var(--down)', base = y(it.prevClose);
  return `
    <svg viewBox="0 0 ${W} ${H}" preserveAspectRatio="none" role="img" aria-label="${esc(it.name)} 장중 시세, ${s[0][0]}부터 ${s.at(-1)[0]}까지. 점선은 전일 종가">
      <path d="${line}L${W},${H}L0,${H}Z" fill="${col}" fill-opacity=".1"/>
      <line x1="0" x2="${W}" y1="${base}" y2="${base}" stroke="rgba(255,255,255,.4)" stroke-dasharray="4 4" vector-effect="non-scaling-stroke"/>
      <path d="${line}" fill="none" stroke="${col}" stroke-width="2" stroke-linejoin="round" vector-effect="non-scaling-stroke"/>
    </svg>
    <div class="ax"><span>${s[0][0]}</span><span>점선 전일 종가</span><span>${s.at(-1)[0]}</span></div>`;
}

const card = (it, closed) => {
  const tag = TAGS[it.tag] ? it.tag : 'pending';
  const kind = EVENT_KINDS[it.event?.kind], judged = hhmm(it.judgedAt);
  const more = [
    it.claim && `<div><h3>내세운 주장</h3><p>${esc(it.claim)}</p></div>`,
    it.reasons?.length && `<div><h3>판단 근거</h3><ul>${it.reasons.slice(0, 3).map(r => `<li>${esc(r)}</li>`).join('')}</ul></div>`,
    it.sources?.length && `<div><h3>출처 ${it.sources.length}</h3><div class="srcs">${it.sources.map(s => `<a ${ext(s.url)} title="${esc(s.title)}">
      <em>${esc(SOURCE_KINDS[s.kind] || s.kind)}</em><span>${esc(s.publisher)} · ${esc(s.title)}</span>${ARROW}</a>`).join('')}</div></div>`,
    tag === 'false' && it.impact > 0 && `<p class="impact">되돌림 예상 폭 <b>약 ${it.impact.toFixed(1)}%</b>. 상승률에 확신도를 곱한 근사값으로, 순서를 정할 때만 씁니다.</p>`,
  ].filter(Boolean);
  return `
  <article class="mv glass">
    <div>
      <div class="who">${logo(it)}
        <div><b>${esc(it.name)}</b><small>${esc(it.code)} · ${esc(it.market)}</small></div>
        <span class="pct ${it.changePct >= 0 ? 'up' : 'down'}">${signed(it.changePct)}</span>
      </div>
      <div class="spark">${chart(it)}</div>
      <p class="px">${closed ? '종가' : '현재가'} <b>${krw(it.price)}</b> · 전일 ${krw(it.prevClose)} · 거래대금 ${Math.round(it.tradeValue).toLocaleString('ko-KR')}억원</p>
    </div>
    <div>
      <div class="meta"><span class="verdict v-${tag}">${TAGS[tag]}${tag === 'pending' ? '' : ` <small>확신도 ${Math.round(it.confidence * 100)}%</small>`}</span>
        ${[kind, judged && `판정 ${judged}`].filter(Boolean).map(esc).join(' · ')}</div>
      <h2>${esc(it.event?.title)}</h2>
      <p class="finding">${esc(it.finding)}</p>
      ${more.length ? `<details><summary>근거 보기 ${CHEVRON}</summary><div class="more">${more.join('')}</div></details>` : ''}
    </div>
  </article>`;
};

// 보기 상태는 주소에 둔다(?date=&tag=) — 공유·뒤로 가기가 같은 화면을 연다
const params = new URLSearchParams(location.search);
const state = {date: DATE_RE.test(params.get('date') || '') ? params.get('date') : null, tag: TAGS[params.get('tag')] ? params.get('tag') : 'all', dates: [], doc: null};
const saveUrl = () => {
  const q = new URLSearchParams();
  if (state.date && state.date !== state.dates[0]) q.set('date', state.date);
  if (state.tag !== 'all') q.set('tag', state.tag);
  history.replaceState(null, '', String(q) ? `?${q}` : location.pathname);
};

function render(){
  const d = state.doc, items = [...d.items].sort((a, b) => b.impact - a.impact || b.changePct - a.changePct);
  const live = d.date === todayKst() && hhmm(d.generatedAt) < '15:30';
  const count = t => t === 'all' ? items.length : items.filter(i => i.tag === t).length;
  $('status').innerHTML = `<b>${esc(md(d.date))}</b> ${esc(hhmm(d.generatedAt))} 기준`;
  $('dates').innerHTML = state.dates.slice(0, 10).map(x =>
    `<button type="button" data-date="${esc(x)}" aria-pressed="${x === d.date}">${x === todayKst() ? '오늘' : esc(dayLabel(x))}</button>`).join('');
  $('tags').innerHTML = ['all', 'false', 'promising', 'pending'].map(t =>
    `<button type="button" data-tag="${t}" aria-pressed="${t === state.tag}"${count(t) || t === 'all' ? '' : ' disabled'}>${t === 'all' ? '전체' : TAGS[t]}<b>${count(t)}</b></button>`).join('');
  const behind = d.date === state.dates[0] && d.date !== todayKst() ? ` 오늘은 아직 장이 열리지 않아 ${md(d.date)} 결과를 보여 줍니다.` : '';
  $('hint').textContent = TAG_HINT[state.tag] + behind;
  const shown = state.tag === 'all' ? items : items.filter(i => i.tag === state.tag);
  $('movers').innerHTML = shown.length ? shown.map(it => card(it, !live)).join('')
    : `<div class="empty">${items.length ? `${esc(md(d.date))}에는 ${TAGS[state.tag]}로 판정한 종목이 없습니다.`
      : `${esc(md(d.date))}에는 10% 넘게 오른 종목이 없거나 장이 열리지 않았습니다.`}</div>`;
}

let token = 0;
async function show(date){
  const mine = ++token;
  try {
    const doc = await getJson(date && date !== state.dates[0] ? `data/movers/${date}.json` : 'data/movers/latest.json');
    if (mine !== token) return;  // 더 늦게 누른 날짜가 이긴다
    state.doc = doc; state.date = doc.date;
    if (!state.dates.includes(doc.date)) state.dates = [doc.date, ...state.dates].sort().reverse();
    saveUrl(); render();
  } catch {
    if (mine !== token) return;
    if (!state.doc) $('movers').innerHTML = '<div class="empty">급등주 해석을 불러오지 못했습니다. 잠시 뒤 다시 열어 주세요.</div>';
    $('status').textContent = state.doc ? '새로 받지 못함 · 이전 결과' : '불러오지 못함';
  }
}

$('dates').addEventListener('click', e => { const b = e.target.closest('button[data-date]'); if (b && b.dataset.date !== state.date) show(b.dataset.date); });
$('tags').addEventListener('click', e => { const b = e.target.closest('button[data-tag]'); if (b && !b.disabled) { state.tag = b.dataset.tag; saveUrl(); render(); } });

getJson('data/movers/dates.json').then(x => { state.dates = (Array.isArray(x) ? x : []).filter(d => DATE_RE.test(d)).sort().reverse(); })
  .catch(() => {}).finally(() => show(state.date));
// 최신 날짜를 보고 있을 때만 5분마다 다시 받는다
setInterval(() => { if (!state.doc || state.date === state.dates[0]) show(state.dates[0]); }, 5 * 60e3);
</script>
</body>
</html>
