<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <!-- 홈 화면 아이콘 원본 — full-bleed 사각(iOS 가 자체 라운딩 마스크를 적용한다). PNG 은 이 파일에서 생성. -->
  <defs>
    <linearGradient id="soma" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#8dd8f8"/>
      <stop offset="1" stop-color="#41abe0"/>
    </linearGradient>
  </defs>
  <rect width="512" height="512" fill="url(#soma)"/>
  <text x="256" y="268" text-anchor="middle" dominant-baseline="central" font-family="Pretendard,-apple-system,Helvetica,Arial,sans-serif" font-size="190" font-weight="800" fill="#ffffff">소마</text>
</svg>
