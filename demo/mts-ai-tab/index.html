<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>가상 MTS — AI 분석 탭 (데모)</title>
<!-- PWA standalone(홈 화면 추가) — 실기기·시뮬레이터에서 앱처럼 전체 화면 실행 (ALPHA-716) -->
<link rel="manifest" href="manifest.json">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="KB증권">
<meta name="theme-color" content="#ffffff">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<link rel="stylesheet" href="css/colors_and_type.css">
<link rel="stylesheet" href="css/edge-components.css">
<style>
  /* 수령 디자인(KODEX 반도체 AI 분석.dc.html, ALPHA-485) 이식 — 정적 html+js 번역 */
  /* --top-inset: CSS 베젤의 가짜 상태바 몫 상단 여백. standalone 에선 실 safe-area 로 대체된다. */
  :root{--top-inset:47px;--bottom-inset:6px}
  body{margin:0;background:#fff;font-family:"Pretendard",-apple-system,sans-serif}
  a{color:#2e5aac;text-decoration:none}a:hover{color:#24488c;text-decoration:underline}
  input::placeholder{color:#a1a1aa}
  @keyframes fadeUp{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
  .fade-up{animation:fadeUp .25s ease both}
  /* 디자인의 iOS 프레임(393x852 + 다크 베젤) 정적 재현 — 데스크톱 브라우저 프리뷰용 */
  .stage{min-height:100vh;display:flex;align-items:flex-start;justify-content:center;padding:40px 20px}
  .bezel{background:#1c1c1e;border-radius:54px;padding:6px;box-shadow:0 0 0 1px #3a3a3c,0 0 0 2px #0a0a0a;flex-shrink:0}
  .device{width:393px;height:852px;background:#fff;border-radius:48px;overflow:hidden;position:relative;
          font-family:Pretendard,-apple-system,sans-serif;color:#18181b}
  .island{position:absolute;top:11px;left:50%;transform:translateX(-50%);width:120px;height:34px;
          background:#000;border-radius:20px;z-index:40}
  .statusbar{position:absolute;top:0;left:0;right:0;height:47px;display:flex;align-items:flex-end;
             justify-content:space-between;padding:0 30px 4px;z-index:30;pointer-events:none}
  .screen{display:none;flex-direction:column;height:100%}
  .screen.active{display:flex}
  .iconbtn{border:none;background:none;padding:0;cursor:pointer;color:inherit;display:flex}
  .toast{position:absolute;left:50%;bottom:96px;transform:translateX(-50%);background:rgba(24,24,27,.88);
         color:#fff;font-size:12px;padding:9px 16px;border-radius:999px;white-space:nowrap;z-index:50}
  /* 홈 화면 추가(standalone) 실행 — CSS 베젤·가짜 상태바 연출을 걷어내고
     실기기 전체 화면 + 실제 iOS 상태바(safe-area)를 쓴다. 데스크톱 프리뷰는 위 기본값 그대로. */
  @media (display-mode: standalone){
    :root{--top-inset:env(safe-area-inset-top);--bottom-inset:calc(6px + env(safe-area-inset-bottom))}
    /* 뷰포트 단위(vh·dvh)는 iOS standalone 에서 신뢰 불가 — 상태바 default(불투명)에선
       웹뷰 높이가 "화면 − 상태바"인데 100vh 는 상태바 포함 화면 전체로 계산돼 그만큼
       세로 오버플로가 나고(탭바가 스크롤 밖, ALPHA-732 실기기 실증), dvh 는 일부 계열이
       safe-area 제외로 오계산한다(ALPHA-716 리뷰). fixed+inset:0 은 산정과 무관하게
       보이는 뷰포트에 직접 고정된다. .stage 의 min-height 도 같은 이유로 잔여 스크롤을
       만들지 않게 둔다(fixed 이후 flow 콘텐츠는 비어 있다). */
    .stage{display:block;min-height:0;padding:0}
    .bezel{padding:0;border-radius:0;box-shadow:none}
    .device{position:fixed;inset:0;width:auto;height:auto;border-radius:0}
    .island,.statusbar{display:none}
  }
</style>
</head>
<body>
<div class="stage">
<div class="bezel">
<div class="device">
  <div class="island"></div>
  <div class="statusbar">
    <span class="num" style="font-size:15px;font-weight:600">15:30</span>
    <span style="display:flex;gap:6px;align-items:center;color:#18181b">
      <svg width="17" height="11" viewBox="0 0 17 11" fill="currentColor"><rect x="0" y="7" width="3" height="4" rx="1"/><rect x="4.5" y="5" width="3" height="6" rx="1"/><rect x="9" y="2.5" width="3" height="8.5" rx="1"/><rect x="13.5" y="0" width="3" height="11" rx="1"/></svg>
      <svg width="16" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M5 12.55a11 11 0 0 1 14.08 0"/><path d="M8.53 16.11a6 6 0 0 1 6.95 0"/><path d="M12 20h.01"/></svg>
      <svg width="25" height="12" viewBox="0 0 25 12"><rect x="0.5" y="0.5" width="21" height="11" rx="3" fill="none" stroke="currentColor" opacity=".4"/><rect x="2" y="2" width="15" height="8" rx="1.6" fill="currentColor"/><path d="M23 4v4a2 2 0 0 0 0-4Z" fill="currentColor" opacity=".4"/></svg>
    </span>
  </div>

  <div id="toast" class="toast" style="display:none"></div>

  <!-- ═══ 홈 화면 ═══ -->
  <section id="screen-home" class="screen active">
    <div style="display:flex;align-items:center;justify-content:space-between;padding:calc(var(--top-inset) + 15px) 16px 10px;flex-shrink:0">
      <div style="display:flex;align-items:center;gap:8px">
        <span style="display:inline-flex;align-items:center;justify-content:center;width:22px;height:22px;background:#FFBC00;border-radius:4px;font-size:10px;font-weight:800;color:#60584C">KB</span>
        <span style="font-size:15px;font-weight:700;color:#3f3a33">KB증권</span>
      </div>
      <div style="display:flex;gap:14px;color:#71717a">
        <button class="iconbtn" data-not-ready><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 8a6 6 0 0 1 12 0c0 7 3 9 3 9H3s3-2 3-9"/><path d="M10.3 21a1.94 1.94 0 0 0 3.4 0"/></svg></button>
        <button class="iconbtn" data-not-ready><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><line x1="4" y1="6" x2="20" y2="6"/><line x1="4" y1="12" x2="20" y2="12"/><line x1="4" y1="18" x2="20" y2="18"/></svg></button>
      </div>
    </div>
    <div style="padding:4px 16px 12px;flex-shrink:0">
      <button id="home-search-btn" style="display:flex;align-items:center;gap:8px;width:100%;padding:10px 14px;background:#f4f4f5;border:1px solid #e4e4e7;border-radius:8px;font-family:inherit;font-size:14px;color:#a1a1aa;cursor:pointer;text-align:left">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#a1a1aa" stroke-width="2" stroke-linecap="round" style="flex-shrink:0"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
        종목명·종목코드 검색
      </button>
    </div>
    <div style="flex:1;overflow-y:auto;min-height:0">
      <div id="home-indices" style="display:grid;grid-template-columns:1fr 1fr;gap:8px;padding:4px 16px 16px"></div>
      <div style="padding:0 16px">
        <button data-not-ready style="display:flex;align-items:center;justify-content:space-between;width:100%;padding:8px 0;border:none;background:none;font-family:inherit;cursor:pointer">
          <span style="font-size:14px;font-weight:700;color:#18181b">관심종목</span>
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#a1a1aa" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="9 18 15 12 9 6"/></svg>
        </button>
        <div id="home-watchlist"></div>
      </div>
    </div>
    <div style="display:flex;border-top:1px solid #e4e4e7;padding:8px 8px var(--bottom-inset);flex-shrink:0">
      <button class="iconbtn" style="flex:1;flex-direction:column;align-items:center;gap:3px;padding:4px 0;font-family:inherit;color:#3f3a33">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg>
        <span style="font-size:10px;font-weight:600">홈</span>
      </button>
      <button class="iconbtn" data-not-ready style="flex:1;flex-direction:column;align-items:center;gap:3px;padding:4px 0;font-family:inherit;color:#a1a1aa">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><path d="M12 2l3.09 6.26L22 9.27l-5 4.87 1.18 6.88L12 17.77l-6.18 3.25L7 14.14 2 9.27l6.91-1.01L12 2z"/></svg>
        <span style="font-size:10px;font-weight:600">관심</span>
      </button>
      <button class="iconbtn" data-not-ready style="flex:1;flex-direction:column;align-items:center;gap:3px;padding:4px 0;font-family:inherit;color:#a1a1aa">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 5v4"/><rect width="4" height="6" x="7" y="9" rx="1"/><path d="M9 15v2"/><path d="M17 3v2"/><rect width="4" height="8" x="15" y="5" rx="1"/><path d="M17 13v3"/><path d="M3 3v16a2 2 0 0 0 2 2h16"/></svg>
        <span style="font-size:10px;font-weight:600">주식</span>
      </button>
      <button class="iconbtn" data-not-ready style="flex:1;flex-direction:column;align-items:center;gap:3px;padding:4px 0;font-family:inherit;color:#a1a1aa">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12V7H5a2 2 0 0 1 0-4h14v4"/><path d="M3 5v14a2 2 0 0 0 2 2h16v-5"/><path d="M18 12a2 2 0 0 0 0 4h4v-4Z"/></svg>
        <span style="font-size:10px;font-weight:600">자산</span>
      </button>
      <button class="iconbtn" data-not-ready style="flex:1;flex-direction:column;align-items:center;gap:3px;padding:4px 0;font-family:inherit;color:#a1a1aa">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><line x1="4" y1="6" x2="20" y2="6"/><line x1="4" y1="12" x2="20" y2="12"/><line x1="4" y1="18" x2="20" y2="18"/></svg>
        <span style="font-size:10px;font-weight:600">메뉴</span>
      </button>
    </div>
  </section>

  <!-- ═══ 검색 화면 ═══ -->
  <section id="screen-search" class="screen">
    <div style="display:flex;align-items:center;gap:8px;padding:calc(var(--top-inset) + 11px) 16px 10px;border-bottom:1px solid #e4e4e7;flex-shrink:0">
      <button id="search-back-btn" class="iconbtn" style="padding:4px;color:#52525b">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="15 18 9 12 15 6"/></svg>
      </button>
      <div style="display:flex;align-items:center;gap:8px;flex:1;padding:9px 12px;background:#f4f4f5;border:1px solid #e4e4e7;border-radius:8px">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="#a1a1aa" stroke-width="2" stroke-linecap="round" style="flex-shrink:0"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
        <input id="search-input" placeholder="종목명·종목코드 검색" style="flex:1;border:none;background:none;outline:none;font-family:inherit;font-size:14px;color:#18181b;min-width:0">
      </div>
    </div>
    <div style="flex:1;overflow-y:auto;min-height:0;padding:8px 16px">
      <div id="search-section-label" style="font-size:11px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:#a1a1aa;padding:8px 0 4px">인기 검색 종목</div>
      <div id="search-results"></div>
      <div id="search-no-results" style="display:none;padding:32px 0;text-align:center;font-size:13px;color:#a1a1aa">검색 결과가 없습니다.</div>
    </div>
  </section>

  <!-- ═══ 종목 상세 화면 ═══ -->
  <section id="screen-stock" class="screen">
    <!-- 앱 바 -->
    <div style="display:flex;align-items:center;justify-content:space-between;padding:calc(var(--top-inset) + 15px) 16px 8px;flex-shrink:0">
      <div style="display:flex;align-items:center;gap:8px">
        <button id="stock-back-btn" class="iconbtn" style="color:#52525b">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="15 18 9 12 15 6"/></svg>
        </button>
        <span style="display:inline-flex;align-items:center;justify-content:center;width:20px;height:20px;background:#FFBC00;border-radius:4px;font-size:10px;font-weight:800;color:#60584C">KB</span>
        <span style="font-size:13px;font-weight:700;color:#3f3a33">KB증권</span>
      </div>
      <div style="display:flex;gap:14px;color:#71717a">
        <button id="stock-search-btn" class="iconbtn"><svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg></button>
        <button class="iconbtn" data-not-ready><svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><line x1="4" y1="6" x2="20" y2="6"/><line x1="4" y1="12" x2="20" y2="12"/><line x1="4" y1="18" x2="20" y2="18"/></svg></button>
      </div>
    </div>
    <!-- 종목 헤더 — 시세는 증권사 자체 데이터(목업 고정값), AI 분석만 Publication API 경유 -->
    <div style="padding:4px 16px 12px;border-bottom:1px solid #e4e4e7;flex-shrink:0">
      <div style="display:flex;align-items:center;justify-content:space-between">
        <div style="display:flex;align-items:baseline;gap:8px">
          <div id="st-name" style="font-size:17px;font-weight:700;letter-spacing:-.2px"></div>
          <div id="st-code" class="num" style="font-size:11px;color:#71717a"></div>
        </div>
        <div style="display:flex;gap:14px">
          <button id="fav-btn" class="iconbtn">
            <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="#71717a" stroke-width="1.8" stroke-linejoin="round"><path d="M12 2l3.09 6.26L22 9.27l-5 4.87 1.18 6.88L12 17.77l-6.18 3.25L7 14.14 2 9.27l6.91-1.01L12 2z"/></svg>
          </button>
          <button id="alert-btn" class="iconbtn">
            <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="#71717a" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M6 8a6 6 0 0 1 12 0c0 7 3 9 3 9H3s3-2 3-9"/><path d="M10.3 21a1.94 1.94 0 0 0 3.4 0"/></svg>
          </button>
        </div>
      </div>
      <div style="display:flex;align-items:baseline;gap:10px;margin-top:6px">
        <div id="st-price" class="num" style="font-size:24px;font-weight:700;letter-spacing:-.3px"></div>
        <div id="st-chg" class="num" style="font-size:13px;font-weight:600"></div>
      </div>
    </div>
    <!-- 탭 바 -->
    <div id="tab-bar" style="display:flex;gap:0;border-bottom:1px solid #e4e4e7;overflow-x:auto;flex-shrink:0;scrollbar-width:none"></div>
    <!-- 콘텐츠 -->
    <div style="flex:1;overflow-y:auto;min-height:0">

      <!-- AI 분석 -->
      <div id="panel-ai" style="display:none;padding:16px">
        <!-- 헤더·본문 콘텐츠 폭 통일 — 패널 16px + 4px = 양쪽 20px (ALPHA-733 피드백: 둘의 평균 폭) -->
        <div style="display:flex;align-items:center;justify-content:space-between;padding:0 4px 12px;border-bottom:1px solid #e4e4e7">
          <div style="display:flex;align-items:center;gap:8px">
            <span id="ai-date" class="num" style="font-size:12px;color:#71717a"></span>
            <span id="ai-date-dot" style="font-size:12px;color:#d4d4d8;display:none">·</span>
            <span style="font-size:11px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:#60584C;border:1px solid #f0d98a;background:#fff7dd;border-radius:3px;padding:2px 6px">AI 분석</span>
          </div>
          <span id="ai-published" class="num" style="font-size:11px;color:#a1a1aa"></span>
        </div>
        <!-- 로딩 스켈레톤 -->
        <div id="ai-loading" style="display:flex;flex-direction:column;gap:10px;margin-top:16px">
          <span class="skel" style="width:92%"></span>
          <span class="skel" style="width:100%"></span>
          <span class="skel" style="width:96%"></span>
          <span class="skel" style="width:64%"></span>
        </div>
        <!-- 200: 리포트 본문 (첫 블록=헤드라인, 이후 문단) — 중앙 정렬 + 좌우 여백 (ALPHA-733 피드백) -->
        <div id="ai-body" style="display:none;text-align:center;padding:0 4px">
          <h2 id="ai-headline" style="font-size:19px;font-weight:700;letter-spacing:-.3px;line-height:1.45;margin:16px 0 14px;text-wrap:pretty"></h2>
          <div id="ai-paragraphs"></div>
        </div>
        <!-- 204/에러: 안내 -->
        <div id="ai-empty" style="display:none;padding:36px 8px;text-align:center">
          <p id="ai-empty-text" style="margin:0;font-size:13px;line-height:1.6;color:#71717a"></p>
        </div>
        <!-- 디스클레이머 -->
        <div style="background:#fafafa;border:1px solid #e4e4e7;border-radius:5px;padding:12px;margin:20px 0 8px">
          <div style="display:flex;gap:8px;align-items:flex-start">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#a1a1aa" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="flex-shrink:0;margin-top:1px"><path d="m21.73 18-8-14a2 2 0 0 0-3.48 0l-8 14A2 2 0 0 0 4 20h16a2 2 0 0 0 1.73-2Z"/><path d="M12 9v4"/><path d="M12 17h.01"/></svg>
            <div>
              <p style="font-size:11px;line-height:1.6;color:#71717a;margin:0">본 콘텐츠는 AI가 뉴스·공시 데이터를 기반으로 자동 생성한 참고 자료이며, 특정 종목의 매수·매도를 권유하는 투자 자문이 아닙니다. 분석 결과의 정확성·완전성은 보장되지 않으며, 투자에 대한 최종 판단과 책임은 투자자 본인에게 있습니다.</p>
              <!-- 계약(publication-api.md): 응답의 disclaimer는 화면에 반드시 함께 노출한다 -->
              <p id="ai-disclaimer" style="display:none;font-size:11px;line-height:1.6;color:#71717a;margin:6px 0 0"></p>
            </div>
          </div>
        </div>
      </div>

      <!-- 호가 -->
      <div id="panel-book" style="display:none;padding:8px 16px 16px">
        <div id="book-rows"></div>
        <div style="display:flex;justify-content:space-between;font-size:11px;color:#a1a1aa;margin-top:10px">
          <span>매도잔량 128,441</span><span>15:30 장마감</span><span>매수잔량 96,205</span>
        </div>
      </div>

      <!-- 차트 — 일봉 실데이터(BrokerApi.getChart 경유), 기간 슬라이스·통계는 화면에서 파생 -->
      <div id="panel-chart" style="display:none;padding:12px 16px 16px">
        <div id="chart-periods" style="display:flex;gap:4px;margin-bottom:12px"></div>
        <!-- 로딩 스켈레톤 -->
        <div id="chart-loading" style="display:none;flex-direction:column;gap:12px;padding:20px 0">
          <span class="skel" style="width:100%"></span>
          <span class="skel" style="width:92%"></span>
          <span class="skel" style="width:96%"></span>
          <span class="skel" style="width:64%"></span>
        </div>
        <!-- 실봉 도착 후 렌더 -->
        <div id="chart-body" style="display:none">
          <svg viewBox="0 0 360 180" style="width:100%;display:block">
            <line x1="0" y1="45" x2="360" y2="45" stroke="#f0f0f1" stroke-width="1"/>
            <line x1="0" y1="90" x2="360" y2="90" stroke="#f0f0f1" stroke-width="1"/>
            <line x1="0" y1="135" x2="360" y2="135" stroke="#f0f0f1" stroke-width="1"/>
            <polyline id="chart-line" points="" fill="none" stroke="#1d4ed8" stroke-width="2"/>
            <circle id="chart-dot" cx="0" cy="0" r="3" fill="#1d4ed8"/>
          </svg>
          <div id="chart-dates" class="num" style="display:flex;justify-content:space-between;font-size:10px;color:#a1a1aa;margin-top:6px"></div>
          <div id="chart-stats" style="display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;margin-top:16px"></div>
        </div>
        <!-- 폴백: 안내 문구 (하드코딩 가짜 차트로 되돌리지 않는다) -->
        <div id="chart-empty" style="display:none;padding:36px 8px;text-align:center">
          <p id="chart-empty-text" style="margin:0;font-size:13px;line-height:1.6;color:#71717a"></p>
        </div>
      </div>

      <!-- 뉴스·공시 -->
      <div id="panel-news" style="display:none;padding:4px 16px 16px"></div>

      <!-- 종목정보 -->
      <div id="panel-info" style="display:none;padding:12px 16px 16px">
        <div style="font-size:11px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:#a1a1aa;padding-bottom:6px">구성종목 상위</div>
        <div id="info-holdings"></div>
      </div>

      <!-- 커뮤니티 -->
      <div id="panel-talk" style="display:none;padding:4px 16px 16px"></div>

      <!-- 재무(상품정보) -->
      <div id="panel-fin" style="display:none;padding:12px 16px 16px"></div>
    </div>
  </section>

</div>
</div>
</div>

<script src="js/broker-api.js"></script>
<script src="js/app.js"></script>
</body>
</html>
