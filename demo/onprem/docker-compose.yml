# edge 가상 온프렘 박스 전용 스택 (ALPHA-444) — demo-onprem EC2 에서 compose 하나로 온프렘 런타임 기동.
# 루트 docker-compose.yml(로컬 풀스택)의 온프렘/데모 서브셋만 떼어, 이미지는 ECR 을 참조하고
# sync-agent 는 실 cloud(sync-dev.edgesignal.dev)를 outbound Pull 한다. 근거: ADR-0017·0033.
#
# 로컬 풀스택과의 차이(의도적):
#   - build: → image: (ECR edge/*:${IMAGE_TAG}). 박스는 소스 빌드를 하지 않는다(user-data 는 docker/compose 만).
#   - SPRING_PROFILES_ACTIVE override 없음 → 이미지 기본 prod = ECS JSON 구조적 로깅(ALPHA-531).
#   - sync-agent 대상 = 실 cloud sync 전용 mTLS ALB(로컬은 tenant-sync-api 컨테이너). trust store
#     미주입 dev 라 현재는 클라이언트 cert 없이 평문 HTTPS — cert·인가는 후속(ALPHA-445).
#   - cloud 서비스(postgres·flyway·super-admin-api·tenant-sync-api)는 없다 — AWS 에 있다.
#   - 호스트 노출은 CloudFront 오리진 2개(mock-broker·tenant-console-ui)뿐. DB·앱 포트는 compose 내부망만(공개 박스 표면 최소화).
#
# 네트워크 3망(dmz/data/serving, ALPHA-561) — ADR-0036 경계를 compose 네트워크로 강제:
#   - sync-agent=dmz 만(외부와 닿는 유일 컴포넌트, postgres-onprem 에 못 닿음), intake=dmz+data(수신 브리지),
#     DB·내부 앱=data, mock-broker=serving 만, publication-api/tenant-console-api=data+serving,
#     tenant-console-ui=serving 만.
#   - data 는 internal(외부 라우팅 차단) — data 전용 서비스의 인터넷 egress 가 구조로 막힌다.
#     dmz/serving 은 일반 bridge 여야 한다: sync-agent 는 outbound HTTPS 가 필요하고,
#     호스트 포트 공개(mock-broker·console-ui)는 internal 망에서 동작하지 않는다.
#   - 한계(수용): dmz/serving 소속 서비스(intake·publication-api·console-api)는 그 망 경유 egress 가
#     남는다 — 완전 차단은 서브넷/방화벽 수준(ADR-0033 의 11월 데모용 후속) 몫.
#
# 알려진 데모 단순화(박스 하드닝은 ALPHA-445):
#   - sync-agent mTLS 클라이언트 cert·인증서-테넌트 바인딩 없음(dev trust store 미주입 전제).
#   - 마이그레이션 번들이 없으면 flyway 는 0개 적용·성공 종료하고 앱이 validate 로 crash-loop 한다
#     — 배포 CD(deploy-demo-onprem.yml, ALPHA-542)가 up 전에 SQL 개수를 preflight 로 게이트한다
#       (0건이면 fail-loud 중단 — ALPHA-560 검증 종결).
#   - 재배포 시 flyway-onprem(one-shot·불변 이미지)은 compose 가 기존 종료 컨테이너를 재사용해
#     새 마이그레이션을 건너뛴다(config·이미지 불변이라 recreate 안 됨) → 배포가 앱 기동 전에
#     `up --force-recreate flyway-onprem` 으로 매 릴리스 스키마를 적용한다(배포 CD 구현됨, ALPHA-542).
#
# 마이그레이션 SQL 은 이 파일 옆 ${MIGRATIONS_ONPREM_DIR:-./migrations-onprem} 에 있어야 한다 —
# 박스 배포 CD(deploy-demo-onprem.yml, ALPHA-542)가 src/libs/schema/migrations-onprem 를 번들해 함께 올린다.
# 레포에서 그대로 테스트하려면 MIGRATIONS_ONPREM_DIR=../../src/libs/schema/migrations-onprem 로 실행.
#
# 배포·tenant_delivery 시드·CloudFront /api 오리진·mTLS cert 는 ALPHA-445. 검수 콘솔은 후속 증분.
#
# 사용(박스에서):
#   IMAGE_TAG=0.1.0 docker compose -f docker-compose.yml up -d
#   docker compose -f docker-compose.yml down [-v]

services:
  # 온프렘 PostgreSQL — 테넌트 물리 격리(ADR-0011). 호스트 미노출(내부망만).
  postgres-onprem:
    image: postgres:16
    container_name: edge-postgres-onprem
    restart: unless-stopped
    environment:
      POSTGRES_DB: edge_onprem
      POSTGRES_USER: edge
      POSTGRES_PASSWORD: ${ONPREM_DB_PASSWORD:-edge}
    networks:
      - data
    volumes:
      - edge-postgres-onprem-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U edge -d edge_onprem"]
      interval: 5s
      timeout: 5s
      retries: 10

  # 온프렘 스키마(migrations-onprem) 적용 후 종료. SQL 은 배포 번들이 옆에 놓는다(위 헤더).
  flyway-onprem:
    image: flyway/flyway:10.21.0
    container_name: edge-flyway-onprem
    depends_on:
      postgres-onprem:
        condition: service_healthy
    networks:
      - data
    volumes:
      - ${MIGRATIONS_ONPREM_DIR:-./migrations-onprem}:/flyway/sql:ro
    command: >-
      -url=jdbc:postgresql://postgres-onprem:5432/edge_onprem
      -user=edge -password=${ONPREM_DB_PASSWORD:-edge}
      -connectRetries=10
      -locations=filesystem:/flyway/sql
      -ignoreMigrationPatterns=repeatable:missing
      migrate

  # DMZ 역할 — 실 cloud sync ALB 를 Pull + 체크섬 검증, DB 접근 없음(ADR-0036).
  sync-agent:
    image: ${IMAGE_REGISTRY:-393229433969.dkr.ecr.ap-northeast-2.amazonaws.com}/edge/sync-agent:${IMAGE_TAG:-0.1.0}
    container_name: edge-sync-agent
    restart: unless-stopped
    networks:
      - dmz
    environment:
      TENANT_SYNC_API_URL: ${TENANT_SYNC_API_URL:-https://sync-dev.edgesignal.dev}

  # 내부망 역할 — sync-agent 폴링 → Raw Event Store 멱등 적재(sync_state cursor 권위).
  intake:
    image: ${IMAGE_REGISTRY:-393229433969.dkr.ecr.ap-northeast-2.amazonaws.com}/edge/intake:${IMAGE_TAG:-0.1.0}
    container_name: edge-intake
    restart: unless-stopped
    depends_on:
      flyway-onprem:
        condition: service_completed_successfully
      sync-agent:
        condition: service_started
    networks:
      - dmz
      - data
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres-onprem:5432/edge_onprem
      SPRING_DATASOURCE_USERNAME: edge
      SPRING_DATASOURCE_PASSWORD: ${ONPREM_DB_PASSWORD:-edge}
      SYNC_AGENT_URL: http://sync-agent:8080
      INTAKE_POLL_MS: ${INTAKE_POLL_MS:-5000}

  # 미점검 번들 파싱·상태 분기(state-machine.md): NEW=AUTO_PUBLISHED+자동게시 / INVALIDATION=즉시 비노출 (CORRECTION 은 폐지 — ADR-0044).
  screening-worker:
    image: ${IMAGE_REGISTRY:-393229433969.dkr.ecr.ap-northeast-2.amazonaws.com}/edge/screening-worker:${IMAGE_TAG:-0.1.0}
    container_name: edge-screening-worker
    restart: unless-stopped
    depends_on:
      flyway-onprem:
        condition: service_completed_successfully
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres-onprem:5432/edge_onprem
      SPRING_DATASOURCE_USERNAME: edge
      SPRING_DATASOURCE_PASSWORD: ${ONPREM_DB_PASSWORD:-edge}
      SCREENING_POLL_MS: ${SCREENING_POLL_MS:-5000}
    networks:
      - data

  # MTS 위젯이 직접 호출하는 조회 표면(Published만·무헤더, ADR-0053) — 온프렘 PG 조회.
  publication-api:
    image: ${IMAGE_REGISTRY:-393229433969.dkr.ecr.ap-northeast-2.amazonaws.com}/edge/publication-api:${IMAGE_TAG:-0.1.0}
    container_name: edge-publication-api
    restart: unless-stopped
    depends_on:
      flyway-onprem:
        condition: service_completed_successfully
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres-onprem:5432/edge_onprem
      SPRING_DATASOURCE_USERNAME: edge
      SPRING_DATASOURCE_PASSWORD: ${ONPREM_DB_PASSWORD:-edge}
      # 종목 마스터 동기화 전 allowlist — 분석 유니버스 32종(검색 노출과 일치, quotes-fallback.json 참조 — 300950 은 ALPHA-624 확장분) + 204 시나리오 305720.
      # 133690(TIGER 미국나스닥100)은 의도적 제외 — AI 탭 404(미지원 종목) 시나리오 보존.
      PUBLICATION_KNOWN_TICKERS: ${PUBLICATION_KNOWN_TICKERS:-069500,305720,091160,0005G0,0093A0,0167A0,0176P0,0182R0,0190G0,0210A0,091230,139260,261060,266370,300950,363580,388420,395160,395270,396500,455850,469150,471760,471780,471990,474590,475300,475310,476260,482030,486240,488210,494220}
    networks:
      - data
      - serving

  # 증권사 자체 제작 API(mock-broker) + 가상 MTS 정적 서빙. 화면 → mock-broker → publication-api 2홉.
  # 호스트 노출(CloudFront 오리진) — 정적(mts-ai-tab, 이미지 내장)+API 를 모두 서빙(ALPHA-632).
  # SG 인바운드=CloudFront 프리픽스(demo-onprem 모듈).
  mock-broker:
    image: ${IMAGE_REGISTRY:-393229433969.dkr.ecr.ap-northeast-2.amazonaws.com}/edge/mock-broker:${IMAGE_TAG:-0.1.0}
    container_name: edge-mock-broker
    restart: unless-stopped
    depends_on:
      - publication-api
    networks:
      - serving
    environment:
      PUBLICATION_API_URL: http://publication-api:8080
      # 토스증권 Open API 키(실시간 시세) — 박스 /opt/edge-onprem/.env 에 1회 수동 배치(커밋 금지).
      # 배포 번들 tar 는 덮어쓰기만 하므로 .env 는 재배포에도 유지된다. 미설정 시 폴백 스냅샷.
      TOSS_CLIENT_ID: ${TOSS_CLIENT_ID:-}
      TOSS_CLIENT_SECRET: ${TOSS_CLIENT_SECRET:-}
    ports:
      - "${MOCK_BROKER_PORT:-8080}:8080"

  # [edge-onprem] 검수 콘솔 API — 온프렘 PG 조회·전이. 세션 인증(ADR-0025). 호스트 미노출(내부망만).
  # 기동 시 bootstrap-accounts(admin@demo.edge.local·reviewer@demo.edge.local)를 member 로 자동 시드.
  tenant-console-api:
    image: ${IMAGE_REGISTRY:-393229433969.dkr.ecr.ap-northeast-2.amazonaws.com}/edge/tenant-console-api:${IMAGE_TAG:-0.1.0}
    container_name: edge-tenant-console-api
    restart: unless-stopped
    depends_on:
      flyway-onprem:
        condition: service_completed_successfully
    networks:
      - data
      - serving
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres-onprem:5432/edge_onprem
      SPRING_DATASOURCE_USERNAME: edge
      SPRING_DATASOURCE_PASSWORD: ${ONPREM_DB_PASSWORD:-edge}
      # 부트스트랩 비밀번호(ALPHA-627) — 콘솔이 CloudFront 로 공개되므로 기본값 폴백을 두지
      # 않는다(:? = 미설정이면 compose 가 fail-loud). 배포 박스는 /opt/edge-onprem/.env 에
      # 기본값(demo-admin-1 류)이 아닌 값을 수동 1회 주입한다(TOSS 키와 같은 패턴). 알려진
      # 문서화 비번으로 공개 기동되는 사고를 구성 단계에서 차단한다. 로컬 검증은 README 참조.
      # 주의: 부트스트랩 시드는 member 0건일 때 1회 — 이미 시드된 박스는 env 변경만으로
      # 비번이 회전되지 않는다(README "환경 변수" 절).
      CONSOLE_BOOTSTRAP_ADMIN_PASSWORD: ${CONSOLE_BOOTSTRAP_ADMIN_PASSWORD:?set-in-box-.env}
      CONSOLE_BOOTSTRAP_REVIEWER_PASSWORD: ${CONSOLE_BOOTSTRAP_REVIEWER_PASSWORD:?set-in-box-.env}

  # [edge-onprem] 검수 콘솔 UI(nginx) — SPA 정적 + /api → tenant-console-api 프록시(한 오리진 co-host).
  # 호스트 공개 바인딩(ALPHA-627) — CloudFront(demo-console 도메인)가 이 포트를 오리진으로 프록시하고,
  # 박스 SG 인바운드는 CloudFront origin-facing 프리픽스로만 열린다(직접 접근 차단). 진입은 로그인
  # 화면(ALPHA-626)뿐 — 자동 세션(autosession) 빌드는 폐기. README "검수 콘솔 접근" 참조.
  tenant-console-ui:
    image: ${IMAGE_REGISTRY:-393229433969.dkr.ecr.ap-northeast-2.amazonaws.com}/edge/tenant-console-ui:${IMAGE_TAG:-0.1.0}
    container_name: edge-tenant-console-ui
    restart: unless-stopped
    depends_on:
      - tenant-console-api
    networks:
      - serving
    ports:
      - "${CONSOLE_PORT:-8090}:80"

# 3망 세분화(ALPHA-561, ADR-0036) — 배치 근거는 헤더 주석.
networks:
  dmz:
    driver: bridge
  data:
    driver: bridge
    internal: true # 외부 라우팅 차단 — data 전용 서비스는 인터넷 egress 불가
  serving:
    driver: bridge

volumes:
  edge-postgres-onprem-data:
