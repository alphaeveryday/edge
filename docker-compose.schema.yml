services:
  postgres:
    image: postgres:16
    container_name: edge-schema-postgres
    environment:
      POSTGRES_DB: edge
      POSTGRES_USER: edge
      POSTGRES_PASSWORD: edge
    ports:
      - "55432:5432"
    volumes:
      - edge-schema-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U edge -d edge"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  edge-schema-postgres-data:
