# edge 로컬 통합 스택 — 백엔드 API + Postgres.
#
# 목적: 백엔드 API 를 ECS Service Connect 토폴로지와 동일하게 로컬에서 재현해 테스트한다.
#       (gateway 는 은퇴 — ADR-0032. 공개 엣지는 super-admin 공개화 시점 ALB 직결로 재도입.)
#
# 핵심 정합성:
#   - 서비스 이름(tenant-console-api·super-admin-api·tenant-sync-api·publication-api)을
#     ECS Service Connect 의 dns_name(= Terraform 모듈 name)과 '똑같이' 둔다
#     → 서비스 간 호출 http://<name>:8080 이 로컬·ECS 에서 동일 동작.
#   - 컨테이너 포트 8080, 빌드 컨텍스트 src/ (Dockerfile 규약과 동일).
#   - Postgres 접속값(edge/edge/edge)·Flyway 는 docker-compose.schema.yml 과 일치.
#   - DB 는 플레인별 2개: postgres(cloud, :55432) / postgres-onprem(온프렘, :55433,
#     ADR-0011 물리 격리 재현). 온프렘 세트는 flyway-onprem 이 적용하고, 로컬 전용
#     시드(seed-local-onprem — SSOT 밖)를 함께 태운다.
#
# 사용:
#   docker compose up --build             # 전체 기동(첫 실행은 gradle 빌드로 느림)
#   docker compose up --build <service>   # 특정 서비스만
#   docker compose down [-v]              # 정리(-v 는 DB 볼륨까지)
#
# 테스트(각 백엔드 host 포트 직접):
#   curl localhost:18081/actuator/health   # tenant-console-api
#   curl localhost:18082/actuator/health   # super-admin-api
#   curl "localhost:18083/api/v1/sync/bundle?after=0"   # tenant-sync-api (번들+체크섬 헤더)
#   curl -H "X-Customer-Hash: h" -H "X-Channel: MTS" localhost:18084/api/v1/explanations/069500   # publication-api
#   open http://localhost:18090                          # mock-broker — 가상 MTS 데모(AI 분석 탭)
#   curl "localhost:18090/api/broker/ai-analysis?ticker=069500"   # mock-broker → publication-api 2홉

services:
  postgres:
    image: postgres:16
    container_name: edge-postgres
    environment:
      POSTGRES_DB: edge
      POSTGRES_USER: edge
      POSTGRES_PASSWORD: edge
    ports:
      - "55432:5432" # host 55432 → schema 모듈 Flyway(gradle) 기본값과 일치
    volumes:
      - edge-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U edge -d edge"]
      interval: 5s
      timeout: 5s
      retries: 10

  # SSOT 스키마(src/libs/schema)를 DB 에 적용하고 종료한다.
  # 로컬 전용 시드(seed-local-cloud — SSOT 밖, CI·CD 미포함)를 함께 태운다.
  flyway:
    image: flyway/flyway:10.21.0
    container_name: edge-flyway
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./src/libs/schema/migrations-cloud:/flyway/sql:ro
      - ./src/libs/schema/seed-local-cloud:/flyway/seed:ro
    command: >-
      -url=jdbc:postgresql://postgres:5432/edge
      -user=edge -password=edge
      -connectRetries=10
      -locations=filesystem:/flyway/sql,filesystem:/flyway/seed
      migrate

  # [edge-onprem] 온프렘 플레인이므로 온프렘 PG 를 본다 (앱은 아직 DataSource
  # autoconfig exclude 상태 — env 는 검수 도메인 실구현 시 사용된다).
  tenant-console-api:
    build:
      context: ./src
      dockerfile: apps/onprem/tenant-console-api/Dockerfile
    container_name: edge-tenant-console-api
    depends_on:
      flyway-onprem:
        condition: service_completed_successfully
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres-onprem:5432/edge_onprem
      SPRING_DATASOURCE_USERNAME: edge
      SPRING_DATASOURCE_PASSWORD: edge
    ports:
      - "18081:8080"

  super-admin-api:
    build:
      context: ./src
      dockerfile: apps/cloud/super-admin-api/Dockerfile
    container_name: edge-super-admin-api
    depends_on:
      flyway:
        condition: service_completed_successfully
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/edge
      SPRING_DATASOURCE_USERNAME: edge
      SPRING_DATASOURCE_PASSWORD: edge
    ports:
      - "18082:8080"

  # [edge-onprem] 온프렘 PostgreSQL — 테넌트별 물리 격리(ADR-0011)를 컨테이너 분리로 재현.
  # cloud postgres 와 절대 섞지 않는다. demo-onprem compose 추출(ALPHA-444/445)의 원형.
  postgres-onprem:
    image: postgres:16
    container_name: edge-postgres-onprem
    environment:
      POSTGRES_DB: edge_onprem
      POSTGRES_USER: edge
      POSTGRES_PASSWORD: edge
    ports:
      - "55433:5432" # host 55433 → cloud(55432)와 구분
    volumes:
      - edge-postgres-onprem-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U edge -d edge_onprem"]
      interval: 5s
      timeout: 5s
      retries: 10

  # 온프렘 세트(migrations-onprem) 적용 + 로컬 전용 시드(seed-local-onprem — SSOT 밖,
  # compose 만 마운트하므로 schema-migrate CD·CI 에 섞이지 않는다).
  flyway-onprem:
    image: flyway/flyway:10.21.0
    container_name: edge-flyway-onprem
    depends_on:
      postgres-onprem:
        condition: service_healthy
    volumes:
      - ./src/libs/schema/migrations-onprem:/flyway/sql:ro
      - ./src/libs/schema/seed-local-onprem:/flyway/seed:ro
    command: >-
      -url=jdbc:postgresql://postgres-onprem:5432/edge_onprem
      -user=edge -password=edge
      -connectRetries=10
      -locations=filesystem:/flyway/sql,filesystem:/flyway/seed
      migrate

  # [edge-onprem] 증권사 백엔드가 호출하는 조회 표면(Published만) — 온프렘 PG 조회.
  publication-api:
    build:
      context: ./src
      dockerfile: apps/onprem/publication-api/Dockerfile
    container_name: edge-publication-api
    depends_on:
      flyway-onprem:
        condition: service_completed_successfully
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres-onprem:5432/edge_onprem
      SPRING_DATASOURCE_USERNAME: edge
      SPRING_DATASOURCE_PASSWORD: edge
    ports:
      - "18084:8080"

  # [demo] 증권사 자체 제작 API(mock-broker) + 가상 MTS 정적 서빙 — ADR-0035 런타임 경로 재현.
  # 화면 → mock-broker → publication-api 실 HTTP 2홉. 고객 해시·채널 부착은 이 레이어 책임.
  mock-broker:
    build:
      context: ./demo
      dockerfile: mock-broker/Dockerfile
    container_name: edge-mock-broker
    depends_on:
      - publication-api
    environment:
      PUBLICATION_API_URL: http://publication-api:8080
    ports:
      - "18090:8080"

  # Sync Agent 가 Pull 하는 Cloud 표면(ADR-0010) — tenant_delivery(outbox) DB 조회.
  # gateway 를 타지 않는다(sync 전용 mTLS ALB — ADR-0034).
  tenant-sync-api:
    build:
      context: ./src
      dockerfile: apps/cloud/tenant-sync-api/Dockerfile
    container_name: edge-tenant-sync-api
    depends_on:
      flyway:
        condition: service_completed_successfully
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/edge
      SPRING_DATASOURCE_USERNAME: edge
      SPRING_DATASOURCE_PASSWORD: edge
    ports:
      - "18083:8080"

volumes:
  edge-postgres-data:
  edge-postgres-onprem-data:
