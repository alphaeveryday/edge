# edge 로컬 통합 스택 — gateway + 백엔드 API + Postgres.
#
# 목적: "gateway 가 앞단, 나머지 API 는 뒤" 라는 배포 토폴로지(ECS + Service Connect)를
#       로컬에서 동일하게 재현해 테스트한다.
#
# 핵심 정합성:
#   - 서비스 이름(tenant-console-api·super-admin-api·gateway)을
#     ECS Service Connect 의 dns_name(= Terraform 모듈 name)과 '똑같이' 둔다.
#     → gateway 라우팅 설정이 http://tenant-console-api:8080 을 타깃하면 로컬·ECS 가 동일 동작.
#   - 컨테이너 포트 8080, 빌드 컨텍스트 src/ (Dockerfile 규약과 동일).
#   - Postgres 접속값(edge/edge/edge)·Flyway 는 docker-compose.schema.yml 과 일치.
#
# gateway 라우팅(ALPHA-294·301, 위젯 라우트는 하이브리드 피벗으로 제거 — ADR-0010):
#    /api/v1/console/** → tenant-console-api, /api/v1/admin/** → super-admin-api
#    (기본 uri 가 서비스명 http://<name>:8080 이라 compose 에서 별도 설정 없이 동작.)
#    각 백엔드 host 포트(18081~)는 라우팅 우회 직접 테스트용으로 남겨 둔다.
#
# 사용:
#   docker compose up --build          # 전체 기동(첫 실행은 gradle 빌드로 느림)
#   docker compose up --build gateway  # 특정 서비스만
#   docker compose down [-v]           # 정리(-v 는 DB 볼륨까지)
#
# 테스트:
#   # gateway 경유(라우팅)
#   curl localhost:8080/actuator/health    # gateway
#   # 백엔드 직접(라우팅 우회)
#   curl localhost:18081/actuator/health   # tenant-console-api
#   curl localhost:18082/actuator/health   # super-admin-api
#   curl "localhost:18083/api/v1/sync/bundle?after=0"   # tenant-sync-api (번들+체크섬 헤더)
#   curl -H "X-Customer-Hash: h" -H "X-Channel: MTS" localhost:18084/api/v1/explanations/069500   # serving-api

services:
  postgres:
    image: postgres:16
    container_name: edge-postgres
    environment:
      POSTGRES_DB: edge
      POSTGRES_USER: edge
      POSTGRES_PASSWORD: edge
    ports:
      - "55432:5432" # host 55432 → schema 모듈 Flyway(gradle) 기본값과 일치
    volumes:
      - edge-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U edge -d edge"]
      interval: 5s
      timeout: 5s
      retries: 10

  # SSOT 스키마(src/libs/schema)를 DB 에 적용하고 종료한다.
  flyway:
    image: flyway/flyway:10.21.0
    container_name: edge-flyway
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./src/libs/schema/migrations:/flyway/sql:ro
    command: >-
      -url=jdbc:postgresql://postgres:5432/edge
      -user=edge -password=edge
      -connectRetries=10
      -locations=filesystem:/flyway/sql
      migrate

  tenant-console-api:
    build:
      context: ./src
      dockerfile: apps/tenant-console-api/Dockerfile
    container_name: edge-tenant-console-api
    depends_on:
      flyway:
        condition: service_completed_successfully
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/edge
      SPRING_DATASOURCE_USERNAME: edge
      SPRING_DATASOURCE_PASSWORD: edge
    ports:
      - "18081:8080"

  super-admin-api:
    build:
      context: ./src
      dockerfile: apps/super-admin-api/Dockerfile
    container_name: edge-super-admin-api
    depends_on:
      flyway:
        condition: service_completed_successfully
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/edge
      SPRING_DATASOURCE_USERNAME: edge
      SPRING_DATASOURCE_PASSWORD: edge
    ports:
      - "18082:8080"

  # [edge-onprem] 증권사 백엔드가 호출하는 조회 표면(Published만). 인메모리 시드 — DB 의존 없음.
  serving-api:
    build:
      context: ./src
      dockerfile: apps/serving-api/Dockerfile
    container_name: edge-serving-api
    ports:
      - "18084:8080"

  # Sync Agent 가 Pull 하는 Cloud 표면(ADR-0010). outbox 인메모리 스텁 — DB 의존 없음.
  # gateway 를 타지 않는다(mTLS 직접 노출 유력 — TODO §6 gateway 존치 ADR과 함께 확정).
  tenant-sync-api:
    build:
      context: ./src
      dockerfile: apps/tenant-sync-api/Dockerfile
    container_name: edge-tenant-sync-api
    ports:
      - "18083:8080"

  # 공개 엣지(단일 진입점). backends 를 http://<name>:8080 으로 프록시한다(ALPHA-294·301).
  #   console→tenant-console-api · admin→super-admin-api
  gateway:
    build:
      context: ./src
      dockerfile: apps/gateway/Dockerfile
    container_name: edge-gateway
    depends_on:
      tenant-console-api:
        condition: service_started
      super-admin-api:
        condition: service_started
    ports:
      - "8080:8080" # 로컬 단일 진입점(2라우트 프록시)

volumes:
  edge-postgres-data:
