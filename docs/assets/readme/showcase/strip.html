<!--
  루트 README "실제 서비스 › EDGE SIGNAL" 에 박히는 signal-screens.png 의 원본이다.
  세로 6블록 showcase(index.html → feature-showcase.jpg)는 제품 README 용이고,
  이 가로 한 장은 ORCA 의 orca-screens.png(2800x1440) 와 짝을 맞춘다.
  스크린샷 원본은 이 폴더의 07(폰: demo-mts 의 KODEX 반도체 2026-09-21 게시분,
  `/?ticker=091160&trade_date=2026-09-21` 를 헤드리스 Chrome 700x1000·2x 로 찍어 베젤만 잘라낸 825x1743)과
  04-review-queue-20261016(검수 관리 콘솔, 2026-10-16 캡처)이다. 다시 뽑는 법:

    "/Applications/Google Chrome.app/Contents/MacOS/Google Chrome" \
      --headless --disable-gpu --hide-scrollbars --force-device-scale-factor=2 \
      --window-size=1400,720 --screenshot=/tmp/signal-strip.png \
      "file://$PWD/docs/assets/readme/showcase/strip.html"
    cp /tmp/signal-strip.png docs/assets/readme/signal-screens.png

  --window-size 는 캔버스 그대로(1400x720)다. 블록을 바꾸면 아래끝을 눈으로 확인한다.
