<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 490" role="img" aria-labelledby="title desc"><title id="title">Cloud 데이터 모델 개요</title><desc id="desc">7개 Cloud 데이터 도메인과 주요 의존 방향.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L10 5L0 10z" class="arrow"/></marker></defs><style>:root{color-scheme:light}text{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}.canvas{fill:#fff}.heading{fill:#0f172a;font-size:25px;font-weight:700}.sub{fill:#64748b;font-size:13px}.domain{fill:#fff;stroke:#7aa2e3;stroke-width:1.5}.name{fill:#172554;font-size:15px;font-weight:700}.detail{fill:#475569;font-size:11px}.flow{fill:none;stroke:#7c93b5;stroke-width:1.6}.arrow{fill:#64748b}</style><rect class="canvas" width="100%" height="100%" rx="12"/><text class="heading" x="35" y="42">Cloud 데이터 모델</text><text class="sub" x="35" y="65">루트에서는 도메인 흐름만, 각 도메인에서는 물리 FK를 확인합니다</text><g><path class="flow" d="M 285 134 L 335 134" marker-end="url(#arrow)"/><path class="flow" d="M 160 173 L 160 235" marker-end="url(#arrow)"/><path class="flow" d="M 460 173 L 460 235" marker-end="url(#arrow)"/><path class="flow" d="M 285 274 L 335 274" marker-end="url(#arrow)"/><path class="flow" d="M 585 274 L 635 274" marker-end="url(#arrow)"/><path class="flow" d="M 760 235 L 760 173" marker-end="url(#arrow)"/><path class="flow" d="M 160 313 L 160 414 L 335 414" marker-end="url(#arrow)"/><path class="flow" d="M 760 313 L 760 414 L 585 414" marker-end="url(#arrow)"/></g><g><g><rect class="domain" x="35" y="95" width="250" height="78" rx="12"/><text class="name" x="51" y="124">기준정보·금융상품</text><text class="detail" x="51" y="149">entity · actor · instrument · concept</text></g><g><rect class="domain" x="335" y="95" width="250" height="78" rx="12"/><text class="name" x="351" y="124">문서·공시 사실</text><text class="detail" x="351" y="149">document · assertion · disclosure_fact</text></g><g><rect class="domain" x="35" y="235" width="250" height="78" rx="12"/><text class="name" x="51" y="264">시장 데이터·수집</text><text class="detail" x="51" y="289">minute ingestion · price · flow</text></g><g><rect class="domain" x="335" y="235" width="250" height="78" rx="12"/><text class="name" x="351" y="264">이벤트·근거</text><text class="detail" x="351" y="289">source_event · evidence · thread</text></g><g><rect class="domain" x="635" y="235" width="250" height="78" rx="12"/><text class="name" x="651" y="264">설명 생성·계보</text><text class="detail" x="651" y="289">route · run · result · lineage</text></g><g><rect class="domain" x="635" y="95" width="250" height="78" rx="12"/><text class="name" x="651" y="124">테넌트 전송</text><text class="detail" x="651" y="149">tenant · release · delivery cursor</text></g><g><rect class="domain" x="335" y="375" width="250" height="78" rx="12"/><text class="name" x="351" y="404">운영 원장</text><text class="detail" x="351" y="429">task · reconciliation · admin audit</text></g></g></svg>
