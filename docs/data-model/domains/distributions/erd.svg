<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 450"><rect width="100%" height="100%" fill="#ffffff"/>
<style>text{font-family:Arial,sans-serif;fill:#1e293b;font-size:12px}.title{font-size:25px;font-weight:bold}.subtitle{font-size:13px;fill:#64748b}.relation{fill:none;stroke:#64748b;stroke-width:2}.table{fill:#ffffff;stroke:#7aa2e3}</style>
<text x="30" y="38" class="title">Cash distribution observations</text><text x="30" y="66" class="subtitle">Public source revisions linked to existing securities; customer holdings stay separate.</text>
<g id="table-cash_distribution_observation"><rect class="table" x="30" y="100" width="390" height="310"/><text x="42" y="125" font-weight="bold">cash_distribution_observation</text>
<text x="42" y="157">PK market_code / ticker</text>
<text x="42" y="182">PK source_vendor</text>
<text x="42" y="207">PK source_event_key</text>
<text x="42" y="232">PK raw_run_id</text>
<text x="42" y="257">record_date / ex_date / pay_date</text>
<text x="42" y="282">amount_per_share / currency</text>
<text x="42" y="307">confirmation / distribution_kind</text>
<text x="42" y="332">received_at / available_at</text>
<text x="42" y="357">raw_key / raw_sha256</text>
<text x="42" y="382">canonical_run_id / artifact_key / artifact_sha256</text>
</g>

<g id="table-cash_distribution_coverage"><rect class="table" x="460" y="100" width="390" height="285"/><text x="472" y="125" font-weight="bold">cash_distribution_coverage</text>
<text x="472" y="157">PK market_code / ticker</text>
<text x="472" y="182">PK source_vendor / raw_run_id</text>
<text x="472" y="207">coverage_from / coverage_to</text>
<text x="472" y="232">status: complete / partial / failed</text>
<text x="472" y="257">received_at / available_at</text>
<text x="472" y="282">raw_key / raw_sha256 (manifest)</text>
<text x="472" y="307">canonical_run_id / artifact_key / artifact_sha256</text>
<text x="472" y="332">observations_sha256 (including empty sets)</text></g>
</svg>
