<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 620" role="img" aria-labelledby="title desc"><title id="title">데이터 모델 개요</title><desc id="desc">Cloud 7개 도메인과 온프렘 테넌트 DB, 둘을 잇는 단방향 Pull 경계.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L10 5L0 10z" class="arrow"/></marker></defs><style>:root{color-scheme:light}text{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}.canvas{fill:#fff}.heading{fill:#0f172a;font-size:25px;font-weight:700}.sub{fill:#64748b;font-size:13px}.domain{fill:#fff;stroke:#7aa2e3;stroke-width:1.5}.name{fill:#172554;font-size:15px;font-weight:700}.detail{fill:#475569;font-size:11px}.flow{fill:none;stroke:#7c93b5;stroke-width:1.6}.arrow{fill:#64748b}.band{fill:none;stroke:#94a3b8;stroke-width:1.2;stroke-dasharray:6 4}.band-label{fill:#64748b;font-size:11px;font-weight:700}.edge-label{fill:#64748b;font-size:11px}.boundary{fill:none;stroke:#64748b;stroke-width:1.6;stroke-dasharray:5 4}</style><rect class="canvas" width="100%" height="100%" rx="12"/><text class="band-label" x="35" y="88">EDGE Cloud 환경 — Flyway cloud 세트 · 71테이블</text><text class="heading" x="35" y="42">데이터 모델</text><text class="sub" x="35" y="65">Flyway 세트는 둘입니다 — Cloud 7개 도메인과 온프렘 테넌트 DB, 둘을 잇는 경계는 하나입니다</text><g><path class="flow" d="M 285 134 L 335 134" marker-end="url(#arrow)"/><path class="flow" d="M 160 173 L 160 235" marker-end="url(#arrow)"/><path class="flow" d="M 460 173 L 460 235" marker-end="url(#arrow)"/><path class="flow" d="M 285 274 L 335 274" marker-end="url(#arrow)"/><path class="flow" d="M 585 274 L 635 274" marker-end="url(#arrow)"/><path class="flow" d="M 760 235 L 760 173" marker-end="url(#arrow)"/><path class="flow" d="M 160 313 L 160 414 L 335 414" marker-end="url(#arrow)"/><path class="flow" d="M 760 313 L 760 414 L 585 414" marker-end="url(#arrow)"/></g><g><g><rect class="domain" x="35" y="95" width="250" height="78" rx="12"/><text class="name" x="51" y="124">기준정보·금융상품</text><text class="detail" x="51" y="149">entity · actor · instrument · concept</text></g><g><rect class="domain" x="335" y="95" width="250" height="78" rx="12"/><text class="name" x="351" y="124">문서·공시 사실</text><text class="detail" x="351" y="149">document · assertion · disclosure_fact</text></g><g><rect class="domain" x="35" y="235" width="250" height="78" rx="12"/><text class="name" x="51" y="264">시장 데이터·수집</text><text class="detail" x="51" y="289">minute ingestion · price · flow</text></g><g><rect class="domain" x="335" y="235" width="250" height="78" rx="12"/><text class="name" x="351" y="264">이벤트·근거</text><text class="detail" x="351" y="289">source_event · evidence · thread</text></g><g><rect class="domain" x="635" y="235" width="250" height="78" rx="12"/><text class="name" x="651" y="264">설명 생성·계보</text><text class="detail" x="651" y="289">route · run · result · lineage</text></g><g><rect class="domain" x="635" y="95" width="250" height="78" rx="12"/><text class="name" x="651" y="124">테넌트 전송</text><text class="detail" x="651" y="149">tenant · release · delivery cursor</text></g><g><rect class="domain" x="335" y="375" width="250" height="78" rx="12"/><text class="name" x="351" y="404">운영 원장</text><text class="detail" x="351" y="429">task · reconciliation · admin audit</text></g></g><g><rect class="band" x="35" y="495" width="850" height="100" rx="12"/><text class="band-label" x="51" y="518">증권사 관리 환경 (On-Prem) — Flyway 온프렘 세트 · 13테이블</text><path class="boundary" d="M 885 134 L 902 134 L 902 549 L 891 549" marker-end="url(#arrow)"/><text class="edge-label" x="615" y="553" text-anchor="end">단방향 Pull · 커서 + 번들</text><rect class="domain" x="635" y="510" width="250" height="78" rx="12"/><text class="name" x="651" y="539">온프렘 테넌트 DB</text><text class="detail" x="651" y="564">analysis_item · review · publication</text></g></svg>
