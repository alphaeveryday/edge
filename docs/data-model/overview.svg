<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1140 664" role="img" aria-labelledby="title desc"><title id="title">데이터 모델 개요</title><desc id="desc">공통 스키마 9개 도메인, ETF Orca 앱 DB, 증권사 테넌트 DB. 증권사와 벤더를 잇는 단방향 Pull 경계.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L10 5L0 10z" class="arrow"/></marker></defs><style>:root{color-scheme:light}text{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}.canvas{fill:#fff}.heading{fill:#0f172a;font-size:25px;font-weight:700}.sub{fill:#64748b;font-size:13px}.domain{fill:#fff;stroke:#7aa2e3;stroke-width:1.5}.name{fill:#172554;font-size:15px;font-weight:700}.detail{fill:#475569;font-size:11px}.flow{fill:none;stroke:#7c93b5;stroke-width:1.6}.arrow{fill:#64748b}.band{fill:none;stroke:#94a3b8;stroke-width:1.2;stroke-dasharray:6 4}.band-label{fill:#64748b;font-size:11px;font-weight:700}.edge-label{fill:#64748b;font-size:11px}.boundary{fill:none;stroke:#64748b;stroke-width:1.6;stroke-dasharray:5 4}</style><rect class="canvas" width="100%" height="100%" rx="12"/><text class="heading" x="35" y="42">데이터 모델</text><text class="sub" x="35" y="65">저장소는 셋입니다. 공통 스키마(Cloud 9개 도메인), ETF Orca 앱 DB, 증권사 테넌트 DB. 증권사와 벤더를 잇는 경계는 단방향 Pull 하나입니다</text><g><rect class="band" x="35" y="95" width="200" height="219" rx="12"/><text class="band-label" x="51" y="118">ETF Orca (B2C)</text><text class="edge-label" x="51" y="138">app-api 자체 Flyway 세트</text><g><rect class="domain" x="45" y="175" width="180" height="94" rx="12"/><text class="name" x="61" y="204">ETF Orca 앱 DB</text><text class="detail" x="61" y="229">member · watch_item</text><text class="detail" x="61" y="245">vote · post</text></g><path class="boundary" d="M 265 292 L 250 292 L 250 222 L 225 222" marker-end="url(#arrow)"/><text class="edge-label" x="51" y="291">공통 스키마에서 읽기 전용 동기화</text></g><text class="band-label" x="265" y="88">EDGE Cloud 환경 — Flyway cloud 세트 · 97테이블</text><g><path class="flow" d="M 445 142 L 480 142" marker-end="url(#arrow)"/><path class="flow" d="M 355 189 L 355 245" marker-end="url(#arrow)"/><path class="flow" d="M 570 189 L 570 245" marker-end="url(#arrow)"/><path class="flow" d="M 445 292 L 480 292" marker-end="url(#arrow)"/><path class="flow" d="M 660 292 L 695 292" marker-end="url(#arrow)"/><path class="flow" d="M 785 245 L 785 189" marker-end="url(#arrow)"/><path class="flow" d="M 355 339 L 355 395" marker-end="url(#arrow)"/><path class="flow" d="M 785 339 L 785 395" marker-end="url(#arrow)"/><path class="flow" d="M 445 442 L 695 442" marker-end="url(#arrow)"/><path class="flow" d="M 355 489 L 355 592 L 480 592" marker-end="url(#arrow)"/><path class="flow" d="M 785 489 L 785 592 L 660 592" marker-end="url(#arrow)"/></g><g><g><rect class="domain" x="265" y="95" width="180" height="94" rx="12"/><text class="name" x="281" y="124">기준정보·금융상품</text><text class="detail" x="281" y="149">entity · actor</text><text class="detail" x="281" y="165">instrument · concept</text></g><g><rect class="domain" x="480" y="95" width="180" height="94" rx="12"/><text class="name" x="496" y="124">문서·공시 사실</text><text class="detail" x="496" y="149">document · assertion</text><text class="detail" x="496" y="165">disclosure_fact</text></g><g><rect class="domain" x="695" y="95" width="180" height="94" rx="12"/><text class="name" x="711" y="124">테넌트 전송</text><text class="detail" x="711" y="149">tenant · release</text><text class="detail" x="711" y="165">delivery cursor</text></g><g><rect class="domain" x="265" y="245" width="180" height="94" rx="12"/><text class="name" x="281" y="274">시장 데이터·수집</text><text class="detail" x="281" y="299">minute ingestion</text><text class="detail" x="281" y="315">price · flow</text></g><g><rect class="domain" x="480" y="245" width="180" height="94" rx="12"/><text class="name" x="496" y="274">이벤트·근거</text><text class="detail" x="496" y="299">source_event · evidence</text><text class="detail" x="496" y="315">thread</text></g><g><rect class="domain" x="695" y="245" width="180" height="94" rx="12"/><text class="name" x="711" y="274">설명 생성·계보</text><text class="detail" x="711" y="299">route · run · result</text><text class="detail" x="711" y="315">lineage</text></g><g><rect class="domain" x="265" y="395" width="180" height="94" rx="12"/><text class="name" x="281" y="424">원천 관측</text><text class="detail" x="281" y="449">macro_observation</text><text class="detail" x="281" y="465">financial_metric · sector</text></g><g><rect class="domain" x="695" y="395" width="180" height="94" rx="12"/><text class="name" x="711" y="424">v2 분석 결과·툴 감사</text><text class="detail" x="711" y="449">outlook · movement</text><text class="detail" x="711" y="465">tool_runs</text></g><g><rect class="domain" x="480" y="545" width="180" height="94" rx="12"/><text class="name" x="496" y="574">운영 원장</text><text class="detail" x="496" y="599">task · reconciliation</text><text class="detail" x="496" y="615">admin audit</text></g></g><g><rect class="band" x="905" y="95" width="200" height="219" rx="12"/><text class="band-label" x="921" y="118">증권사 Cloud 환경 (BYOC)</text><text class="edge-label" x="921" y="138">Flyway onprem 세트 · 14테이블</text><g><rect class="domain" x="915" y="175" width="180" height="94" rx="12"/><text class="name" x="931" y="204">증권사 테넌트 DB</text><text class="detail" x="931" y="229">analysis_item · review</text><text class="detail" x="931" y="245">publication</text></g><path class="boundary" d="M 875 142 L 890 142 L 890 222 L 915 222" marker-end="url(#arrow)"/><text class="edge-label" x="921" y="291">단방향 Pull · 커서 + 번들</text></g></svg>