formatVersion: 2
name: FinancialReportSnapshot
label: Financial report snapshot
description: One collected snapshot of a company's DART financial report for a fiscal
  year, report coverage, and statement basis. Separate collection runs retain separate
  snapshots of the same filing.
group: Disclosures & financials
primaryKey: id
identity:
  columns:
  - corp_code
  - fiscal_year
  - reprt_code
  - fs_basis
  - raw_run_id
  encoding: jsonStringArray
properties:
  id:
    label: ID
    description: Identifier of one collected report snapshot, preserving company code,
      fiscal year, report type, statement basis, and collection run.
    sourceDataType: text
    nullable: false
    sourceConstraints:
      nullable: false
      primaryKey:
      - corp_code
      - fiscal_year
      - reprt_code
      - fs_basis
      - raw_run_id
      foreignKeys: []
    mappingStatus: ready
    apiName: id
    displayName: ID
    status: experimental
    dataType: String
  corpCode:
    label: DART company code
    description: Eight-digit DART company identifier used to find the matching Company.dartCorpCode.
      Leading zeros are part of the code.
    sourceDataType: text
    nullable: false
    sourceConstraints:
      nullable: false
      primaryKey:
      - corp_code
      - fiscal_year
      - reprt_code
      - fs_basis
      - raw_run_id
      foreignKeys: []
    mappingStatus: ready
    apiName: corpCode
    displayName: DART company code
    status: experimental
    dataType: String
  instrumentCode:
    label: Instrument code
    description: Local security code preserved from the source. Use its market context
      when matching it to a listed security.
    sourceDataType: text
    nullable: false
    sourceConstraints:
      nullable: false
      primaryKey: []
      foreignKeys: []
    mappingStatus: ready
    apiName: instrumentCode
    displayName: Instrument code
    status: experimental
    dataType: String
  fiscalYear:
    label: Fiscal year
    description: Fiscal year of the financial report or metric.
    sourceDataType: smallint
    nullable: false
    sourceConstraints:
      nullable: false
      primaryKey:
      - corp_code
      - fiscal_year
      - reprt_code
      - fs_basis
      - raw_run_id
      foreignKeys: []
    mappingStatus: ready
    apiName: fiscalYear
    displayName: Fiscal year
    status: experimental
    dataType: Short
  reportTypeCode:
    label: DART report type code
    description: 'DART report code: 11013 for a first-quarter report, 11012 for a
      half-year report, 11014 for a nine-month report, and 11011 for an annual report.'
    sourceDataType: text
    nullable: false
    sourceConstraints:
      nullable: false
      primaryKey:
      - corp_code
      - fiscal_year
      - reprt_code
      - fs_basis
      - raw_run_id
      foreignKeys: []
    mappingStatus: ready
    apiName: reportTypeCode
    displayName: DART report type code
    status: experimental
    dataType: String
  reportCoverage:
    label: Report coverage
    description: 'Period covered by the report: Q1 for the first quarter, H1 for the
      first half-year, 9M for the first nine months, or FY for the full fiscal year.'
    sourceDataType: text
    nullable: false
    sourceConstraints:
      nullable: false
      primaryKey: []
      foreignKeys: []
    mappingStatus: normalized
    apiName: reportCoverage
    displayName: Report coverage
    status: experimental
    dataType: String
  fsBasis:
    label: Financial statement basis
    description: 'Financial-statement basis: CFS for consolidated statements, or OFS
      for the company''s separate statements.'
    sourceDataType: text
    nullable: false
    sourceConstraints:
      nullable: false
      primaryKey:
      - corp_code
      - fiscal_year
      - reprt_code
      - fs_basis
      - raw_run_id
      foreignKeys: []
    mappingStatus: ready
    apiName: fsBasis
    displayName: Financial statement basis
    status: experimental
    dataType: String
  receiptNumber:
    label: DART receipt number
    description: DART receipt number identifying the filing represented by this collected
      snapshot.
    sourceDataType: text
    nullable: true
    sourceConstraints:
      nullable: true
      primaryKey: []
      foreignKeys: []
    mappingStatus: ready
    apiName: receiptNumber
    displayName: DART receipt number
    status: experimental
    dataType: String
  receiptDate:
    label: DART receipt date
    description: Date DART received the filing represented by this snapshot.
    sourceDataType: date
    nullable: true
    sourceConstraints:
      nullable: true
      primaryKey: []
      foreignKeys: []
    mappingStatus: ready
    apiName: receiptDate
    displayName: DART receipt date
    status: experimental
    dataType: Date
  availableAt:
    label: Available for analysis at
    description: Analytical availability time computed from receipt time or the source
      filing date according to the stored availability basis. It differs from the
      financial period end.
    sourceDataType: timestamp with time zone
    nullable: false
    sourceConstraints:
      nullable: false
      primaryKey: []
      foreignKeys: []
    mappingStatus: ready
    apiName: availableAt
    displayName: Available for analysis at
    status: experimental
    dataType: Timestamp
  receivedAt:
    label: Received at
    description: Time this collected version was received by the system. Use it to
      distinguish actual system possession from reconstructed analytical availability.
    sourceDataType: timestamp with time zone
    nullable: false
    sourceConstraints:
      nullable: false
      primaryKey: []
      foreignKeys: []
    mappingStatus: ready
    apiName: receivedAt
    displayName: Received at
    status: experimental
    dataType: Timestamp
  availabilityBasis:
    label: Availability basis
    description: Stored rule used to assign availableAt, such as receipt time or a
      filing-date convention. A reconstructed date is not an observed historical publication
      timestamp.
    sourceDataType: text
    nullable: false
    sourceConstraints:
      nullable: false
      primaryKey: []
      foreignKeys: []
    mappingStatus: ready
    apiName: availabilityBasis
    displayName: Availability basis
    status: experimental
    dataType: String
  companyName:
    label: Company name
    description: Current stored name of the company referenced by company_id; NULL
      if no name is resolved.
    sourceDataType: text
    nullable: true
    sourceConstraints: null
    mappingStatus: ready
    apiName: companyName
    displayName: Company name
    status: experimental
    dataType: String
  displayTitle:
    label: Display title
    description: Readable title assembled from stored names and the record context.
      IDs remain authoritative; labels may change and are not unique.
    sourceDataType: text
    nullable: false
    sourceConstraints: null
    mappingStatus: ready
    apiName: displayTitle
    displayName: Display title
    status: experimental
    dataType: String
