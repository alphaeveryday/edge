sourceConstraints:
  capturedAt: '2026-10-01 12:09:09.225923+00:00'
  primaryKey:
  - corp_code
  - fiscal_year
  - reprt_code
  - fs_basis
  - raw_run_id
  tableConstraints:
  - name: ck_financial_report_version_availability
    kind: c
    definition: CHECK ((((availability_basis = 'received'::text) AND (available_at
      = received_at)) OR ((availability_basis = 'provider_release_date'::text) AND
      (rcept_date IS NOT NULL) AND (available_at = LEAST(received_at, (((rcept_date
      + 1))::timestamp without time zone AT TIME ZONE 'Asia/Seoul'::text))))))
    validated: true
  - name: ck_financial_report_version_basis
    kind: c
    definition: CHECK ((fs_basis = ANY (ARRAY['CFS'::text, 'OFS'::text])))
    validated: true
  - name: ck_financial_report_version_codes
    kind: c
    definition: CHECK (((corp_code ~ '^[0-9]{8}$'::text) AND (instrument_code ~ '^[0-9A-Z]{6}$'::text)
      AND ((rcept_no IS NULL) OR (rcept_no ~ '^[0-9]{14}$'::text))))
    validated: true
  - name: ck_financial_report_version_json
    kind: c
    definition: CHECK (((jsonb_typeof(metrics) = 'array'::text) AND (jsonb_typeof(rejected)
      = 'array'::text) AND (jsonb_typeof(detail) = 'object'::text)))
    validated: true
  - name: ck_financial_report_version_report
    kind: c
    definition: CHECK ((((((reprt_code = '11013'::text) AND (report_period = 'Q1'::text))
      OR ((reprt_code = '11012'::text) AND (report_period = 'Q2'::text))) OR ((reprt_code
      = '11014'::text) AND (report_period = 'Q3'::text))) OR ((reprt_code = '11011'::text)
      AND (report_period = 'Q4'::text))))
    validated: true
  - name: ck_financial_report_version_sha
    kind: c
    definition: CHECK (((raw_sha256 ~ '^[0-9a-f]{64}$'::text) AND (artifact_sha256
      ~ '^[0-9a-f]{64}$'::text)))
    validated: true
  - name: ck_financial_report_version_status
    kind: c
    definition: CHECK ((status = ANY (ARRAY['CONFIRMED'::text, 'UNCONFIRMED'::text])))
    validated: true
  - name: financial_report_version_pkey
    kind: p
    definition: PRIMARY KEY (corp_code, fiscal_year, reprt_code, fs_basis, raw_run_id)
    validated: true
apiName: FinancialReportSnapshot
displayName: Financial report snapshot
pluralDisplayName: Financial report snapshots
titleProperty: displayTitle
status: experimental
visibility: normal
linkTypes:
- FinancialReportSnapshot_ForCompany_Company
