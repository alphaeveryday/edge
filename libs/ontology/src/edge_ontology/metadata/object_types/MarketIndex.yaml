    apiName: regions
    displayName: Geographic scope
    status: experimental
    dataType: String[]
sourceMapping:
  connection: aws_work
  schema: public
  baseTable: market_series
  joins: []
  filters:
  - column: series_type
    value: INDEX
  properties:
    id:
      alias: base
      table: market_series
      column: market_series_id
    seriesName:
      alias: base
      table: market_series
      column: series_name
    sourceCode:
      alias: base
      table: market_series
      column: source_code
    sourceSeriesId:
      alias: base
      table: market_series
      column: source_series_id
    marketCode:
      alias: base
      table: market_series
      column: market_code
    currencyCode:
      alias: base
      table: market_series
      column: currency_code
    regions:
      kind: unmapped
