formatVersion: 2
name: MarketIndex
label: Market index
description: A named market index that can serve as an ETF benchmark. One record defines
  the index and its provider identifiers; it does not contain the index's daily values.
group: Macro & indices
primaryKey: id
identity:
  columns:
  - market_series_id
  encoding: sourceString
properties:
  id:
    label: ID
    description: Internal identifier of the index definition, shared with the underlying
      market-series record.
    sourceDataType: text
    nullable: false
    sourceConstraints:
      nullable: false
      primaryKey:
      - market_series_id
      foreignKeys: []
    mappingStatus: ready
    apiName: id
    displayName: ID
    status: experimental
    dataType: String
  seriesName:
    label: Series name
    description: Human-readable name of the market index.
    sourceDataType: text
    nullable: false
    sourceConstraints:
      nullable: false
      primaryKey: []
      foreignKeys: []
    mappingStatus: ready
    apiName: seriesName
    displayName: Series name
    status: experimental
    dataType: String
  sourceCode:
    label: Source code
    description: Code identifying the source provider in the source registry.
    sourceDataType: character varying
    nullable: false
    sourceConstraints:
      nullable: false
      primaryKey: []
      foreignKeys: []
    mappingStatus: ready
    apiName: sourceCode
    displayName: Source code
    status: experimental
    dataType: String
  sourceSeriesId:
    label: Source series id
    description: Identifier used by the source provider for this index series.
    sourceDataType: text
    nullable: false
    sourceConstraints:
      nullable: false
      primaryKey: []
      foreignKeys: []
    mappingStatus: ready
    apiName: sourceSeriesId
    displayName: Source series id
    status: experimental
    dataType: String
  marketCode:
    label: Market code
    description: Market identifier recorded by the provider for this index series.
    sourceDataType: character varying
    nullable: true
    sourceConstraints:
      nullable: true
      primaryKey: []
      foreignKeys: []
    mappingStatus: ready
    apiName: marketCode
    displayName: Market code
    status: experimental
    dataType: String
  currencyCode:
    label: Currency code
    description: Three-letter currency code associated with the security or market
      index.
    sourceDataType: character varying
    nullable: true
    sourceConstraints:
      nullable: true
      primaryKey: []
      foreignKeys: []
    mappingStatus: ready
    apiName: currencyCode
    displayName: Currency code
    status: experimental
    dataType: String
  regions:
    label: Geographic scope
    description: Geographic markets represented by the index, expressed as country
      or regional codes.
    nullable: true
    mappingStatus: unmapped
