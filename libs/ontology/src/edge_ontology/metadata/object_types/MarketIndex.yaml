        Prepare a mapping using both sourceCode and sourceSeriesId.
sourceConstraints:
  capturedAt: '2026-10-01 12:09:09.225923+00:00'
  primaryKey:
  - market_series_id
  tableConstraints:
  - name: ck_market_series_currency_code
    kind: c
    definition: CHECK (((currency_code IS NULL) OR ((currency_code)::text ~ '^[A-Z]{3}$'::text)))
    validated: true
  - name: ck_market_series_status
    kind: c
    definition: CHECK (((status)::text = ANY ((ARRAY['ACTIVE'::character varying,
      'INACTIVE'::character varying])::text[])))
    validated: true
  - name: ck_market_series_type
    kind: c
    definition: CHECK (((series_type)::text = ANY ((ARRAY['INDEX'::character varying,
      'ETF_PROXY'::character varying, 'FX'::character varying, 'RATE'::character varying])::text[])))
    validated: true
  - name: market_series_pkey
    kind: p
    definition: PRIMARY KEY (market_series_id)
    validated: true
  - name: uq_market_series_source
    kind: u
    definition: UNIQUE (source_code, source_series_id)
    validated: true
apiName: MarketIndex
