sourceConstraints:
  capturedAt: '2026-10-01 12:09:09.225923+00:00'
  primaryKey: *id001
  tableConstraints:
  - name: ck_source_event_completeness
    kind: c
    definition: CHECK (((completeness IS NULL) OR ((completeness)::text = ANY ((ARRAY['complete'::character
      varying, 'partial'::character varying])::text[]))))
    validated: true
  - name: ck_source_event_confidence_level
    kind: c
    definition: CHECK (((confidence_level IS NULL) OR ((confidence_level)::text =
      ANY ((ARRAY['HIGH'::character varying, 'MEDIUM'::character varying, 'LOW'::character
      varying])::text[]))))
    validated: true
  - name: ck_source_event_source_class
    kind: c
    definition: CHECK (((source_class)::text = ANY ((ARRAY['NEWS'::character varying,
      'DISCLOSURE'::character varying])::text[])))
    validated: true
  - name: ck_source_event_status
    kind: c
    definition: CHECK (((event_status)::text = ANY ((ARRAY['ACTIVE'::character varying,
      'REJECTED'::character varying])::text[])))
    validated: true
  - name: source_event_pkey
    kind: p
    definition: PRIMARY KEY (source_event_id)
    validated: true
  - name: uq_source_event_id_class
    kind: u
    definition: UNIQUE (source_event_id, source_class)
    validated: true
dataIssues:
- Company participation and thread membership remain unverified against the source
