formatVersion: 2
name: SourceEvent
label: Source event
description: A structured account of an event reported by a particular news article
  or disclosure. Different sources or later updates can produce separate records about
  the same underlying event.
group: News & events
primaryKey: id
identity:
  columns: &id001
  - source_event_id
  encoding: sourceString
properties:
  id:
    label: ID
    description: Internal identifier of one source-specific account of an event. Records
      describing the same underlying event can have different IDs.
    sourceDataType: text
    nullable: false
    sourceConstraints:
      nullable: false
      primaryKey: *id001
      foreignKeys: []
    mappingStatus: ready
    apiName: id
    displayName: ID
    status: experimental
    dataType: String
  eventType:
    label: Event type
    description: Event category code used to identify what kind of event is described,
      such as a contract-related event.
    sourceDataType: character varying
    nullable: false
    sourceConstraints:
      nullable: false
      primaryKey: []
      foreignKeys: []
    mappingStatus: ready
    apiName: eventType
    displayName: Event type
    status: experimental
    dataType: String
  predicate:
    label: Predicate
    description: Action or relationship code extracted for the event, identifying
      what the source says happened.
    sourceDataType: character varying
    nullable: true
    sourceConstraints:
      nullable: true
      primaryKey: []
      foreignKeys: []
    mappingStatus: ready
    apiName: predicate
    displayName: Predicate
    status: experimental
    dataType: String
  sourceClass:
    label: Source class
    description: 'Kind of originating document: NEWS for a news article or DISCLOSURE
      for a company filing.'
    sourceDataType: character varying
    nullable: false
    sourceConstraints:
      nullable: false
      primaryKey: []
      foreignKeys: []
    mappingStatus: ready
    apiName: sourceClass
    displayName: Source class
    status: experimental
    dataType: String
  eventDate:
    label: Event date
    description: Date assigned to the event described by the source. It can differ
      from the document's publication or collection date.
    sourceDataType: date
    nullable: true
    sourceConstraints:
      nullable: true
      primaryKey: []
      foreignKeys: []
    mappingStatus: ready
    apiName: eventDate
    displayName: Event date
    status: experimental
    dataType: Date
  availableAt:
    label: Available for analysis at
    description: Time this record is considered available for analysis. Use it to
      exclude information that was not yet available at the requested analysis time.
    sourceDataType: timestamp with time zone
    nullable: false
    sourceConstraints:
      nullable: false
      primaryKey: []
      foreignKeys: []
    mappingStatus: ready
    apiName: availableAt
    displayName: Available for analysis at
    status: experimental
    dataType: Timestamp
  lifecycleStage:
    label: Lifecycle stage
    description: Stage described by this particular source record, such as a contract
      announcement, amendment, or cancellation. It need not be the latest stage in
      the event thread.
    sourceDataType: character varying
    nullable: true
    sourceConstraints:
      nullable: true
      primaryKey: []
      foreignKeys: []
    mappingStatus: ready
    apiName: lifecycleStage
    displayName: Lifecycle stage
    status: experimental
    dataType: String
  argumentSummary:
    label: Argument summary
    description: Stored entity names or original mentions with their event role codes.
      This is display context, not a new participation link or inferred event interpretation.
    sourceDataType: text
    nullable: true
    sourceConstraints: null
    mappingStatus: ready
    apiName: argumentSummary
    displayName: Argument summary
    status: experimental
    dataType: String
  displayTitle:
    label: Display title
    description: Readable title assembled from stored names and the record context.
      IDs remain authoritative; labels may change and are not unique.
    sourceDataType: text
    nullable: false
    sourceConstraints: null
    mappingStatus: ready
    apiName: displayTitle
    displayName: Display title
    status: experimental
    dataType: String
