// 모든 셀을 '가장 긴 라벨' 기준의 동일 너비로 통일 — 열 단위로 우측 열들을 밀어 간격을 보존한다.
(function uniform(){
  let need=0;
  DATA.nodes.forEach(n=>{const el=document.getElementById(n.i);el.style.width='auto';
    need=Math.max(need, Math.ceil(el.getBoundingClientRect().width)+2)});
  const xs=[...new Set(DATA.nodes.map(n=>n.x))].sort((a,b)=>a-b);
  const clusters=[];
  xs.forEach(x=>{const c=clusters[clusters.length-1];
    if(c && x-c.x<=2) c.members.push(x); else clusters.push({x, members:[x]})});
  let acc=0;
  clusters.forEach(c=>{
    const mem=DATA.nodes.filter(n=>c.members.includes(n.x));
    c.shift=acc;
    acc+=Math.max(0, need-Math.max(...mem.map(n=>n.w)));
  });
  function shiftFor(x){let s=0;for(const c of clusters){if(c.x<=x+1)s=c.shift;else break}return s}
  // 이동 전 중심 기록 — 노드 중심에 정렬돼 있던 waypoint 는 새 중심으로 스냅해야 수직선이 곧게 유지된다.
  const origCx={};
  DATA.nodes.forEach(n=>{origCx[n.i]=n.x+n.w/2});
  const newCx={};
  DATA.nodes.forEach(n=>{
    n.x+=shiftFor(n.x); n.w=need; newCx[n.i]=n.x+n.w/2;
    const el=document.getElementById(n.i);
    el.style.left=n.x+'px'; el.style.width=need+'px';
  });
  DATA.edges.forEach(e=>e.p.forEach(pt=>{
    if(Math.abs(pt[0]-origCx[e.a])<=2) pt[0]=newCx[e.a];
    else if(Math.abs(pt[0]-origCx[e.b])<=2) pt[0]=newCx[e.b];
    else pt[0]+=shiftFor(pt[0]);
  }));
  DATA.w+=acc;
  canvas.style.width=DATA.w+'px'; sizer.style.width=DATA.w+'px'; svg.setAttribute('width',DATA.w);
})();
function anchor(N, towardX, towardY){
  // 대상 방향에 가장 가까운 변의 중앙점
  const cx=N.x+N.w/2, cy=N.y+N.h/2;
  const dx=towardX-cx, dy=towardY-cy;
  if(Math.abs(dx)*N.h > Math.abs(dy)*N.w)
    return dx>0 ? [N.x+N.w, cy] : [N.x, cy];
  return dy>0 ? [cx, N.y+N.h] : [cx, N.y];
}
function ortho(points){
  // 연속 점이 대각이면 elbow 점 삽입(수평 우선)
  const out=[points[0]];
  for(let i=1;i<points.length;i++){
    const [px,py]=out[out.length-1], [x,y]=points[i];
    if(px!==x && py!==y) out.push([x,py]);
    out.push([x,y]);
  }
  return out;
}
function pathD(e){
  const A=byId[e.a], B=byId[e.b];
  let pts;
  if(e.p.length){
    const first=e.p[0], last=e.p[e.p.length-1];
    const s=anchor(A, first[0], first[1]), t=anchor(B, last[0], last[1]);
    pts=ortho([s, ...e.p, t]);
  } else {
    // 기본: 부모 우변 → 자식 좌변, 중간 거터
    const s=[A.x+A.w, A.y+A.h/2], t=[B.x, B.y+B.h/2];
    if(B.x >= A.x+A.w-1){
      const mx=(s[0]+t[0])/2;
      pts=[s,[mx,s[1]],[mx,t[1]],[t[0]-2,t[1]]];
    } else if(B.y >= A.y+A.h-1){
      const s2=[A.x+A.w/2, A.y+A.h], t2=[B.x+B.w/2, B.y], my=(s2[1]+t2[1])/2;
      pts=[s2,[s2[0],my],[t2[0],my],[t2[0],t2[1]-2]];
    } else {
      const s3=[A.x, A.y+A.h/2], t3=[B.x+B.w, B.y+B.h/2], mx=(s3[0]+t3[0])/2;
      pts=[s3,[mx,s3[1]],[mx,t3[1]],[t3[0]+2,t3[1]]];
    }
  }
  return 'M'+pts.map(p=>p[0]+','+p[1]).join(' L');
}

// 호버 미리보기(peek) — 클릭 포커스보다 옅은 강조. 선택이 잡혀 있는 동안엔 끼어들지 않는다.
function setPeek(id){
  if(id && SEL) return;
  document.body.classList.toggle('peek', !!id);
  const near={}; if(id) near[id]=true;
  EDGES.forEach(p=>{
    const hit=!!id&&(p.dataset.a===id||p.dataset.b===id);
    p.classList.toggle('pk-on',hit);
    if(!p.classList.contains('on')) p.setAttribute('marker-end',hit?'url(#ar-b)':'url(#ar)');
    if(hit){near[p.dataset.a]=true;near[p.dataset.b]=true}
  });
  NODES.forEach(n=>{n.classList.toggle('pk-on',!!near[n.id]);n.classList.toggle('pk-sel',!!id&&n.id===id)});
}
function setFocus(id){
  SEL=id;
  setPeek(null);
  if(!id){document.body.classList.remove('focus');
    EDGES.forEach(p=>{p.classList.remove('on');p.setAttribute('marker-end','url(#ar)')});
    NODES.forEach(n=>{n.classList.remove('on','sel');n.setAttribute('aria-pressed','false')}); return}
  document.body.classList.add('focus');
  const near={}; near[id]=true;
  EDGES.forEach(p=>{
    const hit=p.dataset.a===id||p.dataset.b===id;
    p.classList.toggle('on',hit);
    p.setAttribute('marker-end',hit?'url(#ar-b)':'url(#ar)');
    if(hit){near[p.dataset.a]=true;near[p.dataset.b]=true;svg.appendChild(p)}
  });
  NODES.forEach(n=>{n.classList.toggle('on',!!near[n.id]);n.classList.toggle('sel',n.id===id);
    n.setAttribute('aria-pressed', String(n.id===id))});
}
NODES.forEach(n=>{
  n.addEventListener('mouseenter',()=>setPeek(n.id));
  n.addEventListener('mouseleave',()=>setPeek(null));
  n.addEventListener('click',ev=>{ev.stopPropagation();setFocus(SEL===n.id?null:n.id)});
  n.addEventListener('keydown',ev=>{
    if(ev.key==='Enter'||ev.key===' '){ev.preventDefault();setFocus(SEL===n.id?null:n.id)}
    else if(ev.key==='Escape')setFocus(null)});
});

let scale=1;
function apply(){canvas.style.transform=`scale(${scale})`;

document.getElementById('zin').onclick=e=>{e.stopPropagation();scale=Math.min(scale*1.25,3);apply()};
document.getElementById('zout').onclick=e=>{e.stopPropagation();scale=Math.max(scale/1.25,.05);apply()};
document.getElementById('zfit').onclick=e=>{e.stopPropagation();fit()};
// Ctrl(⌘)+휠 = 커서 기준 줌 (트랙패드 핀치 포함). 일반 휠은 스크롤 유지 —
// 임베드된 문서 페이지의 휠 스크롤을 가로채지 않기 위한 관례.
vp.addEventListener('wheel',ev=>{
  if(!(ev.ctrlKey||ev.metaKey)) return;
  ev.preventDefault();
  const rect=vp.getBoundingClientRect();
  const px=ev.clientX-rect.left, py=ev.clientY-rect.top;
  const wx=(vp.scrollLeft+px)/scale, wy=(vp.scrollTop+py)/scale;
  const unit=ev.deltaMode===1?16:ev.deltaMode===2?vp.clientHeight:1; // line/page 모드 정규화(Firefox 등)
  scale=Math.min(3, Math.max(.05, scale*Math.exp(-ev.deltaY*unit*.0015)));
  apply();
  vp.scrollLeft=wx*scale-px;
  vp.scrollTop=wy*scale-py;
},{passive:false});
// 드래그 팬 — 빈 영역을 잡고 끌면 화면 이동. 드래그 직후의 click 은 무시(선택 해제 오발동 방지).
(function(){
  let panning=false, moved=false, sx=0, sy=0, sl=0, st=0;
  vp.style.cursor='grab';
  vp.addEventListener('mousedown',ev=>{
    if(ev.button!==0) return;
    if(ev.target.closest && ev.target.closest('#hud')) return; // 상자 위에서도 팬 시작 가능(끌면 팬, 안 끌면 클릭)
    panning=true; moved=false; sx=ev.clientX; sy=ev.clientY; sl=vp.scrollLeft; st=vp.scrollTop;
    vp.style.cursor='grabbing'; ev.preventDefault();
  });
  window.addEventListener('mousemove',ev=>{
    if(!panning) return;
    const dx=ev.clientX-sx, dy=ev.clientY-sy;
    if(Math.abs(dx)+Math.abs(dy)>4) moved=true;
    vp.scrollLeft=sl-dx; vp.scrollTop=st-dy;
  });
  window.addEventListener('mouseup',()=>{
    if(panning){panning=false; vp.style.cursor='grab';}
  });
  document.body.addEventListener('click',ev=>{
    if(moved){moved=false; ev.stopImmediatePropagation();}
  },{capture:true});
})();
window.addEventListener('resize',fit); fit();
</script></body></html>
