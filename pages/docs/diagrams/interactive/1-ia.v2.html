:root{--bg:#ffffff;--node-bg:#ffffff;--node-bd:#c3cbdd;--fg:#1c2333;--wire:#9aa3b5;
  --brand:#00309f;--dimN:.16;--dimW:.07}
*{box-sizing:border-box;margin:0}
html,body{height:100%}
body{background:var(--bg);font-family:Pretendard,-apple-system,'Apple SD Gothic Neo','Malgun Gothic',sans-serif;overflow:hidden}
#viewport{width:100%;height:100%;overflow:auto}
#sizer{position:relative;overflow:hidden}
#canvas{position:relative;transform-origin:0 0}
.node{position:absolute;display:flex;align-items:center;justify-content:center;text-align:center;

  transition:opacity .25s,border-color .25s,background .25s,box-shadow .25s}
.node:focus-visible{outline:2px solid var(--brand);outline-offset:2px}
svg.wires{position:absolute;inset:0;pointer-events:none}
svg.wires path{fill:none;stroke:var(--wire);stroke-width:1.2;transition:opacity .25s,stroke .25s}
body.focus .node{opacity:var(--dimN)}
body.focus .node.on{opacity:1;border-color:var(--brand)}
body.focus .node.sel{opacity:1;background:var(--brand);border-color:var(--brand);color:#fff;font-weight:600;
  box-shadow:0 2px 12px rgba(0,48,159,.35)}
body.focus svg.wires path{opacity:var(--dimW)}
body.focus svg.wires path.on{opacity:1;stroke:var(--brand);stroke-width:2}
#hud{position:fixed;right:14px;bottom:14px;display:flex;gap:6px;z-index:5}
#hud button{width:34px;height:34px;border:1px solid var(--node-bd);border-radius:8px;background:var(--node-bg);
  color:var(--fg);font-size:16px;cursor:pointer}
@media (prefers-reduced-motion: reduce){.node,svg.wires path{transition:none}}

// 모든 셀을 '가장 긴 라벨' 기준의 동일 너비로 통일 — 열 단위로 우측 열들을 밀어 간격을 보존한다.
(function uniform(){
  let need=0;
  DATA.nodes.forEach(n=>{const el=document.getElementById(n.i);el.style.width='auto';
    need=Math.max(need, Math.ceil(el.getBoundingClientRect().width)+2)});
  const xs=[...new Set(DATA.nodes.map(n=>n.x))].sort((a,b)=>a-b);
  const clusters=[];
  xs.forEach(x=>{const c=clusters[clusters.length-1];
    if(c && x-c.x<=2) c.members.push(x); else clusters.push({x, members:[x]})});
  let acc=0;
  clusters.forEach(c=>{
    const mem=DATA.nodes.filter(n=>c.members.includes(n.x));
    c.shift=acc;
    acc+=Math.max(0, need-Math.max(...mem.map(n=>n.w)));
  });
  function shiftFor(x){let s=0;for(const c of clusters){if(c.x<=x+1)s=c.shift;else break}return s}
  // 이동 전 중심 기록 — 노드 중심에 정렬돼 있던 waypoint 는 새 중심으로 스냅해야 수직선이 곧게 유지된다.
  const origCx={};
  DATA.nodes.forEach(n=>{origCx[n.i]=n.x+n.w/2});
  const newCx={};
  DATA.nodes.forEach(n=>{
    n.x+=shiftFor(n.x); n.w=need; newCx[n.i]=n.x+n.w/2;
    const el=document.getElementById(n.i);
    el.style.left=n.x+'px'; el.style.width=need+'px';
  });
  DATA.edges.forEach(e=>e.p.forEach(pt=>{
    if(Math.abs(pt[0]-origCx[e.a])<=2) pt[0]=newCx[e.a];
    else if(Math.abs(pt[0]-origCx[e.b])<=2) pt[0]=newCx[e.b];
    else pt[0]+=shiftFor(pt[0]);
  }));
  DATA.w+=acc;
  canvas.style.width=DATA.w+'px'; sizer.style.width=DATA.w+'px'; svg.setAttribute('width',DATA.w);
})();
function anchor(N, towardX, towardY){
  // 대상 방향에 가장 가까운 변의 중앙점
  const cx=N.x+N.w/2, cy=N.y+N.h/2;
  const dx=towardX-cx, dy=towardY-cy;
  if(Math.abs(dx)*N.h > Math.abs(dy)*N.w)
    return dx>0 ? [N.x+N.w, cy] : [N.x, cy];
  return dy>0 ? [cx, N.y+N.h] : [cx, N.y];
}
function ortho(points){
  // 연속 점이 대각이면 elbow 점 삽입(수평 우선)
  const out=[points[0]];
  for(let i=1;i<points.length;i++){
    const [px,py]=out[out.length-1], [x,y]=points[i];
    if(px!==x && py!==y) out.push([x,py]);
    out.push([x,y]);
  }
  return out;
}
function pathD(e){
  const A=byId[e.a], B=byId[e.b];
  let pts;
  if(e.p.length){
    const first=e.p[0], last=e.p[e.p.length-1];
    const s=anchor(A, first[0], first[1]), t=anchor(B, last[0], last[1]);
    pts=ortho([s, ...e.p, t]);
  } else {
    // 기본: 부모 우변 → 자식 좌변, 중간 거터
    const s=[A.x+A.w, A.y+A.h/2], t=[B.x, B.y+B.h/2];
    if(B.x >= A.x+A.w-1){
      const mx=(s[0]+t[0])/2;
      pts=[s,[mx,s[1]],[mx,t[1]],[t[0]-2,t[1]]];
    } else if(B.y >= A.y+A.h-1){
      const s2=[A.x+A.w/2, A.y+A.h], t2=[B.x+B.w/2, B.y], my=(s2[1]+t2[1])/2;
      pts=[s2,[s2[0],my],[t2[0],my],[t2[0],t2[1]-2]];
    } else {
      const s3=[A.x, A.y+A.h/2], t3=[B.x+B.w, B.y+B.h/2], mx=(s3[0]+t3[0])/2;
      pts=[s3,[mx,s3[1]],[mx,t3[1]],[t3[0]+2,t3[1]]];
    }
  }
  return 'M'+pts.map(p=>p[0]+','+p[1]).join(' L');
}

function setFocus(id){
  SEL=id;
  if(!id){document.body.classList.remove('focus');
    EDGES.forEach(p=>{p.classList.remove('on');p.setAttribute('marker-end','url(#ar)')});
    NODES.forEach(n=>{n.classList.remove('on','sel');n.setAttribute('aria-pressed','false')}); return}
  document.body.classList.add('focus');
  const near={}; near[id]=true;
  EDGES.forEach(p=>{
    const hit=p.dataset.a===id||p.dataset.b===id;
    p.classList.toggle('on',hit);
    p.setAttribute('marker-end',hit?'url(#ar-b)':'url(#ar)');
    if(hit){near[p.dataset.a]=true;near[p.dataset.b]=true;svg.appendChild(p)}
  });
  NODES.forEach(n=>{n.classList.toggle('on',!!near[n.id]);n.classList.toggle('sel',n.id===id);
    n.setAttribute('aria-pressed', String(n.id===id))});
}
