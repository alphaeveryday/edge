<title>EDGE 시스템 아키텍처 v2</title>
<style>
/* 화이트 고정 — 포털 다이어그램 공통(사용자 결정). 노드 색은 drawio 원본 팔레트 유지 */
:root{--bg:#ffffff;--fg:#1c2333;--wire:#8f98ab;--brand:#00309f}
*{box-sizing:border-box;margin:0}
html,body{height:100%}
body{background:var(--bg);font-family:Pretendard,-apple-system,'Apple SD Gothic Neo','Malgun Gothic',sans-serif;overflow:hidden}
#viewport{width:100%;height:100%;overflow:auto}
#sizer{position:relative;overflow:hidden}
#canvas{position:relative;transform-origin:0 0}
.box{position:absolute;border:1px solid;border-radius:6px;color:var(--fg);
  font-size:12px;line-height:1.3;padding:2px 6px;display:flex;align-items:center;justify-content:center;
  text-align:center;white-space:pre-line;font-weight:700;
  transition:opacity .25s,border-color .25s,box-shadow .25s}
.box.frame{align-items:flex-start;justify-content:flex-start;text-align:left;padding:8px 12px;border-radius:10px}
.box.swim{align-items:flex-start;justify-content:center;padding:0;overflow:hidden}
.box.swim .swim-title{width:100%;padding:5px 6px;font-weight:700;text-align:center}
.box.plain{border:none;background:transparent!important;font-weight:600;overflow:visible}
.icon-cap{position:absolute;top:100%;left:50%;transform:translateX(-50%);white-space:pre;text-align:center;
  font-size:12px;font-weight:600;padding-top:4px;color:var(--fg)}
.box:not(.node){pointer-events:none}
.node{cursor:pointer;user-select:none}
.node:focus-visible{outline:2px solid var(--brand);outline-offset:2px}
svg.wires{position:absolute;inset:0;pointer-events:none}
svg.wires path{fill:none;stroke:var(--wire);stroke-width:1.3;transition:opacity .25s,stroke .25s}
.elabel{position:absolute;transform:translate(-50%,-50%);font-size:10.5px;color:#47506a;
  background:rgba(255,255,255,.9);padding:0 4px;border-radius:3px;pointer-events:none;white-space:nowrap;
  transition:opacity .25s}
body.focus .box,body.focus .elabel{opacity:.14}
body.focus .box.on{opacity:1;box-shadow:0 0 0 1.5px var(--brand)}
body.focus .box.on-c{opacity:1!important}
body.focus .box.sel{opacity:1;box-shadow:0 0 0 2.5px var(--brand),0 2px 14px rgba(0,48,159,.35)}
body.focus svg.wires path{opacity:.06}
body.focus svg.wires path.on{opacity:1;stroke:var(--brand)!important;stroke-width:2.2}
body.focus .elabel.on{opacity:1}
body.peek .box,body.peek .elabel{opacity:.45}
body.peek .box.pk-on{opacity:1;box-shadow:0 0 0 1.5px var(--brand)}
body.peek .box.pk-c{opacity:1!important}
body.peek .box.pk-sel{opacity:1;box-shadow:0 0 0 2px var(--brand),0 1px 8px rgba(0,48,159,.25)}
body.peek svg.wires path{opacity:.2}
body.peek svg.wires path.pk-on{opacity:1;stroke:var(--brand)!important;stroke-width:1.9}
body.peek .elabel.pk-on{opacity:1}
#hud{position:fixed;right:14px;bottom:14px;display:flex;gap:6px;z-index:5}
#hud button{width:34px;height:34px;border:1px solid #c3cbdd;border-radius:8px;background:#fff;
  color:var(--fg);font-size:16px;cursor:pointer}
@media (prefers-reduced-motion: reduce){.box,svg.wires path,.elabel{transition:none}}
</style></head><body>

function innerMinX(fr, skip){
  let minX=Infinity;
  DATA.nodes.forEach(k=>{
    if(k===fr||k===skip) return;
    if(k.x>=fr.x&&k.y>=fr.y&&k.x+k.w<=fr.x+fr.w&&k.y+k.h<=fr.y+fr.h) minX=Math.min(minX,k.x);

}

function clamp(v,lo,hi){return Math.min(Math.max(v,lo),hi)}
function anchor(N,tx,ty){
  // 기준점이 상자 밖 어느 방향인지로 변을 정하고, 앵커를 기준점 축에 정렬해
  // 마지막 구간이 항상 그 변에 수직으로 곧게 꽂히게 한다(화살촉 꼬임 방지).
  const PAD=8;
  if(ty<=N.y)      return [clamp(tx,N.x+PAD,N.x+N.w-PAD), N.y];
  if(ty>=N.y+N.h)  return [clamp(tx,N.x+PAD,N.x+N.w-PAD), N.y+N.h];
  if(tx<=N.x)      return [N.x, clamp(ty,N.y+PAD,N.y+N.h-PAD)];
  if(tx>=N.x+N.w)  return [N.x+N.w, clamp(ty,N.y+PAD,N.y+N.h-PAD)];
  // 기준점이 상자 내부(드묾): 가까운 변으로
  const dl=tx-N.x, dr=N.x+N.w-tx, dt=ty-N.y, db=N.y+N.h-ty;
  const m=Math.min(dl,dr,dt,db);
  if(m===dt) return [clamp(tx,N.x+PAD,N.x+N.w-PAD), N.y];
  if(m===db) return [clamp(tx,N.x+PAD,N.x+N.w-PAD), N.y+N.h];
  if(m===dl) return [N.x, clamp(ty,N.y+PAD,N.y+N.h-PAD)];
  return [N.x+N.w, clamp(ty,N.y+PAD,N.y+N.h-PAD)];
}
function ortho(points){
  const out=[points[0]];
  for(let i=1;i<points.length;i++){
    const [px,py]=out[out.length-1],[x,y]=points[i];
    if(px===x&&py===y) continue;          // 중복점 제거(마커 방향 오염 방지)
    if(px!==x&&py!==y) out.push([x,py]);
    out.push([x,y]);
  }
  return out;
}
const EPATH={};
DATA.edges.forEach(e=>{
  const A=byId[e.a],B=byId[e.b]; if(!A||!B) return;
  let pts;
  if(e.p.length){
    const s=anchor(A,e.p[0][0],e.p[0][1]), t=anchor(B,e.p[e.p.length-1][0],e.p[e.p.length-1][1]);
    pts=ortho([s,...e.p,t]);
  } else {
    const s=[A.x+A.w,A.y+A.h/2], t=[B.x,B.y+B.h/2];
    if(B.x>=A.x+A.w-1){const mx=(s[0]+t[0])/2; pts=[s,[mx,s[1]],[mx,t[1]],[t[0]-2,t[1]]];}
    else if(B.y+B.h<=A.y+1){const s4=[A.x+A.w/2,A.y],t4=[B.x+B.w/2,B.y+B.h],my=(s4[1]+t4[1])/2;
      pts=s4[0]===t4[0]?[s4,[t4[0],t4[1]+2]]:[s4,[s4[0],my],[t4[0],my],[t4[0],t4[1]+2]];}
    else if(B.y>=A.y+A.h-1){const s2=[A.x+A.w/2,A.y+A.h],t2=[B.x+B.w/2,B.y],my=(s2[1]+t2[1])/2;
      pts=[s2,[s2[0],my],[t2[0],my],[t2[0],t2[1]-2]];}
    else {const s3=[A.x,A.y+A.h/2],t3=[B.x+B.w,B.y+B.h/2],mx=(s3[0]+t3[0])/2;
      pts=[s3,[mx,s3[1]],[mx,t3[1]],[t3[0]+2,t3[1]]];}
  }
  EPATH[e.i]=pts;
  const p=document.createElementNS(NS,'path');
  p.setAttribute('d','M'+pts.map(q=>q[0]+','+q[1]).join(' L'));
  p.dataset.a=e.a; p.dataset.b=e.b; p.dataset.i=e.i;
  if(e.dash) p.setAttribute('stroke-dasharray','5 4');
  if(e.c){ p.style.stroke=e.c;
    const mid='arc-'+e.c.replace('#','');
    if(!document.getElementById(mid)){
      const mk=document.createElementNS(NS,'marker');
      mk.id=mid; mk.setAttribute('markerWidth','9'); mk.setAttribute('markerHeight','9');
      mk.setAttribute('refX','7'); mk.setAttribute('refY','3.6');
      mk.setAttribute('orient','auto'); mk.setAttribute('markerUnits','userSpaceOnUse');
      mk.innerHTML=`<path d="M1,1 L7,3.6 L1,6.2" fill="none" stroke="${e.c}" stroke-width="1.2"/>`;
      defs.appendChild(mk);
    }
    p.dataset.mk='url(#'+mid+')';
  }
  p.setAttribute('marker-end',p.dataset.mk||'url(#ar)'); svg.appendChild(p);
});
// 간선 라벨 — 경로를 따라 rx(-1~1) 비율 지점 + offset
DATA.elabels.forEach(L=>{
  const pts=EPATH[L.edge]; if(!pts||!L.t) return;
  let len=0; const seg=[];
  for(let i=1;i<pts.length;i++){const d=Math.hypot(pts[i][0]-pts[i-1][0],pts[i][1]-pts[i-1][1]);seg.push(d);len+=d;}
  let target=len*((L.rx+1)/2), x=pts[0][0], y=pts[0][1];
  for(let i=1;i<pts.length;i++){
    if(target<=seg[i-1]||i===pts.length-1){
      const r=seg[i-1]?target/seg[i-1]:0;
      x=pts[i-1][0]+(pts[i][0]-pts[i-1][0])*r; y=pts[i-1][1]+(pts[i][1]-pts[i-1][1])*r; break;
    }
    target-=seg[i-1];
  }
  const el=document.createElement('div'); el.className='elabel'; el.dataset.edge=L.edge;
  el.style.left=(x+L.ox)+'px'; el.style.top=(y+L.oy)+'px'; el.textContent=L.t;
  canvas.appendChild(el);
});
const EDGES=[...svg.querySelectorAll('path[data-a]')],
      NODES=[...canvas.querySelectorAll('.node')],
      BOXES=[...canvas.querySelectorAll('.box')],
      ELB=[...canvas.querySelectorAll('.elabel')];
// 장식 요소 → 그것을 담는 가장 작은 인터랙티브 상자(소유자). 강조 시 내부가 함께 살아남는다.
const OWNER={};

  const inter=DATA.nodes.filter(n=>CONN.has(n.i));
  DATA.nodes.forEach(n=>{
    if(CONN.has(n.i)) return;
    if(n.own){OWNER[n.i]=n.own; return}
    let best=null;
    inter.forEach(m=>{
      if(m.x<=n.x&&m.y<=n.y&&n.x+n.w<=m.x+m.w&&n.y+n.h<=m.y+m.h){
        if(!best||m.w*m.h<best.w*best.h) best=m;
      }
    });
    if(best) OWNER[n.i]=best.i;
  });
}
let SEL=null;
function mark(idOrNull, cls, selCls){
  const on={}, eon={};
  if(idOrNull){
    on[idOrNull]=true;
    EDGES.forEach(p=>{
      const hit=p.dataset.a===idOrNull||p.dataset.b===idOrNull;
      p.classList.toggle(cls,hit);
      if(cls==='on') p.setAttribute('marker-end',hit?'url(#ar-b)':(p.dataset.mk||'url(#ar)'));
      if(hit){on[p.dataset.a]=true;on[p.dataset.b]=true;eon[p.dataset.i]=true;svg.appendChild(p);}
    });
  } else {
    EDGES.forEach(p=>{p.classList.remove(cls); if(cls==='on') p.setAttribute('marker-end',p.dataset.mk||'url(#ar)');});
  }
  const childCls=cls==='on'?'on-c':'pk-c';
  BOXES.forEach(b=>{
    b.classList.toggle(cls,!!on[b.id]);
    b.classList.toggle(childCls,!!(idOrNull&&OWNER[b.id]&&on[OWNER[b.id]]));
    b.classList.toggle(selCls,b.id===idOrNull);
    if(b.classList.contains('node')&&selCls==='sel') b.setAttribute('aria-pressed',String(b.id===idOrNull));
  });
  ELB.forEach(l=>l.classList.toggle(cls,!!eon[l.dataset.edge]));
}
function setFocus(id){
  SEL=id; setPeek(null);
  document.body.classList.toggle('focus',!!id);
  mark(id,'on','sel');
}
function setPeek(id){
  if(id&&SEL) return;
  document.body.classList.toggle('peek',!!id);
  mark(id,'pk-on','pk-sel');
}
NODES.forEach(n=>{
  n.addEventListener('mouseenter',()=>setPeek(n.id));
  n.addEventListener('mouseleave',()=>setPeek(null));
  n.addEventListener('click',ev=>{ev.stopPropagation();setFocus(SEL===n.id?null:n.id)});
  n.addEventListener('keydown',ev=>{
    if(ev.key==='Enter'||ev.key===' '){ev.preventDefault();setFocus(SEL===n.id?null:n.id)}
    else if(ev.key==='Escape')setFocus(null)});
});
document.body.addEventListener('click',()=>setFocus(null));
let scale=1;
function apply(){canvas.style.transform=`scale(${scale})`;
  sizer.style.width=DATA.w*scale+'px';sizer.style.height=DATA.h*scale+'px'}
function fit(){scale=Math.min((vp.clientWidth-8)/DATA.w,(vp.clientHeight-8)/DATA.h,1);apply()}
document.getElementById('zin').onclick=e=>{e.stopPropagation();scale=Math.min(scale*1.25,3);apply()};
document.getElementById('zout').onclick=e=>{e.stopPropagation();scale=Math.max(scale/1.25,.05);apply()};
document.getElementById('zfit').onclick=e=>{e.stopPropagation();fit()};
vp.addEventListener('wheel',ev=>{
  if(!(ev.ctrlKey||ev.metaKey)) return;
  ev.preventDefault();
  const rect=vp.getBoundingClientRect();
  const px=ev.clientX-rect.left, py=ev.clientY-rect.top;
  const wx=(vp.scrollLeft+px)/scale, wy=(vp.scrollTop+py)/scale;
  const unit=ev.deltaMode===1?16:ev.deltaMode===2?vp.clientHeight:1;
  scale=Math.min(3, Math.max(.05, scale*Math.exp(-ev.deltaY*unit*.0015)));
  apply();
  vp.scrollLeft=wx*scale-px; vp.scrollTop=wy*scale-py;
},{passive:false});
// 드래그 팬 — 빈 영역을 잡고 끌면 화면 이동. 드래그 직후의 click 은 무시(선택 해제 오발동 방지).
(function(){
  let panning=false, moved=false, sx=0, sy=0, sl=0, st=0;
  vp.style.cursor='grab';
  vp.addEventListener('mousedown',ev=>{
    if(ev.button!==0) return;
    if(ev.target.closest && ev.target.closest('#hud')) return; // 상자 위에서도 팬 시작 가능(끌면 팬, 안 끌면 클릭)
    panning=true; moved=false; sx=ev.clientX; sy=ev.clientY; sl=vp.scrollLeft; st=vp.scrollTop;
    vp.style.cursor='grabbing'; ev.preventDefault();
  });
  window.addEventListener('mousemove',ev=>{
    if(!panning) return;
    const dx=ev.clientX-sx, dy=ev.clientY-sy;
    if(Math.abs(dx)+Math.abs(dy)>4) moved=true;
    vp.scrollLeft=sl-dx; vp.scrollTop=st-dy;
  });
  window.addEventListener('mouseup',()=>{
    if(panning){panning=false; vp.style.cursor='grab';}
  });
  document.body.addEventListener('click',ev=>{
    if(moved){moved=false; ev.stopImmediatePropagation();}
  },{capture:true});
})();
window.addEventListener('resize',fit); fit();
