# 발전 과정(Evolution) 생성 설정 — pages/scripts/generate_evolution.py 가 읽는다.

# 발전 기록의 기준이 되는 경로. 이 경로들을 바꾼 커밋이 항목이 된다.
include_paths:
  - docs/architecture.md
  - docs/schema.md
  - docs/adr/
  - pages/docs/assets/images/

# 발전 기록에서 뺄 커밋(SHA prefix 목록). 예: ["a1b2c3d"]
exclude: []

# 커밋별 표기 덮어쓰기. SHA prefix 를 키로 title/description/image 를 지정한다.
# 예:
#   9604c09:
#     title: "수집 설정 로더"
#     description: "스키마 로더 도입 배경 요약"
#     image: "assets/images/collector-v1.png"
overrides: {}
