site_name: Edge Architecture Portal
site_description: Edge 시스템 아키텍처 문서 포털 — 설계 문서·산출물·발전 과정

docs_dir: docs
site_dir: site

theme:
  name: material
  custom_dir: overrides
  language: ko
  # 헤더 배경이 항상 브랜드 블루(#00309F, extra.css)라 흰색 로고 단일 사용.
  # (edge-logo-black.svg = 어두운 배경용 흰 로고 — 명명은 배경 기준)
  # 파일은 커밋되지 않는다 — 캐노니컬(src/libs/ui-kit/src/assets)에서 sync 가 복사.
  logo: assets/images/edge-logo-black.svg
  favicon: assets/images/edge-favicon.svg
  features:
    - navigation.tabs
    - navigation.sections
    - search.suggest
    - search.highlight
    - content.code.copy
  palette:
    # custom = Material 기본 색 CSS 를 끄고 extra.css 의 브랜드 변수(#00309F)를 쓴다
    - scheme: default
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-night
        name: 다크 모드로 전환
    - scheme: slate
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-sunny
        name: 라이트 모드로 전환

plugins:
  - search

# sync 가 복사 시 포털 밖(루트 README 등) 링크를 GitHub 소스 URL 로 재작성하므로
# not_found 는 기본(warn)으로 두어 --strict 가 진짜 깨진 링크를 잡게 한다.
# 남는 건 디렉터리형 링크(](adr/))뿐이라 unrecognized 만 완화한다.
validation:
  links:
    unrecognized_links: ignore

# 회고 표준 템플릿은 산출물이 아니라 작성 참고용이므로 빌드/포털에서 제외한다.
exclude_docs: |
  retrospective/_template.md

nav:
  - Home: index.md
  - Diagrams:
      - Overview: diagrams/index.md
      - 1 정보 구조: diagrams/1-information-architecture.md
      - 2 애플리케이션 아키텍처: diagrams/2-application-architecture.md
      - 3 시스템 아키텍처: diagrams/3-system-architecture.md
      - 4 클라우드 아키텍처: diagrams/4-cloud-architecture.md
  - 설계 · ADR: reference/adr/README.md
  - 계약:
      - Sync Protocol: reference/contracts/sync-protocol.md
      - Event Bundle Schema: reference/contracts/event-bundle-schema.md
      - Sync Auth: reference/contracts/sync-auth.md
      - Publication API: reference/contracts/publication-api.md
      - Console Facts API: reference/contracts/console-facts-api.md
  - Evolution: evolution.md
  - Retrospective:
      - Overview: retrospective/index.md
      - Sprint 1: retrospective/sprint-1.md
      - Sprint 2: retrospective/sprint-2.md
      - Sprint 3: retrospective/sprint-3.md
      - Sprint 4: retrospective/sprint-4.md
      - Sprint 5: retrospective/sprint-5.md
      - Sprint 6: retrospective/sprint-6.md
      - Sprint 7: retrospective/sprint-7.md
  - Reference:
      - Context: reference/context.md
      - Scope: reference/scope.md
      - Implementation: reference/implementation.md
      - Roadmap: reference/roadmap.md
      - Writing Rules: reference/writing-rules.md
      - Architecture:
          - Information Architecture: reference/architecture/information-architecture.md
          - Application Architecture: reference/architecture/application-architecture.md
          - System Architecture: reference/architecture/system-architecture.md
          - Cloud Architecture: reference/architecture/cloud-architecture.md
      - Domain:
          - State Machine: reference/domain/state-machine.md
          - Data Residency: reference/domain/data-residency.md
          - Exposure Log: reference/domain/exposure-log.md
          - Data Source Licensing: reference/domain/data-source-licensing.md
      - Console IA:
          - Super Admin Console: reference/console-ia/super-admin-console.md
          - Tenant Console: reference/console-ia/tenant-console.md
          - Permission Matrix: reference/console-ia/permission-matrix.md

# reference/adr/ 아래 개별 ADR 은 빌드 시 복사되는 산출물이며 nav 에 나열하지 않는다
# (README.md 만 nav 에 둔다). ADR 파일명 규칙이나 하위 폴더 유무와 무관하게
# --strict 빌드가 "nav 에 없는 문서" 경고로 실패하지 않도록, README 를 뺀 전부를 대상으로 한다.
not_in_nav: |
  /reference/adr/**
  !/reference/adr/README.md

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - toc:
      permalink: true
  - pymdownx.superfences
  - pymdownx.details

extra_css:
  - assets/stylesheets/extra.css
