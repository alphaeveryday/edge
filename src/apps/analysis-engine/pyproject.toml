[project]
name = "analysis-engine"
version = "0.1.0"
description = "KODEX 반도체 ETF 일일 뉴스 정규화 + 설명 파이프라인 (S3 → Cloud Event Store)"
requires-python = ">=3.12"
dependencies = [
    "boto3>=1.34",          # S3 canonical lake 읽기 + 결과 s3 fallback
    "pyarrow>=17",          # canonical news parquet 읽기
    "pandas>=2.2",          # 경량 데이터 정리
    "psycopg2-binary>=2.9", # edge Postgres(Cloud Event Store) 적재
    "PyYAML>=6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/edge_analysis"]

[dependency-groups]
dev = ["pytest>=8"]

[tool.pytest.ini_options]
pythonpath = ["src"]
