[project]
name = "analysis-engine-v2"
version = "0.1.0"
description = "Agent-driven ETF analysis with inspectable tool evidence"
requires-python = ">=3.12"
dependencies = ["psycopg[binary]>=3.1"]

[project.optional-dependencies]
cloud = ["boto3>=1.34"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/edge_analysis_v2"]

[dependency-groups]
dev = ["pytest>=8"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
