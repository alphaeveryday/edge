<!doctype html>
<html lang="ko"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>ORCA · DB 저장 기록</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.22/dist/katex.min.css" crossorigin="anonymous">
<script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.22/dist/katex.min.js" crossorigin="anonymous"></script>
<style>
:root{color-scheme:light;font:15px/1.65 system-ui,sans-serif;color:#202e40;background:#f4f6f8}*{box-sizing:border-box}body{margin:0}header{padding:28px 36px;background:#fff;border-bottom:1px solid #dce2e8;display:flex;justify-content:space-between;align-items:center;gap:20px}h1{font-size:27px;margin:2px 0}h2{font-size:19px;overflow-wrap:anywhere}h3{font-size:13px;color:#526378;margin:24px 0 8px}.eyebrow{font:11px monospace;letter-spacing:.15em;color:#657a8e}.muted{color:#63758a;font-size:12px;overflow-wrap:anywhere}button{font:inherit;background:white;border:1px solid #ccd6e1;border-radius:8px;padding:10px 15px;cursor:pointer}button:hover{border-color:#317b82}button:focus-visible{outline:3px solid #45a5aa}#message{margin:16px 36px;color:#526378}.error{color:#ac3232!important}.layout{display:grid;grid-template-columns:290px minmax(0,1fr);gap:24px;margin:0 36px 50px;max-width:1500px}aside{min-width:0}#list{display:grid;gap:8px}#list button{text-align:left;display:block;width:100%;overflow-wrap:anywhere}#list button.active{background:#e4f3f1;border-color:#317b82}#list strong,#list small{display:block}main{min-width:0;background:white;border:1px solid #dce2e8;border-radius:12px;padding:26px}article{border-top:2px solid #e5eaef;margin-top:32px;padding-top:12px}pre{white-space:pre-wrap;overflow-wrap:anywhere;word-break:break-word;background:#f6f8fb;border:1px solid #e4e9ef;border-radius:8px;padding:16px;font:13px/1.8 Consolas,monospace;margin:0}.saved{color:#226d63;background:#e9f5f0;padding:10px 14px;border-radius:7px}.status{display:inline-block;background:#eef2f7;padding:3px 10px;border-radius:5px}.formula{padding:16px;background:#f6f8fb;overflow-wrap:anywhere}.key{color:#744ca0}.string{color:#187057}.number{color:#225bbe}.literal{color:#935812}a{color:#226b86}@media(max-width:750px){header{padding:20px;align-items:flex-start}.layout{grid-template-columns:1fr;margin:0 16px 32px}#message{margin:16px}main{padding:18px}}
</style>
<style>
.execution{margin:20px 36px;padding:20px 24px;background:#fff;border:1px solid #dce2e8;border-radius:12px}.controls,.views{display:flex;flex-wrap:wrap;gap:10px;align-items:center}select{font:inherit;padding:10px;border:1px solid #ccd6e1;border-radius:8px;background:white}.primary{background:#226d63;color:white;border-color:#226d63}button:disabled{opacity:.5;cursor:wait}.views{margin-bottom:18px;border-bottom:1px solid #e4e9ef;padding-bottom:14px}.views .active{background:#e4f3f1;border-color:#317b82}.job{margin-bottom:8px;width:100%;text-align:left}#execution-note{margin-bottom:0}.screen-label{background:#e9f5f0;padding:10px 14px;border-radius:7px}@media(max-width:750px){.execution{margin:16px;padding:18px}}
</style>
<header><div><div class="eyebrow">ORCA / DATABASE EVIDENCE</div><h1>분석 실행과 DB 저장 기록</h1><span class="muted">개발 DB · 최근 분석 종류별 50개</span></div><button id="refresh">새로고침</button></header>
<section class="execution" id="execution" hidden><h2>목 시나리오로 실제 에이전트 실행</h2><p class="muted">시장·기사 자료는 가상입니다. 모델 호출과 클라우드 DB 저장은 실제이며 API 비용이 발생합니다.</p><div class="controls"><select id="kind" aria-label="분석 종류"><option value="movement">오늘 움직임</option><option value="outlook">전망</option></select><select id="scenario" aria-label="시나리오"></select><button class="primary" id="start">분석 실행</button></div><p id="execution-note" class="muted"></p></section>
<p id="message" role="status">DB에 연결하고 있어요.</p>
<div class="layout"><aside><h2 id="job-title" hidden>실행 진행</h2><div id="jobs"></div><h2>분석 선택</h2><div id="list"></div></aside><main><nav class="views" id="views"></nav><div id="detail"><p>분석을 선택하면 실제 저장된 인수와 결과를 확인할 수 있어요.</p></div></main></div>
<script>
const list=document.getElementById('list'), detail=document.getElementById('detail'), message=document.getElementById('message');
let selected=null,version=0,refreshing=false,mode='evidence',config=null;
function status(text,error=false){message.textContent=text;message.className=error?'error':''}
async function fetchResponse(path){const r=await fetch(path);if(!r.ok){const body=await r.json();throw Error(body.error||'조회 실패')}return r}
function highlight(pre){const text=pre.textContent;pre.replaceChildren();const pattern=/"(?:\\.|[^"\\])*"\s*(?=:)|"(?:\\.|[^"\\])*"|\b(?:true|false|null)\b|-?\d+(?:\.\d+)?(?:[eE][+-]?\d+)?/g;let end=0;for(const m of text.matchAll(pattern)){pre.append(document.createTextNode(text.slice(end,m.index)));const span=document.createElement('span');span.textContent=m[0];span.className=m[0][0]==='"'?(text.slice(m.index+m[0].length).trimStart().startsWith(':')?'key':'string'):/^(true|false|null)$/.test(m[0])?'literal':'number';pre.append(span);end=m.index+m[0].length}pre.append(document.createTextNode(text.slice(end)))}
function tabs(){const nav=document.getElementById('views');nav.replaceChildren();const entries=[['evidence','DB 툴 근거'],['execution','입력·프롬프트·모델'],['summary','요약 화면'],['detail','상세 화면']];if(selected?.kind==='outlook')entries.push(['factors','5요인'],['conclusion','최종 결론'],['factor_details','요인 상세']);for(const [key,label] of entries){const b=document.createElement('button');b.textContent=label;b.classList.toggle('active',key===mode);b.onclick=()=>{mode=key;openAnalysis(selected)};nav.append(b)}}
async function openAnalysis(row){if(!row)return;selected=row;tabs();const current=++version;history.replaceState(null,'','#'+row.kind+'/'+encodeURIComponent(row.analysis_id));detail.textContent='기록을 읽고 있어요.';for(const b of list.children)b.classList.toggle('active',b.dataset.key===row.kind+'/'+row.analysis_id);try{const base='/api/screens/'+row.kind+'/'+encodeURIComponent(row.analysis_id)+'/';const path=mode==='evidence'?'/view/analyses/'+row.kind+'/'+encodeURIComponent(row.analysis_id):mode==='execution'?'/view/jobs/'+encodeURIComponent(row.analysis_id):base+mode;const r=await fetchResponse(path),body=await r.text();if(current!==version)return;if(mode==='evidence'||mode==='execution'){detail.innerHTML=body}else{detail.replaceChildren();const label=document.createElement('p');label.className='screen-label';label.textContent='DB에서 조립한 기능별 최종 화면 JSON';const pre=document.createElement('pre');pre.textContent=body;detail.append(label,pre)}detail.querySelectorAll('pre').forEach(highlight);let rendered=true;detail.querySelectorAll('[data-latex]').forEach(e=>{if(window.katex){katex.render(e.dataset.latex,e,{throwOnError:false,trust:false,displayMode:true})}else rendered=false});status(rendered?'조회 완료 · '+row.analysis_id:'수식 렌더러를 불러오지 못해 LaTeX 원문으로 표시합니다.')}catch(e){if(current!==version)return;detail.textContent=mode==='execution'?'이 서버의 실행 폴더에 기록이 없습니다. DB 근거는 별도로 확인할 수 있어요.':'아직 완료된 화면이 없거나 저장 기록을 가져오지 못했습니다.';status(e.message,true)}}
async function refresh(){if(refreshing)return;refreshing=true;document.getElementById('refresh').disabled=true;try{const rows=await(await fetchResponse('/api/analyses')).json();list.replaceChildren();for(const row of rows){const b=document.createElement('button');b.dataset.key=row.kind+'/'+row.analysis_id;const title=document.createElement('strong');title.textContent=(row.kind==='movement'?'오늘 움직임':'전망')+' · '+row.etf_code;const info=document.createElement('small');info.textContent=row.analysis_at+' · '+row.status;const id=document.createElement('small');id.className='muted';id.textContent=row.analysis_id;b.append(title,info,id);b.onclick=()=>openAnalysis(row);list.append(b)}status(rows.length?'분석을 선택해 저장 기록을 확인하세요.':'저장된 분석이 없습니다.');if(selected)await openAnalysis(selected);else if(rows.length)await openAnalysis(rows[0])}catch(e){++version;list.replaceChildren();detail.textContent='DB 연결을 확인한 뒤 새로고침하세요.';status(e.message,true)}finally{refreshing=false;document.getElementById('refresh').disabled=false}}
async function refreshJobs(){if(!config?.enabled)return;try{const rows=await(await fetchResponse('/api/jobs')).json();const container=document.getElementById('jobs');container.replaceChildren();document.getElementById('job-title').hidden=!rows.length;document.getElementById('start').disabled=rows.some(r=>r.status==='running');for(const row of rows){const b=document.createElement('button');b.className='job';b.textContent=(row.kind==='movement'?'움직임':'전망')+' · '+row.scenario+' · '+row.status;b.onclick=()=>{mode='execution';openAnalysis(row)};container.append(b)}}catch(e){status(e.message,true)}}
function cutoff(){const scenario=config?.scenarios.find(s=>s.id===document.getElementById('scenario').value);document.getElementById('execution-note').textContent=scenario?'분석 기준시각: '+scenario[document.getElementById('kind').value+'_at']+' · 한 번에 하나의 분석을 실행합니다.':''}
async function initialize(){try{config=await(await fetchResponse('/api/execution')).json();document.getElementById('execution').hidden=!config.enabled;for(const item of config.scenarios){const option=document.createElement('option');option.value=item.id;option.textContent=item.label;document.getElementById('scenario').append(option)}cutoff();const link=location.hash.slice(1).split('/');if(link.length===2&&['movement','outlook'].includes(link[0]))selected={kind:link[0],analysis_id:decodeURIComponent(link[1])}}catch(e){status(e.message,true)}await refresh();await refreshJobs()}
document.getElementById('kind').onchange=cutoff;document.getElementById('scenario').onchange=cutoff;
document.getElementById('start').onclick=async()=>{const button=document.getElementById('start');button.disabled=true;try{const response=await fetch('/api/jobs',{method:'POST',headers:{'Content-Type':'application/json','X-CSRF-Token':config.csrf_token},body:JSON.stringify({kind:document.getElementById('kind').value,scenario:document.getElementById('scenario').value})});const job=await response.json();if(!response.ok)throw Error(job.error);mode='execution';await openAnalysis(job);await refreshJobs()}catch(e){status(e.message,true);button.disabled=false}};
document.getElementById('refresh').onclick=async()=>{await refresh();await refreshJobs()};window.addEventListener('load',initialize);setInterval(()=>{if(!document.hidden){refresh();refreshJobs()}},10000);
</script></html>
