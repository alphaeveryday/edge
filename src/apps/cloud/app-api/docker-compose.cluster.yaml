# Redis Cluster 실험용 (마스터 3 + replica 3). Sentinel 구성(docker-compose.yaml)과 독립 — 함께 겹쳐 쓰지 않는다.
services:
  app:
    # 이미지 이름 고정 — 프로젝트를 바꿔 가며 돌릴 때 --no-build 로 재사용한다.
    image: etf-app-api:experiment
    build:
      context: ../../..
      dockerfile: apps/cloud/app-api/Dockerfile
    ports:
      - "8080:8080"
    environment:
      VOTE_ADMIN_TOKEN: ${VOTE_ADMIN_TOKEN:-local-experiment}
      VOTE_REDIS_COMMAND_TIMEOUT: ${VOTE_REDIS_COMMAND_TIMEOUT:-500ms}
      VOTE_REDIS_DISCONNECTED_BEHAVIOR: ${VOTE_REDIS_DISCONNECTED_BEHAVIOR:-REJECT_COMMANDS}
      VOTE_REDIS_TIMEOUT_OPTIONS: ${VOTE_REDIS_TIMEOUT_OPTIONS:-true}
      VOTE_REDIS_READ_FROM: ${VOTE_REDIS_READ_FROM:-MASTER}
      VOTE_CIRCUIT_FAILURE_RATE: ${VOTE_CIRCUIT_FAILURE_RATE:-50}
      VOTE_CIRCUIT_SCOPE: ${VOTE_CIRCUIT_SCOPE:-global}
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/app
      SPRING_DATA_REDIS_CLUSTER_NODES: redis-1:6379,redis-2:6379,redis-3:6379,redis-4:6379,redis-5:6379,redis-6:6379
      SPRING_DATA_REDIS_LETTUCE_CLUSTER_REFRESH_ADAPTIVE: ${REDIS_TOPOLOGY_REFRESH:-false}
      SPRING_DATA_REDIS_LETTUCE_CLUSTER_REFRESH_PERIOD: ${REDIS_TOPOLOGY_REFRESH_PERIOD:-}
    depends_on:
      mysql:
        condition: service_healthy
      cluster-init:
        condition: service_completed_successfully

  mysql:
    image: mysql:8.4
    environment:
      MYSQL_ROOT_PASSWORD: local-root
      MYSQL_DATABASE: app
      MYSQL_USER: app
      MYSQL_PASSWORD: app
    ports:
      - "55440:3306"
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -uapp -papp"]
      interval: 2s
      timeout: 2s
      retries: 15

  redis-1: &redis
    image: redis:7-alpine
    command:
      - redis-server
      - --cluster-enabled
      - "yes"
      - --cluster-node-timeout
      - "${REDIS_CLUSTER_NODE_TIMEOUT:-5000}"
      - --cluster-require-full-coverage
      - "${REDIS_CLUSTER_REQUIRE_FULL_COVERAGE:-yes}"
      - --appendonly
      - "no"
  redis-2: *redis
  redis-3: *redis
  redis-4: *redis
  redis-5: *redis
  redis-6: *redis

  cluster-init:
    image: redis:7-alpine
    # --cluster create 는 IP:port 만 받는다. 슬롯 배정 순서 = 나열 순서(redis-1~3 마스터, 4~6 replica).
    entrypoint:
      - sh
      - -c
      - |
        NODES=""
        for n in 1 2 3 4 5 6; do
          until redis-cli -h redis-$$n ping >/dev/null 2>&1; do sleep 0.5; done
          NODES="$$NODES $$(getent hosts redis-$$n | awk '{print $$1}'):6379"
        done
        if redis-cli -h redis-1 cluster info | grep -q cluster_state:ok; then exit 0; fi
        redis-cli --cluster create $$NODES --cluster-replicas 1 --cluster-yes
        until redis-cli -h redis-1 cluster info | grep -q cluster_state:ok; do sleep 0.5; done
    depends_on:
      - redis-1
      - redis-2
      - redis-3
      - redis-4
      - redis-5
      - redis-6
