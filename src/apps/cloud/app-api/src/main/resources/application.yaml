spring:
  application:
    name: app
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:55440/app}
    username: ${SPRING_DATASOURCE_USERNAME:app}
    password: ${SPRING_DATASOURCE_PASSWORD:app}
  jackson:
    default-property-inclusion: non_null   # 계약: 선택 필드는 키 생략. nextCursor 만 ALWAYS(PageResponse)
    datatype:
      enum:
        fail-on-numbers-for-enums: true   # {"choice":0} 이 BUY 로 접수되지 않게
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  flyway:
    locations: classpath:db/etf-migration
    table: flyway_etf_schema_history
  data:
    redis:
      host: ${SPRING_DATA_REDIS_HOST:localhost}
      port: ${SPRING_DATA_REDIS_PORT:6390}
      timeout: ${VOTE_REDIS_COMMAND_TIMEOUT:500ms}
      connect-timeout: ${VOTE_REDIS_COMMAND_TIMEOUT:500ms}
      ssl:
        enabled: ${SPRING_DATA_REDIS_SSL_ENABLED:false}   # ElastiCache 는 전송 암호화 필수(ADR-0056), 로컬 compose 는 평문
app:
  jwt:
    secret: ${APP_JWT_SECRET}   # 필수, 기본값 없음. HS256 이라 32바이트 이상
    access-ttl: ${APP_JWT_ACCESS_TTL:PT1H}
  social:   # 소셜 idToken 의 audience(앱 client id). 비어 있으면 그 provider 로그인은 전부 거절
    apple-client-id: ${APP_APPLE_CLIENT_ID:}
    google-client-id: ${APP_GOOGLE_CLIENT_ID:}
vote:
  redis:
    disconnected-behavior: ${VOTE_REDIS_DISCONNECTED_BEHAVIOR:REJECT_COMMANDS}
    timeout-options: ${VOTE_REDIS_TIMEOUT_OPTIONS:true}
    read-from: ${VOTE_REDIS_READ_FROM:MASTER}
  admin-token: ${VOTE_ADMIN_TOKEN:}
  circuit:
    scope: ${VOTE_CIRCUIT_SCOPE:global}
  reconcile:
    interval: ${VOTE_RECONCILE_INTERVAL:PT5M}
resilience4j:
  circuitbreaker:
    instances:
      redis:
        sliding-window-size: 20
        minimum-number-of-calls: 10
        wait-duration-in-open-state: 3s
        failure-rate-threshold: ${VOTE_CIRCUIT_FAILURE_RATE:50}
server:
  tomcat:
    mbeanregistry:
      enabled: true
management:
  endpoints:
    web:
      exposure:
        include: health,metrics
  endpoint:
    health:
      # ALB 가 보는 readiness 는 Kubernetes 밖에선 명시적으로 켜야 노출된다.
      probes:
        enabled: true
      group:
        # DB 를 포함해 RDS 비밀번호 로테이션 뒤 태스크가 교체되게 한다. Redis 는 제외
        # (기본 /actuator/health 는 Redis 만 내려가도 503 이라 전 태스크가 교체된다).
        readiness:
          include: readinessState,db
