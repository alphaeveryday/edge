<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>전망 컨센서스 테스트 콘솔</title>
<style>
  :root { --bg:#f6f7f9; --card:#fff; --line:#e3e6ea; --text:#1f2430; --sub:#6b7280;
          --agree:#2563eb; --disagree:#dc2626; --accent:#111827; }
  * { box-sizing:border-box; }
  body { margin:0; font-family:-apple-system,'Apple SD Gothic Neo','Noto Sans KR',sans-serif;
         background:var(--bg); color:var(--text); }
  .wrap { max-width:760px; margin:0 auto; padding:24px 16px 80px; }
  h1 { font-size:20px; margin:0 0 4px; }
  .sub { color:var(--sub); font-size:13px; margin-bottom:20px; }
  section { background:var(--card); border:1px solid var(--line); border-radius:12px;
            padding:16px; margin-bottom:16px; }
  section h2 { font-size:15px; margin:0 0 12px; }
  label { font-size:12px; color:var(--sub); display:block; margin:8px 0 2px; }
  input, select, textarea { width:100%; padding:8px 10px; border:1px solid var(--line);
    border-radius:8px; font-size:14px; font-family:inherit; background:#fff; }
  textarea { resize:vertical; min-height:56px; }
  .row { display:flex; gap:10px; }
  .row > div { flex:1; }
  button { border:0; border-radius:8px; padding:8px 14px; font-size:13px; cursor:pointer;
           font-family:inherit; }
  button:disabled { opacity:.45; cursor:default; }
  .primary { background:var(--accent); color:#fff; margin-top:12px; }
  .card { border:1px solid var(--line); border-radius:10px; padding:14px; margin-bottom:10px; }
  .card .head { display:flex; justify-content:space-between; align-items:center; gap:8px; }
  .ticker { font-weight:700; font-size:15px; }
  .badge { font-size:11px; padding:2px 8px; border-radius:999px; background:#eef2ff;
           color:#3730a3; white-space:nowrap; }
  .badge.up { background:#fee2e2; color:#b91c1c; }
  .badge.down { background:#dbeafe; color:#1d4ed8; }
  .rationale { font-size:13px; color:var(--sub); margin:8px 0; line-height:1.5; }
  .meta { font-size:11px; color:var(--sub); }
  .bar { height:8px; border-radius:4px; background:#f1d4d4; overflow:hidden; margin:10px 0 4px; }
  .bar > div { height:100%; background:var(--agree); }
  .counts { display:flex; justify-content:space-between; font-size:12px; color:var(--sub); }
  .actions { display:flex; gap:8px; margin-top:10px; }
  .vote-agree { background:#eff6ff; color:var(--agree); flex:1; }
  .vote-agree.on { background:var(--agree); color:#fff; }
  .vote-disagree { background:#fef2f2; color:var(--disagree); flex:1; }
  .vote-disagree.on { background:var(--disagree); color:#fff; }
  .withdraw { background:#f3f4f6; color:var(--sub); }
  .myvote { display:flex; justify-content:space-between; align-items:center;
            padding:10px 4px; border-bottom:1px solid var(--line); font-size:13px; }
  .myvote:last-child { border-bottom:0; }
  .withdrawn { text-decoration:line-through; color:var(--sub); }
  .void { font-size:11px; color:var(--disagree); }
  #toast { position:fixed; left:50%; bottom:24px; transform:translateX(-50%);
           background:#111827; color:#fff; padding:10px 18px; border-radius:8px;
           font-size:13px; opacity:0; transition:opacity .2s; pointer-events:none; max-width:90%; }
  #toast.show { opacity:1; }
  .empty { color:var(--sub); font-size:13px; text-align:center; padding:12px 0; }
</style>
</head>
<body>
<div class="wrap">
  <h1>전망 컨센서스 테스트 콘솔</h1>
  <div class="sub">app-api 수동 테스트용 — 유저를 바꿔가며 투표해 보세요</div>

  <section>
    <h2>유저</h2>
    <select id="user">
      <option value="1">1 — demo-user-1</option>
      <option value="2">2 — demo-user-2</option>
      <option value="3">3 — demo-user-3</option>
    </select>
  </section>

  <section>
    <h2>전망 발행 (어드민)</h2>
    <div class="row">
      <div><label>티커</label><input id="pub-ticker" placeholder="069500"></div>
      <div><label>방향</label>
        <select id="pub-direction">
          <option value="STRONG_UP">강력 상승</option>
          <option value="UP" selected>상승</option>
          <option value="NEUTRAL">중립</option>
          <option value="DOWN">하락</option>
          <option value="STRONG_DOWN">강력 하락</option>
        </select>
      </div>
      <div><label>마감</label><input id="pub-end" type="datetime-local"></div>
    </div>
    <label>근거</label>
    <textarea id="pub-rationale" placeholder="전망 근거"></textarea>
    <button class="primary" onclick="publish()">발행</button>
  </section>

  <section>
    <h2>진행 중 전망</h2>
    <div id="cards"></div>
  </section>

  <section>
    <h2>내 투표</h2>
    <div id="myvotes"></div>
  </section>
</div>
<div id="toast"></div>

<script>
const DIRECTION = { STRONG_UP:'강력 상승', UP:'상승', NEUTRAL:'중립', DOWN:'하락', STRONG_DOWN:'강력 하락' };
const dirClass = d => d.includes('UP') ? 'up' : d.includes('DOWN') ? 'down' : '';
const userId = () => document.getElementById('user').value;

async function api(method, url, body) {
  const res = await fetch(url, {
    method,
    headers: { 'Content-Type': 'application/json', 'X-User-Id': userId() },
    body: body ? JSON.stringify(body) : undefined,
  });
  const envelope = await res.json();
  if (!envelope.isSuccess) throw new Error(`[${envelope.code}] ${envelope.message}`);
  return envelope.result;
}

function toast(message) {
  const el = document.getElementById('toast');
  el.textContent = message;
  el.classList.add('show');
  setTimeout(() => el.classList.remove('show'), 2200);
}

async function publish() {
  const endLocal = document.getElementById('pub-end').value;
  try {
    await api('POST', '/api/forecasts', {
      ticker: document.getElementById('pub-ticker').value,
      direction: document.getElementById('pub-direction').value,
      endAt: endLocal ? new Date(endLocal).toISOString()
                      : new Date(Date.now() + 24 * 3600 * 1000).toISOString(),
      rationale: document.getElementById('pub-rationale').value,
    });
    toast('발행 완료');
    refresh();
  } catch (e) { toast(e.message); }
}

async function vote(id, choice) {
  try {
    const counts = await api('PUT', `/api/forecasts/${id}/vote`, { choice });
    toast(`투표 완료 — 동의 ${counts.agree} · 반대 ${counts.disagree}`);
    refresh();
  } catch (e) { toast(e.message); refresh(); }
}

async function withdraw(id) {
  const reason = prompt('철회 사유를 입력하세요');
  if (!reason) return;
  try {
    await api('POST', `/api/forecasts/${id}/withdraw`, { reason });
    toast('철회 완료');
    refresh();
  } catch (e) { toast(e.message); refresh(); }
}

function cardHtml(forecast, myChoice) {
  const total = forecast.agree + forecast.disagree;
  const ratio = total === 0 ? 50 : Math.round(forecast.agree / total * 100);
  return `
  <div class="card">
    <div class="head">
      <span class="ticker">${forecast.ticker}</span>
      <span class="badge ${dirClass(forecast.direction)}">${DIRECTION[forecast.direction]}</span>
    </div>
    <div class="rationale">${forecast.rationale ?? ''}</div>
    <div class="meta">마감 ${new Date(forecast.endAt).toLocaleString('ko-KR')}</div>
    <div class="bar"><div style="width:${ratio}%"></div></div>
    <div class="counts"><span>동의 ${forecast.agree} (${total ? ratio : '-'}%)</span><span>반대 ${forecast.disagree}</span></div>
    <div class="actions">
      <button class="vote-agree ${myChoice === 'AGREE' ? 'on' : ''}" onclick="vote(${forecast.id}, 'AGREE')">동의</button>
      <button class="vote-disagree ${myChoice === 'DISAGREE' ? 'on' : ''}" onclick="vote(${forecast.id}, 'DISAGREE')">반대</button>
      <button class="withdraw" onclick="withdraw(${forecast.id})">철회</button>
    </div>
  </div>`;
}

function myVoteHtml(vote) {
  const withdrawn = vote.status === 'WITHDRAWN';
  const label = { OPEN:'진행 중', CLOSED:'종료', WITHDRAWN:'철회' }[vote.status];
  return `
  <div class="myvote">
    <span class="${withdrawn ? 'withdrawn' : ''}">
      <b>${vote.ticker}</b> · ${DIRECTION[vote.direction]} · ${vote.choice === 'AGREE' ? '동의' : '반대'}
    </span>
    <span>
      ${withdrawn ? `<span class="void">무효 — ${vote.withdrawReason ?? ''}</span>` : ''}
      <span class="badge">${label}</span>
    </span>
  </div>`;
}

async function refresh() {
  try {
    const [forecasts, myVotes] = await Promise.all([
      api('GET', '/api/forecasts'),
      api('GET', '/api/me/votes'),
    ]);
    const mine = Object.fromEntries(myVotes.map(v => [v.forecastId, v.choice]));
    document.getElementById('cards').innerHTML =
      forecasts.length ? forecasts.map(f => cardHtml(f, mine[f.id])).join('')
                       : '<div class="empty">진행 중인 전망이 없습니다</div>';
    document.getElementById('myvotes').innerHTML =
      myVotes.length ? myVotes.map(myVoteHtml).join('')
                     : '<div class="empty">투표 내역이 없습니다</div>';
  } catch (e) { toast(e.message); }
}

document.getElementById('user').addEventListener('change', refresh);
refresh();
setInterval(refresh, 5000);
</script>
</body>
</html>
