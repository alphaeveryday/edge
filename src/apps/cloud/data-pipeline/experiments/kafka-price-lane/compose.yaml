# Kafka 가격 레인 로컬 실험 — 실행은 lab.py 가 한다(README.md).
# 포트는 전부 127.0.0.1 에만 연다. 클라우드 자원을 만들지 않는다.
x-app: &app
  build:
    context: ../../../../..
    dockerfile: apps/cloud/data-pipeline/experiments/kafka-price-lane/Dockerfile
  image: edge-kafka-price-lab:local
  volumes:
    - .:/lab:ro
    - ${LAB_RUN_DIR:-./results/scratch}:/run-data
  environment: &env
    DATA_PIPELINE_DB__HOST: postgres
    DATA_PIPELINE_DB__PORT: "5432"
    DATA_PIPELINE_DB__NAME: edge
    DATA_PIPELINE_DB__USER: edge
    DATA_PIPELINE_DB__PASSWORD: edge
    DATA_PIPELINE_DB__SSLMODE: disable
    DATA_PIPELINE_STORAGE__BACKEND: local
    DATA_PIPELINE_STORAGE__LOCAL_ROOT: /run-data/lake
  depends_on:
    flyway: {condition: service_completed_successfully}
    kafka: {condition: service_healthy}

# 소비자 설정 — 섹션이 부분만 있으면 다른 스텝의 설정 검증도 실패하므로 소비자에만 둔다
x-consumer-env: &consumer_env
    <<: *env
    DATA_PIPELINE_MINUTE_PRICE_CONSUMER__DETECTION_POLICY_VERSION: intraday-anchor-v2
    DATA_PIPELINE_MINUTE_PRICE_CONSUMER__BATCH_SIZE: "1"
    DATA_PIPELINE_MINUTE_PRICE_CONSUMER__WAIT_SECONDS: "1"
    # kernel 조합 검증: visibility >= heartbeat + batch × 15초
    DATA_PIPELINE_MINUTE_PRICE_CONSUMER__HEARTBEAT_SECONDS: "1"
    DATA_PIPELINE_MINUTE_PRICE_CONSUMER__VISIBILITY_SECONDS: "16"
    DATA_PIPELINE_MINUTE_PRICE_CONSUMER__LEASE_SECONDS: "16"
    DATA_PIPELINE_MINUTE_PRICE_CONSUMER__RETRY_BASE_SECONDS: "1"
    DATA_PIPELINE_MINUTE_PRICE_CONSUMER__RETRY_MAX_SECONDS: "4"
    DATA_PIPELINE_MINUTE_PRICE_CONSUMER__MAX_ATTEMPTS: "20"

services:
  postgres:
    image: postgres:16
    environment: {POSTGRES_DB: edge, POSTGRES_USER: edge, POSTGRES_PASSWORD: edge}
    ports: ["127.0.0.1:55442:5432"]
    healthcheck:
      test: [CMD-SHELL, pg_isready -U edge -d edge]
      interval: 1s
      retries: 30

  flyway:
    image: flyway/flyway:10.21.0
    depends_on: {postgres: {condition: service_healthy}}
    volumes: ["../../../../../libs/schema/migrations-cloud:/flyway/sql:ro"]
    command: -url=jdbc:postgresql://postgres:5432/edge -user=edge -password=edge -connectRetries=10 -locations=filesystem:/flyway/sql migrate

  kafka:
    image: apache/kafka:3.7.0
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@localhost:9093
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
      KAFKA_HEAP_OPTS: -Xms256m -Xmx512m
    healthcheck:
      test: [CMD-SHELL, /opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092 --list]
      interval: 2s
      retries: 30

  relay:
    <<: *app
    command: [python, -m, data_pipeline.run, relay]
    environment:
      <<: *env
      DATA_PIPELINE_MINUTE_RELAY__TICK_SECONDS: "0.2"
      DATA_PIPELINE_MINUTE_RELAY__QUEUE_URLS: >-
        {"price-analysis-realtime":"kafka://kafka:9092/price-analysis-realtime",
        "price-explanation-realtime":"kafka://kafka:9092/price-explanation-realtime",
        "news-extraction-realtime":"kafka://kafka:9092/news-extraction-realtime",
        "news-extraction-backfill":"kafka://kafka:9092/news-extraction-backfill"}

  # 운영 소비자와 복구 소비자는 **같은 명령**이다 — DB·group 만 다르다
  live:
    <<: *app
    command: [python, /lab/entry.py, price-consumer, --universe, /run-data/universe.json]
    environment:
      <<: *consumer_env
      DATA_PIPELINE_MINUTE_PRICE_CONSUMER__QUEUE_URL: kafka://kafka:9092/price-analysis-realtime?group=price-live
      LAB_NAME: live
      LAB_EXIT_BEFORE_COMMIT_WINDOW: ${LIVE_CRASH_WINDOW:-}

  repair:
    <<: *app
    command: [python, /lab/entry.py, price-consumer, --universe, /run-data/universe.json]
    environment:
      <<: *consumer_env
      DATA_PIPELINE_DB__NAME: edge_repair
      DATA_PIPELINE_MINUTE_PRICE_CONSUMER__QUEUE_URL: kafka://kafka:9092/price-analysis-realtime?group=price-repair
      LAB_NAME: repair
      LAB_EXIT_BEFORE_COMMIT_WINDOW: ${REPAIR_CRASH_WINDOW:-}

  driver:
    <<: *app
    profiles: [tools]
    command: [python, /lab/driver.py]
