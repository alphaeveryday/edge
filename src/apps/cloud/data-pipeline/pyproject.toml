[project]
name = "data-pipeline"
version = "0.1.0"
description = "스케줄러로 외부 데이터를 수집해 DB에 적재하는 파이프라인"
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.6",
    "pydantic-settings>=2.2",
    "boto3>=1.34", # 레이크 s3 백엔드 (local 백엔드·단위테스트는 미사용 — 지연 import)
    "pyarrow>=17", # canonical parquet 적재(정제 Step2) — 지연 import
    "beautifulsoup4>=4.12", # 공시 정제 — DART 공급계약 본문(euc-kr HTML 테이블) 파싱(normalize-disclosure)
    "pandas>=2.2", # 공시 사업부문 정제 — 사업보고서 표 4-전략 추출(normalize-disclosure-segment)
    "lxml>=5", # pandas.read_html 백엔드(사업부문 표 파싱)
    "html5lib>=1.1", # pandas.read_html bs4 폴백 파서 — lxml 이 XML-ish 공시표를 못 읽을 때
    "psycopg[binary]>=3.1", # Cloud Event Store 적재(load-*) — Postgres 드라이버, 지연 import
    "edge-ontology", # 이벤트 온톨로지 SSOT lib(src/libs/ontology) — 워크스페이스 멤버(ALPHA-539)
]

[tool.uv.sources]
edge-ontology = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/data_pipeline"]

[dependency-groups]
dev = ["pytest>=8"]
# 로컬 실험 전용 — 클라우드 이미지에 안 들어간다. Dockerfile 은 `pip install <pkg>` 라
# 그룹을 안 깔고, 그룹은 wheel 메타데이터에도 안 실린다. yahoo 지수/ETF 수집은 로컬에서만
# 돌리고(`uv sync --package data-pipeline --group local`), 클라우드는 그 결과를 s3
# canonical 레이크에서 읽는다. 미설치 상태로 `--source yahoo` 를 부르면 fail-loud.
local = ["yfinance>=0.2.40"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
