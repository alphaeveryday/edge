# 수집 유니버스: US 9 + KR 10(소스 무관, KR 은 개별주 9 + ETF 091160). 소스별 심볼 번역은
# 각 소스의 symbol_map
# 참고 — targets 에 있어도 그 소스에 매핑이 없으면 해당 소스는 건너뛴다.
[targets]
symbols = [
    # KR
    "091160", # KODEX 반도체 (ETF — KIS 가격만 매핑, 뉴스·재무 소스는 매핑 없어 스킵)
    "005930", # 삼성전자
    "000660", # SK하이닉스
    "009150", # 삼성전기
    "402340", # SK스퀘어
    "373220", # LG에너지솔루션
    "028260", # 삼성물산
    "032830", # 삼성생명
    "105560", # KB금융
    "055550", # 신한지주
    # US
    "NVDA", "AAPL", "MSFT", "CAT", "GE", "RTX", "BRK.B", "JPM", "V",
]
keywords = ["금리", "실적", "환율"]

# ETF 가격변동 트리거(잠정 absolute gate) — load-price-triggers 가 쓴다(ALPHA-406).
# 게이트 정책 정본 = 분석엔진 L0(결정 2026-07-17, ALPHA-411): 구성종목 가중 proxy 수익률
# |r| >= 3%. relative gate 는 미구현(레이크에 벤치마크 지수 가격이 아직 없다 — 엔진과 동일).
# 임계값 재조정은 로직 소유자(정준영) 소관이라 코드가 아닌 여기 두고, 적재 행의
# detection_policy_version 으로 어느 정책의 행인지 남긴다.
[price_triggers]
etf_ticker = "091160"  # KODEX 반도체
abs_threshold = 0.03   # 엔진 ABS_GATE_THRESHOLD 와 동일
policy_version = "l0-abs-v1"  # 엔진 POLICY_VERSION 과 동일 — 단일 정책 이름
