#
# 위 [minute_universe].sector_etf_ids 와 다른 축이다. 저건 "지수는 분봉이 없다"는 **거짓
# 단언** 위에 세운 대체재였고(그래서 레버리지·인버스2X·농산물선물이 섞였다), 이건 일 모드가
# 이미 쓰는 그 지수 자체다. 소비단이 이 dataset 으로 옮겨가면 저 축은 걷힌다.
#
# 이 섹션은 [minute_universe] 와 달리 **그 자체가 정본이다** — sector_index dataset 은
# universe 를 쓰지 않아(`UNIVERSE_DATASETS` 밖) planner 가 `--universe` 를 거부한다.
# 이미지 배포가 곧 반영이고 S3 를 갈 일이 없다.
#
# 🔴 **KIS 지수코드는 KRX 업종코드가 아니다.** KIS 의 `U` 네임스페이스는 자체 조밀 번호다
# (`0001`=코스피종합 · `1001`=코스닥 · `2001`=KOSPI200 / 업종은 `0xxx`=KOSPI · `1xxx`=KOSDAQ).
# KOSPI 는 1005~1027 이 −1000 이지만 **1045~1047 에서 0028~0030 으로 꺾이고**, KOSDAQ 은
# 산술 관계가 아예 없다. 규칙으로 유도하지 말고 이 표를 봐라.
#
# ⚠️ **틀린 값은 조용히 틀린다.** KRX 코드를 그대로 넣어도 KIS 는 `rt_cd=0` 에 그럴듯한
# 한글 업종명이 담긴 **남의 지수**를 준다 — 45종 중 43종이 정상 격자(79/79)를 채웠다.
# 그래서 이 표는 이름이 아니라 **값으로** 확정했다(2026-08-09): 레이크
# `analysis/backfill/sector_index.parquet` 의 일봉 종가와 **99거래일 전건 소수점 일치**.
# 고칠 때도 같은 방법으로 확인해라. 이름 대조로는 못 잡는다 — 같은 업종명이 KOSPI·KOSDAQ
# 양쪽에 있다(음식료·담배가 1005 와 2056 둘 다다).
#
# 뒤의 종목수는 `sector_member` 최신 스냅샷(as_of 2026-07-15)이다. **이게 오류를 갈라낸
# 단서였다** — 2118 은 229종목인데 빈 응답이 왔고 2027 은 103종목인데 "K200경기소비재
# 레버리지"가 왔다. 매핑을 손대면 이 수치로 먼저 눈대중해라.
