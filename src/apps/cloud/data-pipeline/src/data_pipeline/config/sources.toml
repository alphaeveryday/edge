"395270" = "KR7395270002"   # HANARO Fn K-반도체
"139260" = "KR7139260004"   # TIGER 200 IT
"091230" = "KR7091230003"   # TIGER 반도체
"469150" = "KR7469150007"   # ACE AI반도체TOP3+
"455850" = "KR7455850008"   # SOL AI반도체소부장
"474590" = "KR7474590007"   # WON 반도체밸류체인액티브
"471990" = "KR7471990002"   # KODEX AI반도체핵심장비
