# ETF 가격변동 트리거(잠정 absolute gate) — load-price-triggers 가 쓴다(ALPHA-406).
# 게이트 정책 정본 = 분석엔진 L0(결정 2026-07-17, ALPHA-411): 구성종목 가중 proxy 수익률
# |r| >= 3%. relative gate 는 미구현(레이크에 벤치마크 지수 가격이 아직 없다 — 엔진과 동일).
# 임계값 재조정은 로직 소유자(정준영) 소관이라 코드가 아닌 여기 두고, 적재 행의
# detection_policy_version 으로 어느 정책의 행인지 남긴다.
# 트리거 유니버스는 holdings∩마스터에서 파생한다(ALPHA-465) — 여기에 티커를 두지 않는다.
# 단일 ETF 로 좁혀 돌리려면 etf_ticker 를 옵션으로 넣는다(dev 검증·백필용).
[price_triggers]
abs_threshold = 0.03   # 엔진 ABS_GATE_THRESHOLD 와 동일
# 1분 판정식 v2 전용(ALPHA-745) — 기준선(전일 종가) ±1% 복귀 = 발화 금지·노출 회수
revert_threshold = 0.01
policy_version = "l0-abs-v1"  # 엔진 POLICY_VERSION 과 동일 — 단일 정책 이름

# 1분 레인 universe.json **생성** 입력 — 수집 스텝은 아무도 이 섹션을 안 읽는다.
# 1분 유니버스의 정본은 S3 `config/minute/universe.json` 객체 하나고(planner·worker·
# consumer 가 --universe 로 같은 객체를 본다), 여기 값은 그걸 만드는 재료다:
#   scripts/build_minute_universe.py → /tmp/universe.json → (확인) → aws s3 cp
# 이 파일만 고치고 S3 를 안 갈면 아무것도 안 바뀐다.
#
# ⚠️ **순서가 있다: 이미지 먼저, S3 나중.** `Universe` 는 extra="forbid" 라, 새 축
# (sector_etf_ids)이 든 객체를 옛 이미지가 읽으면 ValidationError 다. 그중 치명적인
# 것은 planner(plan-minute-session)로, exit 2 면 스케일업을 안 해 그날 레인이 통째로
# 안 뜬다 — 그리고 스케줄러는 RunTask 제출까지만 보므로 **그 실패가 관측되지 않는다**
# (README "1분 파이프라인" 참고). 반대 순서(새 이미지 + 옛 객체)는 안전하다: 축이
# 기본값 ()이라 hash·payload 가 축 도입 전과 바이트로 같다.
#
# ⚠️ **장중(세션 ACTIVE)에는 갈지 마라.** 재계획은 UniverseConflictError 로 막히고,
# 그 뒤 재기동된 worker 는 원장 universe 와 갈려 resident 루프에서 매 틱 blocked 로
# 도는데 프로세스는 안 죽는다(ECS 는 정상으로 본다). 되돌리려면 옛 객체를 다시 올려야
# 한다. 반영은 세션 계획 전에.
[minute_universe]
# 구간(장중) 모드 섹터층의 후보 ETF. 일봉 경로는 KRX 업종지수를 섹터 후보로 주입하지만
# (analysis `layers._krx_sector_candidate`) 그 지수는 **분봉이 없어**(수집 원천이 pykrx
# 일봉이다) 구간 모드가 섹터 ETF 로 대체한다 — 그 후보들이 여기 없으면 계열이 아예 없어
# 구간 설명의 섹터층이 통째로 빠진다.
#
# 집합의 정본은 analysis 쪽 `layers_daily` 의 `kind='sector'`(2026-08-07 실측 80종)다.
# 그중 33종은 이미 [krx_etf.source.etf_map] 으로 수집되므로(반도체 30 + 게임 + 2차전지
# + 은행 — 은행은 ALPHA-927 이 여기서 옮겨 갔다) 여기엔 **나머지 47종**만 적는다. 같은
# 코드를 양쪽에 두면 빌더가 거부한다 — 한쪽은 "판정해라", 다른 쪽은 "봉만 받아라"라
# 조용히 한쪽으로 넘기면 나머지가 거짓이 된다.
#
# ⚠️ 이 목록과 `layers_daily` 는 **자동으로 안 맞춰진다**(그 parquet 은 이 레포 밖
# 산출물이다). 갈렸을 때 증상은 조용하다: `layers._series` 가 `layers_daily` 회원만
# 후보로 삼으므로 여기 없는 후보는 `xs` 에 안 들어가고, 탈락 사유를 남기는 자리
# (twins·alien·rho_blocked)는 들어온 후보만 기록한다. 사유 없는 부재다.
#
# 🔴 **이 목록이 섹터층을 세운다는 전제는 폐기됐다(2026-08-09 확인).** 원래 여기엔
# "`layers._on` 이 β 창(BETA_WINDOW=60 거래일)의 모든 날짜를 요구하는데 이 48종은 이력이
# 없다"고 적혀 있었다. **그 게이트도 후보 풀도 지금 없다** — ALPHA-862(#617)가 층 계수를
# 1 로 고정하며 회귀를 걷어냈고, ALPHA-877 이 **프록시 섹터 ETF 선택 자체를 폐기**했다
# (섹터 최종형은 KRX 업종지수 하나. `layers._series` 는 대상·시장 두 심볼만 읽는다).
# 즉 이 47종을 아무리 채워도 **섹터층은 이 경로로 안 선다.**
#
# 이력은 ALPHA-856 이 KIS 소급으로 받아 뒀다(2025-07-29~2026-04-24 · 181거래일 · 668,080행).
# 근거는 섹터층이 아니라 **보관 롤링**이다 — 소급 TR 은 251거래일만 갖고 매일 밀려서 안
# 받으면 영구 소실이라, 소비자가 뒤에 서면 그때는 못 받는다. 이 목록을 계속 수집하는
# 이유도 같다: 지금 쓰는 곳이 없어도 **끊기면 되돌릴 수 없다.**
