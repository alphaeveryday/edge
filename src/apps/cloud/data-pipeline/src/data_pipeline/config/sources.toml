enabled = true
# 수집 대상 공시 유형 — report_nm 부분일치. "단일판매ㆍ공급계약체결" 은 "공급계약" 으로,
# 사업부문 매출은 "사업보고서" 본문으로 잡는다(정정본 [기재정정]… 도 부분일치로 포함).
