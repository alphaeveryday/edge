# 기록한다) 후보로 남긴다 — 어느 게 층으로 뽑히는지는 겹침·ρ 게이트가 정할 일이지 수집이
# 미리 깎을 일이 아니다. 다만 flat 계열로 선 β 는 못 믿으니 소비단이 그걸 봐야 한다.
