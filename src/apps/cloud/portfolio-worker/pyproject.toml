[project]
name = "edge-portfolio-worker"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115,<1",
    "uvicorn>=0.34,<1",
    "httpx>=0.28,<1",
    "psycopg[binary]>=3.2,<4",
    "mcp>=1.20,<2",
    "yfinance[repair]>=0.2.66,<2",
    "finance-datareader>=0.9,<1",
    "exchange-calendars>=4.11,<5",
    "numpy>=2,<3",
]

[dependency-groups]
dev = ["pytest>=8", "pytest-asyncio>=0.25"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/edge_portfolio"]

[tool.pytest.ini_options]
pythonpath = ["src"]
asyncio_mode = "auto"

[tool.uv]
managed = true

[tool.uv.workspace]
members = []
