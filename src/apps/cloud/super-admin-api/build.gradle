plugins {
	id 'java'
	id 'org.springframework.boot' version '4.1.0'
	id 'io.spring.dependency-management' version '1.1.7'
}

group = 'com.edge'
version = '0.0.1-SNAPSHOT'

java {
	toolchain {
		languageVersion = JavaLanguageVersion.of(21)
	}
}

repositories {
	mavenCentral()
}

dependencies {
	implementation project(':libs:jvm-common') // 에러 응답 공통 포맷(ApiResponse)·에러 코드 규약
	implementation 'org.springframework.boot:spring-boot-starter-actuator'
	implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
	implementation 'org.springframework.boot:spring-boot-starter-webmvc'
	// 데모 운영자 계정 비밀번호 해시(BCrypt)만 사용 — Spring Security 프레임워크 전체가
	// 아니라 crypto 모듈 단독(ADR-0025 데모 최소 구현과 같은 결, 인가는 AdminAuthFilter 직접).
	implementation 'org.springframework.security:spring-security-crypto'
	compileOnly 'org.projectlombok:lombok'
	runtimeOnly 'org.postgresql:postgresql'
	annotationProcessor 'org.projectlombok:lombok'
	testImplementation 'org.springframework.boot:spring-boot-starter-actuator-test'
	testImplementation 'org.springframework.boot:spring-boot-starter-data-jpa-test'
	testImplementation 'org.springframework.boot:spring-boot-starter-webmvc-test'
	// JPA 매핑 검증용 통합 테스트 인프라(ALPHA-526) — 실 Postgres 에 Flyway(migrations-cloud)
	// 를 적용해 Hibernate validate 로 엔티티↔스키마 정합을 확인한다(레포 첫 Testcontainers).
	testImplementation 'org.springframework.boot:spring-boot-testcontainers'
	testImplementation 'org.testcontainers:testcontainers-junit-jupiter'
	testImplementation 'org.testcontainers:testcontainers-postgresql'
	// Boot 4 는 자동설정을 기술별 모듈로 분리했다 — Flyway 자동설정(FlywayAutoConfiguration)은
	// spring-boot-flyway 에 있어 flyway-core 만으로는 마이그레이션이 실행되지 않는다.
	testImplementation 'org.springframework.boot:spring-boot-flyway'
	testImplementation 'org.flywaydb:flyway-core'
	testImplementation 'org.flywaydb:flyway-database-postgresql'
	testCompileOnly 'org.projectlombok:lombok'
	testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
	testAnnotationProcessor 'org.projectlombok:lombok'
}

tasks.named('test') {
	useJUnitPlatform()
	// Testcontainers 통합 테스트가 Flyway 로 적용할 cloud 마이그레이션의 절대 경로 —
	// test 작업 디렉터리에 의존하지 않도록 build.gradle 위치 기준으로 해석한다.
	systemProperty 'cloud.migrations.dir', file('../../../libs/schema/migrations-cloud').absolutePath
}
