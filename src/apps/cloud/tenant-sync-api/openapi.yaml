openapi: 3.1.0

# 문법 명세(경로·필드·타입) 층 — 2층 구조의 하위(TODO §5).
# 시맨틱 계약(멱등성·cursor 규칙·에러 의미·전달 보장)의 SSOT 는
# ../../../../docs/contracts/sync-protocol.md 이며, 이 문서는 그 하위 문법 층이다.
# 번들(EventBundle) 필드 표기는 snake_case (DTO @JsonNaming). 200 응답은 공통 ApiResponse 봉투로 감싼다(ADR-0040).
info:
  title: Tenant Sync API
  version: 1.0.0
  description: >-
    온프렘 Sync Agent 가 outbound-Pull 로 소비하는 Cloud 표면.
    한 응답은 항상 Event Bundle 1개이며, 성공(200)은 공통 응답 포맷(ApiResponse)
    봉투로 감싼다(번들은 result 아래). 전송 무결성은 mTLS/TLS 이며, 앱 레벨 체크섬은
    목표 계약(서명)으로 이관됐다(ADR-0040). 시맨틱 계약은
    ../../../../docs/contracts/sync-protocol.md, 번들 필드 정의는
    ../../../../docs/contracts/event-bundle-schema.md 가 SSOT.

servers:
  - url: /
    description: tenant-sync-api 서비스 루트 (로컬 compose host 18083)

# 계약상 매 요청 mTLS 인증서-테넌트 바인딩 검증이 필수다(sync-auth.md 확정 —
# 유일한 벤더-증권사 인증, 클라우드 측 테넌트 격리 강제 지점). 그래서 필수로 둔다.
# 현재 인가 강제는 TenantResolver 데모 스텁(인증서 무관 tenant 1)이라 미구현이며,
# 실제 강제·401/403 도메인 코드는 sync-auth 티켓에서 구현한다 — 요구 자체는 계약이 정한다.
security:
  - mutualTLS: []

paths:
  /api/v1/sync/bundle:
    get:
      operationId: pullBundle
      summary: 커서 이후의 Event Bundle 1건을 Pull
      description: >-
        `after` 커서 초과분을 cursor 오름차순으로 묶어 번들 1개로 반환한다.
        신규가 없으면 204. 재개점은 `result.cursor_to` 다(entry 별 `cursor` 아님).


        테넌트 식별은 매 요청 mTLS 인증서-테넌트 바인딩 검증으로 결정된다(계약 필수 —
        sync-auth.md). 쿼리·경로·헤더로 테넌트를 받지 않는다. 현재 인가 강제는
        TenantResolver 데모 스텁(인증서 무관)이라 미구현이며, 실제 강제·401/403 도메인
        코드는 sync-auth 계약(../../../../docs/contracts/sync-auth.md)에서 구현한다.


        에러 시맨틱: 401·403·410 외 4xx 는 소비자 버그 신호이므로 재시도로 낫지 않는다
        (fail-loud — 즉시 에러 로그, 해법은 수정 배포). 5xx·네트워크 오류만 일시 장애로
        보고 다음 폴링 주기에 재시도한다(at-least-once — 멱등 upsert 가 중복 흡수).
      parameters:
        - name: after
          in: query
          required: true
          description: 소비자의 마지막 committed cursor. 첫 동기화는 0. 0 미만은 400(SYNC4001).
          schema:
            type: integer
            format: int64
            minimum: 0
          example: 0
        - name: limit
          in: query
          required: false
          description: >-
            응답 번들에 담길 전달 레코드(entry) 수 상한. 생략 시 100, 허용 1..500,
            범위 밖은 400(SYNC4002). 번들 개수 파라미터가 아니다 — 한 응답은 항상 번들 1개.
          schema:
            type: integer
            format: int32
            default: 100
            minimum: 1
            maximum: 500
          example: 100
      responses:
        '200':
          description: >-
            신규/정정/무효화 전달 레코드를 담은 Event Bundle 1건을 공통 응답 포맷(ApiResponse)
            봉투로 감싼다 — 번들은 `result` 아래. Content-Type 은 application/json, 번들 필드
            표기는 snake_case.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BundleEnvelope'
        '204':
          description: 신규 없음. 빈 번들은 만들지 않는다.
        '400':
          description: >-
            소비자 버그 신호(재시도로 낫지 않음). 도메인 코드 SYNC4001(after<0)·
            SYNC4002(limit 범위 밖). 수치 표현 자체가 불가한 값(정수 범위 밖·비수치)은
            파라미터 바인딩 실패라 공통 400 코드로 나간다.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                invalidAfter:
                  summary: after < 0
                  value:
                    isSuccess: false
                    code: SYNC4001
                    message: after 는 0 이상이어야 합니다 (첫 동기화는 0).
                invalidLimit:
                  summary: limit 범위 밖
                  value:
                    isSuccess: false
                    code: SYNC4002
                    message: limit 은 1..500 이어야 합니다.
        '401':
          description: >-
            인증서 미제시·유효하지 않음. 도메인 코드는 sync-auth 계약에서 확정(현재 미구현).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: >-
            인증서는 유효하나 테넌트 인가 실패. 도메인 코드는 sync-auth 계약에서 확정(현재 미구현).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '5XX':
          description: 서버 일시 장애. 소비자는 다음 폴링 주기에 재시도한다. 내부 메시지는 응답에 노출하지 않는다.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

components:
  securitySchemes:
    mutualTLS:
      type: mutualTLS
      description: >-
        온프렘 Sync Agent 의 클라이언트 인증서(mTLS) — 계약이 정한 유일 인증이며 매 요청
        인증서-테넌트 바인딩을 검증한다(sync-auth.md). 바인딩·401/403 도메인 코드의 실제
        강제는 sync-auth 티켓 구현 소관이며 현재는 TenantResolver 데모 스텁이라 미강제.

  schemas:
    BundleEnvelope:
      type: object
      description: >-
        성공(200) 응답 봉투 — 공통 응답 포맷(jvm-common ApiResponse)의 성공 형태.
        번들은 result 아래에 온다(ADR-0040).
      required: [isSuccess, code, message, result]
      properties:
        isSuccess:
          type: boolean
          const: true
        code:
          type: string
          description: 성공 공통 코드.
          example: COMMON200
        message:
          type: string
          example: 성공적으로 요청을 수행하였습니다.
        result:
          # 번들 구조 SSOT — libs/schema 의 JSON Schema 를 $ref 한다(ALPHA-497). 중복 정의 없음.
          $ref: '../../../libs/schema/contracts/event-bundle.schema.json#/$defs/EventBundle'
    ErrorResponse:
      type: object
      description: >-
        공통 응답 포맷(jvm-common ApiResponse)의 에러 형태 — 4xx/5xx 에 적용된다.
        성공(200)도 공통 봉투(BundleEnvelope)로 감싼다 — ADR-0040 으로 체크섬 특례 폐기.
      required: [isSuccess, code, message]
      properties:
        isSuccess:
          type: boolean
          const: false
        code:
          type: string
          description: 도메인 코드(예 SYNC4001·SYNC4002) 또는 공통 코드.
          example: SYNC4001
        message:
          type: string
          example: after 는 0 이상이어야 합니다 (첫 동기화는 0).
