[project]
name = "data-pipeline"
version = "0.1.0"
description = "스케줄러로 외부 데이터를 수집해 DB에 적재하는 파이프라인"
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.6",
    "pydantic-settings>=2.2",
    "boto3>=1.34", # 레이크 s3 백엔드 (local 백엔드·단위테스트는 미사용 — 지연 import)
    "pyarrow>=15", # canonical parquet 읽기/쓰기 (normalize 스텝)
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/data_pipeline"]

[dependency-groups]
dev = ["pytest>=8"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
