[project]
name = "data-pipeline"
version = "0.1.0"
description = "스케줄러로 외부 데이터를 수집해 DB에 적재하는 파이프라인"
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.6",
    "pydantic-settings>=2.2",
    "boto3>=1.34", # 레이크 s3 백엔드 (local 백엔드·단위테스트는 미사용 — 지연 import)
    "pyarrow>=17", # canonical parquet 적재(정제 Step2) — 지연 import
    "beautifulsoup4>=4.12", # 공시 정제 — DART 공급계약 본문(euc-kr HTML 테이블) 파싱(normalize-disclosure)
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/data_pipeline"]

[dependency-groups]
dev = ["pytest>=8"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
