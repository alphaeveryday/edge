# data-pipeline 수집 설정
#
# 구조와 공개값만 둔다. api_key 등 비밀값은 커밋하지 말고 환경변수로 주입한다.
#   예) DATA_PIPELINE_NEWS__SOURCES__NAVER__API_KEY=...
# 같은 경로의 환경변수가 이 파일 값을 덮어쓴다(env > file).
#
# 수집 대상은 [targets]만 바꾸면 fetcher의 대상이 바뀐다 — 코드 수정 불필요.

# fmp 가 현재 유일하게 구현된 뉴스 수집 소스다(S002). api_key 는 env 로 주입:
#   DATA_PIPELINE_NEWS__SOURCES__FMP__API_KEY=...
[news.sources.fmp]
base_url = "https://financialmodelingprep.com/stable/news/stock"
enabled = true

# our_ticker → FMP 심볼. 검증된 매핑만 둔다 — 여기 없는 유니버스 종목은 FMP 로
# 수집하지 않는다(검증 안 된 KR ADR 은 생략 = 제외, 후속 소스가 커버).
# US 는 심볼 동일, BRK.B 는 FMP 대시 표기(BRK-B, analysis-engine 데이터 키와 일치).
[news.sources.fmp.symbol_map]
"005930" = "SSNLF"  # 삼성전자 (OTC ADR)
"105560" = "KB"     # KB금융 (NYSE ADR)
"055550" = "SHG"    # 신한지주 (NYSE ADR)
NVDA = "NVDA"
AAPL = "AAPL"
MSFT = "MSFT"
CAT = "CAT"
GE = "GE"
RTX = "RTX"
"BRK.B" = "BRK-B"
JPM = "JPM"
V = "V"

[news.sources.naver]
base_url = "https://openapi.naver.com/v1/search/news.json"
enabled = true

[news.sources.hankyung]
base_url = "https://www.hankyung.com/feed/finance"
enabled = true

# 가격(OHLCV) 소스 — FMP EOD(일봉, S004). api_key 는 env 로 주입:
#   DATA_PIPELINE_PRICE__SOURCE__API_KEY=...
[price.source]
base_url = "https://financialmodelingprep.com/stable/historical-price-eod/full"
enabled = true

# our_ticker → FMP 심볼. 뉴스와 별개 맵이다 — 뉴스 맵의 KR 은 ADR(SSNLF·KB·SHG)로
# 매핑돼 '그 회사 뉴스'엔 맞지만, 가격은 ADR 의 USD 시세를 KR 종목 가격으로 쓰면
# 통화·거래시간이 어긋난다. 그래서 가격은 US 거래소-로컬 심볼만 두고, KR 은 FMP EOD 의
# KRX 로컬 심볼이 검증되기 전까지 생략(=이 소스가 건너뜀, 후속). US 는 심볼 동일,
# BRK.B 는 FMP 대시 표기(BRK-B).
[price.source.symbol_map]
NVDA = "NVDA"
AAPL = "AAPL"
MSFT = "MSFT"
CAT = "CAT"
GE = "GE"
RTX = "RTX"
"BRK.B" = "BRK-B"
JPM = "JPM"
V = "V"

# 재무제표 소스 — FMP 재무제표(손익·재무상태·현금흐름, S035). api_key 는 env 로 주입:
#   DATA_PIPELINE_FINANCIAL__SOURCE__API_KEY=...
# base_url 은 /stable 베이스만 둔다 — 3개 엔드포인트(income-statement·balance-sheet-
# statement·cash-flow-statement)는 어댑터가 붙인다.
[financial.source]
base_url = "https://financialmodelingprep.com/stable"
enabled = true

# our_ticker → FMP 심볼. 가격과 같은 정책 — 재무제표는 US 거래소-로컬 심볼만 둔다.
# KR 은 FMP 재무 커버리지가 약해 후속(DART 등)으로 미룬다(=이 소스가 건너뜀). US 는
# 심볼 동일, BRK.B 는 FMP 대시 표기(BRK-B).
[financial.source.symbol_map]
NVDA = "NVDA"
AAPL = "AAPL"
MSFT = "MSFT"
CAT = "CAT"
GE = "GE"
RTX = "RTX"
"BRK.B" = "BRK-B"
JPM = "JPM"
V = "V"

# 수집 유니버스: US 9 + KR 9(소스 무관). 소스별 심볼 번역은 각 소스의 symbol_map
# 참고 — targets 에 있어도 그 소스에 매핑이 없으면 해당 소스는 건너뛴다.
[targets]
symbols = [
    # KR
    "005930", # 삼성전자
    "000660", # SK하이닉스
    "009150", # 삼성전기
    "402340", # SK스퀘어
    "373220", # LG에너지솔루션
    "028260", # 삼성물산
    "032830", # 삼성생명
    "105560", # KB금융
    "055550", # 신한지주
    # US
    "NVDA", "AAPL", "MSFT", "CAT", "GE", "RTX", "BRK.B", "JPM", "V",
]
keywords = ["금리", "실적", "환율"]
