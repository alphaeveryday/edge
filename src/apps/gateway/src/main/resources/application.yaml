spring:
  application:
    name: gateway
  cloud:
    gateway:
      server:
        webmvc:
          routes:
            # 위젯 라우트: 공개 요청을 widget-api 로 전달(리버스 프록시).
            # dev ECS: Service Connect http://widget-api:8080, 로컬: http://localhost:8081
            - id: widget
              uri: ${WIDGET_API_BASE_URL:http://localhost:8081}
              predicates:
                - Path=/api/v1/widget/**
              filters:
                # 공개 경로(/api/v1/widget/**) → widget-api 내부 경로(/internal/widget/**)
                - RewritePath=/api/v1/widget/(?<segment>.*), /internal/widget/$\{segment}
