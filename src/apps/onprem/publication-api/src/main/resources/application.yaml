spring:
  application:
    name: publication
  datasource:
    # 온프렘 Published Store (libs/schema/migrations-onprem 스키마). 로컬 기본값은
    # compose 의 postgres-onprem(:55433) — 컨테이너에서는 SPRING_DATASOURCE_* 로 덮인다.
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:55433/edge_onprem}
    username: ${SPRING_DATASOURCE_USERNAME:edge}
    password: ${SPRING_DATASOURCE_PASSWORD:edge}
  jpa:
    hibernate:
      # 스키마 SSOT 는 Flyway(libs/schema) — 앱은 consumer 다. 생성/변경 금지, 검증만(ADR-0038·
      # libs/schema/README). 기동 시 매핑된 엔티티와 실제 스키마 정합을 확인하고 DDL 은 발행하지 않는다.
      ddl-auto: validate
    # 조회는 리포지토리의 join fetch 로 즉시 로딩한다 — 뷰 렌더링 중 지연 로딩(OSIV)이 필요 없다.
    open-in-view: false

publication:
  # 상장 여부 판별(404)은 종목 마스터(etf_instrument, 증권사 환경 소유)로 한다 —
  # 구 설정 allowlist(known-tickers)는 은퇴. 404(미상장)와 204(상장이나 설명 없음)는 다른 질문이다.
  # 조회 캐시 TTL(ALPHA-433) — 프로세스 간 무효화 경로가 없어 이 값이 곧 차단·정정
  # 반영 지연의 상한이다(기본 caffeine 모드 기준 — redis·two-level 실험 모드의 상한은
  # 아래 l2-ttl 주석 참조). 늘릴 때는 컴플라이언스 검토 선행(ExplanationStore 주석 참조).
  serve-cache-ttl: ${PUBLICATION_SERVE_CACHE_TTL:3s}
  cors:
    # 별도 API 호스트로 직접 호출하는 테넌트만 위젯 오리진을 등록한다(ADR-0053 결정 5).
    # 기본형(위젯 도메인 동일 오리진 프록시)은 빈 값 = CORS 미등록.
    allowed-origins: ${PUBLICATION_CORS_ALLOWED_ORIGINS:}
  # 다중 인스턴스 캐시 로컬 실험(LOCAL-1~5) 설정. 기본값은 전부 현행 동작과 동일해야 한다 —
  # 실험값은 tests/loadtest/publication compose 의 env 로만 덮는다.
  cache:
    # none|caffeine|redis|two-level. 미지정=caffeine(기존 단일 인스턴스 동작 그대로).
    mode: ${PUBLICATION_CACHE_MODE:caffeine}
    # L2(Redis) TTL — L1(serve-cache-ttl)보다 길어야 한다(two-level 조립 시 검증).
    # redis·two-level 모드에서 게시 상태 변경(무효화·문구 수정·신규 게시)의 반영 상한은
    # 이 값+jitter, two-level 최악은 만료 직전 L2 구본이 L1 에 재적재되는 경우라
    # +L1 TTL(serve-cache-ttl)까지 가산된다. 제공 범위(scope) 차단은 캐시 앞단에서
    # 매 요청 판정되므로 이 지연과 무관하게 즉시다.
    l2-ttl: ${PUBLICATION_CACHE_L2_TTL:10s}
    # 동시 만료 실험의 대조군 보존을 위해 기본 0 — jitter 는 실험 변수다.
    l2-jitter: ${PUBLICATION_CACHE_L2_JITTER:0s}
  request-metric:
    # 요청 원장(serving_request_metric, ALPHA-128 Dashboard reader)도 동일 — 부하 프로필 전용 토글.
    enabled: ${PUBLICATION_REQUEST_METRIC_ENABLED:true}

management:
  health:
    redis:
      # starter-data-redis 가 RedisHealthIndicator 를 자동 등록한다 — Redis 는 실험 전용이라
      # 기본(caffeine) 모드에서 health 가 Redis 부재로 DOWN 되지 않도록 끈다.
      enabled: false
  metrics:
    tags:
      # 다중 인스턴스 실험에서 인스턴스별 지표 분리용 — compose 가 INSTANCE_ID=api-1..4 주입.
      instance: ${INSTANCE_ID:local}
    distribution:
      percentiles-histogram:
        # PromQL histogram_quantile(p99) 전제 — 실험 compose 만 켠다(기본 false = 현행 동작).
        # env 로 percentiles-histogram 을 직접 바인딩하면 relaxed binding 이 percentiles.histogram
        # (double[]) 으로 오해석해 기동이 죽는다 — 그래서 전용 토글을 둔다.
        "[http.server.requests]": ${PUBLICATION_HTTP_PERCENTILES_HISTOGRAM:false}
