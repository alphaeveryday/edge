server:
  servlet:
    session:
      cookie:
        # 세션 쿠키 기반 쓰기 API 의 CSRF 경량 방어(ADR-0025 데모 범위):
        # SameSite=Strict 로 크로스사이트 요청에 쿠키가 실리지 않게 한다.
        # http-only 는 XSS 로부터 쿠키 탈취를 막는다. 운영 SSO 모드·HTTPS 종단에서는
        # secure 쿠키·표준 CSRF 토큰이 추가된다(실계약 시점).
        same-site: strict
        http-only: true

spring:
  application:
    name: tenantconsole
  datasource:
    # 온프렘 DB (libs/schema/migrations-onprem). 로컬 기본값은 compose 의
    # postgres-onprem(:55433) — 컨테이너에서는 SPRING_DATASOURCE_* 로 덮인다.
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:55433/edge_onprem}
    username: ${SPRING_DATASOURCE_USERNAME:edge}
    password: ${SPRING_DATASOURCE_PASSWORD:edge}

console:
  auth:
    # 데모 자체 계정 부트스트랩(ADR-0025) — member 0건일 때 1회 시드.
    # 아래 비밀번호 기본값은 로컬·데모 스택 전용이다(postgres edge/edge 와 같은 결) —
    # 데모 배포에서는 env 로 덮고, 운영은 SSO/AD 모드라 부트스트랩을 쓰지 않는다.
    bootstrap-accounts:
      - email: admin@demo.edge.local
        name: 데모 관리자
        role: TENANT_ADMIN
        password: ${CONSOLE_BOOTSTRAP_ADMIN_PASSWORD:demo-admin-1}
      - email: reviewer@demo.edge.local
        name: 데모 검수자
        role: COMPLIANCE_REVIEWER
        password: ${CONSOLE_BOOTSTRAP_REVIEWER_PASSWORD:demo-reviewer-1}
