spring:
  application:
    name: widget
  # DataSource/JPA 자동설정을 사용한다. 접속 정보는 환경변수로 주입한다:
  #   SPRING_DATASOURCE_URL / SPRING_DATASOURCE_USERNAME / SPRING_DATASOURCE_PASSWORD
  # dev: ECS 태스크가 RDS endpoint + Secrets Manager(관리형 비밀번호)로 주입한다(infra ALPHA-295).
  # 로컬 실행 시 위 3개를 제공해야 부팅된다(없으면 DataSource 구성 실패).
  jpa:
    hibernate:
      # 스키마는 Flyway(libs/schema)가 소유한다. Hibernate 가 DDL 을 건드리지 않게 none.
      ddl-auto: none
    open-in-view: false
