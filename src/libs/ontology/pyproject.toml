[project]
name = "edge-ontology"
version = "0.1.0"
description = "온톨로지 SSOT — 존재 4층(실체·속성·관계·사건) 어휘 리소스 + 로더 뷰"
requires-python = ">=3.12"
dependencies = [
    "pyyaml>=6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/edge_ontology"]

[dependency-groups]
dev = ["pytest>=8"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
