formatVersion: 2
name: Concept
label: Concept
description: A named subject used to classify or describe other objects, such as a
  product, business segment, place, or investment theme. One record identifies one
  stored concept, rather than a particular mention in a document.
group: Reference
primaryKey: id
identity:
  columns: &id001
  - concept_id
  encoding: sourceString
properties:
  id:
    label: ID
