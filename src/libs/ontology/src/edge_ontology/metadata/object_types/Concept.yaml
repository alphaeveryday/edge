sourceConstraints:
  capturedAt: '2026-10-01 12:09:09.225923+00:00'
  primaryKey: *id001
  tableConstraints:
  - name: ck_concept_not_self_parent
    kind: c
    definition: CHECK (((parent_concept_id IS NULL) OR (parent_concept_id <> concept_id)))
    validated: true
  - name: concept_pkey
    kind: p
    definition: PRIMARY KEY (concept_id)
    validated: true
  - name: fk_concept_entity
    kind: f
    definition: FOREIGN KEY (concept_id, entity_type) REFERENCES entity(entity_id,
      entity_type) ON DELETE CASCADE
    validated: true
