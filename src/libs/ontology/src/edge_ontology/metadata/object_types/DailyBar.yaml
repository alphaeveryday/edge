sourceConstraints:
  capturedAt: '2026-10-01 12:09:09.225923+00:00'
  primaryKey: *id001
  tableConstraints:
  - name: ck_price_daily_values
    kind: c
    definition: CHECK ((((close_price IS NULL) OR ((close_price > (0)::numeric) AND
      (close_price < 'Infinity'::numeric))) AND ((adjusted_close_price IS NULL) OR
      ((adjusted_close_price > (0)::numeric) AND (adjusted_close_price < 'Infinity'::numeric)))
      AND ((volume IS NULL) OR (volume >= 0)) AND ((turnover_value IS NULL) OR ((turnover_value
      >= (0)::numeric) AND (turnover_value < 'Infinity'::numeric))) AND ((simple_return
      IS NULL) OR ((simple_return >= ('-1'::integer)::double precision) AND (simple_return
      < 'Infinity'::double precision))) AND ((log_return IS NULL) OR ((log_return
      > '-Infinity'::double precision) AND (log_return < 'Infinity'::double precision)))))
    validated: true
  - name: fk_price_daily_instrument
    kind: f
    definition: FOREIGN KEY (instrument_id) REFERENCES instrument(instrument_id) ON
      DELETE CASCADE
    validated: true
  - name: price_daily_pkey
    kind: p
    definition: PRIMARY KEY (instrument_id, trade_date)
    validated: true
apiName: DailyBar
displayName: Daily bar
pluralDisplayName: Daily bars
titleProperty: displayTitle
status: experimental
visibility: normal
dataIssues:
- Open, high and low exist in the canonical price dataset but are absent from the
  captured PostgreSQL price_daily schema. Their object properties await source mapping.
- The current loader writes NULL to turnover_value, price_basis, simple_return and
  log_return. The ontology definitions are retained; these are data-population gaps.
linkTypes:
- DailyBar_ForSecurity_Equity
- DailyBar_ForSecurity_ETF
