formatVersion: 2
name: DailyBar
label: Daily bar
description: 'One daily OHLCV bar for an equity security or ETF: open, high, low and
  close prices, traded quantity and trading value for one trading date.'
group: Holdings & market data
primaryKey: id
identity:
  columns: &id001
  - instrument_id
  - trade_date
  encoding: jsonStringArray
properties:
  id:
    label: ID
    description: Identifier of this daily bar, encoded from instrumentId, tradeDate.
      Every listed key component is preserved.
    sourceDataType: text
    nullable: false
    sourceConstraints:
      nullable: false
      primaryKey: *id001
      foreignKeys:
      - &id002
        constraint: fk_price_daily_instrument
        table: price_daily
        columns:
        - instrument_id
        target_table: instrument
        target_columns:
        - instrument_id
    mappingStatus: ready
    apiName: id
    displayName: ID
    status: experimental
    dataType: String
  instrumentId:
    label: Instrument id
    description: Internal identifier of the security whose data this record describes.
      Resolve it to Equity or ETF, not directly to Company.
    sourceDataType: text
    nullable: false
    sourceConstraints:
      nullable: false
      primaryKey: *id001
      foreignKeys:
      - *id002
    mappingStatus: ready
    apiName: instrumentId
    displayName: Instrument id
    status: experimental
    dataType: String
  tradeDate:
    label: Trade date
    description: Trading date to which the recorded market data applies; distinct
      from the time it was collected.
    sourceDataType: date
    nullable: false
    sourceConstraints:
      nullable: false
      primaryKey: *id001
      foreignKeys: []
    mappingStatus: ready
    apiName: tradeDate
    displayName: Trade date
    status: experimental
    dataType: Date
  openPrice:
    label: Open price
    description: Opening price per share or ETF unit for the trading day, in the security's
      trading currency.
    dataType: Decimal
    nullable: true
    mappingStatus: unmapped
    mappingNote: The canonical daily-price dataset contains this value, but the captured
      price_daily table has no corresponding column. The database load and ontology
      binding are pending.
    apiName: openPrice
    displayName: Open price
    status: experimental
  highPrice:
    label: High price
    description: Highest traded price per share or ETF unit during the trading day,
      in the security's trading currency.
    dataType: Decimal
    nullable: true
    mappingStatus: unmapped
    mappingNote: The canonical daily-price dataset contains this value, but the captured
      price_daily table has no corresponding column. The database load and ontology
      binding are pending.
    apiName: highPrice
    displayName: High price
    status: experimental
  lowPrice:
    label: Low price
    description: Lowest traded price per share or ETF unit during the trading day,
      in the security's trading currency.
    dataType: Decimal
    nullable: true
    mappingStatus: unmapped
    mappingNote: The canonical daily-price dataset contains this value, but the captured
      price_daily table has no corresponding column. The database load and ontology
      binding are pending.
    apiName: lowPrice
    displayName: Low price
    status: experimental
  closePrice:
    label: Close price
    description: Exchange closing price per share or ETF unit, in the security's recorded
      currency.
    sourceDataType: numeric
    nullable: true
    sourceConstraints:
      nullable: true
      primaryKey: []
      foreignKeys: []
    mappingStatus: ready
    apiName: closePrice
    displayName: Close price
    status: experimental
    dataType: Decimal
  adjustedClosePrice:
    label: Adjusted close price
    description: Closing price adjusted by the source for corporate actions. NULL
      means an adjusted price is unavailable; the adjustment method depends on the
      source.
    sourceDataType: numeric
    nullable: true
    sourceConstraints:
      nullable: true
      primaryKey: []
      foreignKeys: []
    mappingStatus: ready
    apiName: adjustedClosePrice
    displayName: Adjusted close price
    status: experimental
    dataType: Decimal
  simpleReturn:
    label: Simple return
    description: Simple daily return expressed as a fraction; 0.01 represents a 1%
      gain. Interpret the price adjustment basis together with priceBasis.
    sourceDataType: double precision
    nullable: true
    sourceConstraints:
      nullable: true
      primaryKey: []
      foreignKeys: []
    mappingStatus: ready
    apiName: simpleReturn
    displayName: Simple return
    status: experimental
    dataType: Double
  logReturn:
    label: Log return
    description: Natural-log daily price return. Its value is a log ratio, not a percentage
      figure.
    sourceDataType: double precision
    nullable: true
    sourceConstraints:
      nullable: true
      primaryKey: []
      foreignKeys: []
    mappingStatus: ready
    apiName: logReturn
    displayName: Log return
    status: experimental
    dataType: Double
  volume:
    label: Volume
    description: Total quantity traded during the trading day, measured in shares
      for equity securities or fund units for ETFs. Zero is a reported zero quantity;
      NULL means no quantity is available.
    sourceDataType: bigint
    nullable: true
    sourceConstraints:
      nullable: true
      primaryKey: []
      foreignKeys: []
    mappingStatus: ready
    apiName: volume
    displayName: Volume
    status: experimental
    dataType: Long
  turnoverValue:
    label: Turnover value
    description: Total monetary value of trades during the trading day, in the security's
      trading currency.
    sourceDataType: numeric
    nullable: true
    sourceConstraints:
      nullable: true
      primaryKey: []
      foreignKeys: []
    mappingStatus: ready
    apiName: turnoverValue
    displayName: Turnover value
    status: experimental
    dataType: Decimal
    mappingNote: The column exists, but the current loader writes NULL because the
      canonical dataset does not carry trading value.
  priceBasis:
    label: Price basis
    description: Source label describing the price or adjustment basis used for the
      observation. NULL means the basis is not recorded.
    sourceDataType: character varying
    nullable: true
    sourceConstraints:
      nullable: true
      primaryKey: []
      foreignKeys: []
    mappingStatus: ready
    apiName: priceBasis
    displayName: Price basis
    status: experimental
    dataType: String
  availableAt:
    label: Available for analysis at
    description: Time this record is considered available for analysis. Use it to
      exclude information that was not yet available at the requested analysis time.
    sourceDataType: timestamp with time zone
    nullable: false
    sourceConstraints:
      nullable: false
      primaryKey: []
      foreignKeys: []
    mappingStatus: ready
    apiName: availableAt
    displayName: Available for analysis at
    status: experimental
    dataType: Timestamp
  securityName:
    label: Security name
    description: Current stored name of the security identified by instrument_id;
      not its historical name on the record date.
    sourceDataType: text
    nullable: true
    sourceConstraints: null
    mappingStatus: ready
    apiName: securityName
    displayName: Security name
    status: experimental
    dataType: String
  securityTicker:
    label: Security ticker
    description: Current ticker of the security; leading zeros are preserved.
    sourceDataType: text
    nullable: true
    sourceConstraints: null
    mappingStatus: ready
    apiName: securityTicker
    displayName: Security ticker
    status: experimental
    dataType: String
  securityMarketCode:
    label: Security market code
    description: Current market code of the security, used with its ticker for display.
    sourceDataType: text
    nullable: true
    sourceConstraints: null
    mappingStatus: ready
    apiName: securityMarketCode
    displayName: Security market code
    status: experimental
    dataType: String
  displayTitle:
    label: Display title
    description: Readable title assembled from stored names and the record context.
      IDs remain authoritative; labels may change and are not unique.
    sourceDataType: text
    nullable: false
    sourceConstraints: null
    mappingStatus: ready
    apiName: displayTitle
    displayName: Display title
    status: experimental
    dataType: String
