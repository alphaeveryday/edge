sourceConstraints:
  capturedAt: '2026-10-01 12:09:09.225923+00:00'
  primaryKey:
  - etf_instrument_id
  - constituent_instrument_id
  - trade_date
  tableConstraints:
  - name: ck_etf_holding_not_self
    kind: c
    definition: CHECK ((etf_instrument_id <> constituent_instrument_id))
    validated: true
  - name: ck_etf_holding_weight_ratio
    kind: c
    definition: CHECK (((weight_ratio IS NULL) OR ((weight_ratio >= (0)::double precision)
      AND (weight_ratio <= (1)::double precision))))
    validated: true
  - name: etf_holding_snapshot_pkey
    kind: p
    definition: PRIMARY KEY (etf_instrument_id, constituent_instrument_id, trade_date)
    validated: true
  - name: fk_etf_holding_snapshot_constituent
    kind: f
    definition: FOREIGN KEY (constituent_instrument_id) REFERENCES instrument(instrument_id)
      ON DELETE RESTRICT
    validated: true
  - name: fk_etf_holding_snapshot_etf
    kind: f
    definition: FOREIGN KEY (etf_instrument_id) REFERENCES etf_profile(instrument_id)
      ON DELETE CASCADE
    validated: true
