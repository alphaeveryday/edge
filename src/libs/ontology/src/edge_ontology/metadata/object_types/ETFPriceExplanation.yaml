sourceConstraints: {}
dataIssues:
- Only completed, published database-backed v2 reports are exposed. Unknown-source
  and failed runs are excluded.
- Historical tool-run IDs are preserved but their outputs are not yet graph-resolvable;
  treat prior report text as interpretation, not fact evidence.
