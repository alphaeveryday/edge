sourceConstraints: {}
dataIssues:
- Measurement availability is inherited from its source event; historical extraction
  revisions are not retained.
- A measurement has no assertion-level foreign key. Do not combine roles from different
  evidence versions.
apiName: EventMeasurement
displayName: Event measurement
pluralDisplayName: Event measurements
titleProperty: displayTitle
status: experimental
visibility: normal
linkTypes:
- EventMeasurement_ForEvent_SourceEvent
