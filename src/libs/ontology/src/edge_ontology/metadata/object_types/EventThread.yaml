sourceConstraints:
  capturedAt: '2026-10-01 12:09:09.225923+00:00'
  primaryKey: *id001
  tableConstraints:
  - name: ck_event_thread_time
    kind: c
    definition: CHECK (((opened_at IS NULL) OR (last_state_at IS NULL) OR (last_state_at
      >= opened_at)))
    validated: true
  - name: event_thread_pkey
    kind: p
    definition: PRIMARY KEY (thread_id)
    validated: true
  - name: event_thread_thread_key_key
    kind: u
    definition: UNIQUE (thread_key)
    validated: true
dataIssues:
- The current identity key can merge separate events with identical role values.
- Stage updates require validation for corrections, cancellations, and late records.
