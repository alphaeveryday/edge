    description: Korean security name supplied with this classification snapshot.
    sourceDataType: text
    nullable: false
    sourceConstraints:
      nullable: false
      primaryKey: []
      foreignKeys: []
    mappingStatus: ready
    apiName: nameKr
    displayName: Korean security name
    status: experimental
    dataType: String
  securityGroup:
