sourceConstraints:
  capturedAt: '2026-10-01 12:09:09.225923+00:00'
  primaryKey:
  - market
  - instrument_code
  - as_of_date
  - raw_run_id
  tableConstraints:
  - name: ck_sector_classification_as_of
    kind: c
    definition: CHECK ((as_of_date = ((received_at AT TIME ZONE 'Asia/Seoul'::text))::date))
    validated: true
  - name: ck_sector_classification_basis
    kind: c
    definition: CHECK (((availability_basis = 'received'::text) AND (available_at
      = received_at)))
    validated: true
  - name: ck_sector_classification_market
    kind: c
    definition: CHECK ((market = ANY (ARRAY['KOSPI'::text, 'KOSDAQ'::text])))
    validated: true
  - name: ck_sector_classification_none
    kind: c
    definition: CHECK ((((raw_large_code = '0000'::text) = (large_code IS NULL)) AND
      ((raw_medium_code = '0000'::text) = (medium_code IS NULL)) AND ((raw_small_code
      = '0000'::text) = (small_code IS NULL)) AND ((large_code IS NULL) OR (large_code
      = raw_large_code)) AND ((medium_code IS NULL) OR (medium_code = raw_medium_code))
      AND ((small_code IS NULL) OR (small_code = raw_small_code))))
    validated: true
  - name: ck_sector_classification_raw
    kind: c
    definition: CHECK (((raw_large_code ~ '^[0-9]{4}$'::text) AND (raw_medium_code
      ~ '^[0-9]{4}$'::text) AND (raw_small_code ~ '^[0-9]{4}$'::text)))
    validated: true
  - name: ck_sector_classification_sha
    kind: c
    definition: CHECK (((raw_sha256 ~ '^[0-9a-f]{64}$'::text) AND (artifact_sha256
      ~ '^[0-9a-f]{64}$'::text)))
    validated: true
  - name: ck_sector_classification_taxonomy
    kind: c
    definition: CHECK ((taxonomy = 'KIS_INDEX_SECTOR'::text))
    validated: true
  - name: sector_classification_pkey
    kind: p
    definition: PRIMARY KEY (market, instrument_code, as_of_date, raw_run_id)
    validated: true
