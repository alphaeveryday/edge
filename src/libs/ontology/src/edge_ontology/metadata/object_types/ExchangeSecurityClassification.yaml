  security group and industry hierarchy, identified by market, local security code,
  collection date, and collection run.'
group: Holdings & market data
primaryKey: id
identity:
  columns:
  - market
  - instrument_code
  - as_of_date
  - raw_run_id
  encoding: jsonStringArray
properties:
