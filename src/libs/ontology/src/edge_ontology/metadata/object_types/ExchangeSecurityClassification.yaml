    description: Identifier of one collected classification snapshot, preserving market,
      security code, collection date, and collection run.
    sourceDataType: text
    nullable: false
    sourceConstraints:
      nullable: false
      primaryKey:
      - market
      - instrument_code
      - as_of_date
      - raw_run_id
      foreignKeys: []
    mappingStatus: ready
    apiName: id
    displayName: ID
    status: experimental
    dataType: String
