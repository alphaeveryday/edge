sourceConstraints:
  capturedAt: '2026-10-01 12:09:09.225923+00:00'
  primaryKey:
  - corp_code
  - fiscal_year
  - fiscal_period
  - metric
  - period_kind
  - fs_basis
  - raw_run_id
  tableConstraints:
  - name: ck_financial_metric_availability
    kind: c
    definition: CHECK ((((availability_basis = 'received'::text) AND (available_at
      = received_at)) OR ((availability_basis = 'provider_release_date'::text) AND
      (rcept_date IS NOT NULL) AND (available_at = LEAST(received_at, (((rcept_date
      + 1))::timestamp without time zone AT TIME ZONE 'Asia/Seoul'::text))))))
    validated: true
  - name: ck_financial_metric_basis
    kind: c
    definition: CHECK ((fs_basis = ANY (ARRAY['CFS'::text, 'OFS'::text])))
    validated: true
  - name: ck_financial_metric_codes
    kind: c
    definition: CHECK (((corp_code ~ '^[0-9]{8}$'::text) AND (instrument_code ~ '^[0-9A-Z]{6}$'::text)
      AND (rcept_no ~ '^[0-9]{14}$'::text)))
    validated: true
  - name: ck_financial_metric_derivation
    kind: c
    definition: CHECK ((((derivation = 'REPORTED'::text) AND (metric <> ALL (ARRAY['bps'::text,
      'bps_total_shares'::text])) AND (NOT ((fiscal_period = 'Q4'::text) AND (period_kind
      = 'QUARTER'::text)))) OR ((derivation = 'FY_MINUS_9M'::text) AND (fiscal_period
      = 'Q4'::text) AND (period_kind = 'QUARTER'::text) AND (formula IS NOT NULL))
      OR ((derivation = 'EQUITY_OVER_SHARES'::text) AND (metric = ANY (ARRAY['bps'::text,
      'bps_total_shares'::text])) AND (formula IS NOT NULL))))
    validated: true
  - name: ck_financial_metric_finite
    kind: c
    definition: CHECK (((value > '-Infinity'::numeric) AND (value < 'Infinity'::numeric)))
    validated: true
  - name: ck_financial_metric_fy
    kind: c
    definition: CHECK (((fiscal_period <> 'FY'::text) OR (period_kind = 'CUMULATIVE'::text)))
    validated: true
  - name: ck_financial_metric_inputs
    kind: c
    definition: CHECK ((jsonb_typeof(inputs) = 'array'::text))
    validated: true
  - name: ck_financial_metric_period
    kind: c
    definition: CHECK ((fiscal_period = ANY (ARRAY['Q1'::text, 'Q2'::text, 'Q3'::text,
      'Q4'::text, 'FY'::text])))
    validated: true
  - name: ck_financial_metric_period_end
    kind: c
    definition: "CHECK ((period_end =\nCASE fiscal_period\n    WHEN 'Q1'::text THEN\
      \ make_date((fiscal_year)::integer, 3, 31)\n    WHEN 'Q2'::text THEN make_date((fiscal_year)::integer,\
      \ 6, 30)\n    WHEN 'Q3'::text THEN make_date((fiscal_year)::integer, 9, 30)\n\
      \    ELSE make_date((fiscal_year)::integer, 12, 31)\nEND))"
    validated: true
  - name: ck_financial_metric_sha
    kind: c
    definition: CHECK (((raw_sha256 ~ '^[0-9a-f]{64}$'::text) AND (artifact_sha256
      ~ '^[0-9a-f]{64}$'::text)))
    validated: true
  - name: ck_financial_metric_shape
    kind: c
    definition: CHECK ((((((((((((metric = 'eps_basic'::text) AND (unit = 'KRW_per_share'::text)
      AND (period_kind = 'QUARTER'::text)) OR ((metric = 'eps_basic'::text) AND (unit
      = 'KRW_per_share'::text) AND (period_kind = 'CUMULATIVE'::text))) OR ((metric
      = 'eps_diluted'::text) AND (unit = 'KRW_per_share'::text) AND (period_kind =
      'QUARTER'::text))) OR ((metric = 'eps_diluted'::text) AND (unit = 'KRW_per_share'::text)
      AND (period_kind = 'CUMULATIVE'::text))) OR ((metric = 'revenue'::text) AND
      (unit = 'KRW'::text) AND (period_kind = 'QUARTER'::text))) OR ((metric = 'revenue'::text)
      AND (unit = 'KRW'::text) AND (period_kind = 'CUMULATIVE'::text))) OR ((metric
      = 'operating_income'::text) AND (unit = 'KRW'::text) AND (period_kind = 'QUARTER'::text)))
      OR ((metric = 'operating_income'::text) AND (unit = 'KRW'::text) AND (period_kind
      = 'CUMULATIVE'::text))) OR ((metric = 'bps'::text) AND (unit = 'KRW_per_share'::text)
      AND (period_kind = 'POINT'::text))) OR ((metric = 'bps_total_shares'::text)
      AND (unit = 'KRW_per_share'::text) AND (period_kind = 'POINT'::text))))
    validated: true
  - name: financial_metric_pkey
    kind: p
    definition: PRIMARY KEY (corp_code, fiscal_year, fiscal_period, metric, period_kind,
      fs_basis, raw_run_id)
    validated: true
