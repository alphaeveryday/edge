formatVersion: 2
name: FinancialMetric
label: Financial metric
description: One company financial value, such as revenue, operating income, or earnings
  per share, for a specified period and reporting basis. Its identity also preserves
  the metric kind and collection version.
group: Disclosures & financials
primaryKey: id
identity:
  columns:
  - corp_code
  - fiscal_year
  - fiscal_period
  - metric
  - period_kind
  - fs_basis
  - raw_run_id
  encoding: jsonStringArray
properties:
  id:
    label: ID
    description: Identifier of this financial measure and collection version, encoded
      from corpCode, fiscalYear, fiscalPeriod, metric, periodKind, fsBasis, rawRunId.
      Every listed key component is preserved.
    sourceDataType: text
    nullable: false
    sourceConstraints:
      nullable: false
      primaryKey:
      - corp_code
      - fiscal_year
      - fiscal_period
      - metric
      - period_kind
      - fs_basis
      - raw_run_id
      foreignKeys: []
    mappingStatus: ready
    apiName: id
    displayName: ID
    status: experimental
    dataType: String
  corpCode:
    label: DART company code
    description: Eight-digit DART company identifier used to find the matching Company.dartCorpCode.
      Leading zeros are part of the code.
    sourceDataType: text
    nullable: false
    sourceConstraints:
      nullable: false
      primaryKey:
      - corp_code
      - fiscal_year
      - fiscal_period
      - metric
      - period_kind
      - fs_basis
      - raw_run_id
      foreignKeys: []
    mappingStatus: ready
    apiName: corpCode
    displayName: DART company code
    status: experimental
    dataType: String
  instrumentCode:
    label: Instrument code
    description: Local security code preserved from the source. Use its market context
      when matching it to a listed security.
    sourceDataType: text
    nullable: false
    sourceConstraints:
      nullable: false
      primaryKey: []
      foreignKeys: []
    mappingStatus: ready
    apiName: instrumentCode
    displayName: Instrument code
    status: experimental
    dataType: String
  fiscalYear:
    label: Fiscal year
    description: Fiscal year of the financial report or metric.
    sourceDataType: smallint
    nullable: false
    sourceConstraints:
      nullable: false
      primaryKey:
      - corp_code
      - fiscal_year
      - fiscal_period
      - metric
      - period_kind
      - fs_basis
      - raw_run_id
      foreignKeys: []
    mappingStatus: ready
    apiName: fiscalYear
    displayName: Fiscal year
    status: experimental
    dataType: Short
  fiscalPeriod:
    label: Fiscal period
    description: Period label Q1, Q2, Q3, Q4, or FY. Read together with periodKind
      to distinguish standalone quarters from cumulative results.
    sourceDataType: text
    nullable: false
    sourceConstraints:
      nullable: false
      primaryKey:
      - corp_code
      - fiscal_year
      - fiscal_period
      - metric
      - period_kind
      - fs_basis
      - raw_run_id
      foreignKeys: []
    mappingStatus: ready
    apiName: fiscalPeriod
    displayName: Fiscal period
    status: experimental
    dataType: String
  periodEnd:
    label: Period end
    description: End date assigned to the financial period. The current source normalizes
      quarters to calendar-quarter ends.
    sourceDataType: date
    nullable: false
    sourceConstraints:
      nullable: false
      primaryKey: []
      foreignKeys: []
    mappingStatus: ready
    apiName: periodEnd
    displayName: Period end
    status: experimental
    dataType: Date
  metric:
    label: Metric
    description: Financial measure code, such as revenue, operating_income, eps_basic,
      eps_diluted, bps, or bps_total_shares.
    sourceDataType: text
    nullable: false
    sourceConstraints:
      nullable: false
      primaryKey:
      - corp_code
      - fiscal_year
      - fiscal_period
      - metric
      - period_kind
      - fs_basis
      - raw_run_id
      foreignKeys: []
    mappingStatus: ready
    apiName: metric
    displayName: Metric
    status: experimental
    dataType: String
  periodKind:
    label: Period kind
    description: 'Time basis of the value: QUARTER for a standalone quarter, CUMULATIVE
      for year-to-date results, or POINT for a value at a specific date.'
    sourceDataType: text
    nullable: false
    sourceConstraints:
      nullable: false
      primaryKey:
      - corp_code
      - fiscal_year
      - fiscal_period
      - metric
      - period_kind
      - fs_basis
      - raw_run_id
      foreignKeys: []
    mappingStatus: ready
    apiName: periodKind
    displayName: Period kind
    status: experimental
    dataType: String
  fsBasis:
    label: Financial statement basis
    description: 'Financial-statement basis: CFS for consolidated statements, or OFS
      for the company''s separate statements.'
    sourceDataType: text
    nullable: false
    sourceConstraints:
      nullable: false
      primaryKey:
      - corp_code
      - fiscal_year
      - fiscal_period
      - metric
      - period_kind
      - fs_basis
      - raw_run_id
      foreignKeys: []
    mappingStatus: ready
    apiName: fsBasis
    displayName: Financial statement basis
    status: experimental
    dataType: String
  derivation:
    label: Reported or calculated value
    description: 'Origin of the number: REPORTED from the filing, FY_MINUS_9M for
      fourth-quarter figures calculated from annual minus nine-month results, or EQUITY_OVER_SHARES
      for calculated book value per share.'
    sourceDataType: text
    nullable: false
    sourceConstraints:
      nullable: false
      primaryKey: []
      foreignKeys: []
    mappingStatus: ready
    apiName: derivation
    displayName: Reported or calculated value
    status: experimental
    dataType: String
  value:
    label: Value
    description: Numeric amount of the financial measure. Interpret it using unit,
      periodKind, fiscalPeriod, and fsBasis.
    sourceDataType: numeric
    nullable: false
    sourceConstraints:
      nullable: false
      primaryKey: []
      foreignKeys: []
    mappingStatus: ready
    apiName: value
    displayName: Value
    status: experimental
    dataType: Decimal
  unit:
    label: Unit
    description: 'Measurement unit: KRW for monetary totals or KRW_per_share for per-share
      values in the current source contract.'
    sourceDataType: text
    nullable: false
    sourceConstraints:
      nullable: false
      primaryKey: []
      foreignKeys: []
    mappingStatus: ready
    apiName: unit
    displayName: Unit
    status: experimental
    dataType: String
  formula:
    label: Formula
    description: Stored formula explaining a derived metric. It must be read with
      derivation and the source inputs before reproducing the calculation.
    sourceDataType: text
    nullable: true
    sourceConstraints:
      nullable: true
      primaryKey: []
      foreignKeys: []
    mappingStatus: ready
    apiName: formula
    displayName: Formula
    status: experimental
    dataType: String
  rceptNo:
    label: DART receipt number
    description: DART receipt number identifying the source filing. It is a document
      identifier, not a company or report-period code.
    sourceDataType: text
    nullable: false
    sourceConstraints:
      nullable: false
      primaryKey: []
      foreignKeys: []
    mappingStatus: ready
    apiName: rceptNo
    displayName: DART receipt number
    status: experimental
    dataType: String
  availableAt:
    label: Available for analysis at
    description: Analytical availability time computed from receipt time or the source
      filing date according to the stored availability basis. It differs from the
      financial period end.
    sourceDataType: timestamp with time zone
    nullable: false
    sourceConstraints:
      nullable: false
      primaryKey: []
      foreignKeys: []
    mappingStatus: ready
    apiName: availableAt
    displayName: Available for analysis at
    status: experimental
    dataType: Timestamp
  receivedAt:
    label: Received at
    description: Time this collected version was received by the system. Use it to
      distinguish actual system possession from reconstructed analytical availability.
    sourceDataType: timestamp with time zone
    nullable: false
    sourceConstraints:
      nullable: false
      primaryKey: []
      foreignKeys: []
    mappingStatus: ready
    apiName: receivedAt
    displayName: Received at
    status: experimental
    dataType: Timestamp
  availabilityBasis:
    label: Availability basis
    description: Stored rule used to assign availableAt, such as receipt time or a
      filing-date convention. A reconstructed date is not an observed historical publication
      timestamp.
    sourceDataType: text
    nullable: false
    sourceConstraints:
      nullable: false
      primaryKey: []
      foreignKeys: []
    mappingStatus: ready
    apiName: availabilityBasis
    displayName: Availability basis
    status: experimental
    dataType: String
  calculationInputs:
    label: Calculation inputs
    description: JSON text preserving the stored inputs used to derive this value,
      together with formula and derivation.
    sourceDataType: jsonb
    nullable: false
    sourceConstraints:
      nullable: false
      primaryKey: []
      foreignKeys: []
    mappingStatus: ready
    apiName: calculationInputs
    displayName: Calculation inputs
    status: experimental
    dataType: String
  companyName:
    label: Company name
    description: Current stored name of the company referenced by company_id; NULL
      if no name is resolved.
    sourceDataType: text
    nullable: true
    sourceConstraints: null
    mappingStatus: ready
    apiName: companyName
    displayName: Company name
    status: experimental
    dataType: String
  displayTitle:
    label: Display title
    description: Readable title assembled from stored names and the record context.
      IDs remain authoritative; labels may change and are not unique.
    sourceDataType: text
    nullable: false
    sourceConstraints: null
    mappingStatus: ready
    apiName: displayTitle
    displayName: Display title
    status: experimental
    dataType: String
