formatVersion: 2
name: MacroObservation
label: Macro observation
description: One dated value of a macroeconomic indicator, such as an exchange rate,
  government bond yield, inflation rate, or commodity price. Each collected version
  retains its own identity, unit, geography, and indicator category.
group: Macro & indices
primaryKey: id
identity:
  columns: &id001
  - series_id
  - observation_date
  - raw_run_id
  encoding: jsonStringArray
properties:
  id:
    label: ID
    description: Identifier of this dated macroeconomic observation version, encoded
      from seriesId, observationDate, rawRunId. Every listed key component is preserved.
    sourceDataType: text
    nullable: false
    sourceConstraints:
      nullable: false
      primaryKey: *id001
      foreignKeys: []
    mappingStatus: ready
    apiName: id
    displayName: ID
    status: experimental
    dataType: String
  seriesId:
    label: Series id
    description: Internal indicator code, such as usd_krw, us_10y_yield, kr_10y_yield,
      kr_cpi_yoy, or brent_spot_usd.
    sourceDataType: text
    nullable: false
    sourceConstraints:
      nullable: false
      primaryKey: *id001
      foreignKeys: []
    mappingStatus: ready
    apiName: seriesId
    displayName: Series id
    status: experimental
    dataType: String
  observationDate:
    label: Observation date
    description: Date to which the indicator value applies. For monthly inflation,
      the first day of the month identifies the observation month rather than its
      release date.
    sourceDataType: date
    nullable: false
    sourceConstraints:
      nullable: false
      primaryKey: *id001
      foreignKeys: []
    mappingStatus: ready
    apiName: observationDate
    displayName: Observation date
    status: experimental
    dataType: Date
  value:
    label: Value
    description: 'Observed indicator value in the stated unit. A value in percent
      uses percentage points as displayed: 4.5 means 4.5%.'
    sourceDataType: numeric
    nullable: false
    sourceConstraints:
      nullable: false
      primaryKey: []
      foreignKeys: []
    mappingStatus: ready
    apiName: value
    displayName: Value
    status: experimental
    dataType: Decimal
  unit:
    label: Unit
    description: 'Unit supplied for the indicator: for example percent, KRW_per_USD,
      or USD_per_barrel. Values from different units must not be compared as the same
      measure.'
    sourceDataType: text
    nullable: false
    sourceConstraints:
      nullable: false
      primaryKey: []
      foreignKeys: []
    mappingStatus: ready
    apiName: unit
    displayName: Unit
    status: experimental
    dataType: String
  sourceVendor:
    label: Source vendor
    description: Provider of the macroeconomic observation, such as ECOS, FRED, FMP,
      KOSIS, or EIA.
    sourceDataType: text
    nullable: false
    sourceConstraints:
      nullable: false
      primaryKey: []
      foreignKeys: []
    mappingStatus: ready
    apiName: sourceVendor
    displayName: Source vendor
    status: experimental
    dataType: String
  sourceSeries:
    label: Source series
    description: Provider-specific series or endpoint identifier used to obtain this
      indicator value.
    sourceDataType: text
    nullable: false
    sourceConstraints:
      nullable: false
      primaryKey: []
      foreignKeys: []
    mappingStatus: ready
    apiName: sourceSeries
    displayName: Source series
    status: experimental
    dataType: String
  availableAt:
    label: Available for analysis at
    description: Time the source data was received and became available to this system.
      It is not a historical release time reconstructed from the observation date.
    sourceDataType: timestamp with time zone
    nullable: false
    sourceConstraints:
      nullable: false
      primaryKey: []
      foreignKeys: []
    mappingStatus: ready
    apiName: availableAt
    displayName: Available for analysis at
    status: experimental
    dataType: Timestamp
  regions:
    label: Geographic scope
    description: Countries or geographic scope assigned by the explicit indicator
      mapping, such as KR, US, or GLOBAL. An exchange rate can refer to more than
      one country.
    dataType: String[]
    nullable: false
    mappingStatus: lookup
    apiName: regions
    displayName: Geographic scope
    status: experimental
  indicatorType:
    label: Indicator category
    description: 'Broad indicator category assigned by seriesId: EXCHANGE_RATE, INTEREST_RATE,
      INFLATION, or COMMODITY.'
    dataType: String
    nullable: false
    mappingStatus: lookup
    apiName: indicatorType
    displayName: Indicator category
    status: experimental
  seriesName:
    label: Series name
    description: Display name for the five indicator codes defined by the source contract;
      NULL for an unrecognized code. The original series ID, source and unit are retained.
    sourceDataType: text
    nullable: true
    sourceConstraints: null
    mappingStatus: ready
    apiName: seriesName
    displayName: Series name
    status: experimental
    dataType: String
  displayTitle:
    label: Display title
    description: Readable title assembled from stored names and the record context.
      IDs remain authoritative; labels may change and are not unique.
    sourceDataType: text
    nullable: false
    sourceConstraints: null
    mappingStatus: ready
    apiName: displayTitle
    displayName: Display title
    status: experimental
    dataType: String
