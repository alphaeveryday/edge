      - schema: public
        table: macro_observation
        column: source_series
sourceConstraints:
  capturedAt: '2026-10-01 12:09:09.225923+00:00'
  primaryKey: *id001
  tableConstraints:
  - name: ck_macro_observation_basis
    kind: c
    definition: CHECK (((availability_basis = 'received'::text) AND (available_at
      = received_at)))
    validated: true
  - name: ck_macro_observation_complete
    kind: c
    definition: "CHECK (\nCASE\n    WHEN (series_id = 'kr_cpi_yoy'::text) THEN (((observation_date\
      \ + '1 mon'::interval))::date <= ((received_at AT TIME ZONE 'Asia/Seoul'::text))::date)\n\
      \    ELSE (observation_date < ((received_at AT TIME ZONE 'Asia/Seoul'::text))::date)\n\
      END)"
    validated: true
  - name: ck_macro_observation_finite
    kind: c
    definition: CHECK (((value > '-Infinity'::numeric) AND (value < 'Infinity'::numeric)))
    validated: true
  - name: ck_macro_observation_month
    kind: c
    definition: CHECK (((series_id <> 'kr_cpi_yoy'::text) OR (EXTRACT(day FROM observation_date)
      = (1)::numeric)))
    validated: true
  - name: ck_macro_observation_price
    kind: c
    definition: CHECK (((series_id <> ALL (ARRAY['usd_krw'::text, 'brent_spot_usd'::text]))
      OR (value > (0)::numeric)))
    validated: true
  - name: ck_macro_observation_series
    kind: c
    definition: CHECK ((((((((series_id = 'usd_krw'::text) AND (unit = 'KRW_per_USD'::text)
      AND (source_vendor = 'ecos'::text) AND (source_series = 'ECOS 731Y003/D/0000003'::text))
      OR ((series_id = 'us_10y_yield'::text) AND (unit = 'percent'::text) AND (source_vendor
      = 'fmp'::text) AND (source_series = 'FMP treasury-rates year10'::text))) OR
      ((series_id = 'us_10y_yield'::text) AND (unit = 'percent'::text) AND (source_vendor
      = 'fred'::text) AND (source_series = 'FRED DGS10'::text))) OR ((series_id =
      'kr_10y_yield'::text) AND (unit = 'percent'::text) AND (source_vendor = 'ecos'::text)
      AND (source_series = 'ECOS 817Y002/D/010210000'::text))) OR ((series_id = 'kr_cpi_yoy'::text)
      AND (unit = 'percent'::text) AND (source_vendor = 'kosis'::text) AND (source_series
      = 'KOSIS 101/DT_1J22042 T03 objL1=0'::text))) OR ((series_id = 'brent_spot_usd'::text)
      AND (unit = 'USD_per_barrel'::text) AND (source_vendor = 'eia'::text) AND (source_series
      = 'EIA petroleum/pri/spt RBRTE'::text))))
    validated: true
  - name: ck_macro_observation_sha
    kind: c
    definition: CHECK (((raw_sha256 ~ '^[0-9a-f]{64}$'::text) AND (artifact_sha256
      ~ '^[0-9a-f]{64}$'::text)))
    validated: true
  - name: macro_observation_pkey
    kind: p
    definition: PRIMARY KEY (series_id, observation_date, raw_run_id)
    validated: true
apiName: MacroObservation
displayName: Macro observation
pluralDisplayName: Macro observations
titleProperty: displayTitle
status: experimental
visibility: normal
linkTypes: []
