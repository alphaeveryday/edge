sourceConstraints:
  capturedAt: '2026-10-01 12:09:09.225923+00:00'
  primaryKey:
  - fact_id
  tableConstraints:
  - name: business_segment_fact_pkey
    kind: p
    definition: PRIMARY KEY (fact_id)
    validated: true
  - name: ck_business_segment_link_confidence
    kind: c
    definition: CHECK (((concept_link_confidence IS NULL) OR ((concept_link_confidence
      >= (0)::double precision) AND (concept_link_confidence <= (1)::double precision))))
    validated: true
  - name: ck_business_segment_revenue
    kind: c
    definition: CHECK (((revenue_krw IS NULL) OR ((revenue_krw >= (0)::numeric) AND
      (revenue_krw < 'Infinity'::numeric))))
    validated: true
  - name: ck_business_segment_share
    kind: c
    definition: CHECK (((revenue_share_pct IS NULL) OR ((revenue_share_pct >= (0)::double
      precision) AND (revenue_share_pct < 'Infinity'::double precision))))
    validated: true
  - name: ck_business_segment_share_basis
    kind: c
    definition: CHECK (((share_basis IS NULL) OR ((share_basis)::text = ANY ((ARRAY['REPORTED'::character
      varying, 'COMPUTED'::character varying, 'RESCALED'::character varying, 'UNRELIABLE'::character
      varying])::text[]))))
    validated: true
  - name: fk_business_segment_concept
    kind: f
    definition: FOREIGN KEY (concept_id) REFERENCES concept(concept_id) ON DELETE
      SET NULL
    validated: true
  - name: fk_business_segment_fact_type
    kind: f
    definition: FOREIGN KEY (fact_id, fact_type) REFERENCES disclosure_fact(fact_id,
      fact_type) ON DELETE CASCADE
    validated: true
