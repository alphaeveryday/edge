sourceConstraints:
  capturedAt: '2026-10-01 12:09:09.225923+00:00'
  primaryKey:
  - instrument_id
  - as_of_date
  tableConstraints:
  - name: ck_instrument_classification_market_cap
    kind: c
    definition: CHECK (((market_cap IS NULL) OR ((market_cap >= (0)::numeric) AND
      (market_cap < 'Infinity'::numeric))))
    validated: true
  - name: ck_instrument_classification_names_not_blank
    kind: c
    definition: CHECK ((((sector_name IS NULL) OR (btrim(sector_name) <> ''::text))
      AND ((industry_name IS NULL) OR (btrim(industry_name) <> ''::text))))
    validated: true
  - name: fk_instrument_classification_instrument
    kind: f
    definition: FOREIGN KEY (instrument_id) REFERENCES instrument(instrument_id) ON
      DELETE CASCADE
    validated: true
  - name: instrument_classification_pkey
    kind: p
    definition: PRIMARY KEY (instrument_id, as_of_date)
    validated: true
apiName: SecurityListingSnapshot
displayName: Security listing snapshot
pluralDisplayName: Security listing snapshots
titleProperty: displayTitle
status: experimental
visibility: normal
linkTypes:
