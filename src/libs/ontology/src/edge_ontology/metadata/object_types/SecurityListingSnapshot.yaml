formatVersion: 2
name: SecurityListingSnapshot
label: Security listing snapshot
description: Listing-market and primary-share designation reported for one security
  in a dated provider snapshot.
group: Holdings & market data
primaryKey: id
identity:
  columns:
  - instrument_id
  - as_of_date
  encoding: jsonStringArray
properties:
  id:
    label: ID
    description: Identifier of this security and provider-snapshot date, preserving
      the stored instrument ID and date.
    sourceDataType: text
    nullable: false
    sourceConstraints:
      nullable: false
      primaryKey:
      - instrument_id
      - as_of_date
      foreignKeys:
      - constraint: fk_instrument_classification_instrument
        table: instrument_classification
        columns:
        - instrument_id
        target_table: instrument
        target_columns:
        - instrument_id
    mappingStatus: ready
    apiName: id
    displayName: ID
    status: experimental
    dataType: String
  instrumentId:
    label: Instrument id
    description: Internal identifier of the security whose data this record describes.
      Resolve it to Equity or ETF, not directly to Company.
    sourceDataType: text
    nullable: false
    sourceConstraints:
      nullable: false
      primaryKey:
      - instrument_id
      - as_of_date
      foreignKeys:
      - constraint: fk_instrument_classification_instrument
        table: instrument_classification
        columns:
        - instrument_id
        target_table: instrument
        target_columns:
        - instrument_id
    mappingStatus: ready
    apiName: instrumentId
    displayName: Instrument id
    status: experimental
    dataType: String
  snapshotDate:
    label: Snapshot date
    description: Date recorded for this provider snapshot.
    sourceDataType: date
    nullable: false
    sourceConstraints:
      nullable: false
      primaryKey:
      - instrument_id
      - as_of_date
      foreignKeys: []
    mappingStatus: ready
    apiName: snapshotDate
    displayName: Snapshot date
    status: experimental
    dataType: Date
  listingMarket:
    label: Listing market
    description: Listing-market name or code supplied by the classification provider.
    sourceDataType: character varying
    nullable: true
    sourceConstraints:
      nullable: true
      primaryKey: []
      foreignKeys: []
    mappingStatus: ready
    apiName: listingMarket
    displayName: Listing market
    status: experimental
    dataType: String
  isPrimaryShare:
    label: Is primary share
    description: Whether the provider marks the security as its issuer's primary share
      class. NULL means no primary-share flag was supplied.
    sourceDataType: boolean
    nullable: true
    sourceConstraints:
      nullable: true
      primaryKey: []
      foreignKeys: []
    mappingStatus: ready
    apiName: isPrimaryShare
    displayName: Is primary share
    status: experimental
    dataType: Boolean
  source:
    label: Classification provider
    description: Provider that supplied the sector and industry classification, such
      as FMP.
    sourceDataType: character varying
    nullable: false
    sourceConstraints:
      nullable: false
      primaryKey: []
      foreignKeys: []
    mappingStatus: ready
    apiName: source
    displayName: Classification provider
    status: experimental
    dataType: String
  availableAt:
    label: Available for analysis at
    description: Time this record is considered available for analysis. Use it to
      exclude information that was not yet available at the requested analysis time.
    sourceDataType: timestamp with time zone
    nullable: false
    sourceConstraints:
      nullable: false
      primaryKey: []
      foreignKeys: []
    mappingStatus: ready
    apiName: availableAt
    displayName: Available for analysis at
    status: experimental
    dataType: Timestamp
  securityName:
    label: Security name
    description: Current stored name of the security identified by instrument_id;
      not its historical name on the record date.
    sourceDataType: text
    nullable: true
    sourceConstraints: null
    mappingStatus: ready
    apiName: securityName
    displayName: Security name
    status: experimental
    dataType: String
  securityTicker:
    label: Security ticker
    description: Current ticker of the security; leading zeros are preserved.
    sourceDataType: text
    nullable: true
    sourceConstraints: null
    mappingStatus: ready
    apiName: securityTicker
    displayName: Security ticker
    status: experimental
    dataType: String
  securityMarketCode:
    label: Security market code
    description: Current market code of the security, used with its ticker for display.
    sourceDataType: text
    nullable: true
    sourceConstraints: null
    mappingStatus: ready
    apiName: securityMarketCode
    displayName: Security market code
    status: experimental
    dataType: String
  displayTitle:
    label: Display title
    description: Readable title assembled from stored names and the record context.
      IDs remain authoritative; labels may change and are not unique.
    sourceDataType: text
    nullable: false
    sourceConstraints: null
    mappingStatus: ready
    apiName: displayTitle
    displayName: Display title
    status: experimental
    dataType: String
