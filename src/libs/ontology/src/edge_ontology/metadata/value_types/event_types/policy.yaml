types:
  POLICY.COURT.RULING:
    family: POLICY
    lifecycle_model: LEGAL_REGULATORY_LIFECYCLE
    stage_sensitive: true
    predicates:
    - RULE
    - UPHOLD
    - OVERTURN
    - DISMISS
    roles:
      required:
      - COURT
      optional:
      - RULE
      - TARGET
      - GEOGRAPHY
      - LEGAL_ISSUE
      - EFFECTIVE_DATE
      identity:
      - COURT
      - RULE
      - GEOGRAPHY
      primary:
      - TARGET
    note: A court issues a ruling on an identified legal matter involving the reported
      parties.
  POLICY.REGULATION.RULE_CHANGE:
    family: POLICY
    lifecycle_model: POLICY_LIFECYCLE
    stage_sensitive: true
    predicates:
    - ISSUE
    - REVISE
    - REPEAL
    - ENFORCE
    roles:
      required:
      - RULE
      optional:
      - AUTHORITY
      - INDUSTRY
      - GEOGRAPHY
      - EFFECTIVE_DATE
      identity:
      - RULE
      primary:
      - RULE
    quantities:
      PENALTY_CAP_AMOUNT:
        dtype: float
        unit_family: CURRENCY
        desc: 위반 시 벌금/과징금 상한 — 규제 강도
    note: An authority proposes, adopts, changes or withdraws an identified regulation.
  POLICY.SANCTION.IMPOSITION:
    family: POLICY
    lifecycle_model: POLICY_LIFECYCLE
    stage_sensitive: true
    predicates:
    - IMPOSE
    - LIFT
    - EXPAND
    roles:
      required:
      - AUTHORITY
      - TARGET
      optional:
      - PRODUCT_OR_SCOPE
      - GEOGRAPHY
      - EFFECTIVE_DATE
      identity:
      - AUTHORITY
      - TARGET
      primary:
      - TARGET
    note: An authority imposes, changes or lifts sanctions on identified targets.
  POLICY.TRADE.EXPORT_CONTROL:
    family: POLICY
    lifecycle_model: POLICY_LIFECYCLE
    stage_sensitive: true
    predicates:
    - IMPOSE
    - EASE
    - EXPAND
    roles:
      required:
      - AUTHORITY
      optional:
      - TARGET
      - PRODUCT_OR_SCOPE
      - GEOGRAPHY
      - EFFECTIVE_DATE
      - EXEMPTION
      identity:
      - AUTHORITY
      - TARGET
      - PRODUCT_OR_SCOPE
      - GEOGRAPHY
      primary:
      - TARGET
    note: An authority introduces, changes or removes restrictions on exports of identified
      products or technology.
  POLICY.TRADE.TARIFF_CHANGE:
    family: POLICY
    lifecycle_model: POLICY_LIFECYCLE
    stage_sensitive: true
    predicates:
    - RAISE
    - LOWER
    - IMPOSE
    - REMOVE
    roles:
      required:
      - AUTHORITY
      optional:
      - TARGET
      - PRODUCT_OR_SCOPE
      - GEOGRAPHY
      - RATE
      - EFFECTIVE_DATE
      identity:
      - AUTHORITY
      - TARGET
      - PRODUCT_OR_SCOPE
      - GEOGRAPHY
      primary:
      - TARGET
    note: An authority changes tariffs applicable to identified products, origins
      or destinations.
