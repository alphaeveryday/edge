meta:
  version: 0.1.0
  date: '2026-07-08'
  type_count: 53
  scope: Fields intentionally not required by current deterministic feature specs; add when upstream data contracts exist.
current_source_contract:
  available_now:
  - BigKinds news document fields and text
  - DART/parser-derived document rows already in data/events
  - current ticker/entity alias maps
  - daily price/market-cap/liquidity references used by common_blocks
  not_available_now:
  - canonical ex-ante consensus snapshots
  - licensed analyst full-text/estimate panels
  - complete supplier-customer/product revenue graph
  - official legal/regulatory docket state
  - intraday orderbook/passive-flow feeds
  - geospatial asset exposure databases
types:
  COMPANY.PRODUCT.LAUNCH:
    current_spec_part: types/company_product.yaml
    add_later:
    - id: segment_product_revenue_panel
      source: issuer segment/product revenue history
      reason: 현재 DART 파서의 segment/product coverage는 일부 fixture 중심이며 모든 issuer/product에 안정적이지 않음
      unlocks: event exposure weighted by actual revenue share
    - id: canonical_supply_chain_exposure
      source: licensed supplier-customer/product revenue graph
      reason: 현재 alias/sector map은 issuer·sector 중심이며 제품별 매출 연결은 부분적임
      unlocks: direct upstream/downstream spillover weights
    - id: intraday_microstructure_reaction
      source: tick/orderbook/auction imbalance feed
      reason: 현재 리서치 저장소는 일봉/기사 중심이며 장중 유동성·경매 수급이 없음
