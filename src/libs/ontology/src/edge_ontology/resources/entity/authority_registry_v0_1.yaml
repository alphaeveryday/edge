meta:
  version: 0.1.0
  date: '2026-07-28'
  purpose: closed registry of authorities, courts, central banks and market institutions
    so AUTHORITY_OR_RULE identity roles can resolve to a real entity
  local_amendment:
    # 관계층 role_bindings 와 같은 사정 — edge 에서 먼저 만들었다. 상류 백포트 대상.
    # 계약 future_entity_backlog 의 `official_policy_rule_master` 의 최소 구현이다:
    # 규제기관·법원·중앙은행만 담고, 규칙(RULE)·사건(LEGAL_ISSUE)은 담지 않는다
    # (그쪽은 열린 집합이라 레지스트리로 못 닫는다).
    why: AUTHORITY·COURT·CENTRAL_BANK 가 identity 인 타입이 100% UNKNOWN 이었다.
      값을 담을 entity 행이 없어서다. actor_type 은 이미 스키마에 있었다
      (V202607150001 ck_actor_type = COMPANY·GOVERNMENT·INSTITUTION·PERSON·OTHER).
  matching:
    # 별칭은 정규화 후 **완전일치**로만 건다. contains 매칭은 하지 않는다 —
    # '금융위'가 '금융위원회 산하 …' 같은 문장에서 엉뚱한 기관을 물어온다.
    # 정규화: NFKC → 공백·가운뎃점 제거 → casefold.
    rule: exact match on normalized alias
    ambiguous_rejected: ['정부', '당국', '금융당국', '규제당국', '법원', '검찰', '위원회']

