# 사건 유형 한국어 라벨 — edge 로컬 증보 (ALPHA-942).
#
# ⚠️ 이 파일은 상류 실험실(event-ontology) 스냅샷 교체의 대상이 **아니다** —
# resources/relation/ 과 같은 edge 로컬 증보다. 타입 YAML(process/types/)에 라벨을
# 넣지 않는 이유가 그것이다: 거기 넣으면 다음 통째 교체 때 소실된다.
#
# 문맥 계약: 라벨은 고객 산문의 "과거에 {라벨} 소식이 있었던 N건" 자리에 들어가는
# **명사구**다. 통계·영문 약어 금지(analysis-engine 산문 금지어 게이트가 하류에서
# 잡는다). 라벨 문안 근거는 각 타입 YAML 의 note·predicates.
#
# 완전성은 테스트가 강제한다(tests/test_labels.py): registry 의 모든 타입에 라벨이
# 있어야 하고, 라벨만 있고 타입이 없는 고아도 금지 — 상류 스냅샷 교체로 새 타입이
# 오면 여기에 라벨을 추가해야 테스트가 통과한다(fail-loud).

