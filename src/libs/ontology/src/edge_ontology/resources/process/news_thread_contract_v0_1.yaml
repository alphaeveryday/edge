meta:
  version: 0.1.0
  date: '2026-07-08'
  type_count: 53
  purpose: deterministic type-specific news event threading contract for assembled ontology events
invariants:
  dedup_cluster_id:
    must_not_equal_thread_id: true
    must_not_be_used_as_thread_id: true
    meaning: near-duplicate text cluster only; never a lifecycle lineage identifier
  thread_id:
    source: stable hash of normalized thread_key
    must_be_derived_from:
    - event_type_id
    - identity.required
    - identity.optional_discriminators
tables:
  event_thread:
    primary_key:
    - thread_id
    fields:
      thread_id: stable thread identifier derived from thread_key
      thread_key: normalized event identity string before hashing
      event_type_id: ontology leaf type partition
      current_stage: latest lifecycle_stage observed for the thread
      opened_at: first available_at in the thread
      latest_state_valid_from: available_at for current_stage
      latest_state_valid_to: null unless closed or superseded
  event_thread_link:
    primary_key:
    - event_id
    fields:
      event_id: canonical event id
      thread_id: linked thread id or null for UNKNOWN
      link_kind: PRIMARY
      novelty_status: &id001
      - FIRST_IN_THREAD
      - FOLLOW_UP_STAGE
      - CORRECTION
      - DUPLICATE_REBROADCAST
      - UNKNOWN
      state_valid_from: event available_at
      asof: PIT evaluation timestamp
      model_version: threader/contract version
      data_version: input data/schema version
  thread_discovery_snapshot:
    primary_key:
    - event_id
    fields:
      event_id: canonical event id
      thread_id: linked thread id or null for UNKNOWN
      asof: PIT timestamp
      n_prior_events: events already known in same thread before this event
      days_since_prev_stage: elapsed days from previous event timestamp
      novelty_flag: true only for FIRST_IN_THREAD
      unknown_reason: null or missing/ambiguous identity reason
types:
  COMPANY.PRODUCT.LAUNCH:
    identity:
      required:
      - ISSUER
      - PRODUCT
      optional_discriminators:
      - PRODUCT_FAMILY
      - CUSTOMER
      - TECH_NODE
      - EFFECTIVE_DATE
      - QUANTITY
      source: types/*.yaml roles.identity
    relation: produces
    missing_identity_policy: EMIT_UNKNOWN_LINK_ONLY
    novelty_statuses: *id001
    lifecycle:
      correction_markers: &id002
      - AMEND
      - CORRECT
      - CANCEL
      - REVISE
      - RESTATE
  COMPANY.PRODUCT.CERTIFICATION:
