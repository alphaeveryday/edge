# Flyway CLI 설정 — 배포용 마이그레이션 이미지(ECS one-off task)에서만 쓰인다.
#
# 접속값(url/user/password)은 여기 두지 않는다. 런타임에 FLYWAY_URL/FLYWAY_USER/FLYWAY_PASSWORD
# 환경변수로 주입한다(ECS task 가 RDS 관리형 시크릿에서 비밀번호를 넣는다).
#
# 아래 정책 플래그는 build.gradle 의 flyway{} 블록과 **반드시 동일하게** 유지한다(SSOT: libs/schema).
#   baselineOnMigrate=false     — 그린필드 DB, adoption 아님
#   cleanDisabled=true          — flyway clean 금지(데이터 전체 삭제 방지)
#   validateMigrationNaming=true — 파일명 규칙 위반 시 실패
flyway.locations=filesystem:/flyway/sql
flyway.baselineOnMigrate=false
flyway.cleanDisabled=true
flyway.validateMigrationNaming=true
