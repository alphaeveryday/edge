# publication-api 4대 앞의 부하 진입점 — 라운드로빈 분산.
# 측정 대상은 api 이므로 LB 자체가 병목이 되면 안 된다: 업스트림 커넥션을 재사용해
# (keepalive) 요청마다 TCP 핸드셰이크·TIME_WAIT 가 쌓이는 것을 막는다.
upstream publication_api {
    server api-1:8080;
    server api-2:8080;
    server api-3:8080;
    server api-4:8080;

    keepalive 64;
}

server {
    listen 80;

    location / {
        proxy_pass http://publication_api;
        # keepalive 는 HTTP/1.1 + Connection 헤더 비움이 짝 — 둘 중 하나만 두면
        # nginx 가 매 요청 업스트림 연결을 닫아 keepalive 가 무효가 된다.
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
